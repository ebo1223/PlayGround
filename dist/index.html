<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dragon Warrior</title><style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#09050e;font-family:Inter,system-ui,sans-serif;color:#fff;user-select:none}canvas{display:block}.hud{position:absolute;inset:0;pointer-events:none}.topbar{position:absolute;left:28px;top:24px;width:340px}.brand{font:900 20px Georgia;color:#ffcf72;text-shadow:0 2px 12px #9d3c18;letter-spacing:3px}.level{font-size:12px;color:#cabac7;margin:5px 0 8px}.bar{height:12px;border:1px solid #6f5b63;background:#17111c;border-radius:8px;overflow:hidden}.fill{height:100%;transition:width .25s}.health{background:linear-gradient(90deg,#a51d35,#ef5260);width:100%;box-shadow:0 0 12px #e33}.bosswrap{position:absolute;top:26px;left:50%;transform:translateX(-50%);width:min(440px,38vw);text-align:center}.bosstitle{font:700 15px Georgia;letter-spacing:4px;color:#f0d5bc;text-shadow:0 2px 8px #000}.bossbar{margin-top:8px;height:10px}.bossfill{background:linear-gradient(90deg,#8b1e29,#d83a3a);box-shadow:0 0 14px #c32}.coins{position:absolute;right:30px;top:28px;text-align:right}.coinval{font:700 19px Georgia;color:#ffc85d}.bottom{position:absolute;left:28px;bottom:24px}.moves{display:flex;gap:8px}.move{width:72px;height:72px;border-radius:50%;border:1px solid rgba(255,220,150,.25);background:rgba(20,12,24,.72);backdrop-filter:blur(5px);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#e7d5dd}.move{pointer-events:auto;cursor:pointer}.move b{font-size:20px;color:#ffc96b}.move span{font-size:9px;margin-top:4px;color:#aa9da8}.objective{position:absolute;right:28px;bottom:34px;border-left:2px solid #a98a55;padding:8px 12px;text-align:right;text-shadow:0 2px 5px #000}.objective small{display:block;color:#c9b18b;font-size:10px;letter-spacing:2px}.objective strong{font:700 14px Georgia;color:#fff}.crosshair{position:absolute;left:50%;top:50%;width:8px;height:8px;border:1px solid rgba(255,255,255,.6);border-radius:50%;transform:translate(-50%,-50%)}.toast{position:absolute;left:50%;top:21%;transform:translate(-50%,-50%);font:700 22px Georgia;letter-spacing:5px;color:#ffd690;text-shadow:0 3px 18px #e24525;opacity:0;transition:opacity .3s}.toast.show{opacity:1}.panel{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,4,12,.35);pointer-events:auto}.panel.hidden{display:none}.card{text-align:center;min-width:min(420px,80vw);padding:32px;border:1px solid rgba(226,178,94,.35);background:rgba(15,8,18,.88);box-shadow:0 20px 60px #000}.card h1{margin:0 0 8px;font:700 38px Georgia;color:#ffd69a}.card p{color:#cbbfc6}.card button{margin-top:14px;border:1px solid #d1a55c;background:linear-gradient(#bd7c3b,#7d3d27);color:white;padding:12px 28px;font-weight:800;letter-spacing:2px;cursor:pointer}.damage{position:absolute;font:800 17px Georgia;color:#ffd68a;text-shadow:0 2px 5px #000;pointer-events:none;transition:all .7s}
@media(max-width:700px){.topbar{left:14px;top:14px;width:220px}.bosswrap{top:110px;width:70vw}.coins{right:14px;top:14px}.bottom{left:14px;bottom:14px}.move{width:58px;height:58px}.objective{display:none}}
</style></head><body><canvas id="game"></canvas><div class="hud"><div class="topbar"><div class="brand">DRAGON WARRIOR</div><div class="level">LV. <span id="level">1</span> • SHADOWBLADE</div><div class="bar"><div id="health" class="fill health"></div></div></div><div class="bosswrap"><div class="bosstitle">ANCIENT FLAME DRAKE</div><div class="bar bossbar"><div id="boss" class="fill bossfill"></div></div></div><div class="coins">⚜ <span id="coins" class="coinval">240</span></div><div class="crosshair"></div><div id="toast" class="toast">DRAGON AWAKENS</div><div class="bottom"><div class="moves"><button class="move" id="attackBtn"><b>⚔</b><span>ATTACK</span></button><button class="move" id="dashBtn"><b>⇢</b><span>DASH</span></button></div></div><div class="objective"><small>OBJECTIVE</small><strong id="objective">Slay the Flame Drake</strong></div></div><div id="panel" class="panel hidden"><div class="card"><h1 id="title">VICTORY</h1><p id="subtitle">The ancient darkness retreats.</p><button id="restart">BATTLE AGAIN</button></div></div><script type="module" src="/main.js"></script></body></html>
