<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vampire Kingdom</title>
<style>
:root{--gold:#d7bd78;--red:#9d1f2f;--ink:#08070a}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#09070d;color:#eee;font-family:Georgia,'Times New Roman',serif}canvas{position:absolute;inset:0;width:100%;height:100%}.grain{position:absolute;inset:0;pointer-events:none;opacity:.12;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.28'/%3E%3C/svg%3E")}.hud{position:absolute;inset:0;padding:22px 28px;pointer-events:none}.topbar{display:flex;justify-content:space-between;align-items:flex-start}.brand{width:260px}.eyebrow{font-size:11px;letter-spacing:.42em;text-transform:uppercase;color:#b7a78d}.brand h1{margin:4px 0 0;font-size:32px;letter-spacing:.08em;font-weight:500;color:#f2e5c4;text-shadow:0 2px 10px #000}.night{margin-left:-48px;text-align:center}.night .eyebrow{margin-bottom:5px}.timer{font-size:38px;color:#fff7df;letter-spacing:.08em}.stats{display:flex;gap:10px}.stat{min-width:112px;height:48px;padding:8px 12px;background:rgba(12,9,15,.82);border:1px solid rgba(215,189,120,.18);clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}.stat label{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.18em;color:#9e9485}.stat b{font-size:18px;color:#f2dca2}.objective{position:absolute;left:28px;bottom:26px;width:280px;border-left:2px solid var(--red);padding:8px 12px;background:linear-gradient(90deg,rgba(8,6,10,.82),transparent)}.objective label{font-size:9px;text-transform:uppercase;letter-spacing:.25em;color:#a89879}.objective p{margin:5px 0 0;font-size:14px;color:#ddd3c1}.actions{position:absolute;right:28px;bottom:28px;display:flex;gap:10px;pointer-events:auto}.action{position:relative;width:116px;height:88px;border:1px solid rgba(215,189,120,.25);background:rgba(11,8,14,.9);color:#e9dec1;cursor:pointer;font-family:inherit;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);transition:.15s}.action:hover{border-color:#d7bd78;transform:translateY(-3px);background:#19101b}.action .icon{display:block;font-size:24px;color:#bd9d61}.action b{display:block;margin-top:5px;font-size:13px}.action small{display:block;margin-top:4px;font-size:10px;color:#9e9485}.paused,.gameover{display:none;position:absolute;inset:0;align-items:center;justify-content:center;background:rgba(5,4,7,.72);pointer-events:auto}.panel{width:min(520px,80vw);text-align:center;border:1px solid rgba(215,189,120,.32);background:rgba(12,9,16,.96);padding:38px}.panel h2{margin:0 0 10px;font-size:44px;color:#eee0bc}.panel p{color:#bdb2a1}.panel button{margin-top:14px;padding:12px 24px;border:1px solid #d7bd78;background:transparent;color:#d7bd78;font-family:inherit;cursor:pointer}.toast{position:absolute;top:130px;left:50%;transform:translateX(-50%);padding:9px 18px;border:1px solid rgba(215,189,120,.2);background:rgba(12,8,14,.9);font-size:13px;opacity:0;transition:.35s}.toast.show{opacity:1}.help{position:absolute;right:28px;top:90px;color:#9e9485;font-size:10px;text-align:right}.bar{position:absolute;left:50%;bottom:145px;transform:translateX(-50%);width:260px;height:4px;background:#241a25}.bar i{display:block;height:100%;background:#a52b38;width:0%;transition:width .1s}@media(max-width:800px){.hud{padding:14px}.brand h1{font-size:24px}.brand{width:180px}.stats{gap:4px}.stat{min-width:78px;padding:6px}.night{position:absolute;top:78px;left:50%;transform:translateX(-50%)}.objective{left:14px;bottom:112px;width:210px}.actions{right:12px;bottom:12px}.action{width:82px;height:70px}.action .icon{font-size:18px}.action b{font-size:11px}.help{display:none}}
</style></head>
<body><canvas id="c"></canvas><div class="grain"></div>
<div class="hud"><div class="topbar"><div class="brand"><div class="eyebrow">The crimson court</div><h1>Vampire Kingdom</h1></div><div class="night"><div class="eyebrow">Nightfall</div><div class="timer" id="timer">0:00</div></div><div class="stats"><div class="stat"><label>Blood</label><b id="blood">120</b></div><div class="stat"><label>Power</label><b id="power">80</b></div><div class="stat"><label>Army</label><b id="army">24</b></div></div></div><div class="objective"><label>Royal decree</label><p id="objective">Hold the castle until dawn</p></div><div class="bar"><i id="progress"></i></div><div class="help">WASD / arrows move<br>SPACE strike · ESC pause</div><div class="actions"><button class="action" id="feed"><span class="icon">◆</span><b>FEED</b><small>+30 blood · 15</small></button><button class="action" id="summon"><span class="icon">♞</span><b>SUMMON</b><small>+8 army · 25</small></button><button class="action" id="ward"><span class="icon">✦</span><b>WARD</b><small>Arcane shield · 35</small></button></div><div class="toast" id="toast"></div></div>
<div class="paused" id="paused"><div class="panel"><div class="eyebrow">The court waits</div><h2>Paused</h2><p>The night continues only when you command it.</p><button onclick="togglePause()">Return to the throne</button></div></div>
<div class="gameover" id="over"><div class="panel"><div class="eyebrow" id="overeye">The kingdom has fallen</div><h2 id="overtitle">Night's End</h2><p id="oversub">The hunters conquered Blackvein Keep.</p><button onclick="location.reload()">Rise again</button></div></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');let W,H,DPR;function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*DPR;c.height=H*DPR;c.style.width=W+'px';c.style.height=H+'px';x.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
let keys={},blood=120,power=80,army=24,night=0,duration=75,paused=false,ended=false,shield=0,slash=0,invul=0;const player={x:W*.5,y:H*.62,r:12};let enemies=[],particles=[];
function rand(a,b){return a+Math.random()*(b-a)}addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key===' '){e.preventDefault();if(!paused&&!ended)attack()}if(e.key==='Escape')togglePause()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);function toast(t){let q=document.getElementById('toast');q.textContent=t;q.classList.add('show');clearTimeout(q.t);q.t=setTimeout(()=>q.classList.remove('show'),1600)}
function spend(n){if(power<n){toast('Insufficient power');return false}power-=n;update();return true}
document.getElementById('feed').onclick=()=>{if(spend(15)){blood=Math.min(999,blood+30);toast('The court is nourished')}};
document.getElementById('summon').onclick=()=>{if(spend(25)){army+=8;toast('Newborns answer the summons')}};
document.getElementById('ward').onclick=()=>{if(spend(35)){shield=8;toast('The Blackveil rises')}};
function togglePause(){if(ended)return;paused=!paused;document.getElementById('paused').style.display=paused?'flex':'none'}
function attack(){slash=.18;invul=.12;for(let i=enemies.length-1;i>=0;i--){let e=enemies[i],d=Math.hypot(e.x-player.x,e.y-player.y);if(d<70){army=Math.min(999,army+1);blood=Math.min(999,blood+4);spawnParticle(e.x,e.y,'#c52b3f',12);enemies.splice(i,1);e===null}}}
function spawnParticle(a,b,c,n){for(let i=0;i<n;i++)particles.push({x:a,y:b,vx:rand(-90,90),vy:rand(-90,90),life:rand(.3,.8),c})}
function update(){document.getElementById('blood').textContent=Math.floor(blood);document.getElementById('power').textContent=Math.floor(power);document.getElementById('army').textContent=Math.floor(army)}
function spawn(){let side=Math.floor(Math.random()*4),a;if(side===0){a={x:rand(0,W),y:-30}}else if(side===1){a={x:W+30,y:rand(0,H)}}else if(side===2){a={x:rand(0,W),y:H+30}}else a={x:-30,y:rand(0,H)};a.r=9;a.hp=2;enemies.push(a)}
let last=performance.now(),spawnTimer=0,powerTimer=0;
function frame(now){let dt=Math.min(.033,(now-last)/1000);last=now;if(!paused&&!ended){night+=dt;spawnTimer-=dt;powerTimer-=dt;if(spawnTimer<=0){spawn();spawnTimer=Math.max(.28,1.15-night/duration*.7)}if(powerTimer<=0){power=Math.min(100,power+5);powerTimer=1.5}if(shield>0)shield-=dt;if(slash>0)slash-=dt;if(invul>0)invul-=dt;let sp=210;if(keys.w||keys.arrowup)player.y-=sp*dt;if(keys.s||keys.arrowdown)player.y+=sp*dt;if(keys.a||keys.arrowleft)player.x-=sp*dt;if(keys.d||keys.arrowright)player.x+=sp*dt;player.x=Math.max(30,Math.min(W-30,player.x));player.y=Math.max(130,Math.min(H-100,player.y));for(let i=enemies.length-1;i>=0;i--){let e=enemies[i],dx=player.x-e.x,dy=player.y-e.y,d=Math.hypot(dx,dy)||1;e.x+=dx/d*45*dt;e.y+=dy/d*45*dt;if(d<e.r+player.r){if(shield<=0&&invul<=0){army-=7;invul=.8;spawnParticle(player.x,player.y,'#b49a63',8);toast('The keep has taken damage')}else if(shield>0){spawnParticle(e.x,e.y,'#9d82ff',10);enemies.splice(i,1)}if(army<=0)army=0}}blood-=dt*.9;if(army<=0||blood<=0)finish(false);if(night>=duration)finish(true);update();document.getElementById('timer').textContent=Math.floor(night/60)+':'+String(Math.floor(night%60)).padStart(2,'0');document.getElementById('progress').style.width=(night/duration*100)+'%'}draw();requestAnimationFrame(frame)}
function finish(win){ended=true;document.getElementById('over').style.display='flex';document.getElementById('overeye').textContent=win?'Dawn has broken':'The kingdom has fallen';document.getElementById('overtitle').textContent=win?'Blackvein Endures':'Night Reigns';document.getElementById('oversub').textContent=win?'The court survives until morning, its dominion secure.':'The hunters conquered Blackvein Keep.'}
function draw(){let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#17121d');g.addColorStop(.55,'#0b090e');g.addColorStop(1,'#09070a');x.fillStyle=g;x.fillRect(0,0,W,H);drawSky();drawCastle();for(let p of particles){p.life-=.016;p.x+=p.vx*.016;p.y+=p.vy*.016;x.globalAlpha=Math.max(0,p.life*2);x.fillStyle=p.c;x.fillRect(p.x,p.y,3,3)}x.globalAlpha=1;for(let e of enemies){x.save();x.translate(e.x,e.y);x.fillStyle='#17100e';x.beginPath();x.moveTo(-11,-8);x.lineTo(-5,-18);x.lineTo(0,-9);x.lineTo(5,-18);x.lineTo(11,-8);x.lineTo(7,15);x.lineTo(-7,15);x.closePath();x.fill();x.fillStyle='#a7a0b0';x.beginPath();x.arc(-3,-9,1.5,0,7);x.arc(3,-9,1.5,0,7);x.fill();x.strokeStyle='#9b8c65';x.beginPath();x.moveTo(8,-3);x.lineTo(17,9);x.stroke();x.restore()}drawPlayer();}
function drawSky(){x.fillStyle='rgba(155,151,174,.12)';for(let i=0;i<18;i++){let xx=(i*137)%W,yy=(i*83)%Math.floor(H*.5);x.fillRect(xx,yy,1,1)}x.fillStyle='#d0c7ae';x.beginPath();x.arc(W*.78,H*.15,26,0,7);x.fill();x.fillStyle='#17121d';x.beginPath();x.arc(W*.78-10,H*.15-8,28,0,7);x.fill()}
function drawCastle(){let cy=H*.52;x.fillStyle='#09090b';x.beginPath();x.moveTo(W*.18,cy);x.lineTo(W*.82,cy);x.lineTo(W*.78,H*.75);x.lineTo(W*.22,H*.75);x.closePath();x.fill();x.fillStyle='#17151b';for(let i=-1;i<5;i++){let bx=W*.5+(i-2)*W*.14;x.fillRect(bx-36,cy-95,72,155);for(let j=0;j<4;j++){x.beginPath();x.moveTo(bx-38+j*18,cy-95);x.lineTo(bx-29+j*18,cy-118);x.lineTo(bx-20+j*18,cy-95);x.fill()}}x.fillStyle='#08080a';x.beginPath();x.moveTo(W*.5-65,cy+10);x.lineTo(W*.5-65,cy-110);x.quadraticCurveTo(W*.5,cy-170,W*.5+65,cy-110);x.lineTo(W*.5+65,cy+10);x.closePath();x.fill();x.fillStyle='#8e1e2d';x.beginPath();x.moveTo(W*.5,cy-125);x.lineTo(W*.5+34,cy-58);x.lineTo(W*.5,cy-76);x.lineTo(W*.5-34,cy-58);x.closePath();x.fill();x.fillStyle='#050507';for(let i=0;i<7;i++){let xx=W*.5+(i-3)*54;x.fillRect(xx,cy-20,18,55)}}
function drawPlayer(){x.save();x.translate(player.x,player.y);if(shield>0){x.strokeStyle='rgba(158,132,255,.8)';x.lineWidth=2;x.beginPath();x.arc(0,0,28+Math.sin(performance.now()/180)*3,0,7);x.stroke()}if(slash>0){x.strokeStyle='#e4c66d';x.lineWidth=5;x.beginPath();x.arc(0,0,55,-1,1);x.stroke()}x.fillStyle='#19131d';x.beginPath();x.moveTo(-17,18);x.lineTo(-12,-8);x.lineTo(-22,-22);x.lineTo(0,-13);x.lineTo(22,-22);x.lineTo(12,-8);x.lineTo(17,18);x.closePath();x.fill();x.fillStyle='#d6c8b3';x.beginPath();x.arc(0,-8,8,0,7);x.fill();x.fillStyle='#8e1526';x.beginPath();x.moveTo(-3,-8);x.lineTo(0,-3);x.lineTo(3,-8);x.fill();x.restore()}
requestAnimationFrame(frame);
</script></body></html>
