<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Warcraft 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1017;font-family:Georgia,serif;color:#eee}canvas{display:block}#ui{position:absolute;inset:0;pointer-events:none}#top{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;gap:8px}.res{height:38px;min-width:126px;padding:8px 12px;background:linear-gradient(#26384a,#101824);border:2px solid #8c7447;border-radius:4px;box-shadow:0 3px 12px #000;font-size:17px;color:#ffe7a5}.res b{color:white}#gameTitle{position:absolute;left:18px;top:14px;color:#dcb75d;text-shadow:2px 2px 3px #000;font-size:20px;font-weight:bold}#bottom{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);width:520px;height:150px;display:grid;grid-template-columns:150px 1fr 150px;gap:8px;pointer-events:auto}.panel{background:linear-gradient(135deg,#283b38,#101715);border:3px solid #80683d;border-radius:7px;box-shadow:0 5px 18px #000}.portrait{padding:10px;text-align:center}.portraitCanvas{width:90px;height:90px;margin:auto;border:2px solid #9d8650;background:#18251f;border-radius:50%;overflow:hidden}.portraitName{font-size:15px;color:#ffe9a3;margin-top:5px}.actions{padding:10px;display:grid;grid-template-columns:repeat(3,72px);gap:8px}.action{height:56px;border:2px solid #9c8451;border-radius:5px;background:linear-gradient(#405d48,#1a291f);color:#fff;font:bold 12px Georgia;cursor:pointer;text-shadow:1px 1px #000}.action:hover{filter:brightness(1.25);border-color:#e0c66e}.action:disabled{filter:grayscale(1) brightness(.6);cursor:not-allowed}.action small{display:block;color:#e2cb89;margin-top:3px}.info{padding:10px;font-size:13px;line-height:20px}.info b{color:#d6b35a}#hint{position:absolute;left:18px;bottom:18px;width:260px;color:#ddd;text-shadow:1px 1px #000;font-size:13px}#banner{position:absolute;top:25%;left:50%;transform:translate(-50%,-50%);font-size:48px;color:#ffe38a;text-shadow:0 4px 8px #000,0 0 20px #a44;opacity:0;transition:.35s;pointer-events:none}#banner.show{opacity:1}#help{position:absolute;right:18px;top:58px;width:230px;padding:10px;background:rgba(12,18,20,.8);border:1px solid #7d6a43;border-radius:5px;font-size:12px;color:#ddd}.healthbar{position:absolute;width:44px;height:7px;border:1px solid #111;background:#300;pointer-events:none}.healthbar i{display:block;height:100%;background:#62c84b}.selection{position:absolute;width:56px;height:24px;border:2px solid #72df59;border-radius:50%;transform:translate(-50%,-50%) rotateX(55deg);pointer-events:none}.gold{color:#ffd85a}.wood{color:#88c75a}.pop{color:#aaaaff}
</style>
</head>
<body>
<div id="gameTitle">⚔ FROSTREACH</div>
<div id="ui"><div id="top"><div class="res gold">Gold <b id="gold">500</b></div><div class="res wood">Lumber <b id="wood">350</b></div><div class="res pop">Population <b id="pop">0/30</b></div></div><div id="bottom"><div class="panel portrait"><div class="portraitCanvas" id="portrait"></div><div class="portraitName" id="portraitName">No unit selected</div></div><div class="panel actions" id="actions"></div><div class="panel info" id="info">Select a building or unit.<br><span id="objective"></span></div></div><div id="hint">Select units • Right-click to move / attack • Drag to select<br>Build mode: left-click the ground</div><div id="help"><b>Mission</b><br>Destroy the red enemy Great Hall.<br><br><b>Controls</b><br>WASD / edge pan • 1–3 camera<br>R gather • Build > right UI</div><div id="banner"></div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="game.js"></script>
</body></html>
