<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Werewolf Survival</title><link rel="stylesheet" href="style.css"></head><body>
<div id="game"><canvas id="c"></canvas>
<header id="hud"><div class="brand"><b>WEREWOLF</b><span>SURVIVAL</span></div><div class="level"><span id="lv">LV. 1</span><div class="bar"><i id="xpbar"></i></div></div><div class="right"><div id="kills"><small>KILLS</small><b>0</b></div><div id="time"><small>TIME</small><b>00:00</b></div></div></header>
<div id="boss"><span>HUNTER PARTY</span><div><i></i></div></div>
<div id="cross"><span></span><span></span></div>
<div id="start" class="overlay"><div class="moon"></div><div class="panel"><div class="eyebrow">NIGHTFALL // 12:00 AM</div><h1>THE HUNT<br><em>BEGINS</em></h1><p>Survive the frozen woods. Evolve before dawn.</p><button id="play">ENTER THE WILD</button><div class="keys"><span><kbd>WASD</kbd> MOVE</span><span><kbd>MOUSE</kbd> AIM</span><span><kbd>HOLD</kbd> ATTACK</span></div></div></div>
<div id="upgrade" class="overlay hidden"><div class="panel upgrade-panel"><div class="eyebrow">THE BEAST EVOLVES</div><h2>CHOOSE YOUR HUNT</h2><div id="cards"></div></div></div>
<div id="end" class="overlay hidden"><div class="panel"><div class="eyebrow" id="endTag">THE NIGHT ENDS</div><h1 id="endTitle">YOU WERE<br><em>HUNTED</em></h1><p id="endStats"></p><button id="again">HUNT AGAIN</button></div></div>
</div><script src="game.js"></script></body></html>
