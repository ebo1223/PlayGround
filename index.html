<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sudoku Master</title>
<style>
:root{--ink:#16202b;--navy:#10283d;--blue:#2f80ed;--pale:#edf4f9;--line:#b5c2cc;--cell:58px}*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:#f5f7fa}.topbar{height:76px;background:#fff;border-bottom:1px solid #e6eaee;display:flex;align-items:center;padding:0 32px}.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:21px}.brand-mark{width:38px;height:38px;border-radius:9px;background:var(--navy);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:3px;padding:7px}.brand-mark i{background:#fff;border-radius:1px}.wrap{max-width:1120px;margin:0 auto;padding:38px 24px 24px}.title-row{display:flex;align-items:end;justify-content:space-between;margin-bottom:24px}.title-row h1{font-size:36px;margin:0 0 4px;letter-spacing:-1px}.title-row p{margin:0;color:#78848f}.stats{display:flex;gap:12px}.stat{background:#fff;border:1px solid #e3e8ed;border-radius:10px;min-width:120px;padding:10px 16px}.stat label{display:block;color:#8a96a1;font-size:12px;margin-bottom:3px}.stat b{font-size:18px}.game{display:grid;grid-template-columns:auto 240px;gap:26px}.board-panel{background:#fff;border-radius:14px;padding:20px;border:1px solid #e2e7ec}.board{display:grid;grid-template-columns:repeat(9,var(--cell));grid-template-rows:repeat(9,var(--cell));border:3px solid var(--navy);width:calc(var(--cell)*9 + 6px)}.cell{border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:#fff;font-size:24px;font-weight:650;color:var(--blue);display:flex;align-items:center;justify-content:center;cursor:pointer;outline:none}.cell.given{color:var(--ink);font-weight:750}.cell:nth-child(3n){border-right:3px solid var(--navy)}.cell:nth-child(9n){border-right:0}.cell:nth-child(n+19):nth-child(-n+27),.cell:nth-child(n+46):nth-child(-n+54){border-bottom:3px solid var(--navy)}.cell:nth-child(n+73){border-bottom:0}.cell.selected{background:#dcecff}.cell.related{background:#f1f6fb}.cell.same{background:#cae1fb}.cell.error{background:#ffe1e1;color:#d94a4a}.board-foot{height:26px}.side{display:flex;flex-direction:column;gap:14px}.card{background:#fff;border:1px solid #e2e7ec;border-radius:12px;padding:16px}.card h3{margin:0 0 12px;font-size:14px}.difficulty{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.diff{border:1px solid #dfe5ea;border-radius:7px;background:#fff;padding:9px 4px;font-size:12px;cursor:pointer}.diff.active{background:var(--navy);color:#fff;border-color:var(--navy)}.number-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.num{height:50px;border:1px solid #dde5eb;border-radius:9px;background:#fff;font-size:20px;font-weight:700;cursor:pointer}.num:hover,.actions button:hover{background:#edf4fa}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions button{height:43px;border:1px solid #dde5eb;border-radius:8px;background:#fff;cursor:pointer;color:var(--ink);font-weight:650}.actions .erase{grid-column:span 2}.newgame{height:46px;border:0;border-radius:9px;background:var(--navy);color:#fff;font-weight:750;cursor:pointer}.win{position:fixed;inset:0;background:#10283d88;display:none;align-items:center;justify-content:center}.win.open{display:flex}.modal{background:#fff;border-radius:16px;padding:32px;text-align:center;width:min(380px,calc(100% - 32px));box-shadow:0 20px 60px #10283d33}.modal h2{margin:8px 0}.modal button{margin-top:12px;padding:12px 22px;border:0;border-radius:8px;background:var(--navy);color:#fff;font-weight:700}@media(max-width:850px){.wrap{padding:24px 12px}.title-row h1{font-size:28px}.stats{display:none}.game{grid-template-columns:1fr}.board-panel{overflow:auto}.board{--cell:clamp(32px,10vw,58px)}.side{display:grid;grid-template-columns:1fr 1fr}.number-pad{grid-template-columns:repeat(5,1fr)}.num{height:44px}}@media(max-width:520px){.topbar{height:64px;padding:0 16px}.wrap{padding:18px 8px}.title-row{margin:0 4px 14px}.side{grid-template-columns:1fr}.board-panel{padding:8px}.number-pad{grid-template-columns:repeat(9,1fr);gap:4px}.num{height:38px;font-size:17px}.actions{grid-template-columns:repeat(3,1fr)}.actions .erase{grid-column:auto}.card{padding:12px}}
</style></head>
<body>
<header class="topbar"><div class="brand"><div class="brand-mark"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><span>Sudoku Master</span></div></header>
<main class="wrap"><div class="title-row"><div><h1>Daily Puzzle</h1><p>Solve the grid — every row, column, and box.</p></div><div class="stats"><div class="stat"><label>TIME</label><b id="timer">00:00</b></div><div class="stat"><label>MISTAKES</label><b id="mistakes">0 / 3</b></div></div></div>
<div class="game"><section class="board-panel"><div id="board" class="board"></div><div class="board-foot"></div></section>
<aside class="side"><div class="card"><h3>Difficulty</h3><div class="difficulty"><button class="diff" data-level="easy">Easy</button><button class="diff active" data-level="medium">Medium</button><button class="diff" data-level="hard">Hard</button></div></div><div class="card"><h3>Numbers</h3><div id="pad" class="number-pad"></div></div><div class="card"><h3>Actions</h3><div class="actions"><button id="notes">✎ Notes</button><button id="hint">💡 Hint</button><button id="erase" class="erase">⌫ Erase</button></div></div><button id="newgame" class="newgame">New Game</button></aside></div></main>
<div id="win" class="win"><div class="modal"><div style="font-size:42px">🏆</div><h2>Puzzle complete!</h2><p id="wintext"></p><button id="again">Play again</button></div></div>
<script>
const solved=[[5,3,4,6,7,8,9,1,2],[6,7,2,1,9,5,3,4,8],[1,9,8,3,4,2,5,6,7],[8,5,9,7,6,1,4,2,3],[4,2,6,8,5,3,7,9,1],[7,1,3,9,2,4,8,5,6],[9,6,1,5,3,7,2,8,4],[2,8,7,4,1,9,6,3,5],[3,4,5,2,8,6,1,7,9]];
let puzzle=[],given=[],values=[],selected=-1,level='medium',mistakes=0,seconds=0,timer,notesMode=false;
const blanks={easy:[.45,.42,.48,.44,.40,.46,.43,.47,.45],medium:[.52,.58,.55,.54,.60,.56,.57,.53,.55],hard:[.65,.62,.68,.64,.63,.66,.67,.61,.65]};
function newGame(){clearInterval(timer);seconds=0;mistakes=0;notesMode=false;document.getElementById('notes').style.background='';updateStats();puzzle=[];given=[];for(let r=0;r<9;r++){puzzle[r]=[];given[r]=[];for(let c=0;c<9;c++){let keep=Math.random()>blanks[level][c];puzzle[r][c]=keep?solved[r][c]:0;given[r][c]=keep}}selected=-1;render();timer=setInterval(()=>{seconds++;updateStats()},1000)}
function render(){const board=document.getElementById('board');board.innerHTML='';for(let r=0;r<9;r++)for(let c=0;c<9;c++){const i=r*9+c,b=document.createElement('button');b.className='cell';b.textContent=puzzle[r][c]||'';if(given[r][c])b.classList.add('given');if(i===selected)b.classList.add('selected');else if(selected>=0){const sr=Math.floor(selected/9),sc=selected%9;if(r===sr||c===sc|| (Math.floor(r/3)==Math.floor(sr/3)&&Math.floor(c/3)==Math.floor(sc/3)))b.classList.add('related');if(puzzle[r][c]&&puzzle[r][c]==puzzle[sr][sc])b.classList.add('same')}b.onclick=()=>{selected=i;render()};board.appendChild(b)}}
function put(n){if(selected<0)return;let r=Math.floor(selected/9),c=selected%9;if(given[r][c])return;if(n===0){puzzle[r][c]=0;render();return}puzzle[r][c]=n;if(n!==solved[r][c]){mistakes++;document.querySelectorAll('.cell')[selected].classList.add('error');updateStats();if(mistakes>=3)setTimeout(()=>newGame(),400)}else render();checkWin()}
function updateStats(){document.getElementById('timer').textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');document.getElementById('mistakes').textContent=mistakes+' / 3'}
function checkWin(){for(let r=0;r<9;r++)for(let c=0;c<9;c++)if(puzzle[r][c]!==solved[r][c])return;clearInterval(timer);document.getElementById('wintext').textContent='You solved it in '+document.getElementById('timer').textContent+'.';document.getElementById('win').classList.add('open')}
for(let n=1;n<=9;n++){let b=document.createElement('button');b.className='num';b.textContent=n;b.onclick=()=>put(n);document.getElementById('pad').appendChild(b)}
document.getElementById('erase').onclick=()=>put(0);document.querySelectorAll('.diff').forEach(b=>b.onclick=()=>{document.querySelectorAll('.diff').forEach(x=>x.classList.remove('active'));b.classList.add('active');level=b.dataset.level;newGame()});document.getElementById('newgame').onclick=newGame;document.getElementBy('hint')?.addEventListener?.('click',()=>{});document.getElementById('hint').onclick=()=>{if(selected<0)return;let r=Math.floor(selected/9),c=selected%9;if(!given[r][c]){puzzle[r][c]=solved[r][c];render();checkWin()}};document.getElementById('notes').onclick=e=>{notesMode=!notesMode;e.currentTarget.style.background=notesMode?'#edf4fa':''};document.getElementById('again').onclick=()=>{document.getElementById('win').classList.remove('open');newGame()};document.addEventListener('keydown',e=>{if(e.key>=1&&e.key<=9)put(+e.key);if(e.key==='Backspace'||e.key==='Delete')put(0);if(e.key.startsWith('Arrow')){if(selected<0){selected=0}else{let r=Math.floor(selected/9),c=selected%9;if(e.key==='ArrowUp')r=(r+8)%9;if(e.key==='ArrowDown')r=(r+1)%9;if(e.key==='ArrowLeft')c=(c+8)%9;if(e.key==='ArrowRight')c=(c+1)%9;selected=r*9+c}render()}});newGame();
</script></body></html>
