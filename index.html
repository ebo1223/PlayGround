<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Business Tycoon</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
<header class="topbar">
  <div class="brand"><div class="brand-mark">BT</div><div><b>BUSINESS</b><span>TYCOON</span></div></div>
  <div class="stats">
    <div class="stat"><span class="stat-icon">$</span><div><small>CASH</small><strong id="cash">$12,500</strong></div></div>
    <div class="stat"><span class="stat-icon gold">★</span><div><small>REPUTATION</small><strong id="rep">120</strong></div></div>
    <div class="stat"><span class="stat-icon blue">⌁</span><div><small>DAY</small><strong id="day">1</strong></div></div>
  </div>
  <button id="nextDay" class="next-day">NEXT DAY <span>›</span></button>
</header>
<main>
  <aside class="sidebar">
    <div class="profile"><div class="avatar">A</div><div><small>CITY TYCOON</small><strong>Alex Morgan</strong></div></div>
    <nav>
      <button class="nav active" data-view="city"><i>▦</i> CITY</button>
      <button class="nav" data-view="businesses"><i>▣</i> BUSINESSES <b id="ownedCount">3</b></button>
      <button class="nav" data-view="market"><i>◫</i> MARKET</button>
      <button class="nav" data-view="missions"><i>✓</i> MISSIONS <b id="missionCount">3</b></button>
    </nav>
    <div class="side-bottom">
      <button id="saveBtn" class="small-btn">♙ SAVE</button>
      <button id="settingsBtn" class="small-btn">⚙</button>
    </div>
  </aside>

  <section class="content">
    <div class="view-head"><div><p>YOUR EMPIRE</p><h1 id="viewTitle">Downtown District</h1></div><div class="income"><small>DAILY INCOME</small><strong id="income">+$2,850</strong></div></div>

    <div id="cityView" class="view active">
      <div class="city-grid" id="cityGrid"></div>
      <div class="news"><div class="news-label">CITY NEWS</div><div id="newsText">Local economy is booming! Commercial property values are up 8%.</div></div>
    </div>

    <div id="businessView" class="view"><div class="business-list" id="businessList"></div></div>
    <div id="marketView" class="view"><div class="market-list" id="marketList"></div></div>
    <div id="missionsView" class="view"><div class="mission-list" id="missionList"></div></div>
  </section>
</main>
</div>
<div id="toast" class="toast"></div>
<div id="modal" class="modal hidden"><div class="modal-card"><button id="closeModal" class="close">×</button><div id="modalBody"></div></div></div>
<script src="game.js"></script>
</body>
</html>
