<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Chronicle — History Trivia</title>
  <style>
    :root{--ink:#20221d;--paper:#f4f0e5;--red:#c84d35;--gold:#ddb866;--green:#40584a}*
    {box-sizing:border-box}body{margin:0;font-family:Georgia,'Times New Roman',serif;color:var(--ink);background:#e8e2d2;min-height:100vh}.shell{min-height:100vh;display:grid;grid-template-columns:280px 1fr}.sidebar{background:#26352d;color:#efe9d7;padding:34px 28px;display:flex;flex-direction:column;border-right:8px solid #1b281f}.brand{font-size:26px;letter-spacing:4px;text-transform:uppercase;border-bottom:1px solid #788177;padding-bottom:22px}.brand span{display:block;font-family:Arial,sans-serif;font-size:10px;letter-spacing:5px;color:#cbbf9d;margin-top:8px}.side-stat{margin-top:36px}.label{font-family:Arial,sans-serif;font-size:10px;text-transform:uppercase;letter-spacing:2.5px;color:#bcb79f}.side-stat .number{font-size:54px;line-height:1;margin-top:10px}.progress{margin-top:auto}.track{height:5px;background:#59675d;margin-top:12px}.fill{height:100%;width:10%;background:var(--gold);transition:.4s}.main{padding:38px 64px 44px;background:linear-gradient(135deg,rgba(255,255,255,.25),transparent),var(--paper)}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #c9c1ad;padding-bottom:18px}.category{font-family:Arial,sans-serif;font-size:11px;text-transform:uppercase;letter-spacing:2.8px}.category b{color:var(--red)}.timer{text-align:center;font-family:Arial,sans-serif}.ring{width:58px;height:58px;border:2px solid #b6ad98;border-top-color:var(--red);border-radius:50%;display:grid;place-items:center;font-size:18px;font-weight:700;color:var(--red);transition:.3s}.card{max-width:820px;margin:54px auto 0}.question-no{font-family:Arial,sans-serif;font-size:11px;text-transform:uppercase;letter-spacing:2px;color:#777766}.question{font-size:48px;line-height:1.12;max-width:760px;margin:18px 0 38px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:14px}.answer{min-height:78px;border:1px solid #bcb59f;background:rgba(255,255,255,.38);color:var(--ink);font-family:Georgia,serif;font-size:18px;text-align:left;padding:16px 22px;cursor:pointer;transition:.18s;display:flex;align-items:center}.answer .key{font-family:Arial,sans-serif;font-size:11px;width:31px;height:31px;border:1px solid #aaa38f;border-radius:50%;display:grid;place-items:center;margin-right:16px;flex:none}.answer:hover:not(:disabled){transform:translateY(-2px);border-color:#697667;background:#fff}.answer.correct{background:#40584a;color:white;border-color:#40584a}.answer.correct .key{border-color:#fff}.answer.wrong{background:#c84d35;color:white;border-color:#c84d35}.answer.wrong .key{border-color:#fff}.answer:disabled{cursor:default}.feedback{min-height:92px;margin-top:20px;display:flex;align-items:center;justify-content:space-between;gap:20px}.explanation{font-size:15px;line-height:1.45;max-width:650px}.explanation b{display:block;font-family:Arial,sans-serif;text-transform:uppercase;letter-spacing:1.5px;font-size:10px;margin-bottom:5px}.next{border:0;background:var(--ink);color:white;font-family:Arial,sans-serif;text-transform:uppercase;letter-spacing:1.5px;font-size:11px;padding:16px 20px;cursor:pointer;display:none}.next.show{display:block}.result{display:none}.result.show{display:block}.result h2{font-size:62px;margin:20px 0 10px}.result p{font-size:20px}.restart{margin-top:20px}.hidden{display:none!important}@media(max-width:800px){.shell{grid-template-columns:1fr}.sidebar{min-height:118px;padding:18px 22px;display:grid;grid-template-columns:1fr auto;align-items:center}.brand{border:0;padding:0}.side-stat{margin:0;text-align:right}.side-stat .number{font-size:34px}.progress{position:absolute;left:0;right:0;top:118px}.main{padding:36px 22px}.card{margin-top:38px}.question{font-size:34px}.answers{grid-template-columns:1fr}.answer{min-height:64px}.feedback{align-items:flex-end}.top{padding-bottom:12px}.ring{width:50px;height:50px}}
  </style>
</head>
<body>
<div class="shell">
  <aside class="sidebar"><div class="brand">Chronicle<span>History Trivia</span></div><div class="side-stat"><div class="label">Score</div><div class="number" id="score">000</div></div><div class="progress"><div class="label"><span id="qcount">Question 1</span> / 10</div><div class="track"><div class="fill" id="fill"></div></div></div></aside>
  <main class="main"><div class="top"><div class="category"><b id="era">Ancient world</b> · <span id="category">Civilizations</span></div><div class="timer"><div class="label">Time</div><div class="ring" id="ring">20</div></div></div>
  <section class="card" id="game"><div class="question-no" id="no">Question I</div><h1 class="question" id="question"></h1><div class="answers" id="answers"></div><div class="feedback"><div class="explanation" id="explanation"></div><button class="next" id="next">Next question →</button></div></section>
  <section class="card result" id="result"><div class="question-no">Final dossier</div><h2 id="resultTitle">Excellent.</h2><p id="resultText"></p><button class="next show restart" id="restart">Play again</button></section></main>
</div>
<script>
const questions=[
{era:'Ancient world',category:'Civilizations',q:'Which civilization built Machu Picchu?',a:['The Maya','The Aztec','The Inca','The Olmec'],correct:2,why:'The Inca built Machu Picchu in the 15th century, high in the Andes of present-day Peru.'},
{era:'Antiquity',category:'Empires',q:'The Library of Alexandria was founded in which ancient kingdom?',a:['Roman Empire','Ptolemaic Egypt','The Persian Empire','Ancient Greece'],correct:1,why:'It was founded in Ptolemaic Egypt, under a dynasty descended from Alexander the Great’s general Ptolemy.'},
{era:'Middle Ages',category:'Exploration',q:'Who was the first European to reach the court of Kublai Khan?',a:['Marco Polo','Christopher Columbus','Vasco da Gama','Leif Erikson'],correct:0,why:'Marco Polo reached Kublai Khan’s court in China around 1275 and later wrote about his travels.'},
{era:'Renaissance',category:'Art & ideas',q:'Who painted the ceiling of the Sistine Chapel?',a:['Raphael','Titian','Michelangelo','Leonardo da Vinci'],correct:2,why:'Michelangelo painted the frescoed ceiling between 1508 and 1512.'},
{era:'Age of Sail',category:'Exploration',q:'Which ship carried Charles Darwin around the world?',a:['HMS Beagle','HMS Victory','Endeavour','Santa Maria'],correct:0,why:'Darwin sailed aboard HMS Beagle from 1831 to 1836, collecting observations that shaped his theories.'},
{era:'Revolutions',category:'Politics',q:'In which year did the French Revolution begin?',a:['1776','1789','1799','1815'],correct:1,why:'The Revolution began in 1789 with the Estates-General and the fall of the Bastille.'},
{era:'Industrial age',category:'Inventions',q:'Who developed the first practical telephone?',a:['Thomas Edison','Alexander Graham Bell','Nikola Tesla','James Watt'],correct:1,why:'Alexander Graham Bell patented his telephone in 1876 and is generally credited with the first practical system.'},
{era:'World conflict',category:'World history',q:'The Treaty of Versailles formally ended which conflict?',a:['The Crimean War','World War I','The Napoleonic Wars','World War II'],correct:1,why:'Signed in 1919, the Treaty of Versailles officially ended the state of war between Germany and the Allies of World War I.'},
{era:'Modern world',category:'Science',q:'Which nation launched the first human into space?',a:['United States','Soviet Union','China','United Kingdom'],correct:1,why:'The Soviet Union launched Yuri Gagarin aboard Vostok 1 in 1961.'},
{era:'Recent history',category:'World history',q:'The Berlin Wall fell in which year?',a:['1987','1989','1991','1993'],correct:1,why:'The Berlin Wall opened on November 9, 1989, a defining moment in the end of the Cold War.'}
];
let i=0,score=0,time=20,timer,locked=false;
const nums=['I','II','III','IV','V','VI','VII','VIII','IX','X'];
function render(){locked=false;time=20;clearInterval(timer);const q=questions[i];document.getElementById('era').textContent=q.era;document.getElementById('category').textContent=q.category;document.getElementById('no').textContent='Question '+nums[i];document.getElementById('question').textContent=q.q;document.getElementById('qcount').textContent='Question '+(i+1);document.getElementById('fill').style.width=((i+1)*10)+'%';document.getElementById('ring').textContent=time;document.getElementById('ring').style.borderTopColor='#c84d35';document.getElementById('explanation').innerHTML='';document.getElementById('next').classList.remove('show');const box=document.getElementById('answers');box.innerHTML='';q.a.forEach((a,n)=>{const b=document.createElement('button');b.className='answer';b.innerHTML='<span class="key">'+String.fromCharCode(65+n)+'</span><span>'+a+'</span>';b.onclick=()=>choose(n);box.appendChild(b)});timer=setInterval(()=>{time--;document.getElementById('ring').textContent=time;if(time<=5)document.getElementById('ring').style.borderTopColor='#c84d35';if(time<=0){clearInterval(timer);choose(-1)}},1000)}
function choose(n){if(locked)return;locked=true;clearInterval(timer);const q=questions[i],buttons=[...document.queryAll?[]:document.querySelectorAll('.answer')];buttons.forEach((b,k)=>{b.disabled=true;if(k===q.correct)b.classList.add('correct');if(k===n&&n!==q.correct)b.classList.add('wrong')});let correct=n===q.correct;if(correct)score+=100+time*5;document.getElementById('score').textContent=String(score).padStart(3,'0');document.getElementById('explanation').innerHTML='<b>'+ (correct?'Correct':'Not quite')+'</b>'+q.why;document.getElementById('next').textContent=i===9?'See results →':'Next question →';document.getElementById('next').classList.add('show')}
document.getElementById('next').onclick=()=>{i++;if(i<questions.length)render();else finish()};function finish(){document.getElementById('game').classList.add('hidden');document.getElementById('result').classList.add('show');const pct=Math.round(score/1500*100);document.getElementById('resultTitle').textContent=pct>=70?'Excellent.':'Keep exploring.';document.getElementById('resultText').textContent='Final score: '+score+' points. You completed all 10 chapters of history.'}document.getElementById('restart').onclick=()=>{i=0;score=0;document.getElementById('score').textContent='000';document.getElementById('result').classList.remove('show');document.getElementById('game').classList.remove('hidden');render()};document.addEventListener('keydown',e=>{if(!locked&&['1','2','3','4','a','b','c','d'].includes(e.key.toLowerCase())){const n=isNaN(Number(e.key))?e.key.toLowerCase():Number(e.key)-1;choose(n)}});render();
</script>
</body>
</html>
