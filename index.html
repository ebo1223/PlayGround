<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Corner Kings — Boxing Arena</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#07090d;color:#fff;font-family:Arial,Helvetica,sans-serif}canvas{display:block;width:100%;height:100%}
#ui{position:absolute;inset:0;pointer-events:none}.hud{position:absolute;top:18px;left:3%;right:3%;height:92px}.fighter{position:absolute;top:0;width:min(38%,430px)}.fighter.right{right:0}.nameplate{display:flex;align-items:center;gap:10px;margin-bottom:7px}.right .nameplate{justify-content:flex-end}.avatar{width:44px;height:44px;border-radius:50%;border:2px solid #f1b94b;background:linear-gradient(135deg,#151922,#596178);display:grid;place-items:center;font-weight:900}.red .avatar{border-color:#f2cf51}.name{font-size:17px;font-weight:900;letter-spacing:1.5px}.record{font-size:10px;color:#bbc1c9;margin-top:3px}.health{height:18px;background:#252932;border:2px solid #08090c;overflow:hidden;transform:skew(-12deg);box-shadow:0 4px 18px #000}.health span{display:block;height:100%;width:100%;background:linear-gradient(90deg,#f0be42,#f8d975);transition:width .18s}.red .health span{margin-left:auto;background:linear-gradient(90deg,#ff3b34,#ffb13b)}
.roundbox{position:absolute;left:50%;top:-2px;transform:translateX(-50%);text-align:center}.roundnum{font-size:12px;color:#c8cbd1;letter-spacing:3px}.timer{font-size:37px;font-weight:900;font-style:italic;line-height:38px;text-shadow:0 3px 10px #000}.rounddots{display:flex;gap:5px;justify-content:center;margin-top:7px}.dot{width:25px;height:5px;background:#343742}.dot.win{background:#f7c64a}.dot.loss{background:#ef3d35}
.start,.end{position:absolute;inset:0;display:grid;place-items:center;pointer-events:auto;background:radial-gradient(circle,rgba(12,15,21,.15),rgba(3,4,7,.82));transition:.25s}.hidden{opacity:0!important;visibility:hidden!important}.card{text-align:center;width:min(520px,86vw);padding:34px 30px 28px;border:1px solid rgba(255,255,255,.12);background:linear-gradient(145deg,rgba(20,24,31,.96),rgba(8,10,14,.96));box-shadow:0 24px 80px #000}.eyebrow{color:#e8bc4d;font-size:11px;font-weight:bold;letter-spacing:5px}.card h1{margin:10px 0 4px;font-size:clamp(44px,7vw,78px);line-height:.86;font-style:italic;letter-spacing:-4px}.card h1 span{color:#ed3d36}.card p{color:#aeb4bd;font-size:13px;letter-spacing:1px}.controls{display:flex;justify-content:center;gap:8px;margin:24px 0 18px}.control{min-width:86px;border:1px solid #30343d;padding:8px 10px;background:#151820;font-size:10px;color:#bbb}.control b{display:block;color:#fff;font-size:13px;margin-bottom:3px}.start button,.end button{border:0;background:#efc34a;color:#111;font-weight:900;font-size:14px;letter-spacing:2px;padding:15px 34px;cursor:pointer;clip-path:polygon(8% 0,100% 0,92% 100%,0 100%)}
#toast{position:absolute;left:50%;top:39%;transform:translate(-50%,-50%) scale(.8);font-size:clamp(38px,7vw,82px);font-style:italic;font-weight:900;letter-spacing:-3px;text-shadow:0 8px 24px #000;opacity:0;transition:.18s}.#END_UNUSED{display:none}
.mobile{display:none;position:absolute;bottom:24px;left:18px;right:18px;justify-content:space-between;pointer-events:auto}.mgroup{display:flex;gap:8px}.mkey{width:58px;height:58px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(12,14,18,.74);color:#fff;font-weight:bold;font-size:11px}.mkey.punch{background:rgba(228,62,55,.76)}
@media(max-width:760px){.hud{top:10px}.nameplate{gap:5px}.avatar{width:34px;height:34px}.name{font-size:12px}.record{display:none}.health{height:13px}.fighter{width:41%}.roundbox{top:0}.timer{font-size:27px}.roundnum{font-size:8px}.dot{width:14px}.mobile{display:flex}.controls{flex-wrap:wrap}.control{min-width:74px}}
</style></head>
<body><canvas id="c"></canvas><div id="ui">
<div class="hud"><div class="fighter red"><div class="nameplate"><div><div class="name">M. JACKSON</div><div class="record">THE HAWK · 24-2-0</div></div><div class="avatar">MJ</div></div><div class="health"><span id="pHealth"></span></div></div><div class="roundbox"><div class="roundnum">ROUND <span id="round">1</span> / 3</div><div class="timer" id="timer">1:30</div><div class="rounddots"><i class="dot" id="d0"></i><i class="dot" id="d1"></i><i class="dot" id="d2"></i></div></div><div class="fighter right"><div class="nameplate"><div class="avatar">R</div><div><div class="name">R. STONE</div><div class="record">THE WRECKER · 18-5-1</div></div></div><div class="health"><span id="eHealth"></span></div></div></div>
<div id="toast"></div><div class="start" id="start"><div class="card"><div class="eyebrow">CHAMPIONSHIP NIGHT</div><h1>CORNER <span>KINGS</span></h1><p>3 ROUNDS · 90 SECONDS · NO MERCY</p><div class="controls"><div class="control"><b>A / D</b>MOVE</div><div class="control"><b>W / S</b>GUARD</div><div class="control"><b>J</b>LEFT</div><div class="control"><b>K</b>RIGHT</div><div class="control"><b>L</b>BODY</div></div><button id="fight">ENTER THE RING</button></div></div>
<div class="end hidden" id="end"><div class="card"><div class="eyebrow">FINAL BELL</div><h1 id="result">K.O.</h1><p id="summary"></p><button id="again">FIGHT AGAIN</button></div></div>
<div class="mobile"><div class="mgroup"><button class="mkey" data-key="a">◀</button><button class="mkey" data-key="d">▶</button></div><div class="mgroup"><button class="mkey" data-key="w">GUARD</button><button class="mkey punch" data-key="j">JAB</button><button class="mkey punch" data-key="k">HOOK</button></div></div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');let W,H,DPR;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*DPR;c.height=H*DPR;c.style.width=W+'px';c.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const keys={};addEventListener('keydown',e=>{keys[e.key.toLowered?.()||e.key.toLowerCase()]=true});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
document.querySelectorAll('.mkey').forEach(b=>{const k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.prevent.prevent?.();keys[k]=true});b.addEventListener('pointerup',()=>keys[k]=false);b.addEventListener('pointerleave',()=>keys[k]=false)});
let running=false,ended=false,round=1,time=90,pHP=100,eHP=100,pWins=0,eWins=0,last=performance.now(),shake=0,flash=0;
let p={x:-.18,y:0,guard:false,action:'idle',at:0,stun:0,combo:0},e={x:.18,y:0,guard:false,action:'idle',at:0,stun:0};
function resetPositions(){p.x=-.18;e.x=.18;p.action=e.action='idle'}
function toast(t){const q=document.getElementById('toast');q.textContent=t;q.style.opacity=1;q.style.transform='translate(-50%,-50%) scale(1)';clearTimeout(toast.id);toast.id=setTimeout(()=>q.style.opacity=0,700)}
function punch(who,type){const from=who===p?p:e,to=who===p?e:p;if(from.stun>0||from.action==='punch')return;from.action='punch';from.at=.16;from.combo=(from.combo||0)+1;const dist=Math.abs(p.x-e.x);if(dist<.27){const guard=to.guard;let dmg=(type==='jab'?7:type==='hook'?11:9)*(guard?.45:1);if(who===p)dmg*=1+Math.min(p.combo,4)*.025;toHP(who,dmg,guard);shake=who===p?5:3;if(!guard&&type!=='jab')to.stun=.22}else if(who===p)flash=.08}
function toHP(who,dmg,guard){if(who===p){eHP-=dmg}else pHP-=dmg;if(guard)flash=.04}
function endGame(playerWon,reason){ended=true;running=false;document.getElementById('end').classList.remove('hidden');document.getElementById('result').innerHTML=playerWon?'YOU <span style="color:#efc34a">WIN</span>':'K.O. <span style="color:#ef3d35">LOSS</span>';document.getElementById('summary').textContent=reason+' · '+(playerWon?'Championship secured':'Back to the gym')}
function startRound(){running=true;resetPositions();time=90;toast('ROUND '+round);document.getElementById('round').textContent=round}
document.getElementById('fight').onclick=()=>{document.getElementById('start').classList.add('hidden');startRound()};document.getElementById('again').onclick=()=>location.reload();
function update(dt){if(!running)return;time-=dt;if(time<=0){time=90;if(pHP===eHP){toast('DRAW');pHP=eHP=Math.max(pHP,eHP)}else if(pHP>eHP)pWins++,roundWin(true);else eWins++,roundWin(false);round++;if(round>3||pWins>=2||eWins>=2){endGame(pWins>eWins,pWins>eWins?'Split decision':'Corner stoppage');return}document.getElementById('d'+(round-2)).className='dot '+(pWins>eWins?'win':'loss');startRound();return}p.guard=keys.w||keys.arrowup;p.y=p.guard?-0.02:0;e.guard=false;
 if(keys.a||keys.arrowleft)p.x-=dt*.34;if(keys.d||keys.arrowright)p.x+=dt*.34;p.x=clamp(p.x,-.38,.05);
 if(keys.j&&!p._j){punch(p,'jab')}if(keys.k&&!p._k){punch(p,'hook')}if(keys.l&&!p._l){punch(p,'body')}p._j=keys.j;p._k=keys.k;p._l=keys.l;
 let dist=p.x-e.x;if(e.stun<=0){e.at-=dt;const center=-.03;if(Math.abs(e.x-center)>.025)e.x+=Math.sign(center-e.x)*dt*.16; if(dist<-.05)e.x-=dt*.12;if(dist>-.32)e.x+=dt*.12;if(Math.random()<dt*.9){const r=Math.random();if(r>.72)e.guard=true;else if(r>.45)punch(e,r>.58?'hook':'jab')}}e.guard=Math.random()<.018?true:e.guard;if(e.guard&&Math.random()<dt*2)e.guard=false;
 p.at=Math.max(0,p.at-dt);e.at=Math.max(0,e.at-dt);p.stun=Math.max(0,p.stun-dt);e.stun=Math.max(0,e.stun-dt);if(p.at<=0)p.action='idle';if(e.at<=0)e.action='idle';pHP=clamp(pHP,0,100);eHP=clamp(eHP,0,100);document.getElementById('pHealth').style.width=pHP+'%';document.getElementById('eHealth').style.width=eHP+'%';document.getElementById('timer').textContent=Math.floor(time/60)+':'+String(Math.ceil(time%60)).padStart(2,'0');if(pHP<=0||eHP<=0){endGame(eHP<=0,pHP<=0?'KO victory':'KO defeat')}}
function roundWin(win){toast(win?'ROUND WON':'ROUND LOST');if(win)pWins++ ;else eWins++;pHP=clamp(pHP+18,0,100);eHP=clamp(eHP+18,0,100)}
function drawArena(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#151923');g.addColorStop(.58,'#090b10');g.addColorStop(1,'#050609');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);const horizon=H*.58;
 ctx.fillStyle='#0d1118';ctx.fillRect(0,horizon-100,W,100);ctx.fillStyle='#252b34';for(let i=0;i<14;i++){ctx.fillRect(i*W/14+4,horizon-70+((i%3)*7),W/14-8,12)}ctx.fillStyle='#090b0f';ctx.fillRect(0,horizon,W,H-horizon);
 ctx.fillStyle='#bfc0bc';ctx.fillRect(0,horizon-3,W,4);ctx.fillStyle='#151821';ctx.fillRect(W*.08,horizon,W*.84,H-horizon);
 // crowd
 for(let i=0;i<110;i++){const x=(i*83)%W,y=horizon-94+(i%9)*9;if(y<horizon-15){ctx.fillStyle=['#343a45','#69707c','#1b1e25','#8a5f4d'][i%4];ctx.beginPath();ctx.arc(x,y,4+((i*7)%5),0,Math.PI*2);ctx.fill()}}
 // ropes
 ctx.strokeStyle='#3a3d42';ctx.lineWidth=5;for(let y=horizon+15;y<horizon+H*.25;y+=45){ctx.beginPath();ctx.moveTo(W*.11,y);ctx.lineTo(W*.89,y);ctx.stroke()}ctx.fillStyle='#d8d7cf';for(let y=horizon+15;y<horizon+H*.25;y+=45){ctx.fillRect(W*.11,y-2,20,4);ctx.fillRect(W*.89-20,y-2,20,4)}
 // posts
 ctx.fillStyle='#191d24';ctx.fillRect(W*.09,horizon-38,22,H*.38);ctx.fillRect(W*.91-22,horizon-38,22,H*.38);ctx.fillStyle='#ddd7c8';ctx.fillRect(W*.09,horizon-38,22,10);ctx.fillRect(W*.91-22,horizon-38,22,10);
 // canvas
 ctx.fillStyle='#bcb8ad';ctx.fillRect(W*.14,horizon+34,W*.72,H-horizon-50);ctx.fillStyle='#9b9a91';ctx.font='bold 22px Arial';ctx.textAlign='center';ctx.fillText('CORNER  KINGS',W/2,horizon+H*.23)}
function boxer(x,y,red,guard,action,at,stun){const s=clamp(H/700,.72,1.1),base=horizon+H*.33+y*H/5;ctx.save();ctx.translate(W/2+x*W*.75,base);ctx.scale(s*(red?1:-1),s);const bob=running?Math.sin(performance.now()/180+x*20)*3:0;ctx.translate(0,bob);if(red)ctx.scale(-1,1);
 ctx.translate(0,0);ctx.fillStyle='rgba(0,0,0,.28)';ctx.beginPath();ctx.ellipse(0,35,65,12,0,0,Math.PI*2);ctx.fill();
 // legs
 ctx.fillStyle=red?'#cfb26a':'#24272d';ctx.fillRect(-37,-90,28,75);ctx.fillRect(9,-90,28,75);ctx.fillStyle='#11141a';ctx.fillRect(-43,-22,36,16);ctx.fillRect(7,-22,36,16);
 // shorts
 ctx.fillStyle=red?'#b52f2c':'#245078';ctx.beginPath();ctx.moveTo(-50,-115);ctx.lineTo(50,-115);ctx.lineTo(42,-82);ctx.lineTo(-42,-82);ctx.closePath();ctx.fill();ctx.fillStyle='#e7cf91';ctx.fillRect(-50,-116,100,8);
 // torso
 ctx.fillStyle=red?'#9b5a3d':'#9c6848';ctx.beginPath();ctx.ellipse(0,-155,48,67,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='rgba(55,30,20,.18)';ctx.beginPath();ctx.arc(0,-145,5,0,7);ctx.fill();
 // arms/punch
 ctx.lineCap='round';ctx.strokeStyle=red?'#8e5038':'#8f5a3d';ctx.lineWidth=22;let rightX=guard?26:58,rightY=guard?-190:-145,leftX=guard?-26:-58,leftY=guard?-190:-145;if(action==='punch'){const phase=Math.sin(at*20)*.5;if(red)rightX=65+Math.sin(at*20)*20,rightY=-155}else if(stun>0){rightX=70;rightY=-120}
 ctx.beginPath();ctx.moveTo(-43,-170);ctx.lineTo(leftX,leftY);ctx.stroke();ctx.beginPath();ctx.moveTo(43,-170);ctx.lineTo(rightX,rightY);ctx.stroke();ctx.fillStyle=red?'#cf3330':'#e2bd3e';ctx.beginPath();ctx.arc(leftX,leftY,16,0,7);ctx.fill();ctx.beginPath();ctx.arc(rightX,rightY,16,0,7);ctx.fill();
 // head
 ctx.fillStyle=red?'#a56a4c':'#986345';ctx.beginPath();ctx.arc(0,-232,31,0,7);ctx.fill();ctx.fillStyle='#15171c';ctx.beginPath();ctx.arc(0,-238,32,Math.PI,0);ctx.fill();ctx.fillStyle='#d5a06e';ctx.fillRect(-7,-220,14,8);
 ctx.restore()}
function frame(now){const dt=Math.min(.033,(now-last)/1000);last=now;update(dt);ctx.save();if(shake>0){ctx.translate(rnd(-shake,shake),rnd(-shake,shake));shake*=.88}drawArena();boxer(p.x,p.y,true,p.guard,p.action,p.at,p.stun);boxer(e.x,e.y,false,e.guard,e.action,e.at,e.stun);ctx.restore();if(flash>0){ctx.fillStyle='rgba(255,60,45,'+flash+')';ctx.fillRect(0,0,W,H);flash*=.8}requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
