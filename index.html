<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/><title>Basketball Stars</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Impact,'Arial Black',sans-serif;background:#111;color:#fff}#game{position:relative;width:100%;height:100%;background:linear-gradient(#4fc1ed 0 58%,#efc86d 58% 100%);overflow:hidden}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.topbar{position:absolute;z-index:5;top:18px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:20px}.score{height:78px;min-width:190px;display:flex;align-items:center;justify-content:center;gap:16px;background:linear-gradient(135deg,#1764a8,#0d2d67);border:5px solid #fff;border-radius:14px;box-shadow:0 6px 0 #09204d,0 10px 20px #0005;font-size:44px;text-shadow:3px 3px #111}.score.right{background:linear-gradient(135deg,#ed4739,#99182d);box-shadow:0 6px 0 #67111f,0 10px 20px #0005}.clock{width:94px;height:94px;border-radius:50%;display:grid;place-items:center;background:#24294d;border:7px solid #fff;box-shadow:0 5px 0 #111;font-size:31px;color:#ffd84d}.brand{position:absolute;z-index:6;left:22px;top:18px;font-size:27px;font-style:italic;line-height:.78;text-shadow:3px 3px #252525}.brand b{color:#ff9e20}.controls{position:absolute;z-index:6;left:20px;bottom:16px;font:700 13px Arial;color:#fff;text-shadow:1px 1px 3px #000}.controls kbd{display:inline-block;margin:2px;padding:6px 8px;min-width:32px;text-align:center;border-radius:7px;background:#182038dd;border:2px solid #fff}.overlay{position:absolute;z-index:10;inset:0;display:grid;place-items:center;background:linear-gradient(90deg,#112f58cc,#7e1d35cc)}.card{text-align:center;padding:32px 54px;border-radius:24px;background:#17233be6;border:5px solid #fff;box-shadow:0 12px 0 #0b1022,0 20px 40px #0007}.card h1{margin:0;font-size:68px;font-style:italic;line-height:.9;text-shadow:4px 4px #e34b37}.card h1 span{display:block;color:#5cc2ef;font-size:46px;text-shadow:3px 3px #16355f}.card p{font:700 18px Arial;color:#ffd75a}.card button{border:0;border-radius:12px;padding:15px 42px;background:#ff9f23;color:#17233b;font:900 24px Impact,Arial;box-shadow:0 7px 0 #b85c14;cursor:pointer}.card button:active{transform:translateY(5px);box-shadow:0 2px 0 #b85c14}.touch{display:none;position:absolute;z-index:7;bottom:18px;width:64px;height:64px;border-radius:50%;border:3px solid #fff;background:#17233b99;font:900 25px Arial;color:#fff}.lefttouch{left:18px}.righttouch{right:18px}.jumptouch{right:94px}@media(max-width:800px),(pointer:coarse){.touch{display:block}.controls{display:none}.brand{font-size:19px}.topbar{top:8px;gap:6px}.score{height:54px;min-width:112px;font-size:30px;border-width:3px}.clock{width:66px;height:66px;border-width:4px;font-size:22px}.card h1{font-size:46px}.card h1 span{font-size:34px}.card{padding:24px}}
</style></head>
<body><div id="game"><canvas id="c"></canvas><div class="brand"><b>BASKETBALL</b><br>STARS</div><div class="topbar"><div class="score" id="ps">0</div><div class="clock" id="clock">60</div><div class="score right" id="cs">0</div></div><div class="controls"><kbd>A</kbd><kbd>D</kbd> MOVE &nbsp; <kbd>W</kbd> JUMP &nbsp; <kbd>S</kbd> SLAM</div><button class="touch lefttouch" id="ml">‹</button><button class="touch jumptouch" id="mu">↑</button><button class="touch righttouch" id="mr">›</button><div class="overlay" id="overlay"><div class="card"><h1>BASKETBALL<span>STARS</span></h1><p id="subtitle">FIRST TO 21 • 60 SEC</p><button id="play">PLAY</button></div></div></div>
<script>
const c=document.querySelector('#c'),ctx=c.getContext('2d');let W,H,scale;
function resize(){W=c.clientWidth;H=c.clientHeight;c.width=W*devicePixelRatio;c.height=H*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);scale=Math.min(W/1200,H/700)}resize();addEventListener('resize',resize);
const keys={},touch={};onkeydown=e=>{keys[e.key.toLowerCase()]=true;if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key))e.preventDefault()};onkeyup=e=>keys[e.key.toLowerCase()]=false;
function bind(id,k){let el=document.querySelector(id);el.onpointerdown=e=>{e.preventDefault();touch[k]=true};el.onpointerup=el.onpointerleave=()=>touch[k]=false}bind('#ml','left');bind('#mr','right');bind('#mu','jump');
let running=false,time=60,pScore=0,cScore=0,ball,lastScore=0;
const player={x:.23,y:.72,vx:0,vy:0,ground:true,team:'p'};const cpu={x:.77,y:.72,vx:0,vy:0,ground:true,team:'c'};
function reset(){player.x=W*.23;player.y=H*.72;cpu.x=W*.77;cpu.y=H*.72;ball={x:W*.23,y:H*.58,vx:0,vy:-1,owner:'p',rot:0}}
function start(){pScore=cScore=0;time=60;running=true;document.querySelector('#overlay').style.display='none';reset();updateScore()}
document.querySelector('#play').onclick=start;
function updateScore(){document.querySelector('#ps').textContent=pScore;document.querySelector('#cs').textContent=cScore;document.querySelector('#clock').textContent=Math.ceil(time)}
function physics(o,dt){o.vy+=H*.00155*dt;o.x+=o.vx*dt;o.y+=o.vy*dt;if(o.y>H*.72){o.y=H*.72;o.vy=0;o.ground=true}else o.ground=false;o.x=Math.max(65,Math.min(W-65,o.x));o.vx*=Math.pow(.82,dt)}
function ballPhysics(dt){ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;ball.vy+=H*.00118*dt;ball.vx*=Math.pow(.995,dt);ball.rot+=ball.vx*.025*dt;if(ball.x<35||ball.x>W-35)ball.vx*=-.78;if(ball.y>H*.82){ball.y=H*.82;ball.vy=-Math.abs(ball.vy)*.62;ball.vx*=.8;if(Math.abs(ball.vy)<2.5){ball.vy=0}}
function hoopX(){return W*.86}function hoopY(){return H*.31}
let prev=performance.now(),timerAcc=0;
function loop(now){let dt=Math.min(2,(now-prev)/16.67);prev=now;if(running){timerAcc+=dt/60;if(timerAcc>=1){timerAcc-=1;time--;updateScore();if(time<=0||pScore>=21||cScore>=21)finish()}
let spd=W*.008;if(keys.a||touch.left)player.vx-=spd*dt;if(keys.d||touch.right)player.vx+=spd*dt;if((keys.w||touch.jump)&&player.ground){player.vy=-H*.0185;player.ground=false}if(keys.s&&ball.owner=='p'&&Math.abs(ball.x-player.x)<100){ball.vx=W*.012;ball.vy=-H*.009;ball.owner=null}
physics(player,dt);
let dx=(ball.owner=='c'?ball.x:hoopX())-cpu.x;if(Math.abs(dx)>25)cpu.vx+=Math.sign(dx)*W*.0045*dt;cpu.vx=Math.max(-W*.008,Math.min(W*.008,cpu.vx));if(cpu.y>H*.68&&ball.owner=='p'&&Math.abs(ball.x-cpu.x)<160&&Math.random()<.018)cpu.vy=-H*.0165;physics(cpu,dt);
if(ball.owner==null||ball.owner=='p'||ball.owner=='c')ballPhysics(dt);
for(const o of [player,cpu]){if(ball.owner==o.team){ball.x=o.x+(o.team=='p'?-25:25);ball.y=o.y-H*.13}else if(Math.abs(ball.x-o.x)<55&&Math.abs(ball.y-o.y)<75&&ball.owner!=o.team){ball.owner=o.team}}
let hx=hoopX(),hy=hoopY();if(ball.y<hy+35&&ball.y>hy-20&&ball.vy>0&&ball.x>hx-58&&ball.x<hx+58){let side=ball.owner=='p'?'p':'c';if(performance.now()-lastScore>700){lastScore=performance.now();if(side=='p'||ball.x>W*.5)pScore+=2;else cScore+=2;updateScore();reset()}}
if(ball.owner=='p'&&keys[' ']){ball.owner=null;ball.vx=W*.014;ball.vy=-H*.014}
}
draw();requestAnimationFrame(loop)}
function draw(){ctx.clearRect(0,0,W,H);let sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#55b7df');sky.addColorStop(.58,'#8ed7ed');sky.addColorStop(.581,'#d5a45d');sky.addColorStop(1,'#a96d34');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);ctx.fillStyle='#386f31';ctx.fillRect(0,H*.69,W,H*.31);ctx.fillStyle='#7ca74b';ctx.fillRect(0,H*.69,W,20);ctx.fillStyle='#a97a42';ctx.fillRect(0,H*.82,W,H*.18);ctx.fillStyle='#c7965c';for(let x=0;x<W;x+=90){ctx.fillRect(x,H*.82,3,H*.18)}ctx.fillStyle='#b88950';for(let y=H*.82;y<H;y+=55)ctx.fillRect(0,y,W,3);ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.beginPath();ctx.arc(W*.5,H*.82,W*.11,Math.PI,0);ctx.stroke();ctx.beginPath();ctx.moveTo(W*.5,H*.82);ctx.lineTo(W*.5,H*.61);ctx.stroke();drawHoop();drawPlayer(player,'#1f72b9','#15355e');drawPlayer(cpu,'#db4338','#81202b');drawBall()}
function drawHoop(){let x=hoopX(),y=hoopY();ctx.fillStyle='#f2eee2';ctx.fillRect(x+42,y-70,90,150);ctx.fillStyle='#b9d2dd';ctx.fillRect(x+50,y-62,74,134);ctx.strokeStyle='#fff';ctx.lineWidth=12;ctx.beginPath();ctx.moveTo(x+48,y+12);ctx.lineTo(x+48,y-94);ctx.stroke();ctx.fillStyle='#ef5a28';ctx.fillRect(x-65,y-12,132,12);ctx.strokeStyle='#eee';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x-52,y);ctx.lineTo(x-52,y+55);ctx.lineTo(x+52,y+55);ctx.lineTo(x+52,y);ctx.moveTo(x-52,y+55);ctx.lineTo(x+52,y);ctx.moveTo(x+52,y+55);ctx.lineTo(x-52,y);ctx.stroke();ctx.beginPath();ctx.arc(x,y,58,0,Math.PI*2);ctx.stroke()}
function drawPlayer(o,body,trim){ctx.save();ctx.translate(o.x,o.y);ctx.lineWidth=7;ctx.strokeStyle='#432717';ctx.beginPath();ctx.moveTo(-18,-5);ctx.lineTo(-28,20);ctx.moveTo(18,-5);ctx.lineTo(28,20);ctx.stroke();ctx.fillStyle='#b56e3a';ctx.fillRect(-31,15,20,8);ctx.fillRect(19,15,20,8);ctx.fillStyle=body;ctx.beginPath();ctx.roundRect(-36,-95,72,95,12);ctx.fill();ctx.fillStyle=trim;ctx.fillRect(-36,-53,72,15);ctx.fillStyle='#e1a172';ctx.beginPath();ctx.arc(0,-125,30,0,Math.PI*2);ctx.fill();ctx.fillStyle='#201510';ctx.beginPath();ctx.arc(0,-135,31,Math.PI,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.font='700 27px Arial';ctx.textAlign='center';ctx.fillText(o.team=='p'?'7':'23',0,-45);ctx.fillStyle='#e1a172';ctx.beginPath();ctx.arc(-42,-72,13,0,Math.PI*2);ctx.arc(42,-72,13,0,Math.PI*2);ctx.fill();ctx.restore()}
function drawBall(){ctx.save();ctx.translate(ball.x,ball.y);ctx.rotate(ball.rot);ctx.fillStyle='#ef7620';ctx.beginPath();ctx.arc(0,0,24,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#4a2015';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-24,0);ctx.lineTo(24,0);ctx.moveTo(0,-24);ctx.lineTo(0,24);ctx.moveTo(-17,-17);ctx.arc(0,0,24,Math.PI*.75,Math.PI*1.75);ctx.stroke();ctx.restore()}
function finish(){running=false;let won=pScore>cScore?'YOU WIN!':pScore<cScore?'CPU WINS!':'DRAW!';document.querySelector('#subtitle').textContent=won+' — '+pScore+' : '+cScore;document.querySelector('#play').textContent='PLAY AGAIN';document.querySelector('#overlay').style.display='grid'}
reset();draw();
</script></body></html>
