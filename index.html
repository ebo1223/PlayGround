<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tournament Champion 3D</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#080b14;font-family:Impact,"Arial Black",sans-serif;color:#fff;user-select:none}
canvas{display:block;width:100%;height:100%}.ui{position:absolute;inset:0;pointer-events:none}.hud{position:absolute;left:24px;right:24px;top:18px;display:flex;align-items:flex-start;justify-content:space-between;text-transform:uppercase}.panel{min-width:220px;filter:drop-shadow(0 5px 8px #000)}
.name{font-size:22px;letter-spacing:2px}.meter{width:220px;height:18px;background:#171a25;border:3px solid #dce4ef;transform:skew(-10deg);overflow:hidden}.fill{height:100%;width:100%;background:linear-gradient(90deg,#ff2d55,#ffcb45);transition:width .12s}.panel.right{text-align:right}.panel.right .meter{margin-left:auto}.round{font-size:23px;letter-spacing:3px;text-align:center;text-shadow:0 3px #000}.round b{display:block;font-size:42px;color:#ffd84a}.title{position:absolute;left:50%;top:43%;transform:translate(-50%,-50%) scale(.8);text-align:center;text-shadow:0 8px 0 #151827,0 14px 30px #000;opacity:0;transition:.18s}.title.show{transform:translate(-50%,-50%) scale(1);opacity:1}.title h1{font-size:76px;margin:0;line-height:.9;letter-spacing:4px}.title p{font-size:24px;color:#ffd84a;letter-spacing:5px}.intro{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#18203aee,#080b14f5);pointer-events:auto}.intro.hide{display:none}.card{text-align:center}.card h1{font-size:72px;line-height:.85;margin:0;text-shadow:0 7px 0 #1d2750}.card h1 span{color:#ffd84a}.card p{color:#aeb5ca;letter-spacing:2px}.button{pointer-events:auto;border:2px solid #fff;background:#e9b42f;color:#151827;font:900 24px Impact,sans-serif;letter-spacing:3px;padding:14px 34px;transform:skew(-7deg);cursor:pointer;box-shadow:0 7px 0 #8d6511}.button:hover{background:#ffe26d}.controls{margin-top:28px;font:16px monospace;color:#ccd2df}.controls b{color:#fff}.key{display:inline-grid;place-items:center;width:32px;height:32px;border:1px solid #8790a8;border-radius:4px;margin:2px}.winner-actions{margin-top:18px}.winner-actions .button{display:inline-block}
</style>
</head>
<body>
<canvas id="c"></canvas><div class="ui"><div class="hud"><div class="panel"><div class="name" id="pname">CHAMPION YOU</div><div class="meter"><div class="fill" id="php"></div></div></div><div class="round">ROUND <b id="round">1 / 5</b></div><div class="panel right"><div class="name" id="ename">ROOKIE REX</div><div class="meter"><div class="fill" id="ehp"></div></div></div></div><div class="title" id="announce"><h1 id="annTitle">FIGHT</h1><p id="annSub">ROUND 1</p></div></div>
<div class="intro" id="intro"><div class="card"><h1>TOURNAMENT<br><span>CHAMPION</span></h1><p>ONE ARENA. FIVE RIVALS. ONE TITLE.</p><button class="button" id="start">ENTER THE ARENA</button><div class="controls"><b>MOVE</b> <span class="key">A</span><span class="key">D</span> &nbsp; <b>JUMP</b> <span class="key">W</span> &nbsp; <b>STRIKE</b> <span class="key">J</span> <span class="key">K</span></div></div></div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');let W,H,DPR;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
const keys={},names=['ROOKIE REX','IRON MAYA','NEON DRAKE','VIKING VOSS','THE BOSS'];let player,enemy,round=1,running=false,phase='intro',shake=0,particles=[],t=0,last=0,gameWon=false;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
player={x:W*.28,y:0,vx:0,vy:0,hp:100,dir:1,atk:0,hit:0};enemy={x:W*.72,y:0,vx:0,vy:0,hp:100,dir:-1,atk:0,hit:0,ai:0};
function resetFight(){player={x:W*.28,y:0,vx:0,vy:0,hp:100,dir:1,atk:0,hit:0};enemy={x:W*.72,y:0,vx:0,vy:0,hp:100,dir:-1,atk:0,hit:0,ai:0};document.getElementById('ename').textContent=names[round-1];document.getElementById('round').textContent=round+' / 5';updateHP();}
function updateHP(){document.getElementById('php').style.width=player.hp+'%';document.getElementById('ehp').style.width=enemy.hp+'%'}
function announce(a,b){const el=document.getElementById('announce');document.getElementById('annTitle').textContent=a;document.getElementById('annSub').textContent=b;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),900)}
function start(){document.getElementById('intro').classList.add('hide');round=1;gameWon=false;resetFight();running=true;phase='fight';announce('ROUND 1','VS '+names[0]);}
document.getElementById('start').onclick=start;addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if([' ','arrowleft','arrowright','arrowup','arrowdown'].includes(e.key.toLowerCase()))e.prevent.preventDefault?.()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function punch(who,heavy){if(who.atk>0||who.hit>0)return;who.atk=heavy?28:18;who.vx+=who.dir*(heavy?5:3);setTimeout(()=>{if(running&&Math.abs(who.x-(who===player?enemy.x:player.x))<135&&Math.abs(who.y-(who===player?enemy.y:player.y))<80){const foe=who===player?enemy:player;foe.hp=clamp(foe.hp-(heavy?13:8),0,100);foe.hit=16;foe.vx+=who.dir*(heavy?12:7);shake=heavy?12:7;updateHP();spawn(foe.x,ground()-foe.y-70,heavy?'#ffd84a':'#ff536e',10);}},heavy?210:130)}
function ground(){return H*.78}function spawn(x,y,c,n){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-1)*8,vy:(Math.random()-1.5)*8,life:30,c,s:2+Math.random()*5})}
function update(){t++;if(!running)return;const g=ground();for(const f of [player,enemy]){f.x+=f.vx;f.y+=f.vy;f.vx*=.82;if(f.y<0)f.vy+=1.1;else if(f.y>=0){f.y=0;f.vy=0}f.x=clamp(f.x,100,W-100);if(f.atk>0)f.atk--;if(f.hit>0)f.hit--;}
if(keys.a){player.vx-=1.2;player.dir=-1}if(keys.d){player.vx+=1.2;player.dir=1}if(keys.w&&player.y===0){player.vy=-21}if(keys.j)punch(player,false);if(keys.k)punch(player,true);player.dir=enemy.x>player.x?1:-1;
// AI
enemy.ai--;if(enemy.ai<=0){enemy.ai=18+Math.random()*22;const d=enemy.x-player.x;if(Math.abs(d)>115)enemy.vx+=d>0?-1.15:1.15;if(Math.random()<.22&&enemy.y===0)enemy.vy=-17}enemy.dir=player.x>enemy.x?1:-1;if(Math.abs(enemy.x-player.x)<120&&enemy.ai%20===0)punch(enemy,Math.random()<.45);
if(player.hp<=0||enemy.hp<=0){running=false;setTimeout(nextRound,1200)}for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.25;p.life--;if(p.life<=0)particles.splice(i,1)}shake*=.75}
function nextRound(){if(enemy.hp<=0){if(round>=5){gameWon=true;showEnd(true)}else{round++;resetFight();running=true;phase='fight';announce('ROUND '+round,'VS '+names[round-1])}}else showEnd(false)}
function showEnd(win){running=false;const box=document.getElementById('intro');box.queryContent='';box.innerHTML=win?`<div class="card"><h1>TOURNAMENT<br><span>CHAMPION</span></h1><p>YOU DEFEATED ALL FIVE RIVALS</p><button class="button" id="again">CHAMPION AGAIN</button></div>`:`<div class="card"><h1><span>KNOCKOUT</span></h1><p>THE TITLE SLIPPED AWAY</p><button class="button" id="again">TRY AGAIN</button></div>`;box.classList.remove('hide');document.getElementById('again').onclick=()=>location.reload()}
function fighter(f,main){const base=ground()-f.y;ctx.save();ctx.translate(f.x+(shake?(Math.random-.5)*shake:0),base);ctx.scale(f.dir,1);if(f.hit>0)ctx.rotate(f.dir*.12);if(f.atk>0)ctx.rotate(-.08*f.dir);const skin=main?'#ffb18a':'#82d4dc',hair=main?'#191a20':'#20243b',cloth=main?'#edb91f':'#e64d62';ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(0,8,70,14,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#24304d';ctx.fillRect(-40,-78,80,82);ctx.fillStyle=cloth;ctx.beginPath();ctx.moveTo(-42,-75);ctx.lineTo(42,-75);ctx.lineTo(34,-20);ctx.lineTo(-34,-20);ctx.closePath();ctx.fill();ctx.fillStyle=skin;ctx.beginPath();ctx.arc(0,-105,30,0,Math.PI*2);ctx.fill();ctx.fillStyle=hair;if(main){ctx.beginPath();ctx.moveTo(-28,-126);ctx.lineTo(-20,-145);ctx.lineTo(-8,-128);ctx.lineTo(4,-149);ctx.lineTo(15,-128);ctx.lineTo(29,-139);ctx.lineTo(28,-115);ctx.fill()}else{ctx.fillRect(-28,-130,56,18)}ctx.fillStyle='#1a1c26';ctx.fillRect(-20,-108,8,4);ctx.fillRect(12,-108,8,4);ctx.fillStyle=skin;const armY=-60+(f.atk>0?-20:0);ctx.save();ctx.translate(38,-62);ctx.rotate(f.atk>0?-1.25:.15);ctx.fillRect(-8,-8,58,20);ctx.fillStyle='#ffb18a';ctx.fillRect(42,-11,23,24);ctx.restore();ctx.fillStyle=skin;ctx.fillRect(-54,-62,20,58);ctx.fillStyle='#151929';ctx.fillRect(-30,-18,22,76);ctx.fillRect(8,-18,22,76);ctx.fillStyle='#090b12';ctx.fillRect(-35,50,31,14);ctx.fillRect(3,50,31,14);ctx.restore()}
function draw(){ctx.clearRect(0,0,W,H);const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#10162c');sky.addColorStop(.75,'#28334e');sky.addColorStop(1,'#111527');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);ctx.fillStyle='#101425';for(let i=0;i<16;i++){ctx.fillRect(i*W/15,H*.18,2,H*.48)}ctx.fillStyle='#151b30';ctx.beginPath();ctx.moveTo(0,H*.68);ctx.lineTo(W,H*.68);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();ctx.fillStyle='#a7adbb';ctx.globalAlpha=.12;for(let i=-10;i<20;i++){const ring=Math.max(20,150+i*36);ctx.beginPath();ctx.arc(W/2,H*.62,ring,Math.PI,Math.PI*2);ctx.stroke()}ctx.globalAlpha=1;ctx.fillStyle='#23293b';ctx.fillRect(0,ground(),W,H-ground());ctx.strokeStyle='#687086';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,ground());ctx.lineTo(W,ground());ctx.stroke();ctx.fillStyle='#e9b42f';ctx.fillRect(W*.5-3,ground()-95,6,95);ctx.fillStyle='#151929';ctx.beginPath();ctx.arc(W*.5,ground()-110,48,0,Math.PI*2);ctx.fill();ctx.fillStyle='#e9b42f';ctx.font='900 42px Impact';ctx.textAlign='center';ctx.fillText('1',W*.5,ground()-96);fighter(player,true);fighter(enemy,false);for(const p of particles){ctx.globalAlpha=p.life/30;ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,p.s,p.s)}ctx.globalAlpha=1;requestAnimationFrame(loop)}
function loop(){update();draw()}requestAnimationFrame(loop);
</script>
</body></html>
