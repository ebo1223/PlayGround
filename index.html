<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Match 3 Mania</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght:wght@600;700;800&family=Nunito:wght@700;800&display=swap');
:root{--cream:#fff8df;--ink:#3a1d48;--pink:#ff5e7b;--purple:#7544a8}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:'Nunito',system-ui,sans-serif;color:var(--ink);overflow:hidden;background:#f9ebbc;background-image:radial-gradient(circle at 15% 20%,rgba(255,255,255,.8) 0 2px,transparent 3px),radial-gradient(circle at 78% 12%,rgba(255,255,255,.6) 0 3px,transparent 4px),linear-gradient(135deg,#fff7d6,#f5dba1)}
body:before{content:"";position:absolute;inset:-80px;background:radial-gradient(ellipse at 50% 110%,rgba(191,111,48,.14),transparent 40%);pointer-events:none}
.app{position:relative;width:min(1180px,100vw);height:100vh;margin:auto;display:grid;grid-template-columns:230px minmax(480px,620px) 230px;gap:22px;align-items:center;padding:18px 28px}
.side{height:min(690px,calc(100vh - 36px));display:flex;flex-direction:column;gap:14px}.brand{text-align:center;margin-bottom:3px}.brand h1{font-family:'Fredoka',sans-serif;font-size:39px;line-height:.82;margin:0;letter-spacing:-2px;color:#6b3a94;text-shadow:0 4px 0 #fff,0 7px 0 #df93bd}.brand h1 span{display:block;font-size:49px;color:#ff6682}.brand small{display:inline-block;margin-top:12px;color:#9c743d;font-size:13px;letter-spacing:2.5px;text-transform:uppercase}
.card{background:rgba(255,253,237,.93);border:3px solid #fff;border-radius:22px;box-shadow:0 8px 0 rgba(153,100,62,.12),0 12px 30px rgba(91,57,42,.12)}.score-card{padding:18px 20px;text-align:center}.label{font-size:12px;text-transform:uppercase;letter-spacing:2px;color:#a07e69}.score{font-family:'Fredoka';font-size:44px;line-height:1;color:#f05b77}.goal{margin-top:10px;color:#806458}.progress{height:12px;border-radius:20px;background:#eadbbd;margin-top:8px;overflow:hidden;border:2px solid rgba(130,91,64,.08)}.progress i{display:block;height:100%;width:0%;border-radius:20px;background:linear-gradient(90deg,#ff9f55,#ff5d7b);transition:width .35s}
.moves-card{padding:15px;text-align:center}.moves{font-family:'Fredoka';font-size:54px;line-height:.95;color:#71479c}.moves-card .label{margin-top:5px}
.boosters{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.boost{border:0;border-radius:15px;height:82px;background:#fffdf0;border:3px solid #fff;box-shadow:0 5px 0 #dec99d;cursor:pointer;transition:.15s;position:relative}.boost:hover{transform:translateY(-2px)}.boost.selected{outline:4px solid #ff86a0;background:#fff1f3}.boost b{display:block;font-size:31px}.boost span{font-size:10px;text-transform:uppercase;letter-spacing:.5px}.boost em{position:absolute;right:-5px;top:-7px;background:#7544a8;color:white;border-radius:12px;font-size:10px;padding:2px 7px;font-style:normal}
.center{display:flex;flex-direction:column;align-items:center}.board-wrap{position:relative;width:min(620px,calc(100vw - 520px),calc(100vh - 36px));aspect-ratio:1;padding:14px;border-radius:28px;background:linear-gradient(145deg,#b36ec1,#71449e);box-shadow:0 12px 0 #59377e,0 22px 45px rgba(65,38,90,.28);border:5px solid rgba(255,255,255,.65)}
.board{height:100%;display:grid;grid-template-columns:repeat(8,1fr);gap:5px;border-radius:17px;background:#6a438e;padding:7px}.tile{position:relative;border:0;border-radius:14px;padding:0;cursor:pointer;transition:transform .12s,filter .12s;box-shadow:inset 0 -5px 0 rgba(65,31,72,.16),0 3px 5px rgba(42,24,59,.16);overflow:hidden}.tile:hover{transform:scale(.94);filter:brightness(1.08)}.tile.selected{transform:scale(.82);outline:4px solid white}.tile.hint{animation:pulse 1s infinite}.tile.matching{animation:pop .28s forwards}.tile.special:after{content:"✦";position:absolute;inset:0;display:grid;place-items:center;font-size:38px;color:rgba(255,255,255,.9);text-shadow:0 2px 5px rgba(0,0,0,.2)}
@keyframes pop{50%{transform:scale(1.18) rotate(8deg)}100%{transform:scale(0);opacity:0}}@keyframes pulse{50%{transform:scale(.88);filter:brightness(1.2)}}
.red{background:linear-gradient(135deg,#ff9aa1,#f34860)}.blue{background:linear-gradient(135deg,#72d8ff,#378bd5)}.yellow{background:linear-gradient(135deg,#ffe881,#ffc32a)}.green{background:linear-gradient(135deg,#91e89b,#4bbf66)}.purple{background:linear-gradient(135deg,#d89bf2,#9851bd)}.orange{background:linear-gradient(135deg,#ffc079,#ef7e35)}
.gem{position:absolute;inset:13%;border-radius:50%;background:radial-gradient(circle at 35% 25%,rgba(255,255,255,.9) 0 5%,rgba(255,255,255,.32) 8%,transparent 28%),currentColor;box-shadow:inset -5px -7px 8px rgba(60,30,70,.14)}.red .gem{color:#f84d63}.blue .gem{color:#3c9dda}.yellow .gem{color:#f5b827}.green .gem{color:#50bc67}.purple .gem{color:#9e55bc}.orange .gem{color:#ed8134}
.toast{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.7);font-family:'Fredoka';font-size:42px;color:white;text-shadow:0 4px 0 #874b9b,0 6px 18px rgba(54,28,73,.35);pointer-events:none;opacity:0}.toast.show{animation:toast 1s}.combo{position:absolute;right:-8px;top:18px;background:#fffdf0;border-radius:14px;padding:8px 12px;font-family:'Fredoka';color:#f05b77;box-shadow:0 5px 15px rgba(70,40,50,.18);transform:rotate(3deg);opacity:0}.combo.show{animation:combo .8s}@keyframes toast{20%,70%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-70%) scale(1.08)}}@keyframes combo{40%{opacity:1;transform:rotate(3deg) scale(1.12)}100%{opacity:0}}
.goals{display:flex;flex-direction:column}.goal-row{display:flex;align-items:center;gap:10px;padding:9px 8px;border-bottom:1px dashed #eadbbd}.goal-row:last-child{border:0}.mini{width:42px;height:42px;border-radius:12px;box-shadow:inset 0 -4px rgba(60,30,70,.12)}.goal-row b{margin-left:auto;font-family:'Fredoka';font-size:20px}.goal-row.done{opacity:.45}.goal-row.done b{text-decoration:line-through}
.actions{display:flex;gap:8px}.action{flex:1;border:0;border-radius:15px;padding:13px 8px;background:#fffdf0;box-shadow:0 5px 0 #dec99d;color:#7a5a55;font-family:'Nunito';font-weight:800;cursor:pointer}.action.primary{background:linear-gradient(135deg,#ff7e98,#ef5576);color:white;box-shadow:0 5px 0 #bd3e60}
.modal{position:absolute;inset:0;z-index:20;background:rgba(66,38,84,.62);display:none;align-items:center;justify-content:center;backdrop-filter:blur(5px)}.modal.show{display:flex}.modal-box{width:min(390px,calc(100vw - 40px));text-align:center;padding:32px}.modal h2{font-family:'Fredoka';font-size:48px;margin:0;color:#f05b77}.modal p{color:#806458}.modal button{border:0;border-radius:16px;padding:14px 28px;background:#7544a8;color:white;font-family:'Fredoka';font-size:18px;cursor:pointer}
@media(max-width:900px){body{overflow:auto}.app{height:auto;min-height:100vh;grid-template-columns:minmax(72px,90px) minmax(320px,1fr) 90px;padding:10px 8px;gap:7px}.brand h1{font-size:25px}.brand h1 span{font-size:31px}.brand small{display:none}.side{height:calc(100vh - 20px);gap:7px}.board-wrap{width:min(600px,calc(100vw - 196px),calc(100vh - 20px))}.score-card{padding:10px 5px}.score{font-size:28px}.moves-card{padding:8px}.moves{font-size:38px}.goals{display:none}.boosters{gap:4px}.boost{height:70px}.boost span{display:none}.boost b{font-size:24px}.actions{flex-direction:column}.action{padding:9px 4px;font-size:12px}.label{font-size:9px}}
@media(max-width:560px){body{overflow:hidden}.app{height:100vh;grid-template-columns:1fr;grid-template-rows:auto 1fr auto;padding:6px}.app>.side:first-child{height:58px;flex-direction:row}.brand{width:112px}.brand h1{font-size:20px}.brand h1 span{font-size:25px}.score-card{flex:1}.moves-card{width:76px}.side.right{height:66px}.right .goals,.right .actions{display:none}.boosters{width:100%;margin:0 auto}.boost{height:54px}.boost b{font-size:22px}.boost em{font-size:8px}.center{align-self:center}.board-wrap{width:min(calc(100vw - 12px),calc(100vh - 150px));padding:8px}.board{gap:3px;padding:5px}.tile{border-radius:9px}.gem{inset:12%}}
</style>
</head>
<body>
<div class="app">
 <aside class="side left">
  <div class="brand"><h1>MATCH 3<span>MANIA</span></h1><small>Sweet puzzles</small></div>
  <div class="card score-card"><div class="label">Score</div><div class="score" id="score">0</div><div class="goal"><span id="scoreGoal">Goal 3,000</span><div class="progress"><i id="progress"></i></div></div></div>
  <div class="card moves-card"><div class="moves" id="moves">24</div><div class="label">Moves left</div></div>
  <div class="boosters">
   <button class="boost" data-booster="hammer" title="Hammer — remove one tile"><b>🔨</b><span>Hammer</span><em id="hammerCount">3</em></button>
   <button class="boost" data-booster="shuffle" title="Shuffle the board"><b>🌀</b><span>Shuffle</span><em id="shuffleCount">2</em></button>
   <button class="boost" data-booster="swap" title="Swap any two tiles"><b>↔️</b><span>Free swap</span><em id="swapCount">2</em></button>
  </div>
 </aside>
 <main class="center">
  <div class="board-wrap"><div class="board" id="board"></div><div class="toast" id="toast"></div><div class="combo" id="combo">NICE! ×2</div></div>
 </main>
 <aside class="side right">
  <div class="card goals" style="padding:10px 14px"><div class="label" style="margin:5px 0 3px">Today’s goals</div><div id="goalList"></div></div>
  <div class="actions"><button class="action" id="hintBtn">💡 Hint</button><button class="action primary" id="newBtn">↻ New game</button></div>
 </aside>
</div>
<div class="modal" id="modal"><div class="modal-box card"><h2 id="modalTitle">Sweet!</h2><p id="modalText">You cleared the board!</p><button id="modalBtn">Play again</button></div></div>
<script>
const colors=['red','blue','yellow','green','purple','orange'], goals=[{c:'red',n:18},{c:'blue',n:16},{c:'yellow',n:14}];
let board=[],score=0,moves=24,selected=null,busy=false,swapping=false,counts={hammer:3,shuffle:2,swap:2},progress={red:0,blue:0,yellow:0,green:0,purple:0,orange:0};
const boardEl=document.getElementById('board'),scoreEl=document.getElementById('score'),movesEl=document.getElementById('moves'),progressEl=document.getElementById('progress');
function randomColor(){return colors[Math.floor(Math.random()*colors.length)]}
function init(){board=[];score=0;moves=24;selected=null;busy=false;swapping=false;counts={hammer:3,shuffle:2,swap:2};progress={red:0,blue:0,yellow:0,green:0,purple:0,orange:0};document.querySelectorAll('.boost').forEach(b=>b.classList.remove('selected'));document.getElementById('modal').classList.remove('show');renderGoals();for(let r=0;r<8;r++){board[r]=[];for(let c=0;c<8;c++){let choices=colors.filter(x=>!(c>=2&&board[r][c-1]==x&&board[r][c-2]==x)&&!(r>=2&&board[r-1][c]==x&&board[r-2][c]==x));board[r][c]=choices[Math.floor(Math.random()*choices.length)]}}update();render();}
function render(){boardEl.innerHTML='';for(let r=0;r<8;r++)for(let c=0;c<8;c++){const el=document.createElement('button');el.className='tile '+board[r][c];el.dataset.r=r;el.dataset.c=c;el.innerHTML='<i class="gem"></i>';el.addEventListener('click',()=>tileClick(r,c));boardEl.appendChild(el)}}
function update(){scoreEl.textContent=score.toLocaleString();movesEl.textContent=moves;progressEl.style.width=Math.min(100,score/3000*100)+'%';['hammer','shuffle','swap'].forEach(k=>document.getElementById(k+'Count').textContent=counts[k])}
function renderGoals(){document.getElementById('goalList').innerHTML=goals.map(g=>`<div class="goal-row ${progress[g.c]>=g.n?'done':''}"><div class="mini ${g.c}"></div><span>${g.n-progress[g.c]>0?g.n-progress[g.c]:0} left</span><b>${g.n}</b></div>`).join('')}
function tileClick(r,c){if(busy)return;const active=document.querySelector('.boost.selected');if(active){useBooster(active.dataset.booster,r,c);return}
 if(!selected){selected={r,c};updateSelection();return}if(selected.r==r&&selected.c==c){selected=null;updateSelection();return}if(Math.abs(selected.r-r)+Math.abs(selected.c-c)==1){const a=selected;selected=null;swap(a.r,a.c,r,c,true)}else{selected={r,c};updateSelection()}}
function updateSelection(){document.querySelectorAll('.tile').forEach((el,i)=>el.classList.toggle('selected',selected&&+el.dataset.r==selected.r&&+el.dataset.c==selected.c))}
function swap(r1,c1,r2,c2,consume){if(busy)return;busy=true;[board[r1][c1],board[r2][c2]]=[board[r2][c2],board[r1][c1]];render();const matches=findMatches();if(matches.length||!consume){if(consume)moves--;resolve(matches,1)}else{setTimeout(()=>{[board[r1][c1],board[r2][c2]]=[board[r2][c2],board[r1][c1]];render();busy=false},180)}}
function findMatches(){const matched=new Set();for(let r=0;r<8;r++){let start=0;for(let c=1;c<=8;c++){if(c<8&&board[r][c]==board[r][start])continue;if(c-start>=3)for(let x=start;x<c;x++)matched.add(r+','+x);start=c}}for(let c=0;c<8;c++){let start=0;for(let r=1;r<=8;r++){if(r<8&&board[r][c]==board[start][c])continue;if(r-start>=3)for(let x=start;x<r;x++)matched.add(x+','+c);start=r}}return [...matched].map(s=>s.split(',').map(Number))}
async function resolve(matches,combo){if(!matches.length){busy=false;checkEnd();return}matches.forEach(([r,c])=>{progress[board[r][c]]=(progress[board[r][c]]||0)+1});matches.forEach(([r,c])=>{const el=boardEl.querySelector(`[data-r="${r}"][data-c="${c}"]`);if(el)el.classList.add('matching')});score+=matches.length*150*combo;if(combo>1)showCombo(combo);update();renderGoals();await wait(280);matches.forEach(([r,c])=>board[r][c]=null);drop();await wait(240);render();await wait(40);const next=findMatches();if(next.length)resolve(next,combo+1);else{busy=false;checkEnd()}}
function drop(){for(let c=0;c<8;c++){let write=7;for(let r=7;r>=0;r--)if(board[r][c]){board[write][c]=board[r][c];if(write!=r)board[r][c]=null;write--}for(let r=write;r>=0;r--)board[r][c]=randomColor()}}
function wait(ms){return new Promise(r=>setTimeout(r,ms))}
function useBooster(kind,r,c){const active=document.querySelector('.boost.selected');if(counts[kind]<=0)return;if(kind=='hammer'){counts.hammer--;busy=true;board[r][c]=null;progressToast('POW!');drop();render();update();setTimeout(()=>busy=false,250)}if(kind=='shuffle'){counts.shuffle--;busy=true;const vals=board.flat();for(let i=vals.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[vals[i],vals[j]]=[vals[j],vals[i]]}while(vals.some((v,i)=>i>=7&&vals[i]==vals[i-1]&&vals[i]==vals[i-2]))vals.sort(()=>Math.random-.5);for(let i=0;i<64;i++)board[Math.floor(i/8)][i%8]=vals[i];render();progressToast('SHUFFLE!') ;busy=false}if(kind=='swap'){counts.swap--;swapping=true;progressToast('Pick two!');busy=false}active.classList.remove('selected');update();renderGoals()}
function progressToast(text){const el=document.getElementById('toast');el.textContent=text;el.className='toast show';setTimeout(()=>el.className='toast',1000)}
function showCombo(n){const el=document.getElementById('combo');el.textContent='NICE! ×'+n;el.className='combo show';setTimeout(()=>el.className='combo',800)}
function checkEnd(){const won=score>=3000&&goals.every(g=>progress[g.c]>=g.n);if(won)end(true);else if(moves<=0)end(false)}
function end(won){document.getElementById('modalTitle').textContent=won?'Sweet!':'So close!';document.getElementById('modalText').textContent=won?'You crushed the goals and scored '+score.toLocaleString()+' points!':'No moves left — try another sweet combo.';document.getElementById('modal').classList.add('show')}
document.querySelectorAll('.boost').forEach(b=>b.onclick=()=>{if(busy||counts[b.dataset.booster]<=0)return;document.querySelectorAll('.boost').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')});
document.getElementById('hintBtn').onclick=()=>{document.querySelectorAll('.tile.hint').forEach(x=>x.classList.remove('hint'));for(let r=0;r<8;r++)for(let c=0;c<8;c++){for(const [dr,dc]of[[0,1],[1,0]]){const r2=r+dr,c2=c+dc;if(r2<8&&c2<8){[board[r][c],board[r2][c2]]=[board[r2][c2],board[r][c]];const ok=findMatches().length;[board[r][c],board[r2][c2]]=[board[r2][c2],board[r][c]];if(ok){boardEl.querySelector(`[data-r="${r}"][data-c="${c}"]`)?.classList.add('hint');boardEl.querySelector(`[data-r="${r2}"][data-c="${c2}"]`)?.classList.add('hint');return}}}}};
document.getElementById('newBtn').onclick=init;document.getElementById('modalBtn').onclick=init;
init();
</script>
</body>
</html>
