<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crossword Challenge</title>
<style>
:root{--ink:#172131;--navy:#1d2a44;--cream:#f7f6f1;--orange:#ef6b43;--yellow:#f5d67d}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--cream)}
header{height:72px;background:white;border-bottom:1px solid #e8e7e1;display:flex;align-items:center;padding:0 28px;justify-content:space-between}.brand{display:flex;align-items:center;gap:12px}.brandmark{width:38px;height:38px;border:2px solid var(--ink);border-radius:50%;display:grid;place-items:center;font-weight:900}.brandname{font-family:Georgia,serif;font-size:23px;font-weight:700}.level{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#777b82;margin-top:2px}.headright{display:flex;align-items:center;gap:18px}.timer{font-variant-numeric:tabular-nums;font-weight:700}.iconbtn{border:0;background:transparent;font-size:20px;cursor:pointer;color:#677080;padding:6px}
main{max-width:1180px;margin:0 auto;padding:26px 24px 40px}.topline{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:18px}.titleblock h1{font-family:Georgia,serif;font-size:34px;line-height:1;margin:0 0 7px}.titleblock p{margin:0;color:#777b82;font-size:13px}.actions{display:flex;gap:8px}.btn{height:38px;padding:0 14px;border:1px solid #d7d8d3;border-radius:7px;background:white;color:var(--ink);font-weight:700;cursor:pointer}.btn.primary{background:var(--navy);color:white;border-color:var(--navy)}
.game{display:grid;grid-template-columns:minmax(430px,620px) 1fr;gap:28px}.boardwrap{background:white;border:1px solid #e3e3de;border-radius:12px;padding:22px;box-shadow:0 8px 30px rgba(31,39,54,.04)}.board{width:100%;aspect-ratio:1/1;display:grid;grid-template-columns:repeat(11,1fr);grid-template-rows:repeat(11,1fr);border:1.5px solid #7d8794;overflow:hidden}.cell{position:relative;border-right:1px solid #cfd2d2;border-bottom:1px solid #cfd2d2;background:white;display:flex;align-items:center;justify-content:center}.cell.block{background:var(--navy);border-color:var(--navy)}.cell input{width:100%;height:100%;border:0;text-align:center;text-transform:uppercase;font-family:Georgia,serif;font-size:clamp(16px,2.1vw,27px);font-weight:700;color:var(--ink);background:transparent;caret-color:transparent;outline:0;padding:0}.cell.activeword{background:#edf3ef}.cell.activecell{background:var(--yellow)!important}.cell.correct input{color:#2d7968}.cell.wrong input{color:#c64c3c}.num{position:absolute;left:2px;top:1px;font-size:clamp(7px,.7vw,10px);font-weight:700;z-index:2;color:#586273}
.clues{background:white;border:1px solid #e3e3de;border-radius:12px;padding:20px 22px;height:fit-content;max-height:594px;overflow:auto}.cluetabs{display:flex;border-bottom:1px solid #e7e7e2;gap:24px;margin-bottom:13px}.tab{border:0;background:none;padding:0 0 10px;font-weight:800;font-size:13px;color:#9a9da2;cursor:pointer}.tab.active{color:var(--ink);border-bottom:3px solid var(--orange)}.clue{display:grid;grid-template-columns:28px 1fr;gap:7px;padding:9px 7px;border-radius:7px;font-size:13px;line-height:1.35;cursor:pointer}.clue:hover,.clue.active{background:#f2f5f3}.clue .n{font-weight:800;color:#62705e}.clue.solved{opacity:.5;text-decoration:line-through}.progress{height:4px;background:#ecece7;border-radius:4px;margin-top:16px;overflow:hidden}.progress div{height:100%;width:0;background:var(--orange);transition:.25s}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,30px);background:var(--navy);color:white;padding:12px 18px;border-radius:8px;opacity:0;transition:.25s;font-size:13px}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:820px){header{height:62px;padding:0 16px}.level,.brandname{display:none}.headright{gap:8px}main{padding:18px 12px}.topline{align-items:center}.titleblock h1{font-size:27px}.actions .btn{padding:0 10px}.game{grid-template-columns:1fr;gap:14px}.boardwrap{padding:10px}.clues{max-height:none}.board input{font-size:clamp(14px,5vw,24px)}}
</style></head>
<body><header><div class="brand"><div class="brandmark">C</div><div><div class="brandname">Crossword Challenge</div><div class="level">DAILY PUZZLE · #042</div></div></div><div class="headright"><div class="timer" id="timer">00:00</div><button class="iconbtn" id="pause" title="Pause">Ⅱ</button></div></header>
<main><div class="topline"><div class="titleblock"><h1>Mini Crossword</h1><p id="date"></p></div><div class="actions"><button class="btn" id="hint">Hint</button><button class="btn primary" id="check">Check</button></div></div><div class="game"><div class="boardwrap"><div class="board" id="board"></div></div><aside class="clues"><div class="cluetabs"><button class="tab active" data-dir="across">Across</button><button class="tab" data-dir="down">Down</button></div><div id="cluelist"></div><div class="progress"><div id="progress"></div></div></aside></div></main><div class="toast" id="toast"></div>
<script>
const entries=[
{n:1,a:'across',r:0,c:3,ans:'GAME',clue:'Fun or sport'},
{n:2,a:'across',r:1,c:1,ans:'LIGHT',clue:'What a bulb gives'},
{n:3,a:'down',r:0,c:3,ans:'GLASS',clue:'Window material'},
{n:4,a:'down',r:0,c:7,ans:'TREE',clue:'Forest giant'},
{n:5,a:'across',r:3,c:5,ans:'CROSS',clue:'Symbol with four arms'},
{n:6,a:'down',r:3,c:5,ans:'CLOCK',clue:'Timepiece'},
{n:7,a:'across',r:5,c:1,ans:'WORD',clue:'One in a sentence'},
{n:8,a:'down',r:5,c:1,ans:'WORLD',clue:'Planet Earth'},
{n:9,a:'across',r:7,c:3,ans:'PUZZLE',clue:'A brain teaser'},
{n:10,a:'down',r:7,c:6,ans:'ZEST',clue:'Citrus peel or enthusiasm'},
{n:11,a:'across',r:9,c:2,ans:'SMART',clue:'Intelligent'},
{n:12,a:'down',r:7,c:9,ans:'ART',clue:'Gallery subject'}];
const solution=Array.from({length:11},()=>Array(11).fill(null));entries.forEach(e=>{for(let i=0;i<e.ans.length;i++){let r=e.r+(e.a==='down'?i:0),c=e.c+(e.a==='across'?i:0);solution[r][c]=e.ans[i]}});
const board=document.getElementById('board'),cluelist=document.getElementById('cluelist');let dir='across',selected=null,paused=false,seconds=0,values=Array.from({length:11},()=>Array(11).fill(''));
document.getElementById('date').textContent=new Intl.DateTimeFormat('en',{weekday:'long',month:'long',day:'numeric'}).format(new Date());
function build(){for(let r=0;r<11;r++)for(let c=0;c<11;c++){const d=document.createElement('div');d.className='cell'+(solution[r][c]==null?' block':'');d.dataset.r=r;d.dataset.c=c;if(solution[r][c]){const ins=document.createElement('input');ins.maxLength=1;ins.value='';ins.addEventListener('focus',()=>select(r,c));ins.addEventListener('input',e=>{e.target.value=e.target.value.replace(/[^a-z]/gi,'').toUpperCase().slice(-1);values[r][c]=e.target.value;updateProgress();if(e.target.value)moveNext(1)});ins.addEventListener('keydown',e=>key(e,r,c));d.appendChild(ins);const nums=entries.filter(x=>x.r===r&&x.c===c);if(nums.length)d.insertAdjacentHTML('afterbegin','<span class="num">'+nums[0].n+'</span>');d.addEventListener('click',()=>{if(selected&&selected.r===r&&selected.c===c)dir=dir==='across'?'down':'across';select(r,c)})}board.appendChild(d)}renderClues()}
function key(e,r,c){if(e.key==='Backspace'){e.prevent();if(values[r][c]){values[r][c]='';board.querySelector('[data-r="'+r+'"][data-c="'+c+'"] input').value='' }else moveNext(-1);updateProgress()}else if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.prevent();moveNext(e.key==='ArrowRight'?1:-1)}else if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.prevent();dir=e.key==='ArrowDown'?'down':'across';focusAt(r+(e.key==='ArrowDown'?1:-1),c)}}
function select(r,c){selected={r,c};if(!entryAt(r,c,dir))dir=dir==='across'?'down':'across';highlight()}
function entryAt(r,c,d){return entries.find(e=>e.a===d&&r>=e.r&&c>=e.c&&(d==='across'?r===e.r&&c<e.c+e.ans.length:c===e.c&&r<e.r+e.ans.length))}
function highlight(){document.querySelectorAll('.cell').forEach(x=>x.classList.remove('activeword','activecell'));if(!selected)return;const e=entryAt(selected.r,selected.c,dir);if(e){for(let i=0;i<e.ans.length;i++){const rr=e.r+(e.a==='down'?i:0),cc=e.c+(e.a==='across'?i:0);board.querySelector('[data-r="'+rr+'"][data-c="'+cc+'"]')?.classList.add('activeword')}}board.querySelector('[data-r="'+selected.r+'"][data-c="'+selected.c+'"]')?.classList.add('activecell')}
function moveNext(step){if(!selected)return;let r=selected.r,c=selected.c;r+=dir==='down'?step:0;c+=dir==='across'?step:0;focusAt(r,c)}
function focusAt(r,c){if(r<0||r>10||c<0||c>10||solution[r][c]==null)return;select(r,c);board.querySelector('[data-r="'+r+'"][data-c="'+c+'"] input')?.focus()}
function renderClues(){cluelist.innerHTML='';entries.filter(e=>e.a===dir).forEach(e=>{const d=document.createElement('div');d.className='clue';d.dataset.n=e.n;d.innerHTML='<span class="n">'+e.n+'</span><span>'+e.clue+'</span>';d.onclick=()=>{selected={r:e.r,c:e.c};dir=e.a;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.dir===dir));highlight();focusAt(e.r,e.c)};cluelist.appendChild(d)})}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{dir=t.dataset.dir;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===t));renderClues();highlight()});
function updateProgress(){let fill=0,total=0;for(let r=0;r<11;r++)for(let c=0;c<11;c++)if(solution[r][c]){total++;if(values[r][c])fill++}document.getElementById('progress').style.width=(fill/total*100)+'%';entries.forEach(e=>{const solved=e.ans.split('').every((x,i)=>values[e.r+(e.a==='down'?i:0)][e.c+(e.a==='across'?i:0)]===x);document.querySelector('.clue[data-n="'+e.n+'"]')?.classList.toggle('solved',solved)})}
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
document.getElementById('hint').onclick=()=>{let e=selected?entryAt(selected.r,selected.c,dir):null;if(!e)e=entries.find(x=>x.a===dir);if(!e)return;for(let i=0;i<e.ans.length;i++){const r=e.r+(e.a==='down'?i:0),c=e.c+(e.a==='across'?i:0);if(!values[r][c]){values[r][c]=e.ans[i];const inp=board.querySelector('[data-r="'+r+'"][data-c="'+c+'"] input');if(inp)inp.value=e.ans[i];select(r,c);break}}updateProgress()};
document.getElementById('check').onclick=()=>{let wrong=0,empty=0;document.querySelectorAll('.cell:not(.block)').forEach(d=>{const r=+d.dataset.r,c=+d.dataset.c;d.classList.remove('wrong','correct');if(!values[r][c])empty++;else if(values[r][c]===solution[r][c])d.classList.add('correct');else{d.classList.add('wrong');wrong++}});if(!empty&&!wrong)toast('Puzzle complete — brilliant!');else if(wrong)toast(wrong+' letter'+(wrong===1?'':'s')+' need attention');else toast(empty+' square'+(empty===1?'':'s')+' left to fill')};
document.getElementById('pause').onclick=()=>{paused=!paused;document.getElementById('pause').textContent=paused?'▶':'Ⅱ';toast(paused?'Puzzle paused':'Back to the puzzle')};
setInterval(()=>{if(!paused){seconds++;document.getElementById('timer').textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')}},1000);build();
</script></body></html>
