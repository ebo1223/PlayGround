<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bingo Blast</title>
<style>
:root{--ink:#251b3d;--cream:#fffaf0;--purple:#7c52c7;--yellow:#ffd74a;--pink:#ff6f91}
*{box-sizing:border-box} body{margin:0;min-height:100vh;font-family:"Trebuchet MS",system-ui,sans-serif;color:var(--ink);background:#fffdf7;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(circle at 12% 18%,#fff0a8 0 4%,transparent 4.2%),radial-gradient(circle at 88% 70%,#ffdbe6 0 5%,transparent 5.2%),linear-gradient(135deg,#fffdf8,#fff8e9)}
body:after{content:"✦  ·  ✦       ·      ✦    ·      ✦";position:fixed;inset:8% 4% auto;color:#efb95a;font-size:22px;letter-spacing:35px;opacity:.35;z-index:-1}
.app{max-width:1180px;margin:auto;padding:18px 28px 26px}.top{height:82px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px}.logo{width:52px;height:52px;border-radius:50%;background:var(--yellow);display:grid;place-items:center;border:4px solid white;box-shadow:0 4px 0 #eabf3a;font-weight:1000;font-size:30px;transform:rotate(-8deg)}
.brand h1{margin:0;font-family:Georgia,serif;font-size:38px;letter-spacing:-2px}.brand h1 span{color:#eb6e8b}
.controls{display:flex;gap:10px}.round,.sound{height:42px;border:2px solid #e9dfcb;border-radius:13px;background:white;display:flex;align-items:center;font-weight:800;padding:0 14px}.sound{width:42px;padding:0;justify-content:center;font-size:18px;cursor:pointer}
main{display:grid;grid-template-columns:1fr 310px;gap:42px}.board-panel{padding:14px 12px}.board-head{text-align:center;margin-bottom:14px}.board-head h2{font-family:Georgia,serif;font-size:27px;margin:0}.board-head p{margin:5px 0 0;color:#887b91;font-size:13px}
.board-wrap{position:relative;width:min(540px,85vw);margin:auto}.letters{display:grid;grid-template-columns:repeat(5,1fr);text-align:center;margin-bottom:7px}.letters b{font-family:Georgia,serif;font-size:32px;color:#7b54b7}
.board{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;background:#eee3ef;border:7px solid #eee3ef;border-radius:22px;box-shadow:0 14px 30px rgba(80,55,92,.12)}
.cell{aspect-ratio:1;border:0;border-radius:12px;background:#fffdf9;font-family:Georgia,serif;font-size:34px;font-weight:800;color:#402f55;cursor:pointer;box-shadow:inset 0 -3px 0 #eee7dc;transition:.18s}.cell:hover{transform:translateY(-2px);background:white}.cell.marked{background:linear-gradient(145deg,#ffda55,#ffc83c);color:#5d3d23;box-shadow:0 4px 10px rgba(220,174,50,.3)}
.cell.free{font-size:24px;background:#f7a9bb;color:white}.cell.free:after{content:"FREE";display:block;font-family:"Trebuchet MS";font-size:9px;letter-spacing:1px;margin-top:2px}.cell.winning{animation:win .55s ease infinite alternate}@keyframes win{to{transform:scale(.91);box-shadow:0 0 18px #ffb42d}}
.side{padding-top:6px}.draw-card{background:#fff;border:2px solid #eee4d5;border-radius:22px;padding:20px;text-align:center;box-shadow:0 12px 28px rgba(70,46,85,.08)}
.label{font-size:12px;text-transform:uppercase;letter-spacing:2px;font-weight:900;color:#9a8da0}.ball-zone{height:120px;display:grid;place-items:center}.ball{width:94px;height:94px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#9169d3,#6745a4);color:white;border:7px solid #fff;box-shadow:0 7px 0 #54368b,0 12px 22px rgba(95,65,145,.25);font-family:Georgia,serif;font-size:51px;font-weight:800;position:relative}.ball:before{content:"";position:absolute;width:48px;height:15px;border-radius:50%;background:rgba(255,255,255,.22);top:11px}.drawn-list{display:flex;gap:6px;justify-content:center;margin:10px 0 16px;height:30px}.chip{width:30px;height:30px;border-radius:50%;background:#f2edf1;display:grid;place-items:center;font-weight:900;font-size:12px}.draw-btn{width:100%;height:52px;border:0;border-radius:14px;background:linear-gradient(135deg,#ff6f91,#ed557a);color:white;font-weight:1000;font-size:16px;box-shadow:0 6px 0 #c83f61;cursor:pointer}.draw-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #c83f61}.draw-btn:disabled{filter:grayscale(.7);opacity:.6}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.stat{background:#fff;border:2px solid #eee4d5;border-radius:15px;padding:12px;text-align:center}.stat b{display:block;font-family:Georgia,serif;font-size:25px}.stat span{font-size:11px;color:#998da0;font-weight:800}
.toast{position:fixed;left:50%;top:20px;transform:translate(-50%,-120px);background:#282038;color:white;border-radius:14px;padding:13px 22px;font-weight:900;z-index:20;transition:.35s}.toast.show{transform:translate(-50%,0)}
.modal{position:fixed;inset:0;background:rgba(42,28,56,.55);display:none;place-items:center;z-index:30}.modal.show{display:grid}.modal-box{width:min(400px,calc(100% - 40px));background:white;border-radius:28px;text-align:center;padding:34px;box-shadow:0 30px 80px rgba(28,16,40,.35)}.modal-box h2{font-family:Georgia,serif;font-size:42px;margin:8px}.modal-box button{border:0;border-radius:13px;background:#7651be;color:white;height:48px;padding:0 28px;font-weight:900;cursor:pointer}
@media(max-width:760px){.app{padding:10px 14px}.top{height:68px}.brand h1{font-size:29px}.round{display:none}main{grid-template-columns:1fr;gap:8px}.board-panel{padding:5px}.board-wrap{width:min(520px,94vw)}.board{gap:5px}.cell{font-size:28px}.side{width:min(520px,94vw);margin:auto}.draw-card{display:grid;grid-template-columns:110px 1fr;align-items:center;text-align:left}.ball-zone{height:110px}.ball{width:82px;height:82px;font-size:44px}.drawn-list{justify-content:flex-start}.label{text-align:left}.draw-btn{height:46px}.stats{margin-top:8px}}
@media(max-width:420px){.letters b{font-size:26px}.cell{font-size:23px;border-radius:9px}.brand h1{font-size:25px}.logo{width:44px;height:44px;font-size:25px}}
</style></head>
<body>
<div class="toast" id="toast">Number matched!</div>
<div class="app"><header class="top"><div class="brand"><div class="logo">B</div><h1>Bingo <span>Blast</span></h1></div><div class="controls"><div class="round">Round <b>&nbsp;#12</b></div><button class="sound" id="sound" aria-label="Sound">♪</button></div></header>
<main><section class="board-panel"><div class="board-head"><h2>Your Card</h2><p>Tap each number when it's called</p></div><div class="board-wrap"><div class="letters"><b>B</b><b>I</b><b>N</b><b>G</b><b>O</b></div><div class="board" id="board"></div></div></section>
<aside class="side"><div class="draw-card"><div><div class="label">Now calling</div><div class="ball-zone"><div class="ball" id="ball">—</div></div></div><div><div class="drawn-list" id="chips"></div><button class="draw-btn" id="draw">Draw Next Number</button></div></div><div class="stats"><div class="stat"><b id="matched">0</b><span>Numbers Matched</span></div><div class="stat"><b id="lines">0</b><span>Winning Lines</span></div></div></aside></main></div>
<div class="modal" id="modal"><div class="modal-box"><div class="label">Amazing!</div><h2 id="winText">Bingo!</h2><p>You found the winning pattern.</p><button id="again">Play Again</button></div></div>
<script>
const boardEl=document.getElementById('board'),ball=document.getElementById('ball'),chips=document.getElementById('chips'),toast=document.getElementById('toast'),modal=document.getElementById('modal');
let card=[],marked=new Set([12]),drawn=[],pool=[],won=false,sound=true;
function rand(a,b){return Math.floor(Math.random*(b-a+1))+a} 
function makeCard(){card=[];marked=new Set([12]);for(let c=0;c<5;c++){let nums=[],lo=c*15+1,hi=lo+14;while(nums.length<5){let n=rand(lo,hi);if(!nums.includes(n))nums.push(n)}for(let r=0;r<5;r++)card.push(nums[r])}drawn=[];pool=[];for(let c=0;c<5;c++)for(let n=c*15+1;n<=c*15+15;n++)pool.push(n);pool.sort(()=>Math.random-.5);render()}
function render(){boardEl.innerHTML='';card.forEach((n,i)=>{let el=document.createElement('button');el.className='cell'+(marked.has(i)?' marked':'')+(i===12?' free':'');el.textContent=i===12?'★':n;el.onclick=()=>{if(i===12)return;if(drawn.includes(n)){marked.add(i);play(.18);toastNow('Nice match!');render()}else toastNow('Not called yet')};boardEl.appendChild(el)});document.getElementById('matched').textContent=marked.size-(marked.has(12)?1:0);chips.innerHTML=drawn.slice(-4).reverse().map(n=>' <div class="chip">'+n+'</div>').join('');check()}
function toastNow(t){toast.textContent=t;toast.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>toast.classList.remove('show'),900)}
function check(){let lines=[];for(let r=0;r<5;r++){let a=[];for(let c=0;c<5;c++)a.push(marked.has(r*5+c));if(a.every(Boolean))lines.push(r)}for(let c=0;c<5;c++){let a=[];for(let r=0;r<5;r++)a.push(marked.has(r*5+c));if(a.every(Boolean))lines.push(10+c)}if([0,6,12,18,24].every(i=>marked.has(i)))lines.push(20);if([4,8,12,16,20].every(i=>marked.has(i)))lines.push(21);document.getElementById('lines').textContent=lines.length;if(lines.length&&marked.size>1&&!won){won=true;document.querySelectorAll('.marked').forEach(e=>e.classList.add('winning'));setTimeout(()=>{document.getElementById('winText').textContent='Bingo!';modal.classList.add('show');play(.1,true)},500)}}
function play(freq=0.2,win=false){if(!sound)return;try{let ac=new(window.AudioContext||window.webkitAudioContext),o=ac.createOscillator(),g=ac.createGain();o.frequency.value=win?520:360;o.type='triangle';g.gain.setValueAtTime(.06,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.18);o.connect(g);g.connect(ac.destination);o.start();o.frequency.exponentialRampToValueAtTime(win?780:480,ac.currentTime+.15);o.stop(ac.currentTime+.18)}catch(e){}}
document.getElementById('draw').onclick=()=>{if(!pool.length||won)return;let n=pool.pop();drawn.push(n);ball.textContent=n;let letter=n<=15?'B':n<=30?'I':n<=45?'N':n<=60?'G':'O';ball.textContent=n;card.forEach((v,i)=>{if(v===n){} });toastNow(letter+' — '+n);play(.08);render();};document.getElementById('sound').onclick=e=>{sound=!sound;e.currentTarget.textContent=sound?'♪':'×'};document.getElementById('again').onclick=()=>{modal.classList.remove('show');won=false;makeCard();ball.textContent='—'};
makeCard();
</script></body></html>
