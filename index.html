<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Northvale City Builder</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700;800&family=Space+Mono:wght@700&display=swap');
:root{--ink:#18314a;--cream:#f7f3e8;--orange:#ef7651;--blue:#9ed2dd;--green:#67a67d}
*{box-sizing:border-box}body{margin:0;font-family:'DM Sans',sans-serif;color:var(--ink);background:#e8eadf;overflow:hidden}.app{height:100vh;display:grid;grid-template-rows:76px 1fr 150px}
.top{display:flex;align-items:center;gap:26px;padding:0 28px;background:#fffdf6;border-bottom:1px solid #d8dacd;z-index:3}.brand{width:205px}.brand h1{font:800 20px/1 'DM Sans';margin:0}.brand small{display:block;margin-top:6px;text-transform:uppercase;letter-spacing:2.2px;font-size:9px;color:#81909a}.resources{display:flex;gap:28px;flex:1}.resource{display:flex;align-items:center;gap:9px}.r-icon{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:18px}.resource:nth-child(1) .r-icon{background:#ffe7b7}.resource:nth-child(2) .r-icon{background:#cfe5ce}.resource:nth-child(3) .r-icon{background:#d7e9ed}.resource b{display:block;font-size:16px}.resource small{display:block;color:#83909a;font-size:10px}.date{padding:12px 16px;border-radius:12px;background:#edf1e8}.date b{display:block}.date small{color:#84908a;font-size:10px}.map{position:relative;overflow:hidden;background:linear-gradient(135deg,#a9cba1 0%,#91b98b 100%)}
.map:before{content:"";position:absolute;inset:-40%;opacity:.12;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:15px 15px}.world{position:absolute;width:760px;height:570px;left:50%;top:50%;transform:translate(-50%-50%) rotateX(55deg) rotateZ(-45deg);transform:translate(-50%,-50%)}.grid{position:absolute;left:50px;top:-15px;width:620px;height:620px;transform-style:preserve-3d;background-color:#94ae83;background-image:linear-gradient(#7e9b70 2px,transparent 2px),linear-gradient(90deg,#7e9b70 2px,transparent 2px);background-size:62px 62px;border:7px solid #d9ce9c;box-shadow:0 20px 30px #57705266}.road{position:absolute;background:#c8bda2;box-shadow:inset 0 0 0 2px #b6ab91}.road.h{height:62px;left:0;right:0;top:279px}.road.v{width:62px;top:0;bottom:0;left:279px}.plot{position:absolute;width:62px;height:62px;cursor:pointer}.plot:hover{background:#ffffff20}.building{position:absolute;left:50%;top:50%;width:46px;height:46px;transform:translate(-50%,-50%) rotateZ(45deg) rotateX(-55deg);transform-origin:center;display:grid;place-items:center}.house{width:48px;height:42px;background:#f1d6a6;border:3px solid #d1ad78;border-radius:3px;box-shadow:inset 0 -8px #c8ab7d}.house:before{content:"";position:absolute;left:-5px;top:-18px;width:52px;height:28px;background:#b85e45;clip-path:polygon(50% 0,100% 70%,92% 100%,8% 100%,0 70%)}.house:after{content:"";position:absolute;width:8px;height:13px;background:#6e7d73;left:17px;bottom:-2px}.shop{width:50px;height:44px;background:#f1a96d;border:3px solid #ca8153}.shop:before{content:"";position:absolute;left:-3px;right:-3px;top:-15px;height:18px;background:repeating-linear-gradient(90deg,#fff 0 8px,#5aa3a0 8px 16px);border-radius:3px}.park{width:48px;height:48px;border-radius:50%;background:#72a85f;box-shadow:inset 0 0 0 8px #91c578}.park:before{content:"🌳";font-size:26px;position:absolute}.factory{width:50px;height:43px;background:#9ba29a;border:3px solid #68736c}.factory:before{content:"";position:absolute;width:13px;height:25px;background:#68736c;right:2px;top:-25px}.factory:after{content:"";position:absolute;width:26px;height:9px;background:#d7d5bd;left:4px;top:-8px}.tree{width:35px;height:35px;border-radius:50%;background:#609552;box-shadow:-20px 18px #87b56a,20px 15px #79aa66}.water{position:absolute;border-radius:50%;background:#76bdc4;box-shadow:inset 0 0 18px #a9dde0}.lake{width:150px;height:100px;left:-68px;top:500px}.lake2{width:100px;height:130px;right:-20px;top:60px}.label{position:absolute;left:26px;bottom:24px;background:#fffdf6;padding:10px 14px;border-radius:8px;font-size:11px;box-shadow:0 5px 16px #55704d33}.bottom{display:grid;grid-template-columns:240px 1fr 210px;background:#fffdf6;border-top:1px solid #d8dacd;z-index:4}.cityinfo{padding:20px 28px;border-right:1px solid #e1e4da}.cityinfo h2{margin:0 0 12px;font-size:18px}.statrow{display:flex;justify-content:space-between;font-size:11px;margin:8px 0}.track{height:5px;border-radius:5px;background:#dde3d7;overflow:hidden}.track i{display:block;height:100%;background:var(--green)}.tools{display:flex;align-items:center;gap:12px;padding:14px 20px}.tool{border:0;background:#f1f1e8;width:78px;height:116px;border-radius:12px;color:var(--ink);cursor:pointer;font-family:inherit;transition:.15s}.tool:hover{transform:translateY(-3px)}.tool.active{background:#18314a;color:white}.tool .emoji{display:block;font-size:28px;margin-bottom:7px}.tool b{display:block;font-size:11px}.tool small{display:block;color:#89958e;margin-top:5px}.tool.active small{color:#bcd0c8}.actions{display:flex;align-items:center;justify-content:center;border-left:1px solid #e1e4da}.pause{border:0;width:54px;height:54px;border-radius:50%;background:var(--orange);color:white;font-size:19px;cursor:pointer}.toast{position:absolute;left:50%;bottom:170px;transform:translateX(-50%) translateY(20px);background:#18314a;color:white;padding:10px 16px;border-radius:8px;font-size:12px;opacity:0;transition:.25s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:760px){.app{grid-template-rows:68px 1fr 126px}.top{padding:0 12px}.brand{width:auto}.brand h1{font-size:15px}.brand small{display:none}.resources{gap:8px}.resource{gap:4px}.r-icon{width:29px;height:29px}.resource small{display:none}.date{display:none}.bottom{grid-template-columns:1fr}.cityinfo{display:none}.tools{padding:8px;justify-content:space-between}.tool{width:19%;height:108px}.actions{position:absolute;right:8px;bottom:132px;border:0}.world{transform:translate(-50%,-50%) scale(.72)}.tool small{display:none}}
</style>
</head>
<body><div class="app"><header class="top"><div class="brand"><h1>NORTHVALE</h1><small>Municipal Planning</small></div><div class="resources"><div class="resource"><div class="r-icon">◉</div><div><b id="coins">12,450</b><small>Budget</small></div></div><div class="resource"><div class="r-icon">♟</div><div><b id="pop">284</b><small>Residents</small></div></div><div class="resource"><div class="r-icon">⚡</div><div><b id="power">82%</b><small>Power</small></div></div></div><div class="date"><b id="month">MAY 2026</b><small>Spring • 18°C</small></div></header>
<main class="map"><div class="world"><div class="grid" id="grid"><div class="road h"></div><div class="road v"></div><div class="water lake"></div><div class="water lake2"></div></div></div><div class="label">DISTRICT 04 · RIVERSIDE</div><div class="toast" id="toast"></div></main>
<footer class="bottom"><section class="cityinfo"><h2>Riverside</h2><div class="statrow"><span>Happiness</span><b>88%</b></div><div class="track"><i style="width:88%"></i></div><div class="statrow"><span>Growth</span><b>+12%</b></div><div class="track"><i style="width:62%;background:#ef7651"></i></div></section><section class="tools"><button class="tool active" data-type="house" data-cost="850"><span class="emoji">⌂</span><b>Homes</b><small>$850</small></button><button class="tool" data-type="shop" data-cost="1200"><span class="emoji">▥</span><b>Commerce</b><small>$1,200</small></button><button class="tool" data-type="park" data-cost="400"><span class="emoji">♣</span><b>Parks</b><small>$400</small></button><button class="tool" data-type="factory" data-cost="1800"><span class="emoji">⌸</span><b>Industry</b><small>$1,800</small></button><button class="tool" data-type="road" data-cost="100"><span class="emoji">═</span><b>Road</b><small>$100</small></button></section><section class="actions"><button class="pause" id="pause">Ⅱ</button></section></footer></div>
<script>
let active='house',budget=12450,pop=284,paused=false,month=4;
const grid=document.getElementById('grid'),toast=document.getElementById('toast');
function notice(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1500)}
document.querySelectorAll('.tool').forEach(b=>b.onclick=()=>{document.querySelector('.tool.active')?.classList.remove('active');b.classList.add('active');active=b.dataset.type});
for(let y=0;y<10;y++)for(let x=0;x<10;x++){if((x===4||x===5)&&y<10)continue;if((y===4||y===5)&&x<10)continue;const p=document.createElement('div');p.className='plot';p.style.left=(x*62)+'px';p.style.top=(y*62)+'px';grid.appendChild(p)}
[[1,1,'house'],[2,2,'house'],[1,3,'house'],[7,1,'shop'],[8,2,'shop'],[7,3,'park'],[2,7,'house'],[1,8,'house'],[7,7,'factory'],[8,8,'house'],[3,7,'park'],[7,8,'park']].forEach(([x,y,t])=>{const p=grid.querySelector(`.plot[style="left: ${x*62}px; top: ${y*62}px;"]`)||grid.querySelectorAll('.plot')[y*10+x];if(p)add(p,t)});
function add(p,t){if(p.querySelector('.building'))return;if(t==='road'){p.style.background='rgba(200,189,162,.8)';p.style.boxShadow='inset 0 0 0 2px #b6ab91';return}const el=document.createElement('div');el.className='building '+t;p.appendChild(el)}
grid.addEventListener('click',e=>{if(paused)return;const p=e.target.closest('.plot');if(!p)return;const b=document.querySelector('.tool.active');const cost=+b.dataset.cost;if(p.querySelector('.building')||p.style.background)return notice('This lot is already occupied');if(budget<cost)return notice('Not enough budget');budget-=cost;if(active==='house')pop+=18;if(active==='factory')pop-=3;if(active==='park')pop+=2;add(p,active);update()});
function update(){document.getElementById('coins').textContent=budget.toLocaleString();document.getElementById('pop').textContent=pop}document.getElementById('pause').onclick=e=>{paused=!paused;e.currentTarget.textContent=paused?'▶':'Ⅱ';notice(paused?'Planning paused':'Planning resumed')};
setInterval(()=>{if(!paused){budget+=120;const names=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];month=(month+1)%12;document.getElementById('month').textContent=names[month]+' 2026';update()}},5000);
</script></body></html>
