<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Family Trivia</title>
  <style>
    :root { --cream:#f7f1df; --ink:#243b32; --orange:#ef8354; --yellow:#f6c453; --mint:#cfe0b7; --green:#5d805f; --white:#fffdf6; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--ink); background:var(--cream); overflow-x:hidden; }
    body:before { content:""; position:fixed; inset:0; pointer-events:none; opacity:.28; background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.13'/%3E%3C/svg%3E"); }
    button,input { font:inherit; }
    .app { min-height:100vh; position:relative; }
    .topbar { height:86px; display:flex; align-items:center; justify-content:space-between; padding:0 42px; border-bottom:1px solid rgba(36,59,50,.12); }
    .brand { display:flex; align-items:center; gap:12px; font-family:Georgia,serif; font-weight:800; font-size:26px; }
    .brand-mark { width:43px; height:43px; border-radius:50%; background:var(--orange); display:grid; place-items:center; color:white; font-family:Georgia,serif; box-shadow:0 4px 0 #cc6844; }
    .top-actions { display:flex; gap:10px; }
    .icon-btn { width:44px; height:44px; border:1px solid rgba(36,59,50,.16); border-radius:50%; background:rgba(255,255,255,.45); color:var(--ink); cursor:pointer; display:grid; place-items:center; }
    .icon-btn:hover { background:white; transform:translateY(-1px); }
    .screen { min-height:calc(100vh - 86px); }
    .hidden { display:none !important; }

    /* Setup */
    #setup { display:grid; grid-template-columns:minmax(360px,1fr) 520px; align-items:center; max-width:1180px; margin:auto; padding:52px 40px 42px; gap:70px; }
    .eyebrow { text-transform:uppercase; letter-spacing:.18em; font-size:12px; font-weight:900; color:var(--orange); margin-bottom:12px; }
    h1 { font-family:Georgia,"Times New Roman",serif; font-size:clamp(52px,7vw,82px); line-height:.92; letter-spacing:-.045em; margin:0 0 20px; }
    h1 em { color:var(--orange); font-style:italic; }
    .subtitle { max-width:480px; font-size:18px; line-height:1.55; color:#647268; }
    .panel { background:rgba(255,253,246,.72); border:1px solid rgba(36,59,50,.12); border-radius:28px; padding:30px; box-shadow:0 18px 50px rgba(67,74,54,.08); }
    .panel-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
    .panel h2 { margin:0; font-family:Georgia,serif; font-size:25px; }
    .count { font-size:12px; font-weight:900; background:var(--mint); border-radius:20px; padding:7px 10px; }
    .player-list { display:grid; gap:10px; margin-bottom:16px; }
    .player-row { display:flex; align-items:center; gap:12px; }
    .avatar { width:42px; height:42px; flex:none; border-radius:50%; display:grid; place-items:center; color:white; font-weight:900; }
    .player-row input { height:48px; flex:1; border:1px solid rgba(36,59,50,.13); border-radius:14px; background:white; padding:0 14px; color:var(--ink); outline:none; }
    .player-row input:focus { border-color:var(--orange); box-shadow:0 0 0 3px rgba(239,131,84,.12); }
    .remove { border:0; background:transparent; color:#9a9f96; cursor:pointer; font-size:20px; }
    .remove:hover { color:#b54d38; }
    .add-player { width:100%; height:48px; border:1.5px dashed rgba(36,59,50,.25); border-radius:14px; background:transparent; color:var(--green); font-weight:800; cursor:pointer; }
    .primary { border:0; height:56px; border-radius:16px; background:var(--orange); color:white; font-weight:900; letter-spacing:.01em; cursor:pointer; box-shadow:0 6px 0 #cb6945; transition:.12s; }
    .primary:hover { filter:saturate(1.05); transform:translateY(-1px); }
    .primary:active { transform:translateY(4px); box-shadow:0 2px 0 #cb6945; }
    .start { width:100%; margin-top:18px; }

    /* Game */
    #game { max-width:1060px; margin:auto; padding:38px 40px 30px; }
    .game-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:24px; }
    .round-label { font-size:12px; letter-spacing:.16em; font-weight:900; text-transform:uppercase; color:#7b877f; }
    .progress { width:260px; height:8px; border-radius:10px; background:#dedecf; overflow:hidden; }
    .progress div { height:100%; border-radius:10px; background:var(--orange); transition:width .35s ease; }
    .score-strip { display:flex; gap:8px; justify-content:center; margin-bottom:20px; }
    .score-chip { min-width:100px; height:44px; border-radius:22px; background:rgba(255,255,255,.62); border:1px solid rgba(36,59,50,.11); display:flex; align-items:center; gap:8px; padding:5px 12px 5px 5px; font-size:13px; font-weight:800; }
    .score-chip.active { background:white; border-color:var(--orange); box-shadow:0 5px 18px rgba(82,92,65,.09); }
    .score-chip .mini { width:34px; height:34px; border-radius:50%; display:grid; place-items:center; color:white; }
    .score-chip b { margin-left:auto; }
    .question-card { max-width:820px; margin:auto; background:var(--white); border:1px solid rgba(36,59,50,.1); border-radius:30px; padding:34px 44px 38px; box-shadow:0 20px 60px rgba(79,83,62,.1); text-align:center; }
    .category { display:inline-flex; align-items:center; gap:8px; border-radius:20px; background:var(--yellow); padding:8px 13px; font-size:11px; font-weight:900; letter-spacing:.12em; text-transform:uppercase; }
    .question-card h2 { min-height:92px; display:flex; align-items:center; justify-content:center; font-family:Georgia,serif; font-size:clamp(26px,3.4vw,42px); line-height:1.12; margin:18px 0 24px; }
    .answers { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .answer { min-height:64px; border:1.5px solid rgba(36,59,50,.13); border-radius:16px; background:#faf8ef; color:var(--ink); font-weight:800; cursor:pointer; padding:12px 18px; transition:.16s; }
    .answer:hover { border-color:var(--orange); background:white; transform:translateY(-2px); }
    .answer.correct { background:#bcd69e; border-color:#78995d; }
    .answer.wrong { background:#f0b0a0; border-color:#c66f5a; }
    .answer.dim { opacity:.48; }
    .turn-name { height:54px; display:flex; align-items:center; justify-content:center; font-weight:900; }
    .next-row { height:58px; display:flex; justify-content:flex-end; align-items:center; }
    .next { min-width:150px; }

    /* Results */
    #results { align-content:start; padding-top:58px; }
    .results-inner { max-width:760px; margin:auto; text-align:center; }
    .results-inner h1 { font-size:64px; }
    .podium { display:flex; justify-content:center; align-items:flex-end; gap:14px; height:260px; margin:25px 0 24px; }
    .podium-card { width:210px; background:white; border:1px solid rgba(36,59,50,.1); border-radius:24px 24px 12px 12px; box-shadow:0 12px 30px rgba(69,77,58,.08); display:flex; flex-direction:column; justify-content:flex-end; align-items:center; padding:18px; }
    .podium-card.first { height:230px; background:#fff4c9; }
    .podium-card.second { height:190px; }
    .podium-card.third { height:160px; }
    .trophy { font-size:32px; margin-bottom:8px; }
    .podium-avatar { width:58px; height:58px; border-radius:50%; display:grid; place-items:center; color:white; font-size:22px; font-weight:900; margin-bottom:8px; }
    .podium-card strong { font-family:Georgia,serif; font-size:19px; }
    .podium-card span { font-size:13px; color:#738078; }
    .play-again { width:220px; }

    @media (max-width:800px) {
      .topbar { height:72px; padding:0 18px; } .brand { font-size:21px; } .brand-mark { width:38px; height:38px; }
      #setup { grid-template-columns:1fr; gap:28px; padding:34px 18px; } h1 { font-size:56px; } .subtitle { font-size:16px; }
      #game { padding:24px 14px; } .game-top { margin-bottom:14px; } .progress { width:140px; }
      .score-strip { overflow-x:auto; justify-content:flex-start; padding-bottom:4px; } .score-chip { min-width:92px; }
      .question-card { padding:26px 16px 22px; border-radius:22px; } .question-card h2 { min-height:84px; font-size:27px; }
      .answers { grid-template-columns:1fr; } .answer { min-height:54px; }
      .podium { height:220px; gap:5px; } .podium-card { width:31%; } .podium-card.first { height:210px; } .podium-card.second { height:170px; } .podium-card.third { height:145px; }
      .results-inner h1 { font-size:48px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><div class="brand-mark">F</div> Family Trivia</div>
      <div class="top-actions">
        <button class="icon-btn" id="soundBtn" title="Toggle sound" aria-label="Toggle sound">♪</button>
        <button class="icon-btn" id="homeBtn" title="New game" aria-label="New game">⌂</button>
      </div>
    </header>

    <main id="setup" class="screen">
      <section>
        <div class="eyebrow">Family game night</div>
        <h1>Good times.<br><em>Great answers.</em></h1>
        <p class="subtitle">Gather around! Add your players, choose the family trivia challenge, and see who knows everyone best.</p>
      </section>
      <section class="panel">
        <div class="panel-head"><h2>Who's playing?</h2><span class="count" id="playerCount">3 players</span></div>
        <div class="player-list" id="playerList"></div>
        <button class="add-player" id="addPlayer">＋ Add another player</button>
        <button class="primary start" id="startBtn">Start the game →</button>
      </section>
    </main>

    <main id="game" class="screen hidden">
      <div class="game-top"><div><div class="round-label">Family trivia</div><div id="roundText" style="font-family:Georgia,serif;font-size:18px;font-weight:bold">Round 1 of 10</div></div><div class="progress"><div id="progressBar"></div></div></div>
      <div class="score-strip" id="scoreStrip"></div>
      <section class="question-card">
        <span class="category" id="category">✦ Memories</span>
        <h2 id="question">Question</h2>
        <div class="answers" id="answers"></div>
      </section>
      <div class="turn-name" id="turnName"></div>
      <div class="next-row"><button class="primary next hidden" id="nextBtn">Next question →</button></div>
    </main>

    <main id="results" class="screen hidden">
      <div class="results-inner">
        <div class="eyebrow">That's a wrap</div>
        <h1>Family, you did great!</h1>
        <div class="podium" id="podium"></div>
        <button class="primary play-again" id="playAgain">Play again</button>
      </div>
    </main>
  </div>

  <script>
    const palette=['#ef8354','#6e9bb8','#d6a84b','#7da47b','#a77da6','#6e8b78'];
    let players=[{name:'Mom',score:0},{name:'Dad',score:0},{name:'The Kids',score:0}];
    let current=0, round=0, answered=false, sound=true;

    const questions=[
      {cat:'Memories',q:'Which month is traditionally called the start of summer in the Northern Hemisphere?',a:['June','April','August','September'],c:0},
      {cat:'Food',q:'What is the main ingredient in traditional guacamole?',a:['Avocado','Cucumber','Peas','Broccoli'],c:0},
      {cat:'Around the house',q:'Which room is traditionally used for preparing and cooking meals?',a:['Kitchen','Garage','Attic','Dining room'],c:0},
      {cat:'Nature',q:'How many legs does a spider have?',a:['6','8','10','12'],c:1},
      {cat:'Family fun',q:'How many dots are on a standard pair of dice?',a:['21','36','42','48'],c:2},
      {cat:'Animals',q:'Which animal is known as the largest on Earth?',a:['African elephant','Blue whale','Giraffe','Great white shark'],c:1},
      {cat:'Home sweet home',q:'What do you normally use to open a locked door?',a:['A key','A spoon','A pillow','A coin'],c:0},
      {cat:'Around the world',q:'Which country is famous for the pyramids of Giza?',a:['Greece','Mexico','Egypt','India'],c:2},
      {cat:'Brain power',q:'What has hands but cannot clap?',a:['A clock','A statue','A glove','A shadow'],c:0},
      {cat:'Family fun',q:'Which of these is used in a board game to move around a track?',a:['A map pin','A game piece','A bookmark','A paintbrush'],c:1}
    ];

    function renderPlayers(){
      const list=document.getElementById('playerList'); list.innerHTML='';
      players.forEach((p,i)=>{ const row=document.createElement('div'); row.className='player-row'; row.innerHTML=`<div class="avatar" style="background:${palette[i%palette.length]}">${escapeHtml(p.name.trim().charAt(0)||'?')}</div><input aria-label="Player ${i+1} name" value="${escapeAttr(p.name)}" maxlength="18"><button class="remove" title="Remove player" ${players.length<=2?'disabled style="opacity:.25"':''}>×</button>`;
        const input=row.querySelector('input'); input.oninput=()=>{p.name=input.value||'Player '+(i+1);row.querySelector('.avatar').textContent=(input.value.trim().charAt(0)||'?').toUpperCase()};
        row.querySelector('.remove').onclick=()=>{if(players.length>2){players.splice(i,1);renderPlayers()}};
        list.appendChild(row);
      });
      document.getElementById('playerCount').textContent=`${players.length} players`;
    }
    function escapeHtml(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
    function escapeAttr(s){return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}

    document.getElementById('addPlayer').onclick=()=>{if(players.length<6){players.push({name:'Player '+(players.length+1),score:0});renderPlayers()} else document.getElementById('addPlayer').textContent='Maximum 6 players'};

    function beep(ok=true){ if(!sound)return; try{const ctx=new(window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator();const g=ctx.createGain();o.type='sine';o.frequency.value=ok?620:220;g.gain.setValueAtTime(.05,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.18);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.18)}catch(e){}}

    function startGame(){ players.forEach(p=>p.score=0); current=0;round=0;document.getElementById('setup').classList.add('hidden');document.getElementById('results').classList.add('hidden');document.getElementById('game').classList.remove('hidden');showQuestion(); }
    function showQuestion(){ answered=false;document.getElementById('nextBtn').classList.add('hidden');const q=questions[round];document.getElementById('roundText').textContent=`Round ${round+1} of ${questions.length}`;document.getElementById('progressBar').style.width=((round/questions.length)*100)+'%';document.getElementById('category').textContent='✦ '+q.cat;document.getElementById('question').textContent=q.q;document.getElementById('turnName').textContent=`${players[current].name}'s turn`;
      const answers=document.getElementById('answers');answers.innerHTML='';q.a.forEach((text,i)=>{const b=document.createElement('button');b.className='answer';b.textContent=text;b.onclick=()=>answer(i,b);answers.appendChild(b)});renderScores(); }
    function answer(i,b){ if(answered)return;answered=true;const q=questions[round];document.querySelectorAll('.answer').forEach((x,j)=>{x.disabled=true;if(j===q.c)x.classList.add('correct');else if(j===i)x.classList.add('wrong');else x.classList.add('dim')});if(i===q.c){players[current].score++;beep(true)}else beep(false);renderScores();document.getElementById('nextBtn').classList.remove('hidden'); }
    function renderScores(){const strip=document.getElementById('scoreStrip');strip.innerHTML='';players.forEach((p,i)=>{const chip=document.createElement('div');chip.className='score-chip'+(i===current?' active':'');chip.innerHTML=`<span class="mini" style="background:${palette[i%palette.length]}">${escapeHtml(p.name.charAt(0)||'?')}</span><span>${escapeHtml(p.name)}</span><b>${p.score}</b>`;strip.appendChild(chip)}); }
    document.getElementById('nextBtn').onclick=()=>{round++;current=(current+1)%players.length;if(round>=questions.length)showResults();else showQuestion()};
    function showResults(){document.getElementById('game').classList.add('hidden');document.getElementById('results').classList.remove('hidden');const ranking=[...players].sort((a,b)=>b.score-a.score);const slots=['first','second','third'];const pod=document.getElementById('podium');pod.innerHTML='';const order=[ranking[1],ranking[0],ranking[2]];order.forEach((p,idx)=>{if(!p)return;const original=players.indexOf(p);const place=idx===1?0:(idx===0?1:2);const card=document.createElement('div');card.className='podium-card '+slots[place];card.innerHTML=`<div class="trophy">${place===0?'★':''}</div><div class="podium-avatar" style="background:${palette[original%palette.length]}">${escapeHtml(p.name.charAt(0)||'?')}</div><strong>${escapeHtml(p.name)}</strong><span>${p.score} ${p.score===1?'point':'points'}</span>`;pod.appendChild(card)}); }

    document.getElementById('startBtn').onclick=startGame;
    document.getElementById('playAgain').onclick=()=>{document.getElementById('results').classList.add('hidden');document.getElementById('setup').classList.remove('hidden')};
    document.getElementById('homeBtn').onclick=()=>{document.getElementById('game').classList.add('hidden');document.getElementById('results').classList.add('hidden');document.getElementById('setup').classList.remove('hidden')};
    document.getElementById('soundBtn').onclick=()=>{sound=!sound;document.getElementById('soundBtn').textContent=sound?'♪':'♬';document.getElementById('soundBtn').style.opacity=sound?'1':'.45'};
    renderPlayers();
  </script>
</body>
</html>
