<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Ironvale — Tower Defense</title>
<style>
:root{--ink:#ecf1e9;--muted:#91a09a;--gold:#e8b84a;--panel:#18231f;--green:#66aa79}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111a17;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,sans-serif}button{font:inherit;color:inherit}
#app{display:grid;grid-template-columns:minmax(520px,1fr) 292px;height:100%;min-height:640px}.game{position:relative;min-width:0;background:#1a2a25}canvas{display:block;width:100%;height:100%}
.topbar{position:absolute;z:4;left:24px;right:24px;top:18px;height:68px;display:flex;align-items:center;justify-content:space-between;pointer-events:none}.brand{display:flex;align-items:center;gap:12px;text-shadow:0 2px 12px #000}.crest{width:42px;height:42px;display:grid;place-items:center;border:1px solid #d5b45f;border-radius:50%;background:linear-gradient(135deg,#31483f,#17251f);font-size:22px}.brand b{display:block;font-family:Georgia,serif;font-size:20px;letter-spacing:.8px}.brand small{color:#9eaaa4;text-transform:uppercase;letter-spacing:2.3px;font-size:8px}.stats{display:flex;gap:8px}.pill{height:44px;min-width:94px;display:flex;align-items:center;gap:9px;border:1px solid rgba(232,237,224,.12);border-radius:7px;background:rgba(18,29,25,.88);padding:0 12px;box-shadow:0 8px 22px rgba(0,0,0,.16);font-weight:800}.pill .ico{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#263a32;color:var(--gold);font-size:13px}.pill small{display:block;color:#87978f;font-size:8px;text-transform:uppercase;letter-spacing:1.2px}.pill b{font-size:15px}
.sidebar{position:relative;z:5;background:linear-gradient(145deg,#1c2924,#111916);border-left:1px solid rgba(255,255,255,.07);padding:18px 16px;display:flex;flex-direction:column;box-shadow:-12px 0 30px rgba(0,0,0,.12)}.paneltitle{display:flex;align-items:center;justify-content:space-between;height:42px;border-bottom:1px solid rgba(255,255,255,.07)}.paneltitle h2{font-family:Georgia,serif;font-size:16px;margin:0}.paneltitle span{font-size:9px;color:#8a9a92;text-transform:uppercase;letter-spacing:1.5px}.section{margin-top:13px}.section-label{display:flex;justify-content:space-between;color:#91a097;text-transform:uppercase;font-size:8px;font-weight:800;letter-spacing:1.7px;margin:0 2px 8px}.tower-list{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tower-card{height:92px;border:1px solid rgba(255,255,255,.09);border-radius:8px;background:#202e29;padding:9px;cursor:pointer;text-align:left;position:relative;transition:.15s}.tower-card:hover,.tower-card.active{border-color:#d1ad55;background:#293830;transform:translateY(-1px)}.tower-card .cost{position:absolute;right:7px;top:7px;color:var(--gold);font-size:10px;font-weight:800}.tower-icon{width:43px;height:43px;border-radius:50%;background:#131d19;display:grid;place-items:center;margin-bottom:7px;border:1px solid rgba(255,255,255,.08)}.tower-icon i{display:block;width:20px;height:20px;border:4px solid #d8bd70;transform:rotate(45deg);border-radius:3px}.tower-card[data-type="rapid"] .tower-icon i{border-radius:50%;border-width:5px;border-color:#76b6a1}.tower-card[data-type="cannon"] .tower-icon i{border-radius:2px;border-width:7px;border-color:#bf8c5a}.tower-card strong{display:block;font-size:11px}.tower-card small{color:#8c9b94;font-size:8px}.selection{margin-top:10px;border:1px solid rgba(255,255,255,.08);border-radius:8px;background:rgba(10,18,15,.28);min-height:130px;padding:11px}.selection h3{margin:0 0 8px;font-family:Georgia,serif;font-size:14px}.empty{color:#718078;font-size:10px;line-height:1.6;text-align:center;padding-top:28px}.upgrade-row{display:flex;align-items:center;justify-content:space-between;margin:7px 0;font-size:9px;color:#98a69f}.bar{height:4px;width:82px;background:#39463f;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:#d0a64c}.action{width:100%;height:38px;border:1px solid rgba(232,196,104,.35);border-radius:6px;background:#a88a43;color:#fff;font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.8px;margin-top:8px;cursor:pointer}.action:disabled{opacity:.38;cursor:not-allowed}.wavebox{margin-top:auto;border-top:1px solid rgba(255,255,255,.07);padding-top:12px}.waveinfo{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:9px}.waveinfo small{display:block;color:#83928b;font-size:8px;text-transform:uppercase;letter-spacing:1.4px}.waveinfo b{font-family:Georgia,serif;font-size:20px}.waveinfo em{font-size:9px;color:#e2b957;font-style:normal}.start{height:48px;width:100%;border:0;border-radius:7px;background:linear-gradient(135deg,#d7b85d,#a9863a);box-shadow:0 8px 20px rgba(196,158,62,.16);font-weight:900;text-transform:uppercase;letter-spacing:1px;font-size:11px;cursor:pointer}.start:disabled{filter:saturate(.35);opacity:.6}.speed{display:flex;gap:6px;margin-top:8px}.speed button{flex:1;height:30px;border:1px solid rgba(255,255,255,.08);border-radius:5px;background:#202c27;font-size:9px;color:#91a098;cursor:pointer}.speed button.active{color:#edc963;border-color:#77683d;background:#29342f}
.toast{position:absolute;z:8;left:50%;bottom:25px;transform:translate(-50%,20px);background:#18241f;border:1px solid rgba(255,255,255,.12);border-radius:7px;padding:10px 16px;font-size:11px;opacity:0;transition:.25s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
#overlay{position:absolute;z:20;inset:0;background:rgba(12,18,16,.7);display:none;place-items:center;backdrop-filter:blur(5px)}#overlay.show{display:grid}.modal{width:330px;text-align:center;border:1px solid rgba(220,193,117,.25);border-radius:12px;background:#19251f;padding:34px 28px;box-shadow:0 24px 70px #0008}.modal h1{font-family:Georgia,serif;margin:8px 0}.modal p{color:#98a69f;font-size:11px}.modal button{width:180px}
@media(max-width:850px){#app{grid-template-columns:minmax(420px,1fr) 250px}.sidebar{padding:12px}.topbar{left:12px}.pill{min-width:78px;padding:0 8px}}
</style></head>
<body><div id="app"><main class="game"><canvas id="game"></canvas><header class="topbar"><div class="brand"><div class="crest">♜</div><div><b>IRONVALE</b><small>Border Keep</small></div></div><div class="stats"><div class="pill"><div class="ico">♥</div><div><small>Integrity</small><b id="lives">20</b></div></div><div class="pill"><div class="ico">◆</div><div><small>Gold</small><b id="gold">350</b></div></div></div></header><div class="toast" id="toast"></div><div id="overlay"><div class="modal"><div style="color:#dfb854;font-size:28px">♜</div><h1 id="endtitle">Victory</h1><p id="endtext">The border holds.</p><button class="start" id="restart">Play Again</button></div></div></main><aside class="sidebar"><div class="paneltitle"><h2>War Table</h2><span>Outpost 7</span></div><section class="section"><div class="section-label"><span>Build towers</span><span id="buildmode">Select</span></div><div class="tower-list"><button class="tower-card active" data-type="arrow"><span class="cost">80 ◆</span><div class="tower-icon"><i></i></div><strong>Arbalest</strong><small>Balanced</small></button><button class="tower-card" data-type="rapid"><span class="cost">110 ◆</span><div class="tower-icon"><i></i></div><strong>Gatling</strong><small>Fast fire</small></button><button class="tower-card" data-type="cannon"><span class="cost">160 ◆</span><div class="tower-icon"><i></i></div><strong>Mortar</strong><small>Area damage</small></button><button class="tower-card" data-type="frost"><span class="cost">130 ◆</span><div class="tower-icon"><i></i></div><strong>Frostwell</strong><small>Slows foes</small></button></div></section><section class="section"><div class="section-label"><span>Tower details</span><span id="selltext"></span></div><div class="selection" id="selection"><div class="empty">Select a tower or a build site<br>to manage defenses</div></div></section><div class="wavebox"><div class="waveinfo"><div><small>Next assault</small><b id="wavenum">WAVE 1</b></div><em id="remaining">0 enemies</em></div><button class="start" id="startwave">Start Wave</button><div class="speed"><button data-speed="1" class="active">1×</button><button data-speed="2">2×</button><button data-speed="3">3×</button></div></div></aside></div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),app=document.getElementById('app');
let W,H,DPR;const path=[[[-.12,.76],[.12,.76],[.27,.76],[.27,.52],[.48,.52],[.48,.76],[.67,.76],[.67,.34],[.82,.34],[1.12,.34]]];
const defs={arrow:{cost:80,range:118,damage:16,rate:.72,color:'#e4c16a'},rapid:{cost:110,range:92,damage:7,rate:.25,color:'#78bdab'},cannon:{cost:160,range:130,damage:38,rate:1.45,color:'#ba8b61',splash:48},frost:{cost:130,range:105,damage:8,rate:1.05,color:'#78a8c1',slow:.55}};
let gold=350,lives=20,wave=1,selected=null,buildType='arrow',speed=1,active=false,enemies=[],towers=[],bullets=[],particles=[],spawnQueue=[],spawnTimer=0,last=0,gameOver=false;
function resize(){DPR=Math.min(devicePixelRatio||1,2);const r=canvas.getBoundingClientRect();W=r.width;H=r.height;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
function pts(){return path[0].map(p=>[p[0]*W,p[1]*H])}function segLen(a,b){return Math.hypot(b[0]-a[0],b[1]-a[1])}
function progressPoint(progress){const p=pts(),lens=p.slice(1).map((b,i)=>segLen(p[i],b)),total=lens.reduce((a,b)=>a+b,0);let d=progress*total;for(let i=0;i<lens.length;i++){if(d<=lens[i]){let t=d/lens[i];return [p[i][0]+(p[i+1][0]-p[i][0])*t,p[i][1]+(p[i+1][1]-p[i][1])*t]}d-=lens[i]}return p[p.length-1]}
function updateHUD(){document.getElementById('gold').textContent=gold;document.getElementById('lives').textContent=lives;document.getElementById('wavenum').textContent='WAVE '+wave;document.getElementById('remaining').textContent=(spawnQueue.length+enemies.length)+' enemies';document.getElementById('startwave').disabled=active||gameOver}
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('show');clearTimeout(toast.x);toast.x=setTimeout(()=>t.classList.remove('show'),1400)}
function openSelection(){const box=document.getElementById('selection');if(!selected){box.innerHTML='<div class="empty">Select a tower or a build site<br>to manage defenses</div>';return}const d=defs[selected.type],level=selected.level||1;box.innerHTML=`<h3>${{arrow:'Arbalest',rapid:'Gatling',cannon:'Mortar',frost:'Frostwell'}[selected.type]} <span style="color:#cba94e;font-size9px">LV ${level}</span></h3><div class="upgrade-row"><span>Damage</span><div class="bar"><i style="width:${Math.min(90,30+level*18)}%"></i></div></div><div class="upgrade-row"><span>Range</span><div class="bar"><i style="width:${Math.min(90,35+d.range/2)}%"></i></div></div><div class="upgrade-row"><span>Fire rate</span><div class="bar"><i style="width:${Math.min(90,70-level*4)}%"></i></div></div><button class="action" id="upgrade">Upgrade · ${50+level*35} ◆</button><button class="action" id="sell" style="background:#26352f;border-color:#48584f">Sell · ${Math.floor(d.cost*.6)} ◆</button>`;
 document.getElementById('upgrade').onclick=()=>{let c=50+(selected.level||1)*35;if(gold>=c){gold-=c;selected.level=(selected.level||1)+1;selected.damage=(selected.damage||d.damage)*1.25;toast('Tower upgraded')}else toast('Not enough gold');updateHUD();openSelection()};document.getElementById('sell').onclick=()=>{gold+=Math.floor(d.cost*.6);towers=towers.filter(t=>t!==selected);selected=null;updateHUD();openSelection()}}
function validSpot(x,y){if(x<45||x>W-45||y<100||y>H-35)return false;const p=pts();for(let i=0;i<p.length-1;i++){const ax=p[i][0],ay=p[i][1],bx=p[i+1][0],by=p[i+1][1],vx=bx-ax,vy=by-ay,wx=x-ax,wy=y-ay,tt=Math.max(0,Math.min(1,(wx*vx+wy*vy)/(vx*vx+vy*vy))),dx=ax+tt*vx-x,dy=ay+tt*vy-y;if(Math.hypot(dx,dy)<48)return false}for(const t of towers)if(Math.hypot(t.x-x,t.y-y)<58)return false;return true}
canvas.addEventListener('mousemove',e=>{canvas._mx=e.offsetX;canvas._my=e.offsetY});canvas.addEventListener('click',e=>{const x=e.offsetX,y=e.offsetY;let hit=towers.find(t=>Math.hypot(t.x-x,t.y-y)<27);if(hit){selected=hit;openSelection();return}selected=null;openSelection();if(y<100)return;const d=defs[buildType];if(!validSpot(x,y)){toast('Cannot build here');return}if(gold<d.cost){toast('Not enough gold');return}gold-=d.cost;towers.push({x,y,type:buildType,level:1,damage:d.damage,cool:0,angle:-Math.PI/2});updateHUD();selected=towers[towers.length-1];openSelection()});
document.querySelectorAll('.tower-card').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tower-card').forEach(v=>v.classList.remove('active'));b.classList.add('active');buildType=b.dataset.type;document.getElementById('buildmode').textContent=b.querySelector('strong').textContent});
document.querySelectorAll('.speed button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.speed button').forEach(v=>v.classList.remove('active'));b.classList.add('active');speed=+b.dataset.speed});
function startWave(){if(active||gameOver)return;active=true;spawnQueue=[];const count=7+wave*2;for(let i=0;i<count;i++)spawnQueue.push({hp:38+wave*16*(i%5===4?1.35:1),maxhp:38+wave*16*(i%5===4?1.35:1),armor:i%5===4,progress:-i*.09,speed:34+wave*2*(i%4===0?1.2:1)});spawnTimer=.2;document.getElementById('startwave').disabled=true}
document.getElementById('startwave').onclick=startWave;document.getElementById('restart').onclick=()=>location.reload();
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#23352e';ctx.fillRect(0,0,W,H);ctx.fillStyle='#1d2d27';for(let x=0;x<W;x+=70)for(let y=0;y<H;y+=70){if((x/70+y/70)%2===0)ctx.fillRect(x+1,y+1,68,68)}
 // map border/path
 const p=pts();ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#3b4840';ctx.lineWidth=58;ctx.beginPath();ctx.moveTo(p[0][0],p[0][1]);p.slice(1).forEach(q=>ctx.lineTo(q[0],q[1]));ctx.stroke();ctx.strokeStyle='#596057';ctx.lineWidth=48;ctx.stroke();ctx.strokeStyle='rgba(210,196,151,.12)';ctx.lineWidth=2;ctx.setLineDash([7,12]);ctx.stroke();ctx.setLineDash([]);
 // decorative rocks
 ctx.fillStyle='#4b584f';for(let i=0;i<15;i++){let x=(i*137+31)%W,y=(i*83+173)%H;if(Math.abs(y-H*.5)>40){ctx.beginPath();ctx.arc(x,y,2+(i%3),0,7);ctx.fill()}}
 for(const t of towers)drawTower(t);for(const b of bullets)drawBullet(b);for(const e of enemies)drawEnemy(e);for(const p of particles){ctx.globalAlpha=p.life/p.max;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,7);ctx.fill();ctx.globalAlpha=1}
 if(canvas._mx!=null&&buildType){const d=defs[buildType];ctx.beginPath();ctx.arc(canvas._mx,canvas._my,d.range,0,7);ctx.fillStyle='rgba(231,203,113,.07)';ctx.fill();ctx.strokeStyle=validSpot(canvas._mx,canvas._my)?'rgba(231,203,113,.5)':'rgba(220,90,70,.5)';ctx.lineWidth=1;ctx.stroke();drawGhost(canvas._mx,canvas._my)}
 if(selected){ctx.beginPath();ctx.arc(selected.x,selected.y,defs[selected.type].range,0,7);ctx.strokeStyle='rgba(233,201,111,.28)';ctx.setLineDash([5,5]);ctx.stroke();ctx.setLineDash([])}
}
function drawTower(t){const d=defs[t.type];ctx.save();ctx.translate(t.x,t.y);ctx.fillStyle='#121a16';ctx.beginPath();ctx.arc(0,0,24,0,7);ctx.fill();ctx.fillStyle='#728076';ctx.beginPath();ctx.arc(0,0,19,0,7);ctx.fill();ctx.fillStyle='#26352e';ctx.beginPath();ctx.arc(0,0,14,0,7);ctx.fill();ctx.rotate(t.angle||-Math.PI/2);ctx.fillStyle=d.color;ctx.fillRect(-4,-17,8,20);ctx.beginPath();ctx.arc(0,-10,7,0,7);ctx.fill();ctx.restore();ctx.fillStyle='#d0b65f';ctx.fillRect(t.x-13,t.y+13,26,4)}
function drawGhost(x,y){ctx.save();ctx.translate(x,y);ctx.globalAlpha=.55;ctx.fillStyle='#59665f';ctx.beginPath();ctx.arc(0,0,20,0,7);ctx.fill();ctx.fillStyle=defs[buildType].color;ctx.fillRect(-4,-16,8,19);ctx.restore()}
function drawEnemy(e){const pos=progressPoint(e.progress);e.x=pos[0];e.y=pos[1];ctx.save();ctx.translate(e.x,e.y);ctx.rotate(Math.PI/2);ctx.fillStyle=e.armor?'#6d7971':'#8b5b4f';ctx.beginPath();ctx.ellipse(0,0,12,17,0,0,7);ctx.fill();ctx.fillStyle='#3a2c28';ctx.fillRect(-7,-10,14,5);ctx.restore();ctx.fillStyle='#3b211d';ctx.fillRect(e.x-16,e.y-23,32,4);ctx.fillStyle='#dc9a58';ctx.fillRect(e.x-16,e.y-23,32*Math.max(0,e.hp/e.maxhp),4)}
function drawBullet(b){ctx.fillStyle=b.color;ctx.beginPath();ctx.arc(b.x,b.y,b.splash?5:3,0,7);ctx.fill();if(b.splash){ctx.strokeStyle=b.color;ctx.globalAlpha=.25;ctx.beginPath();ctx.arc(b.x,b.y,10,0,7);ctx.stroke();ctx.globalAlpha=1}}
function spawnEnemy(){const q=spawnQueue.shift();if(q){let e={...q,hp:q.hp,maxhp:q.maxhp,slow:1,slowTime:0};enemies.push(e)}}
function update(dt){dt*=speed;if(!active&&!gameOver){spawnTimer=0}if(active&&spawnQueue.length){spawnTimer-=dt;if(spawnTimer<=0){spawnEnemy();spawnTimer=.65}}for(const e of enemies){e.slowTime-=dt;if(e.slowTime<0)e.slow=1;e.progress+=e.speed*(e.slow/100)*dt;if(e.progress>=1){lives-=e.armor?3:1;e.dead=true;particlesBurst(e.x,e.y,'#d16d53',8)}}for(let i=enemies.length-1;i>=0;i--)if(enemies[i].dead||enemies[i].hp<=0){if(enemies[i].hp<=0&&!enemies[i].dead){gold+=12+(wave>4?3:0);particlesBurst(enemies[i].x,enemies[i].y,'#dfc06a',7)}enemies.splice(i,1)}
 for(const t of towers){t.cool-=dt;let target=null,best=-1;for(const e of enemies){let d=Math.hypot(e.x-t.x,e.y-t.y);if(d<=defs[t.type].range&&e.progress>best){best=e.progress;target=e}}if(target){t.angle=Math.atan2(target.y-t.y,target.x-t.x)+Math.PI/2;if(t.cool<=0){const d=defs[t.type];bullets.push({x:t.x,y:t.y,tx:target.x,ty:target.y,target,damage:t.damage,color:d.color,speed:t.type==='cannon'?210:330,splash:d.splash,slow:d.slow});t.cool=d.rate}}}
 for(let i=bullets.length-1;i>=0;i--){let b=bullets[i];if(!b.target||b.target.dead||b.target.hp<=0){bullets.splice(i,1);continue}let dx=b.tx-b.x,dy=b.ty-b.y;if(Math.hypot(dx,dy)<Math.max(5,b.speed*dt)){if(b.splash){for(const e of enemies)if(Math.hypot(e.x-b.x,e.y-b.y)<b.splash){e.hp-=b.damage;if(b.slow){e.slow=b.slow;e.slowTime=1.8}}particlesBurst(b.x,b.y,b.color,12)}else{b.target.hp-=b.damage;if(b.slow){b.target.slow=b.slow;b.target.slowTime=1.8}}bullets.splice(i,1)}else{let a=Math.atan2(b.ty-b.y,b.tx-b.x);b.x+=Math.cos(a)*b.speed*dt;b.y+=Math.sin(a)*b.speed*dt;b.tx=b.target.x;b.ty=b.target.y}}
 for(let i=particles.length-1;i>=0;i--){particles[i].life-=dt;particles[i].y-=dt*8;if(particles[i].life<=0)particles.splice(i,1)}
 if(lives<=0&&!gameOver){gameOver=true;active=false;document.getElementById('endtitle').textContent='Keep Fallen';document.getElementById('endtext').textContent='The Ironvale border has been breached.';document.getElementById('overlay').classList.add('show')}
 if(active&&spawnQueue.length===0&&enemies.length===0&&!gameOver){active=false;gold+=50+wave*10;wave++;toast('Wave cleared · Bonus earned');updateHUD();document.getElementById('startwave').disabled=false;if(wave>12){gameOver=true;document.getElementById('endtitle').textContent='Victory';document.getElementById('endtext').textContent='The border holds. Ironvale is safe.';document.getElementById('overlay').classList.add('show')}}updateHUD();
}
function particlesBurst(x,y,c,n){for(let i=0;i<n;i++){let a=Math.random()*7,r=Math.random()*20;particles.push({x:x+Math.cos(a)*r,y:y+Math.sin(a)*r,life:.5+Math.random*.4,max:.9,size:1+Math.random()*3,color:c})}}
function loop(t){let dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);updateHUD();
</script></body></html>
