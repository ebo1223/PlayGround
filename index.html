<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>GeoQuest — Geography Explorer</title>
<style>
:root{--ink:#18342f;--muted:#71827d;--cream:#f4f0df;--paper:#fffdf5;--orange:#ef7f4d;--yellow:#f4bd50;--green:#4c806d;--sea:#9ecfcb;--line:#d9dfcf}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--cream)}button{font:inherit;color:inherit}.app{min-height:100vh}.topbar{height:74px;display:flex;align-items:center;padding:0 34px;background:#fffdf7;border-bottom:1px solid #e7e4d5}.brand{display:flex;align-items:center;gap:11px;font-weight:900;font-size:21px}.brand-mark{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--orange);color:white;font-size:21px;box-shadow:inset 0 -3px 0 #c95d35}.topnav{margin-left:auto;display:flex;gap:8px}.navbtn{border:0;background:transparent;padding:10px 14px;border-radius:20px;font-weight:800;font-size:14px;cursor:pointer}.navbtn.active{background:#e8efe8}.topstats{display:flex;gap:10px;margin-left:25px}.stat{min-width:74px;height:44px;border:1px solid var(--line);border-radius:12px;background:white;display:flex;align-items:center;justify-content:center;gap:7px;font-weight:900}.stat small{display:block;color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.8px}.stat b{font-size:15px}.stat-icon{font-size:17px}
main{max-width:1440px;margin:auto;padding:22px 34px 32px}.heading{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:14px}.heading h1{margin:0;font-family:Georgia,serif;font-size:30px}.heading p{margin:5px 0 0;color:var(--muted);font-size:14px}.mode-tabs{display:flex;background:#e9e7d9;border-radius:12px;padding:4px}.mode-tabs button{border:0;background:transparent;border-radius:9px;padding:9px 13px;font-size:13px;font-weight:800;cursor:pointer}.mode-tabs button.active{background:white;box-shadow:0 2px 8px #4c806d18}.game{display:grid;grid-template-columns:minmax(480px,1.65fr) minmax(330px,.75fr);gap:18px}.map-card,.quiz-card{border:1px solid #dfe2d2;border-radius:18px;box-shadow:0 8px 24px rgba(49,73,64,.07)}.map-card{height:585px;position:relative;overflow:hidden;background:var(--sea)}.map-toolbar{position:absolute;z-index:3;top:16px;left:16px;right:16px;display:flex;justify-content:space-between;pointer-events:none}.region-picker{pointer-events:auto;display:flex;gap:6px;background:rgba(255,255,255,.94);padding:5px;border-radius:12px}.region-picker button{border:0;background:transparent;padding:7px 9px;border-radius:8px;font-size:12px;font-weight:800;cursor:pointer}.region-picker button.active{background:var(--ink);color:white}.zoom-controls{pointer-events:auto;display:flex;gap:6px}.zoom-controls button{width:36px;height:36px;border-radius:10px;border:1px solid rgba(24,52,47,.12);background:white;font-size:20px;font-weight:800;cursor:pointer}.world-map{width:100%;height:100%;display:block;transform-origin:center;transition:transform .35s ease}.continent{fill:#f1e8b8;stroke:#d0c998;stroke-width:2}.continent:hover{fill:#e9dfa2}.map-grid{stroke:white;stroke-opacity:.22;fill:none}.pin{cursor:pointer}.pin-ring{fill:white;stroke:var(--orange);stroke-width:3;filter:drop-shadow(0 3px 4px rgba(32,77,67,.25));transition:.2s}.pin-core{fill:var(--orange);transition:.2s}.pin text{font-size:18px;text-anchor:middle;dominant-baseline:middle;pointer-events:none}.pin:hover .pin-ring{r:14;stroke:#f0ad69}.pin.active .pin-ring{fill:#fbe4a9}.pin-label{opacity:0;transition:.2s}.pin:hover .pin-label,.pin.active .pin-label{opacity:1}.label-bg{fill:white}.label-text{font-size:11px;font-weight:900;text-anchor:middle;fill:var(--ink)}.map-footer{position:absolute;z-index:4;bottom:16px;left:16px;background:rgba(255,255,255,.94);border-radius:12px;padding:9px 12px;font-size:12px;font-weight:800;box-shadow:0 4px 12px #31544a20}.map-footer span{color:var(--orange)}
.quiz-card{height:585px;background:var(--paper);display:flex;flex-direction:column}.quiz-head{padding:20px 22px 12px;border-bottom:1px solid #e7e7da}.quiz-meta{display:flex;justify-content:space-between;align-items:center}.round{font-size:12px;text-transform:uppercase;letter-spacing:1.2px;font-weight:900;color:var(--muted)}.points{font-size:12px;font-weight:900;background:#edf2e8;border-radius:20px;padding:7px 10px}.progress{height:7px;border-radius:10px;background:#ebe8da;margin-top:12px;overflow:hidden}.progress div{height:100%;width:10%;background:var(--orange);border-radius:10px;transition:.4s}.question-area{padding:22px;flex:1}.category{display:inline-flex;gap:6px;align-items:center;color:var(--orange);font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.7px}.category i{width:8px;height:8px;border-radius:50%;background:var(--orange)}.question-area h2{font-family:Georgia,serif;font-size:24px;line-height:1.25;margin:13px 0 18px}.clue{background:#edf3ec;border-left:3px solid #77a58f;border-radius:0 10px 10px 0;padding:10px 12px;font-size:12px;color:#536b64;margin:-5px 0 16px}.answers{display:grid;gap:9px}.answer{border:1.5px solid #dde2d4;border-radius:11px;background:white;padding:12px 13px;text-align:left;font-weight:800;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;transition:.16s}.answer:hover{border-color:#88a99c;transform:translateY(-1px)}.answer.correct{border-color:#65a07e;background:#edf7ef;color:#397256}.answer.wrong{border-color:#dd8468;background:#fff0ea;color:#9a5038}.answer .letter{width:25px;height:25px;border-radius:50%;border:1px solid #dfe4d7;display:grid;place-items:center;font-size:11px;margin-right:10px}.answer span{display:flex;align-items:center}.answer em{font-style:normal}.quiz-foot{border-top:1px solid #e7e7da;padding:14px 22px}.nextbtn{width:100%;border:0;border-radius:11px;background:var(--ink);color:white;height:47px;font-weight:900;cursor:pointer}.nextbtn:disabled{opacity:.45;cursor:not-allowed}.nextbtn:not(:disabled):hover{background:#2a5147}.toast{position:absolute;z-index:10;left:50%;bottom:72px;transform:translate(-50%,20px);background:var(--ink);color:white;border-radius:12px;padding:11px 16px;font-size:13px;font-weight:800;opacity:0;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}
.modal-backdrop{position:fixed;inset:0;z-index:20;background:rgba(24,52,47,.48);display:none;place-items:center;padding:20px}.modal-backdrop.show{display:grid}.modal{width:min(440px,100%);background:var(--paper);border-radius:18px;padding:26px;text-align:center;box-shadow:0 20px 70px #18342f55}.modal .trophy{font-size:48px}.modal h2{font-family:Georgia,serif;font-size:30px;margin:10px}.modal p{color:var(--muted)}.modal .scores{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:20px 0}.modal-score{background:#edf2e8;border-radius:12px;padding:12px}.modal-score b{display:block;font-size:21px}.modal-score small{color:var(--muted)}
@media(max-width:900px){.topbar{padding:0 16px}.topnav{display:none}.topstats{margin-left:auto}.stat:nth-child(1){display:none}main{padding:16px}.heading h1{font-size:25px}.game{grid-template-columns:1fr}.map-card{height:430px}.quiz-card{height:auto}.heading{align-items:flex-start}.mode-tabs{display:none}}@media(max-width:560px){.topstats .stat:nth-child(2){display:none}.map-card{height:360px}.region-picker button{font-size:10px;padding:7px}.heading p{display:none}.quiz-head{padding:16px}.question-area{padding:16px}.map-toolbar{top:10px;left:10px;right:10px}.zoom-controls{display:none}}
</style>
</head>
<body><div class="app">
<header class="topbar"><div class="brand"><div class="brand-mark">◎</div>GeoQuest</div><nav class="topnav"><button class="navbtn active">Explore</button><button class="navbtn" id="quizNav">Quiz</button></nav><div class="topstats"><div class="stat"><span class="stat-icon">🔥</span><div><small>Streak</small><b id="streak">0</b></div></div><div class="stat"><span class="stat-icon">⭐</span><div><small>Score</small><b id="score">0</b></div></div></div></header>
<main><div class="heading"><div><h1 id="pageTitle">Explore the world</h1><p id="subtitle">Tap a marker to discover a new place</p></div><div class="mode-tabs"><button class="active" data-mode="Capitals">Capitals</button><button data-mode="Flags">Flags</button><button data-mode="Landmarks">Landmarks</button></div></div>
<section class="game"><div class="map-card"><div class="map-toolbar"><div class="region-picker"><button class="active" data-region="All">All</button><button data-region="Americas">Americas</button><button data-region="Europe">Europe</button><button data-region="Africa">Africa</button><button data-region="Asia">Asia</button></div><div class="zoom-controls"><button id="zoomOut">−</button><button id="zoomIn">+</button></div></div>
<svg class="world-map" id="worldMap" viewBox="0 0 1000 500" aria-label="Interactive world map"><g id="mapScale">
<defs><pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse"><path d="M100 0H0V100" class="map-grid"/></pattern></defs><rect width="1000" height="500" fill="#9ecfcb"/><rect width="1000" height="500" fill="url(#grid)"/><ellipse cx="500" cy="250" rx="485" ry="235" fill="#7ebcb9" opacity=".18"/>
<path class="continent" d="M72 115L115 67l74-30 93 22 55 52-15 42-48 18-28 53-44 24-18 58-49 20-28-45 4-57-32-31z"/><path class="continent" d="M224 293l49 12 41 44-2 52-27 61-28-17-18-68-29-52z"/><path class="continent" d="M430 91l37-28 77 8 38 27-18 35-71 4-49-18z"/><path class="continent" d="M470 145l82-17 82 22 48 69-31 96-65 73-67-35-23-83-43-45z"/><path class="continent" d="M565 102l76-58 122 20 116 74-19 64-86 17-38-29-71 13-70-57z"/><path class="continent" d="M772 292l54-13 61 34 30 58-47 42-58-20-24-56z"/><path class="continent" d="M876 208l38 10 23 31-26 26-48-20z"/><g id="pins"></g></g></svg><div class="map-footer">Discovered <span id="discovered">0 / 12</span></div><div class="toast" id="toast"></div></div>
<div class="quiz-card"><div class="quiz-head"><div class="quiz-meta"><span class="round" id="roundLabel">Round 1 of 10</span><span class="points" id="xp">+100 XP</span></div><div class="progress"><div id="progress"></div></div></div><div class="question-area"><div class="category"><i></i><span id="category">World Capitals</span></div><h2 id="question">Loading question…</h2><div class="clue" id="clue"></div><div class="answers" id="answers"></div></div><div class="quiz-foot"><button class="nextbtn" id="nextBtn" disabled>Next question →</button></div></div></section></main></div>
<div class="modal-backdrop" id="finishModal"><div class="modal"><div class="trophy">🏆</div><h2>Journey complete!</h2><p>You’ve mapped out an impressive collection of places.</p><div class="scores"><div class="modal-score"><b id="finalScore">0</b><small>Score</small></div><div class="modal-score"><b id="finalCorrect">0/10</b><small>Correct</small></div><div class="modal-score"><b id="finalStreak">0</b><small>Best streak</small></div></div><button class="nextbtn" id="playAgain">Explore again</button></div></div>
<script>
const places=[
{id:'canada',name:'Canada',region:'Americas',x:160,y:135,flag:'🇨🇦',capital:'Ottawa',landmark:'CN Tower'},
{id:'usa',name:'United States',region:'Americas',x:205,y:205,flag:'🇺🇸',capital:'Washington, D.C.',landmark:'Golden Gate Bridge'},
{id:'mexico',name:'Mexico',region:'Americas',x:180,y:270,flag:'🇲🇽',capital:'Mexico City',landmark:'Chichen Itza'},
{id:'brazil',name:'Brazil',region:'Americas',x:300,y:355,flag:'🇧🇷',capital:'Brasília',landmark:'Christ the Redeemer'},
{id:'argentina',name:'Argentina',region:'Americas',x:275,y:435,flag:'🇦🇷',capital:'Buenos Aires',landmark:'Perito Moreno Glacier'},
{id:'uk',name:'United Kingdom',region:'Europe',x:447,y:145,flag:'🇬🇧',capital:'London',landmark:'Big Ben'},
{id:'france',name:'France',region:'Europe',x:470,y:172,flag:'🇫🇷',capital:'Paris',landmark:'Eiffel Tower'},
{id:'egypt',name:'Egypt',region:'Africa',x:525,y:250,flag:'🇪🇬',capital:'Cairo',landmark:'Great Pyramids'},
{id:'kenya',name:'Kenya',region:'Africa',x:578,y:315,flag:'🇰🇪',capital:'Nairobi',landmark:'Mount Kenya'},
{id:'japan',name:'Japan',region:'Asia',x:850,y:205,flag:'🇯🇵',capital:'Tokyo',landmark:'Mount Fuji'},
{id:'india',name:'India',region:'Asia',x:682,y:245,flag:'🇮🇳',capital:'New Delhi',landmark:'Taj Mahal'},
{id:'australia',name:'Australia',region:'Asia',x:825,y:390,flag:'🇦🇺',capital:'Canberra',landmark:'Sydney Opera House'}
];
let mode='Capitals',region='All',score=0,streak=0,best=0,round=0,correct=0,answered=false,questions=[],discovered=new Set(),zoom=1;
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
function renderPins(){const pg=$('#pins');pg.innerHTML='';places.filter(p=>region==='All'||p.region===region).forEach(p=>{const g=document.createElementNS('http://www.w3.org/2000/svg','g');g.setAttribute('class','pin'+(discovered.has(p.id)?' active':''));g.setAttribute('transform',`translate(${p.x} ${p.y})`);g.innerHTML=`<circle class="pin-ring" r="11"/><circle class="pin-core" r="5"/><text y="1">${discovered.has(p.id)?'✓':''}</text><g class="pin-label" transform="translate(0 -24)"><rect class="label-bg" x="-48" y="-13" width="96" height="26" rx="13"/><text class="label-text" y="4">${p.name}</text></g>`;g.onclick=()=>explorePlace(p);pg.appendChild(g)})}
function explorePlace(p){discovered.add(p.id);$('#discovered').textContent=`${discovered.size} / ${places.length}`;renderPins();showToast(`${p.flag} ${p.name} · Capital: ${p.capital}`)}
function showToast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(e.timer);e.timer=setTimeout(()=>e.classList.remove('show'),2200)}
function shuffle(a){return [...a].sort(()=>Math.random-.5)}
function makeQuestions(){questions=[];for(let i=0;i<10;i++){const q=shuffle(places)[0];let list;let text,category,clue;if(mode==='Capitals'){text=`What is the capital of ${q.name}?`;category='World Capitals';clue=`${q.flag} Region: ${q.region}`;list=shuffle(places.filter(p=>p.id!==q.id).sort(()=>Math.random-.5).slice(0,3).concat(q).map(p=>p.capital))}else if(mode==='Flags'){text=`Which flag belongs to ${q.name}?`;category='Flag Identification';clue=`Find ${q.name} on the map`;list=shuffle(places.filter(p=>p.id!==q.id).sort(()=>Math.random-.5).slice(0,3).concat(q).map(p=>p.flag))}else{text=`Which landmark is found in ${q.name}?`;category='Famous Landmarks';clue=`${q.flag} Region: ${q.region}`;list=shuffle(places.filter(p=>p.id!==q.id).sort(()=>Math.random-.5).slice(0,3).concat(q).map(p=>p.landmark))}questions.push({q,text,category,clue,answer: mode==='Capitals'?q.capital:mode==='Flags'?q.flag:q.landmark,list})}}
function renderQuestion(){answered=false;const item=questions[round];$('#roundLabel').textContent=`Round ${round+1} of ${questions.length}`;$('#progress').style.width=`${((round+1)/questions.length)*100}%`;$('#xp').textContent='+100 XP';$('#category').textContent=item.category;$('#question').textContent=item.text;$('#clue').textContent=item.clue;$('#answers').innerHTML='';item.list.forEach((ans,i)=>{const b=document.createElement('button');b.className='answer';b.innerHTML=`<span><b class="letter">${String.fromCharCode(65+i)}</b>${ans}</span><em></em>`;b.onclick=()=>answer(b,ans,item.answer);$('#answers').appendChild(b)});$('#nextBtn').disabled=true}
function answer(btn,ans,correctAns){if(answered)return;answered=true;const good=ans===correctAns;$$('.answer').forEach(b=>{if(b.queryContent?false:false){};const val=b.querySelector('span').textContent.slice(1).trim();if(val===correctAns||b.textContent.includes(correctAns))b.classList.add('correct')});btn.classList.toggle('good',good);if(good){btn.classList.add('correct');correct++;score+=100+(streak*20);streak++;best=Math.max(best,streak);btn.querySelector('em').textContent='✓'}else{btn.classList.add('wrong');streak=0;btn.querySelector('em').textContent='×'}$('#score').textContent=score;$('#streak').textContent=streak;$('#xp').textContent=good?'+100 XP':'Keep exploring';$('#nextBtn').disabled=false}
function next(){if(round<questions.length-1){round++;renderQuestion()}else{$('#finalScore').textContent=score;$('#finalCorrect').textContent=`${correct}/${questions.length}`;$('#finalStreak').textContent=best;$('#finishModal').classList.add('show')}}
$('#nextBtn').onclick=next;$('#playAgain').onclick=()=>{$('#finishModal').classList.remove('show');score=0;streak=0;best=0;correct=0;round=0;$('#score').textContent='0';$('#streak').textContent='0';makeQuestions();renderQuestion()};
$$('.mode-tabs button').forEach(b=>b.onclick=()=>{$$('.mode-tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.mode;round=0;score=0;streak=0;correct=0;$('#score').textContent='0';$('#streak').textContent='0';makeQuestions();renderQuestion();showToast(`${mode} challenge started`) });
$$('.region-picker button').forEach(b=>b.onclick=()=>{$$('.region-picker button').forEach(x=>x.classList.remove('active'));b.classList.add('active');region=b.dataset.region;renderPins();showToast(region==='All'?'Showing the whole world':`Showing ${region}`)});
$('#zoomIn').onclick=()=>{zoom=Math.min(1.55,zoom+.15);$('#mapScale').style.transform=`scale(${zoom})`;$('#mapScale').style.transformOrigin='500px 250px'};$('#zoomOut').onclick=()=>{zoom=Math.max(.85,zoom-.15);$('#mapScale').style.transform=`scale(${zoom})`;$('#mapScale').style.transformOrigin='500px 250px'};$('#quizNav').onclick=()=>$('.quiz-card').scrollIntoView({behavior:'smooth'});
renderPins();makeQuestions();renderQuestion();
</script></body></html>
