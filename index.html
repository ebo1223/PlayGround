<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Glasshouse Murder</title>
<style>
:root{--ink:#17120f;--paper:#ded2b7;--gold:#cba85c;--red:#9b3a31;--green:#2d4a3a}
*{box-sizing:border-box}body{margin:0;font-family:Georgia,"Times New Roman",serif;color:var(--ink);background:#13110e;overflow:hidden}
button{font:inherit}.game{height:100vh;display:grid;grid-template-columns:270px 1fr 285px;background:#ddd}
.sidebar,.casebook{background:#1d211d;color:#ece4d2;border-right:1px solid #090a09;padding:18px 16px;overflow:auto}.casebook{border-right:0;border-left:1px solid #090a09}
.brand{font-size:13px;letter-spacing:4px;text-transform:uppercase;color:var(--gold);border-bottom:1px solid #555;padding-bottom:14px}.brand b{display:block;font-size:25px;letter-spacing:1px;color:#f5ecd7;margin-top:5px}
.room-list{margin-top:18px}.room{width:100%;text-align:left;padding:12px 10px;margin:4px 0;border:1px solid transparent;background:transparent;color:#aaa;font-size:16px;cursor:pointer}.room:hover,.room.active{border-color:#806d48;color:#fff;background:#292c27}.room span{float:right;color:var(--gold)}
.progress{margin-top:20px;font-size:12px;text-transform:uppercase;letter-spacing:2px;color:#aaa}.meter{height:5px;background:#090b09;margin-top:8px}.meter i{display:block;width:0;height:100%;background:var(--gold);transition:.4s}
.scene{position:relative;overflow:hidden;background:#4a4b43}.scene-bg{position:absolute;inset:0;transition:opacity .25s;background-size:cover;background-position:center}
.library{background:linear-gradient(90deg,rgba(10,10,8,.35),transparent 30%,rgba(10,10,8,.2)),radial-gradient(circle at 70% 15%,#6e755f 0 3%,transparent 28%),linear-gradient(145deg,#2a352c,#696756 58%,#201b15)}
.hall{background:radial-gradient(ellipse at 52% 20%,rgba(239,221,164,.5),transparent 18%),linear-gradient(90deg,#171813 0 12%,transparent 12% 88%,#171813 88%),linear-gradient(#555846,#25291f)}
.study{background:radial-gradient(circle at 70% 20%,rgba(203,168,92,.3),transparent 25%),linear-gradient(135deg,#24352e,#101611)}
glasshouse{position:absolute}.panel{position:absolute;top:-20px;width:22%;height:75%;border:3px solid #1d211b;background:linear-gradient(135deg,rgba(189,205,176,.35),rgba(64,82,65,.5));box-shadow:0 0 0 2px #10120f}.panel:nth-child(1){left:5%}.panel:nth-child(2){left:39%}.panel:nth-child(3){right:5%}.bench{position:absolute;left:10%;right:10%;bottom:13%;height:19%;background:linear-gradient(#8d7652,#4b3825);box-shadow:0 20px 30px #111;border-radius:2px}.bench:before{content:"";position:absolute;left:7%;right:7%;height:5px;top:30%;background:#b19a72}.floor{position:absolute;left:-10%;right:-10%;bottom:-15%;height:36%;transform:perspective(300px) rotateX(52deg);background:repeating-linear-gradient(90deg,#3d4638 0 70px,#252b22 71px 74px)}
.vase{position:absolute;width:52px;height:105px;border-radius:15px 15px 28px 28px;background:linear-gradient(90deg,#c8b98c,#e5d6a5,#8d8058);left:64%;bottom:25%;z-index:2}.vase:before{content:"";position:absolute;width:34px;height:18px;border:5px solid #d2c48d;border-radius:50%;left:4px;top:-11px}.plant{position:absolute;width:100px;height:100px;left:5%;bottom:22%;border-radius:50%;background:radial-gradient(ellipse at 50% 100%,#2d5736 0 10%,transparent 11%),repeating-conic-gradient(from 20deg,#1f452b 0 12deg,#64805a 13deg 20deg);clip-path:polygon(50% 0,61% 35%,94% 13%,72% 47%,100% 61%,64% 58%,75% 100%,50% 66%,25% 100%,36% 58%,0 61%,28% 47%,6% 13%,39% 35%)}
.title-card{position:absolute;top:25px;left:32px;color:#f4edd9;text-shadow:0 2px 6px #000}.title-card small{letter-spacing:3px;text-transform:uppercase}.title-card h1{margin:5px 0 0;font-size:32px;font-weight:normal}.hotspot{position:absolute;border:0;border-radius:50%;width:50px;height:50px;background:rgba(201,174,105,.88);color:#17120f;font:bold 24px Georgia;cursor:pointer;box-shadow:0 0 0 6px rgba(201,174,105,.15),0 2px 12px #111;transition:.2s;z-index:5}.hotspot:hover{transform:scale(1.12);background:#fff1bd}.hotspot:after{content:""}.hotspot.done{background:#6c745f;color:#ddd}.hotspot.done:after{content:"✓"}.hotspot.done span{display:none}
.note{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);background:rgba(24,25,21,.94);color:#eee;border:1px solid #aaa;padding:10px 18px;border-radius:3px;max-width:70%;text-align:center;font-size:14px;z-index:8}
.casebook h2{font-size:20px;font-weight:normal;border-bottom:1px solid #777;padding-bottom:10px}.tabs{display:flex;gap:4px}.tab{flex:1;border:1px solid #555;background:transparent;color:#aaa;padding:8px 4px;font-size:12px;cursor:pointer}.tab.active{background:var(--paper);color:#17120f}.panel-content{margin-top:14px}.clue{border-bottom:1px solid #40443f;padding:10px 0}.clue b{display:block;color:var(--gold);font-size:14px}.clue p{font-size:13px;line-height:1.45;margin:5px 0 0;color:#ddd}.empty{color:#aaa;font-style:italic;font-size:14px}.accuse{width:100%;margin-top:14px;border:0;background:var(--red);color:#fff;padding:12px;cursor:pointer}.accuse:disabled{background:#4d4840;color:#999;cursor:not-allowed}
.modal-backdrop{position:absolute;inset:0;background:rgba(10,10,8,.78);display:none;align-items:center;justify-content:center;z-index:20}.modal-backdrop.show{display:flex}.modal{width:min(520px,82%);background:#e3d8bc;border:8px solid #bba875;padding:22px 28px;box-shadow:0 20px 60px #000}.modal h2{margin:0 0 12px}.modal p{line-height:1.5}.suspect-list{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.suspect{border:1px solid #8d8063;background:#f2e8cc;padding:12px;cursor:pointer}.suspect:hover,.suspect.selected{background:#c6ad70}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.modal-actions button{border:1px solid #655e4d;padding:9px 14px;background:#eee4c9;cursor:pointer}.modal-actions .confirm{background:#2d4a3a;color:white}
.truth{font-size:28px;text-align:center;margin:12px}.wrong{color:#9b3a31}.right{color:#2d4a3a}
@media(max-width:900px){.game{grid-template-columns:200px 1fr 240px}.title-card h1{font-size:24px}}
@media(max-width:680px){body{overflow:auto}.game{height:100vh;grid-template-columns:78px 1fr}.sidebar{padding:12px 6px}.brand{font-size:0}.brand b{font-size:14px}.room{font-size:12px;padding:10px 4px}.room span{display:none}.progress{display:none}.casebook{position:absolute;right:0;top:55%;bottom:0;width:220px;z-index:10;transform:translateY(100%);transition:.25s}.casebook.open{transform:translateY(0)}.title-card{left:16px}.title-card h1{font-size:20px}}
</style>
</head>
<body>
<div class="game">
<aside class="sidebar"><div class="brand">The <b>Glasshouse</b> Affair</div><div class="room-list">
<button class="room active" data-room="glasshouse">Glasshouse <span>●</span></button><button class="room" data-room="hall">West Hall <span></span></button><button class="room" data-room="study">Lord's Study <span></span></button><button class="room" data-room="library">Library <span></span></button></div>
<div class="progress">Evidence <span id="evidenceCount">0/6</span><div class="meter"><i id="meter"></i></div></div></aside>
<main class="scene" id="scene"><div class="scene-bg library" id="sceneBg"></div><div class="title-card"><small>Crime scene</small><h1 id="roomTitle">Glasshouse</h1></div>
<div id="objects"></div><div class="note" id="note">Choose a marked object to examine.</div></main>
<aside class="casebook"><h2>Detective's Casebook</h2><div class="tabs"><button class="tab active" data-tab="clues">Clues</button><button class="tab" data-tab="suspects">Suspects</button></div><div class="panel-content" id="panel"></div><button class="accuse" id="accuse" disabled>ACCUSE A SUSPECT</button></aside>
</div>
<div class="modal-backdrop" id="modal"><div class="modal"><div id="modalContent"></div></div></div>
<script>
const rooms={glasshouse:{title:'Glasshouse',spots:[['Broken terrarium',45,55,'A triangular shard of glass, held together by a dark smear.'],['Discarded gloves',67,68,'A pair of soil-blackened gloves — the left glove is clean.'],['Torn note',81,45,'Only three words remain: “meet him alone.”']]},hall:{title:'West Hall',spots:[['Mud trail',30,72,'A trail of garden mud leads toward the west entrance, then stops.'],['Silver button',62,61,'An official-style silver button, prised from a coat.']]},study:{title:'Lord’s Study',spots:[['Locked ledger',52,48,'The final page lists a payment to C. Vale — “for the old debt.”']]},library:{title:'Library',spots:[['Hidden letter',38,62,'A letter threatens Lord Ashcombe unless he returns “the letters at midnight.”']]}};
let found=new Set(),current='glasshouse',tab='clues',selected=null;
const panel=document.getElementById('panel'),objects=document.getElementById('objects'),sceneBg=document.getElementById('sceneBg'),note=document.getElementById('note');
function sceneMarkup(){return '<div class="panel"></div><div class="panel"></div><div class="panel"></div><div class="floor"></div><div class="bench"></div><div class="vase"></div><div class="plant"></div>';}
sceneBg.innerHTML=sceneMarkup();
function clueKey(room,index){return room+'-'+index}
function renderRoom(room){current=room;document.querySelectorAll('.room').forEach(b=>b.classList.toggle('active',b.dataset.room===room));document.getElementById('roomTitle').textContent=rooms[room].title;sceneBg.className='scene-bg '+room;if(room==='glasshouse')sceneBg.innerHTML=sceneMarkup();else if(room==='study')sceneBg.innerHTML='<div style="position:absolute;inset:12% 15% 20%;background:#211e19;border:12px solid #6b5638;box-shadow:0 20px 40px #111"><div style="position:absolute;left:8%;right:8%;top:18%;height:8px;background:#8d7954"></div></div>';else if(room==='hall')sceneBg.innerHTML='<div style="position:absolute;left:38%;top:5%;width:24%;height:70%;background:#32291f;border:8px solid #15130f;border-radius:50% 50% 0 0"></div><div style="position:absolute;left:8%;bottom:15%;width:84%;height:12%;background:#77715a;transform:rotate(-2deg)"></div>';else sceneBg.innerHTML='<div style="position:absolute;left:-5%;right:-5%;top:0;height:68%;background:repeating-linear-gradient(90deg,#332219 0 36px,#8a6a43 37px 42px)"></div><div style="position:absolute;left:14%;bottom:16%;width:72%;height:18%;background:#28271f"></div>';
objects.innerHTML='';rooms[room].spots.forEach((s,i)=>{let b=document.createElement('button');b.className='hotspot'+(found.has(clueKey(room,i))?' done':'');b.style.left=s[1]+'%';b.style.top=s[2]+'%';b.innerHTML='<span>?</span>';b.onclick=()=>examine(clueKey(room,i),s);objects.appendChild(b)});note.textContent='Choose a marked object to examine.'}
function examine(key,s){if(!found.has(key)){found.add(key);let b=[...objects.children].find(x=>x.style.left===s[1]+'%'&&x.style.top===s[2]+'%');if(b)b.classList.add('done')}note.textContent=s[3];update();}
function update(){document.getElementById('evidenceCount').textContent=found.size+'/6';document.getElementById('meter').style.width=(found.size/6*100)+'%';document.getElementById('accuse').disabled=found.size<3;if(tab==='clues')renderClues()}
const names=['Inspector Vale','Lady Celeste','Dr. Wren','Lord Ashcombe'];
function renderClues(){if(!found.size){panel.innerHTML='<p class="empty">No evidence collected yet.</p>';return}let html='';[...found].forEach(k=>{let [r,i]=k.split('-');let s=rooms[r].spots[+i];html+='<div class="clue"><b>'+s[0]+'</b><p>'+s[3]+'</p></div>'});panel.innerHTML=html}
function renderSuspects(){panel.innerHTML='';names.forEach(n=>{let d=document.createElement('div');d.className='clue';d.innerHTML='<b>'+n+'</b><p>'+({ 'Inspector Vale':'Investigating officer. Appears overly familiar with Lord Ashcombe’s affairs.', 'Lady Celeste':'The victim’s niece. Her inheritance vanished when Ashcombe changed his will.', 'Dr. Wren':'Ashcombe’s physician. Claimed he never entered the glasshouse.', 'Lord Ashcombe':'Wealthy estate owner. The victim was found in the glasshouse at midnight.'}[n])+'</p>';panel.innerHTML+=d.outerHTML})}
document.querySelectorAll('.room').forEach(b=>b.onclick=()=>renderRoom(b.dataset.room));document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');tab==='clues'?renderClues():renderSuspects()});
const modal=document.getElementById('modal'),mc=document.getElementById('modalContent');
document.getElementById('accuse').onclick=()=>{selected=null;mc.innerHTML='<h2>Choose the guilty suspect</h2><p>Present your accusation.</p><div class="suspect-list">'+names.map(n=>'<button class="suspect">'+n+'</button>').join('')+'</div><div class="modal-actions"><button id="cancel">Return</button><button class="confirm" id="confirm" disabled>Accuse</button></div>';modal.classList.add('show');document.querySelectorAll('.suspect').forEach(b=>b.onclick=()=>{document.querySelectorAll('.suspect').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');selected=b.textContent;document.getElementById('confirm').disabled=false});document.getElementById('cancel').onclick=()=>modal.classList.remove('show');document.getElementById('confirm').onclick=resolve};
function resolve(){let right=selected==='Inspector Vale';mc.innerHTML='<div class="truth '+(right?'right':'wrong')+'">'+(right?'CASE SOLVED':'CASE UNSOLVED')+'</div><p>'+ (right?'Vale used his position to conceal the evidence. The ledger proves Ashcombe paid to keep an old scandal secret. Vale arranged the meeting in the glasshouse, and the silver button from his uniform slipped loose.':'The evidence does not support that accusation. Review the silver button, ledger, and torn note, then try again.')+'</p><div class="modal-actions"><button id="again">Review evidence</button><button class="confirm" id="close">Close case</button></div>';document.getElementById('again').onclick=()=>modal.classList.remove('show');document.getElementById('close').onclick=()=>{if(right){mc.innerHTML='<h2>Excellent deduction, Detective.</h2><p>You restored the truth to the Ashcombe estate.</p><div class="modal-actions"><button id="restart">Play again</button></div>';document.getElementById('restart').onclick=()=>{found=new Set();tab='clues';modal.classList.remove('show');renderRoom('glasshouse');update();}}else modal.classList.remove('show')}}
renderRoom('glasshouse');update();
</script>
</body></html>
