<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Night Pursuit</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#091018;color:#edf4ff;font-family:Arial,sans-serif}canvas{display:block;width:100%;height:100%}.hud{position:absolute;inset:0;pointer-events:none}.top{position:absolute;top:18px;left:22px;right:22px;display:flex;justify-content:space-between;align-items:flex-start}.brand{font-weight:900;font-size:20px;letter-spacing:2px;text-shadow:0 2px 12px #000}.brand b{color:#61a8ff}.score{text-align:right;font-size:12px;color:#9eb1c9}.score strong{display:block;font-size:30px;color:#fff}.mission{position:absolute;left:50%;top:18px;transform:translateX(-50%);text-align:center}.mission small{display:block;color:#9eb1c9;font-size:10px;letter-spacing:2px}.mission strong{font-size:16px}.bar{position:absolute;bottom:32px;left:50%;transform:translateX(-50%);width:min(420px,60vw);height:8px;border-radius:8px;background:#1a2633;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90,#ff3c54,#ffd05c,#58dc91);width:100%;transition:width .1s}.nitro{position:absolute;right:24px;bottom:28px;width:74px;height:74px;border:3px solid #86bfff;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:bold;background:rgba(20,43,66,.7);box-shadow:0 0 20px #1d79d755}.nitro:after{content:'';position:absolute;inset:7px;border:2px dashed #86bfff;border-radius:50%;animation:spin 8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;background:rgba(5,12,20,.88);border:1px solid #314a63;border-radius:18px;padding:28px 38px;pointer-events:auto;box-shadow:0 20px 70px #000}.center h1{margin:0 0 8px;font-size:38px}.center p{color:#adc0d4;margin:0 0 20px}.center button{border:0;border-radius:8px;padding:13px 22px;background:#ff4058;color:white;font-weight:900;cursor:pointer;letter-spacing:1px}.hidden{display:none}.controls{display:none}@media(max-width:700px){.mission{top:58px}.brand{font-size:15px}.bar{bottom:92px;width:55vw}.controls{display:block}.pad{position:absolute;left:16px;bottom:20px;width:150px;height:150px}.pad button{position:absolute;width:55px;height:55px;border:1px solid #ffffff38;border-radius:50%;background:#ffffff18;color:white;font-size:20px}.pad #up{left:48px;top:0}.pad #down{left:48px;bottom:0}.pad #left{left:0;top:48px}.pad #right{right:0;top:48px}.nitro{width:64px;height:64px}} 
</style></head>
<body>
<canvas id="c"></canvas>
<div class="hud"><div class="top"><div class="brand"><b>◆</b> NIGHT<br>PURSUIT</div><div class="mission"><small>OBJECTIVE</small><strong id="objective">INTERCEPT SUSPECT</strong></div><div class="score"><small>SCORE</small><strong id="score">0000</strong></div></div><div class="bar"><i id="health"></i></div><div class="nitro" id="nitro">NITRO</div><div class="center" id="panel"><h1>NIGHT PURSUIT</h1><p>Stop the suspect before they escape.<br>WASD / Arrows to drive · Shift for nitro</p><button id="start">START CHASE</button></div><div class="controls"><div class="pad"><button id="up">▲</button><button id="down">▼</button><button id="left">◀</button><button id="right">▶</button></div></div></div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');let W,H,DPR,started=false,over=false,last=0;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
const keys={},road={w:640};for(const id of ['up','down','left','right']){const el=document.getElementById(id);el.addEventListener('pointerdown',e=>{e.preventPreventDefault;keys[id]=true});el.addEventListener('pointerup',()=>keys[id]=false);el.addEventListener('pointerleave',()=>keys[id]=false)}
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key===' ')keys.shift=true});addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;if(e.key===' ')keys.shift=false});
let player,suspect,score,health,nitro,distance,particles=[];function reset(){player={x:0,y:0,v:0,a:0};suspect={x:110,y:-260,v:6,a:0};score=0;health=100;nitro=100;distance=0;particles=[]}
reset();
function car(x,y,angle,police=false,turn=0){ctx.save();ctx.translate(x,y);ctx.rotate(angle);ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(-27,-48,54,96);ctx.fillStyle=police?'#dce5ed':'#e74b45';ctx.beginPath();ctx.roundRect(-24,-43,48,86,9);ctx.fill();ctx.fillStyle='#101a22';ctx.fillRect(-19,-25,38,34);ctx.fillStyle='#506579';ctx.fillRect(-17,-22,34,12);ctx.fillStyle=police?'#ff9c36':'#1a1a20';ctx.fillRect(-22,-35,44,9);ctx.fillStyle='#111';ctx.fillRect(-28,-31,5,20);ctx.fillRect(23,-31,5,20);ctx.fillRect(-28,16,5,20);ctx.fillRect(23,16,5,20);if(police){ctx.fillStyle='#ef3d4d';ctx.fillRect(-22,-39,20,5);ctx.fillStyle='#3e83ff';ctx.fillRect(2,-39,20,5)}else{ctx.fillStyle='#791f24';ctx.fillRect(-18,36,36,4)}ctx.restore()}
function drawRoad(){let cy=H/2-player.y;ctx.fillStyle='#101b20';ctx.fillRect(0,0,W,H);ctx.save();ctx.translate(W/2,0);ctx.fillStyle='#263237';ctx.fillRect(-road.w/2,0,road.w,H);ctx.fillStyle='#172126';ctx.fillRect(-road.w/2+12,0,8,H);ctx.fillRect(road.w/2-20,0,8,H);ctx.setLineDash([35,38]);ctx.lineDashOffset=-(-player.y%73);ctx.strokeStyle='#b3a86e';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-3,0);ctx.lineTo(-3,H);ctx.moveTo(3,0);ctx.lineTo(3,H);ctx.stroke();ctx.setLineDash([]);for(let i=-800;i<3000;i+=180){let y=i+(-player.y%180);if(y>-50&&y<H+50){ctx.fillStyle='#bfc6b2';ctx.fillRect(-road.w/2+35,y,10,44);ctx.fillRect(road.w/2-45,y,10,44)}}ctx.restore();ctx.fillStyle='#182d28';for(let i=0;i<18;i++){let y=((i*137-player.y*.35)% (H+180))-90;let x=i%2?20+((i*83)%110):W-20-((i*83)%110);ctx.fillRect(x-18,y-12,36,24);ctx.fillStyle='#263f35';ctx.fillRect(x-12,y-17,24,12);ctx.fillStyle='#182d28'}}
function update(dt){if(!started||over)return;dt=Math.min(dt,.033);let steer=(keys.arrowleft||keys.a||keys.left?-1:0)+(keys.arrowright||keys.d||keys.right?1:0);let acc=(keys.arrowup||keys.w||keys.up?1:0)-(keys.arrowdown||keys.s||keys.down?1:0);let boosting=(keys.shift||keys[' '])&&nitro>1&&acc>0;if(boosting){nitro-=28*dt}else nitro=Math.min(100,nitro+9*dt);player.a+=(steer*.018-player.a*.14)*dt*60;player.v+=(acc*(boosting?2.3:.75)-player.v*.018)*dt*60;player.v=Math.max(-3,Math.min(boosting?13:9,player.v));player.x+= (steer*3.8+player.a*player.v*.12)*dt*60;if(player.x<-road.w/2+38)player.x=-road.w/2+38;if(player.x>road.w/2-38)player.x=road.w/2-38;player.y+=player.v*dt*60;
let targetA=-.02*steer+Math.sin(performance.now()/900)*.12+(player.x-suspect.x)*-.0015;suspect.a+=(targetA-suspect.a*.02-suspect.a)*.04;suspect.x+=((player.x-suspect.x)*.008+steer*-.1)*dt*60;suspect.y+=((player.y-290)-suspect.y)*.008*suspect.v*dt*0.45;if(suspect.x<-road.w/2+38)suspect.x=-road.w/2+38;if(suspect.x>road.w/2-38)suspect.x=road.w/2-38;distance=Math.max(distance,Math.abs(suspect.y-player.y));let dx=player.x-suspect.x,dy=player.y-suspect.y,d=Math.hypot(dx,dy);if(d<68){score+=Math.round(34*dt*60);health=Math.max(0,health-.35);if(Math.random()<.2)particles.push({x:W/2+(player.x+suspect.x)/2,y:H/2+(player.y-suspect.y)/2,vx:(Math.random-.5)*3,vy:2,life:1})}else score+=Math.round(player.v*dt*.8);if(player.v>7&&d<110)score+=Math.round(dt*100);document.getElementById('health').style.width=health+'%';document.getElementById('score').textContent=Math.floor(score).toString().padStart(4,'0');document.getElementById('nitro').style.opacity=.45+nitro/180;if(health<=0)end(false)}
function end(win){over=true;document.getElementById('panel').classList.remove('hidden');document.querySelector('#panel h1').textContent=win?'SUSPECT CAPTURED':'VEHICLE DISABLED';document.querySelector('#panel p').textContent='Final score: '+Math.floor(score).toString().padStart(4,'0');document.querySelector('#panel button').textContent='CHASE AGAIN'}
function render(){ctx.clearRect(0,0,W,H);drawRoad();let screenY=y=>H/2+(y-player.y);ctx.save();ctx.translate(W/2+suspect.x,screenY(suspect.y));ctx.rotate(suspect.a);car(0,0,suspect.a,false);ctx.restore();ctx.save();ctx.translate(W/2+player.x,H/2);ctx.rotate(player.a);car(0,0,player.a,true);ctx.restore();for(let p of particles){ctx.fillStyle=`rgba(255,190,90,${p.life})`;ctx.beginPath();ctx.arc(p.x,p.y,3,0,7);ctx.fill();p.x+=p.vx;p.y+=p.vy;p.life-=.04}particles=particles.filter(p=>p.life>0)}
function loop(t){let dt=(t-last)/1000||0;last=t;update(dt);render();requestAnimationFrame(loop)}requestAnimationFrame(loop);
document.getElementById('start').onclick=()=>{if(over){}reset();started=true;over=false;document.getElementById('panel').classList.add('hidden')};
</script></body></html>
