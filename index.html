<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Karate Champion</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Black+Ops+One&display=swap');
:root{--red:#ef3e36;--ink:#11151a;--paper:#f4ead5;--gold:#f3c34b}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#11151a;font-family:'Barlow Condensed',Impact,sans-serif;color:#fff;user-select:none}body:before{content:"";position:absolute;inset:0;pointer-events:none;z-index:20;box-shadow:inset 0 0 100px #0008;background:repeating-linear-gradient(0deg,#fff1 0 1px,transparent 1px 4px);opacity:.12}
#game{position:relative;width:100%;height:100%;min-height:500px;overflow:hidden;background:#c9d7c9}canvas{position:absolute;inset:0;width:100%;height:100%}.topbar{position:absolute;z-index:5;top:0;left:0;right:0;height:128px;padding:18px 5.5% 0;display:grid;grid-template-columns:1fr 110px 1fr;gap:18px;background:linear-gradient(180deg,#11151aea 0,#11151ac2 72%,transparent 100%)}
.player{display:grid;grid-template-columns:58px 1fr;gap:10px}.player.right{direction:rtl}.portrait{width:58px;height:58px;border:3px solid var(--paper);border-radius:50%;background:linear-gradient(145deg,#dca,#79533a);overflow:hidden;position:relative;box-shadow:0 4px 0 #000}.portrait:before{content:"";position:absolute;width:28px;height:35px;border-radius:50% 50% 45% 45%;background:#bc7d59;left:12px;top:14px}.portrait:after{content:"";position:absolute;width:50px;height:18px;border-radius:60% 60% 20% 20%;background:#15191d;left:4px;top:4px}.right .portrait:after{background:#d5d8d7}.right .portrait:before{background:#d99d73}.name{font-size:20px;line-height:25px;font-weight:800;letter-spacing:2px;text-shadow:2px 2px #000}.roundPips{display:flex;gap:5px;margin-top:3px}.right .roundPips{justify-content:flex-end}.pip{width:11px;height:11px;border:2px solid #fff;border-radius:50%;opacity:.45}.pip.won{background:var(--gold);border-color:var(--gold);opacity:1}
.healthWrap{height:23px;background:#050607;border:3px solid #e9e1c8;transform:skew(-10deg);overflow:hidden;box-shadow:3px 4px 0 #0007;margin-top:5px}.health{height:100%;background:linear-gradient(180deg,#f55 0,#cf2020 55%,#991a1a 56%);transform-origin:left;transition:width .15s}.right .health{transform-origin:right;background:linear-gradient(180deg,#f0d26b 0,#e79e29 55%,#b76a18 56%)}
.timer{text-align:center}.timer .round{font-size:13px;color:var(--gold);letter-spacing:3px}.time{font-family:'Black Ops One';font-size:51px;line-height:58px;text-shadow:4px 4px 0 #000;letter-spacing:-4px}
#intro,#pause,#result{position:absolute;z-index:10;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;background:linear-gradient(120deg,#101318d9,#1a1d20aa)}.hidden{display:none!important}.logo{font-family:'Black Ops One';font-size:clamp(48px,8vw,105px);line-height:.78;text-transform:uppercase;text-shadow:7px 7px 0 #a51d1c,12px 12px 0 #000;transform:rotate(-2deg)}.logo span{display:block;color:var(--gold);font-size:.48em;letter-spacing:10px;margin-left:.7em}.tag{margin-top:34px;font-size:19px;letter-spacing:5px}.btn{margin-top:24px;border:0;border-bottom:6px solid #8e1915;background:var(--red);color:#fff;font-family:'Barlow Condensed';font-weight:800;font-size:24px;letter-spacing:3px;padding:13px 38px 10px;cursor:pointer;transform:skew(-8deg);box-shadow:8px 10px 0 #0007}.btn:hover{filter:brightness(1.12);transform:skew(-8deg) translateY(-2px)}
.controls{position:absolute;z-index:7;bottom:18px;left:22px;display:flex;gap:7px}.controlLegend{background:#1118;border:1px solid #fff3;padding:7px 9px;font-size:13px;letter-spacing:1px}.key{display:inline-grid;place-items:center;min-width:26px;height:25px;margin-right:4px;border:1px solid #fff8;border-bottom-width:3px;background:#fff1;font-weight:800}
.mobileControls{display:none;position:absolute;z-index:8;bottom:16px;left:16px;right:16px;justify-content:space-between;pointer-events:none}.pad,.actions{display:flex;align-items:end;gap:8px}.touch{pointer-events:auto;width:58px;height:58px;border-radius:50%;border:2px solid #fff7;background:#1119;color:#fff;font:800 17px 'Barlow Condensed';box-shadow:0 5px 0 #0007}.touch.attack{background:#b82922dd;border-color:#ffd6c3}.touch.small{width:48px;height:48px}
#message{position:absolute;z-index:6;left:50%;top:43%;transform:translate(-50%,-50%) rotate(-3deg);font-family:'Black Ops One';font-size:clamp(50px,10vw,115px);text-shadow:6px 6px 0 #111;opacity:0;pointer-events:none}.flash{animation:flash 1s ease}.hitflash{animation:screenHit .12s}@keyframes flash{0%{opacity:0;transform:translate(-50%,-50) scale(.4) rotate(-3deg)}20%,65%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-3deg)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.15)}}@keyframes screenHit{50%{filter:brightness(2) contrast(.7);transform:translate(5px,-3px)}}
@media(max-width:700px),(pointer:coarse){.topbar{height:110px;padding:12px 3%;grid-template-columns:1fr 70px 1fr;gap:6px}.player{grid-template-columns:42px 1fr;gap:5px}.portrait{width:42px;height:42px}.name{font-size:14px}.time{font-size:39px}.controls{display:none}.mobileControls{display:flex}.roundPips{margin-top:1px}.healthWrap{height:18px}.tag{font-size:15px}.logo{text-shadow:4px 4px 0 #a51d1c,8px 8px 0 #000}}
</style>
</head>
<body>
<div id="game"><canvas id="canvas"></canvas>
<div class="topbar"><div class="player"><div class="portrait"></div><div><div class="name">KAITO</div><div class="healthWrap"><div class="health" id="pHealth"></div></div><div class="roundPips" id="pPips"><i class="pip"></i><i class="pip"></i></div></div></div><div class="timer"><div class="round" id="roundLabel">ROUND 1</div><div class="time" id="time">60</div></div><div class="player right"><div class="portrait"></div><div><div class="name">RAI</div><div class="healthWrap"><div class="health" id="eHealth"></div></div><div class="roundPips" id="ePips"><i class="pip"></i><i class="pip"></i></div></div></div></div>
<div id="message">FIGHT!</div>
<div id="intro"><div class="logo">KARATE<span>CHAMPION</span></div><div class="tag">DOJO FINALS • TOKYO</div><button class="btn" id="start">ENTER THE DOJO</button></div>
<div id="pause" class="hidden"><div class="logo" style="font-size:70px">PAUSED</div><button class="btn" id="resume">CONTINUE</button></div>
<div id="result" class="hidden"><div class="logo" id="resultTitle">VICTORY</div><div class="tag" id="resultSub">CHAMPION OF THE DOJO</div><button class="btn" id="again">FIGHT AGAIN</button></div>
<div class="controls"><div class="controlLegend"><span class="key">A D</span>MOVE</div><div class="controlLegend"><span class="key">W</span>JUMP</div><div class="controlLegend"><span class="key">S</span>BLOCK</div><div class="controlLegend"><span class="key">J</span>PUNCH</div><div class="controlLegend"><span class="key">K</span>KICK</div><div class="controlLegend"><span class="key">L</span>SPECIAL</div></div>
<div class="mobileControls"><div class="pad"><button class="touch" data-key="a">◀</button><button class="touch" data-key="d">▶</button><button class="touch small" data-key="w">▲</button></div><div class="actions"><button class="touch small" data-key="s">DEF</button><button class="touch attack" data-key="j">P</button><button class="touch attack" data-key="k">K</button><button class="touch attack" data-key="l">龍</button></div></div></div>
<script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');let W,H,scale;
function resize(){W=canvas.width=innerWidth*devicePixelRatio;H=canvas.height=innerHeight*devicePixelRatio;scale=Math.min(W/innerWidth,H/innerHeight);ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',resize);resize();
const keys={}, particles=[];let running=false,paused=false,roundOver=false,round=1,timeLeft=60,last=0,aiThink=0,shake=0;
const p={x:310,y:0,vx:0,vy:0,w:58,h:145,hp:100,face:1,action:'idle',actionT:0,block:false,combo:0,special:100,wins:0,hit:0};
const e={x:850,y:0,vx:0,vy:0,w:58,h:145,hp:100,face:-1,action:'idle',actionT:0,block:false,combo:0,special:100,wins:0,hit:0};
function resetFight(){p.x=Math.max(180,W/devicePixelRatio*.28);e.x=Math.min(W/devicePixelRatio*.72,W/devicePixelRatio-180);p.y=e.y=0;p.vx=e.vx=p.vy=e.vy=0;p.hp=e.hp=100;p.action=e.action='idle';p.face=1;e.face=-1;p.block=e.block=false;timeLeft=60;roundOver=false;aiThink=0;updateBars();document.getElementById('roundLabel').textContent='ROUND '+round;announce('FIGHT!')}
function updateBars(){document.getElementById('pHealth').style.width=p.hp+'%';document.getElementById('eHealth').style.width=e.hp+'%';document.getElementById('time').textContent=String(Math.max(0,Math.ceil(timeLeft)));for(let i=0;i<2;i++){document.querySelectorAll('#pPips .pip')[i]?.classList.toggle('won',i<p.wins);document.querySelectorAll('#ePips .pip')[i]?.classList.toggle('won',i<e.wins)}}
function announce(txt){const m=document.getElementById('message');m.textContent=txt;m.classList.remove('flash');void m.offsetWidth;m.classList.add('flash')}
function startGame(){document.getElementById('intro').classList.add('hidden');document.getElementById('result').classList.add('hidden');round=1;p.wins=e.wins=0;resetFight();running=true;paused=false;last=performance.now();requestAnimationFrame(loop)}
function attack(a,type){if(!running||paused||roundOver||a.actionT>0)return;const isP=a===p;const spec=type==='special';if(spec&&a.special<100)return;a.action=type;a.actionT=spec?.55:type==='kick'?.38:.28;a.block=false;if(spec){a.special=0;for(let i=0;i<22;i++)particles.push({x:a.x+a.face*35,y:80+Math.random()*70,vx:a.face*(2+Math.random()*5),vy:(Math.random()-.5)*4,life:30,c:'#efc44f'})}}
function doAttack(a,b){if(a.action==='idle'||a.actionT<=0)return;const type=a.action,range=type==='special'?155:type==='kick'?112:90,power=type==='special'?24:type==='kick'?15:10;if(Math.abs(a.x-b.x)<range&&Math.sign(b.x-a.x)===a.face||Math.abs(a.x-b.x)<range&&a.action==='special'){let dmg=power;b.hit=.12;if(b.block)dmg*=.28;b.hp=Math.max(0,b.hp-dmg);b.vx=a.face*(b.block?2:type==='special'?10:5);if(dmg>11)b.action='hit',b.actionT=.22;shake=type==='special'?10:5;a.special=Math.min(100,a.special+(type==='special'?0:18));spawnHit(b.x,b.y||80,a.action==='special');updateBars();if(b.hp<=0)endRound(a)}}
function spawnHit(x,y,special=false){for(let i=0;i<(special?18:9);i++)particles.push({x,y:y+Math.random()*70,vx:(Math.random()-.5)*9,vy:(Math.random()-.5)*7,life:20+Math.random()*15,c:special?'#f4cf58':'#f1eee2'})}
function endRound(winner){roundOver=true;winner.wins++;updateBars();announce(winner===p?'K.O.!':'K.O.!');setTimeout(()=>{if(winner.wins>=2){running=false;document.getElementById('resultTitle').textContent=winner===p?'VICTORY':'DEFEAT';document.getElementById('resultSub').textContent=winner===p?'CHAMPION OF THE DOJO':'RAI CLAIMS THE TITLE';document.getElementById('result').classList.remove('hidden')}else{round++;resetFight()}},1700)}
function ai(){aiThink-=1/60;if(aiThink>0)return;aiThink=.12+Math.random()*.22;const dist=e.x-p.x;const ad=Math.abs(dist);e.face=dist>0?1:-1;if(ad>115){e.vx=e.face*(e.face*(p.x-e.x)>0?2.8:-1)}else if(ad<65&&Math.random()<.3)e.vx=-e.face*2;else e.vx*=.4;if(p.action==='punch'||p.action==='kick'||p.action==='special'){if(Math.random()<.55)e.block=true;else e.block=false}else e.block=false;if(ad<105&&Math.random()<.38)attack(e,Math.random()<.55?'kick':Math.random()<.25?'special':'punch');if(ad>150&&Math.random()<.2)e.vy=-11}
function update(dt){if(!running||paused)return;if(!roundOver){p.block=keys.s||false;e.block=false;for(const [a,code,left,right,jump] of [[p,'p','a','d','w']]){}if(keys.a)p.vx-=.9;if(keys.d)p.vx+=.9;if(keys.w&&p.y===0)p.vy=-12;p.vx*=.82;if(keys.j){attack(p,'punch');keys.j=false}if(keys.k){attack(p,'kick');keys.k=false}if(keys.l){attack(p,'special');keys.l=false}p.vx=Math.max(-6,Math.min(6,p.vx));
for(const a of [p,e]){a.x+=a.vx;a.y+=a.vy;if(a.y<0)a.vy+=.75;if(a.y>=0){a.y=0;a.vy=0}a.actionT-=dt;a.hit=Math.max(0,a.hit-dt);if(a.actionT<=0){a.action='idle';a.actionT=0}a.special=Math.min(100,a.special+.06)}
const pw=W/devicePixelRatio;p.x=Math.max(85,Math.min(pw-85,p.x));e.x=Math.max(85,Math.min(pw-85,e.x));if(Math.abs(p.x-e.x)<65){const mid=(p.x+e.x)/2;if(p.x<e.x){p.x=mid-32;e.x=mid+32}else{p.x=mid+32;e.x=mid-32}}p.face=p.x<=e.x?1:-1;e.face=e.x<=p.x?1:-1;ai();doAttack(p,e);doAttack(e,p);timeLeft-=dt;document.getElementById('time').textContent=String(Math.max(0,Math.ceil(timeLeft)));if(timeLeft<=0){roundOver=true;if(p.hp>=e.hp)p.wins++;else e.wins++;updateBars();setTimeout(()=>{if(p.wins>=2||e.wins>=2){running=false;document.getElementById('resultTitle').textContent=p.wins>=2?'VICTORY':'DEFEAT';document.getElementById('resultSub').textContent=p.wins>=2?'CHAMPION OF THE DOJO':'RAI CLAIMS THE TITLE';document.getElementById('result').classList.remove('hidden')}else{round++;resetFight()}},1500)}}
for(let i=particles.length-1;i>=0;i--){let q=particles[i];q.x+=q.vx;q.y+=q.vy;q.vy+=.12;q.life--;if(q.life<=0)particles.splice(i,1)}shake*=.8}
function floorY(){return H/devicePixelRatio*.76}
function drawFighter(a,isPlayer){const sx=a.x,sy=floorY()+a.y,dir=a.face,ground=sy;ctx.save();ctx.translate(sx,ground);ctx.scale(dir,1);if(a.hit>0)ctx.rotate(.08);ctx.lineCap='round';ctx.lineJoin='round';
// shadow
ctx.save();ctx.scale(dir,1);ctx.fillStyle='#2c302b55';ctx.beginPath();ctx.ellipse(0,4,52,9,0,0,7);ctx.fill();ctx.restore();
const crouch=a.block?18:0,bending=a.action==='hit'?-.12:0;
ctx.rotate(bending);
// gi legs
ctx.strokeStyle='#eee7d4';ctx.lineWidth=27;ctx.beginPath();ctx.moveTo(-10,-72-crouch);ctx.lineTo(-24,-42);ctx.lineTo(-18,-6);ctx.stroke();ctx.beginPath();ctx.moveTo(10,-72-crouch);ctx.lineTo(24,-42);ctx.lineTo(30,-6);ctx.stroke();ctx.strokeStyle='#4f5553';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-37,-5);ctx.lineTo(-10,-5);ctx.moveTo(14,-5);ctx.lineTo(43,-5);ctx.stroke();
// torso
ctx.fillStyle=isPlayer?'#ece5cf':'#f1eddf';ctx.beginPath();ctx.moveTo(-31,-125+crouch);ctx.lineTo(27,-125+crouch);ctx.lineTo(36,-70-crouch);ctx.lineTo(-36,-70-crouch);ctx.closePath();ctx.fill();ctx.strokeStyle='#b5aa8d';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle=isPlayer?'#b52f29':'#30363a';ctx.fillRect(-31,-73-crouch,67,9);
// belt
ctx.fillStyle=isPlayer?'#dfc25b':'#d2b255';ctx.fillRect(-38,-81-crouch,76,12);ctx.fillRect(18,-78-crouch,18,22);
// head
ctx.fillStyle='#bc805e';ctx.beginPath();ctx.arc(0,-145+crouch,25,0,7);ctx.fill();ctx.fillStyle=isPlayer?'#20242a':'#d7d9d5';ctx.beginPath();ctx.arc(-2,-153+crouch,25,Math.PI,Math.PI*2);ctx.lineTo(22,-147+crouch);ctx.closePath();ctx.fill();ctx.fillStyle='#111';ctx.fillRect(12,-146+crouch,7,3);
// arms
let armY=-116+crouch,attack=a.action==='punch'||a.action==='kick'||a.action==='special';ctx.strokeStyle=isPlayer?'#ece5cf':'#f1eddf';ctx.lineWidth=20;ctx.beginPath();ctx.moveTo(-28,armY);ctx.lineTo(-43,-88-crouch);ctx.stroke();ctx.beginPath();ctx.moveTo(27,armY);if(a.action==='punch')ctx.lineTo(82,-112+crouch);else if(a.action==='special')ctx.lineTo(105,-130+crouch);else if(a.block)ctx.lineTo(18,-150+crouch);else ctx.lineTo(43,-90-crouch);ctx.stroke();ctx.strokeStyle='#bc805e';ctx.lineWidth=18;ctx.beginPath();if(a.action==='punch')ctx.moveTo(82,-112+crouch),ctx.lineTo(108,-112+crouch);else if(a.action==='special')ctx.moveTo(105,-130+crouch),ctx.lineTo(125,-130+crouch);else if(a.block)ctx.moveTo(18,-150+crouch),ctx.lineTo(38,-150+crouch);else ctx.moveTo(43,-90-crouch),ctx.lineTo(50,-82-crouch);ctx.stroke();ctx.restore();
}
function draw(){let vw=W/devicePixelRatio,vh=H/devicePixelRatio;ctx.save();if(shake)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
// sky
let g=ctx.createLinearGradient(0,0,0,vh);g.addColorStop(0,'#b8cfcb');g.addColorStop(.55,'#d9d3b7');g.addColorStop(1,'#d8c69a');ctx.fillStyle=g;ctx.fillRect(-20,-20,vw+40,vh+40);
// distant mountains
ctx.fillStyle='#728b86';ctx.beginPath();ctx.moveTo(0,vh*.48);for(let x=-40;x<vw+80;x+=120){ctx.lineTo(x,vh*.48-Math.sin(x*.01)*35-45);ctx.lineTo(x+70,vh*.48-110)}ctx.lineTo(vw,vh*.48);ctx.closePath();ctx.fill();ctx.fillStyle='#edf0df88';ctx.beginPath();ctx.moveTo(0,vh*.47);ctx.quadraticCurveTo(vw*.25,vh*.37,vw*.5,vh*.47);ctx.quadraticCurveTo(vw*.75,vh*.38,vw,vh*.46);ctx.lineTo(vw,vh*.54);ctx.lineTo(0,vh*.54);ctx.fill();
// dojo
ctx.fillStyle='#463e35';ctx.fillRect(0,vh*.53,vw,vh*.23);ctx.fillStyle='#8d3029';ctx.fillRect(0,vh*.51,vw,18);ctx.fillStyle='#18191a';ctx.fillRect(vw*.08,vh*.55,vw*.84,3);
for(let x=vw*.1;x<vw*.9;x+=90){ctx.fillStyle='#292521';ctx.fillRect(x,vh*.57,9,vh*.19);ctx.fillStyle='#c9bba1';ctx.fillRect(x+2,vh*.58,5,vh*.17)}ctx.fillStyle='#23282a';ctx.fillRect(vw*.44,vh*.56,vw*.12,vh*.2);ctx.fillStyle='#b3a17f';ctx.fillRect(vw*.445,vh*.565,vw*.11,vh*.18);
// torii structure
ctx.fillStyle='#651f1b';ctx.fillRect(vw*.5-8,vh*.34,16,vh*.18);ctx.fillRect(vw*.5-105,vh*.31,210,13);ctx.fillRect(vw*.5-130,vh*.27,260,18);ctx.fillStyle='#d5b56b';ctx.fillRect(vw*.5-92,vh*.33,184,5);
// floor
ctx.fillStyle='#bdb38f';ctx.fillRect(0,vh*.76,vw,vh*.24);ctx.fillStyle='#d8cba4';for(let y=vh*.76;y<vh;y+=32){ctx.fillRect(0,y,vw,3)}for(let x=0;x<vw;x+=100){ctx.fillRect(x,vh*.76,3,vh*.24)}
// banner
ctx.fillStyle='#8e2d28';ctx.beginPath();ctx.moveTo(vw*.04,vh*.57);ctx.lineTo(vw*.04+62,vh*.57);ctx.lineTo(vw*.04+55,vh*.67);ctx.lineTo(vw*.04+31,vh*.64);ctx.lineTo(vw*.04+8,vh*.67);ctx.closePath();ctx.fill();ctx.fillStyle='#eee0b5';ctx.font="800 22px Barlow Condensed";ctx.fillText("空 手",vw*.04+10,vh*.61);
ctx.restore();drawFighter(p,true);drawFighter(e,false);ctx.save();for(const q of particles){ctx.globalAlpha=Math.min(1,q.life/8);ctx.fillStyle=q.c;ctx.fillRect(q.x,q.y,4,4)}ctx.restore();}
function loop(t){const dt=Math.min(.032,(t-last)/1000||.016);last=t;update(dt);draw();if(running)requestAnimationFrame(loop)}
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='escape'&&running){paused=!paused;document.getElementById('pause').classList.toggle('hidden',!paused)}});addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
document.querySelectorAll('.touch').forEach(b=>{const k=b.dataset.key;b.addEventListener('pointerdown',ev=>{ev.preventDefault();keys[k]=true});b.addEventListener('pointerup',()=>keys[k]=false);b.addEventListener('pointerleave',()=>keys[k]=false)});
document.getElementById('start').onclick=startGame;document.getElementById('again').onclick=startGame;document.getElementById('resume').onclick=()=>{paused=false;document.getElementByById('pause').classList.add('hidden')};draw();
</script>
</body></html>
