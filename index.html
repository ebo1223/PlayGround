<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Formula Racing</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#111;font-family:Arial,Helvetica,sans-serif;color:#fff}canvas{display:block;width:100%;height:100%}.hud{position:absolute;inset:0;pointer-events:none}.topbar{position:absolute;top:18px;left:24px;right:24px;height:76px;display:flex;justify-content:space-between;align-items:flex-start}.position{font-style:italic}.position strong{font-size:54px;line-height:.85}.position span{font-size:18px;color:#aaa}.lap{border-left:3px solid #e10600;padding-left:12px;font-size:13px;line-height:1.55;color:#aaa}.lap b{color:#fff;font-size:18px}.timer{text-align:right;font-size:13px;line-height:1.55;color:#aaa}.timer b{display:block;color:#fff;font-size:24px;font-family:'Courier New',monospace}.rank{position:absolute;right:24px;top:120px;width:230px}.rank div{display:grid;grid-template-columns:28px 1fr 58px;height:30px;align-items:center;font-size:12px;padding:0 8px;color:#ddd}.rank div.active{background:#e10600;color:#fff}.rank i{font-style:normal;color:#aaa}.rank div.active i{color:#fff}.speedo{position:absolute;bottom:25px;left:50%;transform:translateX(-50%);width:210px;text-align:center}.speedo .gear{font-size:62px;font-weight:900;font-style:italic;line-height:.85}.speedo .kmh{font-size:14px;color:#aaa}.bar{display:flex;gap:3px;height:5px;margin:10px 4px 0}.bar i{flex:1;background:#333}.bar i.on{background:#fff}.bar i.red{background:#e10600}.message{position:absolute;top:30%;left:50%;transform:translate(-50%,-50%);text-align:center;text-shadow:0 3px 12px #000;opacity:0}.message.show{animation:blink 3s ease forwards}@keyframes blink{0%,70%,100%{opacity:0}10%,60%{opacity:1}}.message h1{font-size:72px;margin:0;font-style:italic;line-height:.9}.message p{letter-spacing:5px;margin:12px 0}.controls{position:absolute;left:24px;bottom:24px;font-size:11px;color:#aaa;line-height:1.8}.controls kbd{color:#fff;border:1px solid #777;border-radius:3px;padding:2px 5px;margin-right:4px}.menu{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(90deg,rgba(0,0,0,.76),rgba(0,0,0,.08));pointer-events:auto}.menu.hidden{display:none}.card{margin-left:-38%;width:390px}.card h1{font-size:64px;line-height:.82;font-style:italic;margin:0 0 28px}.card h1 em{color:#e10600;font-style:italic}.card p{color:#aaa;font-size:13px;letter-spacing:2px}.card button{border:0;background:#e10600;color:#fff;font-weight:bold;font-size:15px;padding:15px 28px;cursor:pointer;transform:skew(-8deg)}.card button span{display:inline-block;transform:skew(8deg)}@media(max-width:700px){.rank{display:none}.topbar{left:12px;right:12px}.controls{display:none}.card{margin:0;width:80%;text-align:center}.card h1{font-size:48px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="hud">
  <div class="topbar"><div class="position"><strong id="pos">1</strong> <span>/ 6</span></div><div class="lap">LAP<br><b id="lap">1</b> / 3</div><div class="timer">CURRENT LAP<b id="time">00:00.000</b></div></div>
  <div class="rank" id="rank"></div><div class="message" id="message"><h1>RACE START</h1><p>LIGHTS OUT</p></div>
  <div class="speedo"><div class="gear" id="gear">1</div><div class="kmh"><b id="speed">0</b> KM/H</div><div class="bar" id="bar"></div></div>
  <div class="controls"><kbd>W</kbd> THROTTLE &nbsp; <kbd>S</kbd> BRAKE &nbsp; <kbd>A</kbd><kbd>D</kbd> STEER</div>
</div>
<div class="menu" id="menu"><div class="card"><p>MONACO NIGHT GRAND PRIX</p><h1>FORMULA <em>RACING</em></h1><button id="start"><span>START RACE</span></button></div></div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
let W,H,DPR;function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase()))e.preventDefault()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
const track=[{x:.13,y:.72},{x:.30,y:.84},{x:.55,y:.80},{x:.73,y:.65},{x:.86,y:.50},{x:.77,y:.32},{x:.58,y:.25},{x:.42,y:.32},{x:.32,y:.48},{x:.20,y:.47},{x:.12,y:.58}];
function trackPoint(t){t=((t%1)+1)%1;let n=track.length,i=Math.floor(t*n)%n,f=t*n-i,a=track[i],b=track[(i+1)%n];return{x:a.x+(b.x-a.x)*f,y:a.y+(b.y-a.y)*f,angle:Math.atan2(b.y-a.y,b.x-a.x)}}
function catmull(t){t=((t%1)+1)%1;let n=track.length,s=t*n,i=Math.floor(s)%n,f=s-i,p0=track[(i-1+n)%n],p1=track[i],p2=track[(i+1)%n],p3=track[(i+2)%n];let h= h=>{let h2=h*h,h3=h2*h;return{x:.5*((2*p1.x)+(-p0.x+p2.x)*h+(2*p0.x-5*p1.x+4*p2.x-p3.x)*h2+(-p0.x+3*p1.x-3*p2.x+p3.x)*h3),y:.5*((2*p1.y)+(-p0.y+p2.y)*h+(2*p1.y-5*p1.y+4*p2.y-p3.y)*h2)}};let x=.5*((2*p1.x)+(-p0.x+p2.x)*f+(2*p0.x-5*p1.x+4*p2.x-p3.x)*f*f+(-p0.x+3*p1.x-3*p2.x+p3.x)*f*f*f);let y=.5*((2*p1.y)+(-p0.y+p2.y)*f+(2*p0.y-5*p1.y+4*p2.y-p3.y)*f*f+(-p0.y+3*p1.y-3*p2.y+p3.y)*f*f*f);let d=.006,xa=.5*((2*p1.x)+(-p0.x+p2.x)*(f+d)+(2*p0.x-5*p1.x+4*p2.x-p3.x)*(f+d)*(f+d)+(-p0.x+3*p1.x-3*p2.x+p3.x)*(f+d)*(f+d)*(f+d));let ya=.5*((2*p1.y)+(-p0.y+p2.y)*(f+d)+(2*p0.y-5*p1.y+4*p2.y-p3.y)*(f+d)*(f+d)+(-p0.y+3*p1.y-3*p2.y+p3.y)*(f+d)*(f+d)*(f+d));return{x,y,angle:Math.atan2(ya-y,xa-x)}}
let running=false,lap=1,startTime=0,lastLap=0,bestLap=0;
const player={t:.02,x:0,y:0,a:0,speed:0,lateral:0,color:'#e10600',name:'YOU'};
const colors=['#00a3e0','#ff8700','#64c47b','#a14fce','#ffffff','#d6b55a'];const racers=[];for(let i=0;i<5;i++){racers.push({t:.02-(i+1)*.012-.002*i,x:0,y:0,a:0,speed:45+i*2,lateral:(i%2?1:-1)*(18+i*2),color:colors[i+1],name:['VER','NOR','LEC','SAI','PIA'][i],lane:i%2?.006:-.006,pace:.05+i*.002})}
function reset(){lap=1;player.t=.02;player.speed=0;player.lateral=0;startTime=performance.now();lastLap=0;running=true;for(let i=0;i<racers.length;i++){racers[i].t=.02-(i+1)*.012;racerUpdate(racers[i])}document.getElementById('menu').classList.add('hidden');document.getElementById('message').className='message show'}
document.getElementById('start').onclick=reset;
function racerUpdate(r){let p=catmull(r.t);r.x=p.x;r.y=p.y;r.a=p.angle;r.t+=r.pace||.002}
const rankNames=['YOU','VER','NOR','LEC','SAI','PIA'];
function drawTrack(){ctx.fillStyle='#183a20';ctx.fillRect(0,0,W,H);ctx.fillStyle='#225b2d';for(let i=0;i<140;i++){let x=(i*137%W),y=(i*83%H);ctx.globalAlpha=.12;ctx.fillRect(x,y,50,18)}ctx.globalAlpha=1;
  ctx.lineJoin='round';ctx.lineCap='round';ctx.beginPath();for(let i=0;i<=240;i++){let p=catmull(i/240),x=p.x*W,y=p.y*H;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.closePath();ctx.strokeStyle='#22272b';ctx.lineWidth=Math.min(W,H)*.22;ctx.stroke();ctx.strokeStyle='#b7b1a6';ctx.lineWidth=Math.min(W,H)*.205;ctx.stroke();ctx.strokeStyle='#303438';ctx.lineWidth=Math.min(W,H)*.18;ctx.stroke();
  ctx.beginPath();for(let i=0;i<=240;i++){let p=catmull(i/240),x=p.x*W,y=p.y*H;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.closePath();ctx.strokeStyle='#4d5357';ctx.lineWidth=Math.min(W,H)*.012;ctx.setLineDash([14,14]);ctx.stroke();ctx.setLineDash([]);
  ctx.save();let p=catmull(.02);ctx.translate(p.x*W,p.y*H);ctx.rotate(p.angle);ctx.fillStyle='#eee';for(let i=-8;i<8;i++){ctx.fillStyle=(i%2?0:1)?'#111':'#eee';ctx.fillRect(-70+i*10,-15,10,30)}ctx.restore();}
function drawCar(r,main=false){ctx.save();ctx.translate(r.x*W,r.y*H);ctx.rotate(r.a);ctx.rotate(main?r.lateral*.002:0);ctx.fillStyle='rgba(0,0,0,.45)';ctx.beginPath();ctx.ellipse(2,4,18,9,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=r.color;ctx.beginPath();ctx.moveTo(14,0);ctx.lineTo(9,-10);ctx.lineTo(-12,-8);ctx.lineTo(-17,-5);ctx.lineTo(-17,5);ctx.lineTo(-12,8);ctx.lineTo(9,10);ctx.closePath();ctx.fill();ctx.fillStyle='#111';ctx.fillRect(-10,-12,7,24);ctx.fillRect(8,-12,7,24);ctx.fillRect(-14,-4,28,8);ctx.fillStyle=main?'#fff':'#ddd';ctx.fillRect(-5,-4,7,8);ctx.restore()}
function distanceToTrack(){let p=catmull(player.t);let dx=(player.x-p.x)*W,dy=(player.y-p.y)*H;return Math.sqrt(dx*dx+dy*dy)}
let prev=performance.now();function loop(now){let dt=Math.min(.033,(now-prev)/1000);prev=now;if(running){let throttle=keys.w||keys.arrowup,brake=keys.s||keys.arrowdown,turn=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0);if(throttle)player.speed+=55*dt;else player.speed-=20*dt;if(brake)player.speed-=95*dt;player.speed=Math.max(0,Math.min(330,player.speed));let steer=turn*(1.25-(player.speed/330)*.65)*dt*(.45+player.speed/220);player.t+=player.speed*.000018*dt*5.3;player.t+=steer*.025;let p=catmull(player.t);player.a=p.angle+turn*Math.min(.16,player.speed/1500);player.x=p.x+Math.cos(p.angle+Math.PI/2)*player.lateral/W*W*.0001;player.y=p.y+Math.sin(p.angle+Math.PI/2)*player.lateral/H*H*.0001;player.lateral+=steer*W*.00055;player.lateral*=.985;player.lateral=Math.max(-W*.11,Math.min(W*.11,player.lateral));let roadWidth=Math.min(W,H)*.09;if(distanceToTrack()>roadWidth)player.speed*=.985;let oldLap=Math.floor(player.t);if(player.t>=lap&&lap<3){lap++;lastLap=(now-startTime)/1000-(bestLap?0:0);if(lap===2){lastLap=(now-startTime)/1000;document.getElementById('lap').textContent=lap}}if(player.t>=3){running=false;document.querySelector('.message h1').textContent='RACE COMPLETE';document.querySelector('.message p').textContent='1ST PLACE';document.getElementById('message').className='message show';setTimeout(()=>document.getElementById('menu').classList.remove('hidden'),2500)}for(let r of racers){r.t+=r.pace*dt*(.7+r.speed/180);r.pace=.05+Math.sin(now*.001+r.lane*20)*.004;r.x=catmull(r.t).x;r.y=catmull(r.t).y;r.a=catmull(r.t).angle}updateHUD(now)}
 drawTrack();let visible=[player,...racers].sort((a,b)=>b.y-a.y);for(let r of visible)drawCar(r,r===player);requestAnimationFrame(loop)}requestAnimationFrame(loop);
function updateHUD(now){document.getElementById('speed').textContent=Math.round(player.speed);let gear=Math.max(1,Math.min(8,Math.ceil(player.speed/42)));document.getElementById('gear').textContent=gear;let ms=(now-startTime);let m=Math.floor(ms/60000),s=Math.floor(ms/1000)%60,mi=ms%1000;document.getElementById('time').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')+'.'+String(Math.floor(mi)).padStart(3,'0');let bars=document.getElementById('bar'),count=Math.ceil(player.speed/330*8);bars.innerHTML='';for(let i=0;i<8;i++){let x=document.createElement('i');if(i<count)x.className=i>6?'red':'on';bars.appendChild(x)}let all=[player,...racers].sort((a,b)=>b.t-a.t);let pos=all.indexOf(player)+1;document.getElementById('pos').textContent=pos;let html='';all.forEach((r,i)=>{html+=`<div class="${r===player?'active':''}"><i>${i+1}</i><b>${r.name}</b><span>${i===0?'LEADER':((r.t-player.t)*900).toFixed(1)}</span></div>`});document.getElementById('rank').innerHTML=html}
</script>
</body></html>
