<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Soccer Championship</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@600;700;800&display=swap');
:root{--yellow:#ffe600;--blue:#102b55;--cyan:#23a6d5}*{box-sizing:border-box}body{margin:0;background:#07101d;color:#fff;font-family:Inter,sans-serif;overflow:hidden}canvas{display:block;width:100vw;height:100vh}.hud{position:fixed;inset:0;pointer-events:none}.scoreboard{position:absolute;top:18px;left:50%;transform:translateX(-50%);display:flex;height:58px;filter:drop-shadow(0 8px 16px #0008)}.team-score{width:145px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-family:'Barlow Condensed';font-size:24px;font-weight:800}.team-score:first-child{background:#f5f7fa;color:#102b55;border-radius:9px 0 0 9px}.team-score:last-child{background:#12345f;border-radius:0 9px 9px 0}.team-name{font-size:18px}.team-score .num{font-size:38px}.clock{background:var(--yellow);color:#111;width:88px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Barlow Condensed';font-weight:800}.clock strong{font-size:26px;line-height:22px}.clock span{font-size:13px;letter-spacing:1px}.bottom{position:absolute;bottom:22px;left:24px;width:260px}.label{font-family:'Barlow Condensed';font-size:14px;color:#bdcbdc;letter-spacing:1px}.bar{height:8px;background:#ffffff22;border-radius:9px;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#20d69b,#ffe600);transition:.15s}.controls{position:absolute;right:24px;bottom:22px;display:flex;gap:12px;align-items:end}.round{pointer-events:auto;width:78px;height:78px;border:2px solid #ffffff55;border-radius:50%;background:#0b1a2aa8;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:800;letter-spacing:.5px;box-shadow:0 6px 18px #0008;touch-action:none}.round.shoot{width:94px;height:94px;background:#ffcc00;color:#14203a;border:0;font-size:15px}.overlay{position:absolute;inset:0;background:#07101ddd;display:flex;align-items:center;justify-content:center;pointer-events:auto;backdrop-filter:blur(8px)}.panel{text-align:center;width:min(520px,90vw)}.eyebrow{color:var(--yellow);font-family:'Barlow Condensed';font-size:16px;font-weight:800;letter-spacing:4px}.panel h1{font-family:'Barlow Condensed';font-size:72px;line-height:.85;margin:14px 0 22px;text-transform:uppercase}.panel h1 span{color:var(--yellow)}.panel p{color:#b9c7d8;margin:0 0 28px}.primary{border:0;border-radius:7px;background:var(--yellow);color:#101820;padding:15px 34px;font-weight:900;font-size:16px;cursor:pointer;box-shadow:0 8px 24px #ffe60033}.primary:active{transform:translateY(2px)}.hidden{display:none}.notice{position:absolute;top:104px;left:50%;transform:translateX(-50%);font-family:'Barlow Condensed';font-size:32px;font-weight:800;text-transform:uppercase;text-shadow:0 3px 12px #000}.touch-left{position:absolute;left:24px;bottom:24px;width:150px;height:150px;display:none;pointer-events:auto}.stick{width:150px;height:150px;border-radius:50%;border:2px solid #ffffff44;background:#0a172777;position:relative}.knob{position:absolute;width:64px;height:64px;border-radius:50%;background:#ffffff55;border:2px solid #fff8;left:43px;top:43px}.touch-action{display:none}@media(max-width:700px){.scoreboard{top:8px;height:48px}.team-score{width:104px;font-size:18px;padding:0 9px}.team-score .num{font-size:30px}.team-name{font-size:14px}.clock{width:70px}.clock strong{font-size:22px}.bottom{left:12px;bottom:12px;width:180px}.controls{display:none}.touch-left,.touch-action{display:block}.touch-action{position:absolute;right:18px;bottom:28px;width:100px;height:100px;border-radius:50%;pointer-events:auto;border:0;background:#ffcc00;color:#152039;font-weight:900}.panel h1{font-size:54px}}
</style></head>
<body>
<canvas id="game"></canvas>
<div class="hud">
  <div class="scoreboard"><div class="team-score"><span class="team-name">NORTH</span><span class="num" id="scoreA">0</span></div><div class="clock"><strong id="clock">02:00</strong><span>1ST</span></div><div class="team-score"><span class="num" id="scoreB">0</span><span class="team-name">UNITED</span></div></div>
  <div class="bottom"><div class="label">STAMINA</div><div class="bar"><i id="stamina"></i></div></div>
  <div class="notice" id="notice"></div>
  <div class="controls"><div class="round" id="passBtn">PASS</div><div class="round shoot" id="shootBtn">SHOOT</div></div>
  <div class="touch-left" id="touchStick"><div class="stick"><div class="knob" id="knob"></div></div></div><button class="touch-action" id="touchShoot">SHOOT</button>
  <div class="overlay" id="menu"><div class="panel"><div class="eyebrow">NATIONAL CUP</div><h1>SOCCER<br><span>CHAMPIONSHIP</span></h1><p>Outplay United in a fast two-minute match.</p><button class="primary" id="start">PLAY MATCH</button></div></div>
  <div class="overlay hidden" id="end"><div class="panel"><div class="eyebrow">FULL TIME</div><h1 id="result">VICTORY</h1><p id="finalScore">North 0 — 0 United</p><button class="primary" id="restart">PLAY AGAIN</button></div></div>
</div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');let W,H,dpr,keys={},game=false,time=120,last=0,scoreA=0,scoreB=0,noticeTimer=0;
const ball={x:0,y:0,vx:0,vy:0,r:10,owner:null};let players=[];const touch={x:0,y:0,active:false};
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function resetPositions(){players=[];for(let i=0;i<5;i++)players.push({team:0,x:W*(.25+i*.09),y:H*(.5+(i%2-.5)*.18),vx:0,vy:0,r:17,active:i===1});for(let i=0;i<5;i++)players.push({team:1,x:W*(.72-i*.09),y:H*(.5+(i%2-.5)*.18),vx:0,vy:0,r:17,active:false});ball.x=W/2;ball.y=H/2;ball.vx=0;ball.vy=0;ball.owner=players[1]}
function drawField(){ctx.fillStyle='#168447';ctx.fillRect(0,0,W,H);ctx.fillStyle='#1a9650';for(let x=0;x<W;x+=H*.16)ctx.fillRect(x,0,Math.min(H*.08,W-x),H);ctx.strokeStyle='#eaf3e9';ctx.globalAlpha=.88;ctx.lineWidth=3;ctx.strokeRect(W*.07,H*.12,W*.86,H*.76);ctx.beginPath();ctx.moveTo(W*.5,H*.12);ctx.lineTo(W*.5,H*.88);ctx.stroke();ctx.beginPath();ctx.arc(W*.5,H*.5,H*.095,0,7);ctx.stroke();ctx.beginPath();ctx.rect(W*.07,H*.34,W*.13,H*.32);ctx.stroke();ctx.beginPath();ctx.rect(W*.80,H*.34,W*.13,H*.32);ctx.stroke();ctx.beginPath();ctx.arc(W*.07,H*.5,H*.08,-Math.PI/2,Math.PI/2);ctx.stroke();ctx.beginPath();ctx.arc(W*.93,H*.5,H*.08,Math.PI/2,Math.PI*1.5);ctx.stroke();ctx.globalAlpha=1}
function drawPlayer(p){ctx.save();ctx.translate(p.x,p.y);ctx.shadowColor='#0008';ctx.shadowBlur=8;ctx.beginPath();ctx.arc(0,0,p.r,0,7);ctx.fillStyle=p.team?'#ef4b4b':'#eaf1f7';ctx.fill();ctx.shadowBlur=0;ctx.beginPath();ctx.arc(0,0,p.r*.68,0,7);ctx.fillStyle=p.team?'#b81d2e':'#2d6ba8';ctx.fill();ctx.fillStyle='#f7cc9b';ctx.beginPath();ctx.arc(0,-p.r*.55,p.r*.34,0,7);ctx.fill();if(p.active){ctx.strokeStyle='#ffe600';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,p.r+5,0,7);ctx.stroke()}ctx.restore()}
function drawBall(){ctx.save();ctx.translate(ball.x,ball.y);ctx.shadowColor='#0008';ctx.shadowBlur=8;ctx.beginPath();ctx.arc(0,0,ball.r,0,7);ctx.fillStyle='#fff';ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#213148';ctx.beginPath();ctx.moveTo(0,-5);ctx.lineTo(5,-1);ctx.lineTo(3,5);ctx.lineTo(-3,5);ctx.lineTo(-5,-1);ctx.closePath();ctx.fill();ctx.restore()}
function activePlayer(){return players.find(p=>p.team===0&&p.active)||players[0]}
function setNotice(s){document.getElementById('notice').textContent=s;noticeTimer=1.1}
function shoot(){if(!game)return;let p=ball.owner;if(p&&p.team===0){let dir=Math.atan2(H/2-p.y,W-p.x);ball.owner=null;ball.vx=Math.cos(dir)*560+100;ball.vy=Math.sin(dir)*560}}
function pass(){if(!game)return;let p=ball.owner;if(p&&p.team===0){let target=players.filter(q=>q.team===0&&q!==p).sort((a,b)=>Math.hypot(a.x-p.x,a.y-p.y)-Math.hypot(b.x-p.x,b.y-p.y))[0];if(target){ball.owner=null;ball.vx=(target.x-p.x)*2.4;ball.vy=(target.y-p.y)*2.4}}}
function update(dt){if(!game)return;time-=dt;if(time<=0){endGame();return}let p=activePlayer(),ax=0,ay=0;if(keys.ArrowLeft||keys.a)ax-=1;if(keys.ArrowRight||keys.d)ax+=1;if(keys.ArrowUp||keys.w)ay-=1;if(keys.ArrowDown||keys.s)ay+=1;if(touch.active){ax+=touch.x;ay+=touch.y}let mag=Math.hypot(ax,ay)||1;ax/=mag;ay/=mag;p.vx=ax*230;p.vy=ay*230;p.x+=p.vx*dt;p.y+=p.vy*dt;p.x=Math.max(W*.08,p.x);p.x=Math.min(W*.92,p.x);p.y=Math.max(H*.13,p.y);p.y=Math.min(H*.87,p.y);if(ball.owner===p){ball.x=p.x+20;ball.y=p.y}
players.forEach(q=>{if(q.team===0){if(q!==p){let dx=p.x-q.x,dy=p.y-q.y,d=Math.hypot(dx,dy)||1;if(d<110){q.vx=dx/d*55;q.vy=dy/d*55}else q.vx+=((W*(.18+q.x/W*.35))-q.x)*dt;q.vy+=(H/2-q.y)*dt*.7;q.x+=q.vx*dt;q.y+=q.vy*dt}}else{let target=ball.owner&&ball.owner.team===1?ball.owner:ball;let dx=target.x-q.x,dy=target.y-q.y,d=Math.hypot(dx,dy)||1;q.vx+=dx/d*85*dt;q.vy+=dy/d*85*dt;q.vx*=.94;q.vy*=.94;q.x+=q.vx;q.y+=q.vy}}
});
if(!ball.owner){ball.vx*=.985;ball.vy*=.985;ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;if(ball.x<W*.08||ball.x>W*.92){ball.vx=-ball.vx*.75};if(ball.y<H*.12||ball.y>H*.88){ball.vy=-ball.vy*.75}for(const q of players){if(Math.hypot(ball.x-q.x,ball.y-q.y)<q.r+ball.r){ball.owner=q;ball.vx=0;ball.vy=0;if(q.team===1&&q.x<W*.55)setNotice('TACKLE')}}}
if(ball.owner){for(const q of players)if(q.team===1&&Math.hypot(q.x-ball.owner.x,q.y-ball.owner.y)<q.r+ball.r+.02){}}
if(ball.x>W*.93&&ball.y>H*.34&&ball.y<H*.66){scoreA++;setNotice('GOAL!');resetPositions();ball.owner=players[1]}if(ball.x<W*.07&&ball.y>H*.34&&ball.y<H*.66){scoreB++;setNotice('GOAL!');resetPositions();ball.owner=players[1]}document.getElementById('scoreA').textContent=scoreA;document.getElementById('scoreB').textContent=scoreB;let sec=Math.max(0,Math.ceil(time));document.getElementById('clock').textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');document.getElementById('stamina').style.width=(100-Math.max(0,Math.abs(p.vx)+Math.abs(p.vy)-180)/2)+'%';if(noticeTimer>0){noticeTimer-=dt;if(noticeTimer<=0)document.getElementById('notice').textContent=''}}
function loop(t){let dt=Math.min((t-last)/1000,.033||0);last=t;drawField();update(dt);players.forEach(drawPlayer);drawBall();requestAnimationFrame(loop)}requestAnimationFrame(loop);
function startGame(){scoreA=0;scoreB=0;time=120;game=true;resetPositions();document.getElementById('menu').classList.add('hidden');document.getElementById('end').classList.add('hidden')}function endGame(){game=false;document.getElementById('result').textContent=scoreA>scoreB?'VICTORY':scoreA<scoreB?'DEFEAT':'DRAW';document.getElementById('finalScore').textContent=`North ${scoreA} — ${scoreB} United`;document.getElementById('end').classList.remove('hidden')}
document.getElementById('start').onclick=startGame;document.getElementById('restart').onclick=startGame;document.getElementById('shootBtn').onclick=shoot;document.getElementById('touchShoot').onclick=shoot;document.getElementById('passBtn').onclick=pass;addEventListener('keydown',e=>{keys[e.key.toLower]=1;if(e.key===' ')shoot();if(e.key==='Shift')pass()});addEventListener('keyup',e=>keys[e.key.toLower]=0);let stick=document.getElementById('touchStick'),knob=document.getElementById('knob');stick.addEventListener('pointerdown',e=>{touch.active=true;stick.setPointerCapture(e.pointerId)});stick.addEventListener('pointermove',e=>{if(!touch.active)return;let r=stick.getBoundingRect?stick.getBoundingRect():stick.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),m=Math.hypot(dx,dy)||1,scale=Math.min(43,m)/m;touch.x=dx/m;touch.y=dy/m;knob.style.left=(43+dx/m*scale)+'px';knob.style.top=(43+dy/m*scale)+'px'});stick.addEventListener('pointerup',()=>{touch.active=false;touch.x=0;touch.y=0;knob.style.left='43px';knob.style.top='43px'});
resetPositions();
</script>
</body></html>
