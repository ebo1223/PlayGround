<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ancient Egypt Mystery</title>
<style>
:root{--sand:#d7b873;--gold:#e4b84b;--ink:#20190e;--dark:#17170f;--blue:#4fa5a7}
*{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden;background:#130f09;color:#f8efda;font-family:Georgia,'Times New Roman',serif}
#game{height:100vh;position:relative;background:linear-gradient(#b5c8bc 0 19%,#d4ad69 19% 68%,#a66f3b 68%);}
.sun{position:absolute;right:9%;top:6%;width:70px;height:70px;border-radius:50%;background:#fff1ad;box-shadow:0 0 45px #ffe797}
.sky{position:absolute;inset:0 0 62% 0;overflow:hidden}.cloud{position:absolute;width:170px;height:18px;border-radius:50%;background:rgba(244,236,205,.55);filter:blur(1px)}.c1{left:12%;top:18%}.c2{left:48%;top:32%;width:230px}
.pyramid{position:absolute;bottom:31%;width:38%;height:40%;clip-path:polygon(50% 0,100% 100%,0 100%);background:linear-gradient(125deg,#ead69b 0 50%,#b99256 51%)}.pyramid.left{left:-9%}.pyramid.mid{left:25%;height:43%;bottom:32%;opacity:.88}.pyramid.right{right:-10%;height:33%;bottom:32%;opacity:.75}
.temple{position:absolute;left:0;right:0;bottom:18%;height:22%;background:linear-gradient(90deg,#6f4a29,#ba9060 15%,#805833 15% 18%,#b18d5a 18% 82%,#805833 82% 85%,#694527);border-top:8px solid #d2ad70}.columns{position:absolute;bottom:18%;left:6%;right:6%;height:27%;display:flex;justify-content:space-around}.column{width:6.5%;background:linear-gradient(90deg,#73502e,#c79d61 35%,#80603c 78%,#5b4027);border:4px solid #ddb978;border-bottom:0;border-radius:3px 3px 0 0}.column:before{content:'';display:block;height:18px;margin:-10px -8px 0;background:#daba81;border:3px solid #80603c}
.floor{position:absolute;left:0;right:0;bottom:0;height:25%;background:linear-gradient(135deg,#9d743c 25%,#c79f61 25% 50%,#9d743c 50% 75%,#c79f61 75%);background-size:80px 80px;transform-origin:bottom;transform:perspective(300px) rotateX(5deg)}
header{position:absolute;z-index:20;top:18px;left:22px;right:22px;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:rgba(31,25,16,.88);border:2px solid #b8924e;clip-path:polygon(12px 0,calc(100% - 12px) 0,100% 12px,100% calc(100% - 12px),calc(100% - 12px) 100%,12px 100%,0 calc(100% - 12px),0 12px)}
.title small{display:block;font-size:11px;text-transform:uppercase;letter-spacing:4px;color:#d4bb83}.title b{font-size:25px;color:#f4dfaa}.status{display:flex;gap:10px}.pill{border:1px solid #806638;background:#282214;padding:8px 11px;font-size:13px;color:#dfc98e}.pill strong{color:#fff4c8}
#scene{position:absolute;inset:82px 0 118px 0}.hotspot{position:absolute;border:0;background:transparent;cursor:pointer;z-index:5}.hotspot:hover .halo,.hotspot:focus .halo{transform:translate(-50%,-50%) scale(1.15);opacity:1}.halo{position:absolute;left:50%;top:50%;width:54px;height:54px;transform:translate(-50%,-50%);border:2px solid rgba(255,224,136,.9);border-radius:50%;opacity:.7;box-shadow:0 0 18px #d8b55e,inset 0 0 12px rgba(255,226,146,.35);transition:.18s}.halo:after{content:'';position:absolute;width:8px;height:8px;left:21px;top:21px;border-radius:50%;background:#ffeaa7}.label{position:absolute;left:50%;top:62px;transform:translateX(-50%);white-space:nowrap;background:rgba(30,23,14,.92);border:1px solid #967742;padding:5px 8px;font-size:12px;opacity:0}.hotspot:hover .label{opacity:1}
#scarab{left:62%;top:67%;width:90px;height:90px}.scarab-icon{position:absolute;width:28px;height:38px;border-radius:50% 50% 45% 45%;background:#1d5e62;left:31px;top:25px;transform:rotate(-12deg);box-shadow:0 0 10px #65aaa5}.scarab-icon:before{content:'';position:absolute;width:38px;height:4px;left:-5px;top:18px;background:#183b3a}.scarab-icon:after{content:'';position:absolute;width:7px;height:30px;border-radius:50%;border-left:2px solid #183b3a;left:-7px;top:-1px;box-shadow:42px 0 0 -1px #183b3a}
#urn{left:25%;top:52%;width:90px;height:130px}.urn-icon{position:absolute;bottom:25px;left:22px;width:46px;height:58px;border-radius:42% 42% 35% 35%;background:#b85e33;border:3px solid #d49a55}.urn-icon:before{content:'';position:absolute;left:5px;top:-18px;width:30px;height:18px;border:4px solid #d49a55;border-radius:3px;background:#b85e33}.urn-icon:after{content:'𓂀';position:absolute;left:10px;top:13px;color:#edcf86;font-size:20px}
#tablet{left:46%;top:71%;width:100px;height:70px}.tablet-icon{position:absolute;width:68px;height:44px;left:16px;top:12px;background:#8e7044;border:5px solid #b18a4f;transform:rotate(-5deg);font-size:17px;text-align:center;padding-top:8px;color:#3c2a18}
#statue{right:10%;top:38%;width:100px;height:180px}.statue-icon{position:absolute;bottom:26px;left:32px;width:38px;height:105px;background:linear-gradient(90deg,#806c44,#b4a363,#716139);clip-path:polygon(32% 0,68% 0,82% 25%,100% 100%,0 100%,18% 25%)}.statue-icon:before{content:'';position:absolute;top:-48px;left:5px;width:28px;height:38px;border-radius:50% 50% 35% 35%;background:#a9955d}
#door{left:8%;top:34%;width:110px;height:170px}.door-icon{position:absolute;bottom:20px;left:24px;width:62px;height:120px;border:8px solid #9c7b48;background:#45351f;box-shadow:inset 0 0 0 5px #1a1710}.door-icon:after{content:'𓆣';font-size:42px;color:#bda66d;position:absolute;left:12px;top:22px}
#journal{position:absolute;z-index:30;left:18px;bottom:18px;width:330px;height:82px;background:rgba(31,25,16,.95);border:2px solid #a78548;padding:10px 12px}.slots{display:flex;gap:8px;margin-top:7px}.slot{width:46px;height:46px;border:1px dashed #7a683e;background:#18140e;display:grid;place-items:center;font-size:20px;color:#d8bc78}.slot.filled{border-style:solid;background:#332718}.slot .tiny{font-size:12px}
#deduce{position:absolute;z-index:31;right:18px;bottom:18px;height:82px;padding:14px 18px;background:#6f3925;border:2px solid #c49a52;color:#fff0c2;font-family:inherit;font-size:16px;cursor:pointer}.clues-count{display:block;font-size:11px;color:#d7bd82;margin-top:5px}
.panel{position:absolute;z-index:40;left:50%;top:50%;transform:translate(-50%,-50%) scale(.96);width:min(520px,calc(100% - 40px));background:#241e13;border:3px solid #b58a48;box-shadow:0 18px 70px rgba(0,0,0,.7);padding:22px;opacity:0;pointer-events:none;transition:.18s}.panel.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}.panel h2{margin:0 0 8px;color:#e7c879}.panel p{line-height:1.5;color:#e4d7b5}.close{position:absolute;right:10px;top:8px;border:0;background:none;color:#dfc98e;font-size:25px;cursor:pointer}.evidence{display:flex;align-items:center;gap:12px;border-top:1px solid #665536;margin-top:12px;padding-top:12px}.sigil{width:58px;height:58px;border:1px solid #8b7548;background:#17130d;display:grid;place-items:center;font-size:29px}.take{margin-left:auto;border:1px solid #b39252;background:#806038;color:white;padding:9px 12px;font-family:inherit;cursor:pointer}.take:disabled{opacity:.5}
#deduction{width:min(620px,calc(100% - 30px))}.suspects{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.suspect{border:1px solid #76643e;background:#17140e;padding:11px;text-align:center;cursor:pointer;color:#d8c69a}.suspect.selected{background:#5e4a2a;border-color:#dabd75}.suspect span{display:block;font-size:30px}.solve{width:100%;height:44px;border:1px solid #dab75d;background:#8a5c2b;color:#fff4ca;font-family:inherit;font-size:16px;cursor:pointer}
#toast{position:absolute;z-index:60;left:50%;top:96px;transform:translate(-50%,-20px);background:#2b2417;border:1px solid #c5a45f;color:#faedc6;padding:10px 16px;opacity:0;transition:.25s}.show{opacity:1!important;transform:translate(-50%,0)!important}
#end{position:absolute;z-index:70;inset:0;background:rgba(19,15,8,.93);display:none;place-items:center;text-align:center}.endcard{max-width:580px;padding:35px;border:2px solid #c59e53;background:#241d12}.endcard h1{color:#eccf82;font-size:44px;margin:.2em}.endcard button{border:1px solid #d8b35d;background:#70512e;color:#fff2c7;padding:12px 20px;font-family:inherit;font-size:16px;cursor:pointer}
@media(max-width:700px){header{left:8px;right:8px}.title b{font-size:18px}.status .pill:first-child{display:none}.pyramid.mid{left:18%}.columns{left:2%;right:2%}.column{width:8%}#journal{width:calc(100% - 150px)}#deduce{right:8px}.panel{max-height:70vh;overflow:auto}.suspects{grid-template-columns:repeat(3,1fr)} }
</style></head>
<body><div id="game">
<div class="sky"><div class="sun"></div><div class="cloud c1"></div><div class="cloud c2"></div></div>
<div class="pyramid left"></div><div class="pyramid mid"></div><div class="pyramid right"></div><div class="temple"></div><div class="columns"><div class="column"></div><div class="column"></div><div class="column"></div><div class="column"></div><div class="column"></div><div class="column"></div></div><div class="floor"></div>
<header><div class="title"><small>The Lost Tomb of</small><b>AMENHOTEP</b></div><div class="status"><div class="pill">DAY <strong id="day">1</strong></div><div class="pill">CLUES <strong id="count">0/5</strong></div></div></header>
<section id="scene">
<button class="hotspot" id="door" data-site="door"><span class="door-icon"></span><span class="halo"></span><span class="label">Sealed Entry</span></button>
<button class="hotspot" id="urn" data-site="urn"><span class="urn-icon"></span><span class="halo"></span><span class="label">Stone Offering Urn</span></button>
<button class="hotspot" id="tablet" data-site="tablet"><span class="tablet-icon">𓇋𓏏</span><span class="halo"></span><span class="label">Sun Tablet</span></button>
<button class="hotspot" id="scarab" data-site="scarab"><span class="scarab-icon"></span><span class="halo"></span><span class="label">Scarab Pedestal</span></button>
<button class="hotspot" id="statue" data-site="statue"><span class="statue-icon"></span><span class="halo"></span><span class="label">Guardian Statue</span></button>
</section>
<div id="journal"><small>DISCOVERED EVIDENCE</small><div class="slots"><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div></div></div>
<button id="deduce">DEDUCE THE TRAITOR <span class="clues-count">Accumulate 5 clues</span></button>
<div id="evidencePanel" class="panel"><button class="close">×</button><h2 id="ptitle"></h2><p id="ptext"></p><div class="evidence"><div class="sigil" id="psigil"></div><div><b id="pname"></b><br><small id="pdesc"></small></div><button class="take" id="take">Add to journal</button></div></div>
<div id="deduction" class="panel"><button class="close">×</button><h2>Choose the tomb’s traitor</h2><p>Who broke the royal seal and awakened the curse?</p><div class="suspects"><button class="suspect" data-name="Scribe Khepri"><span>𓂀</span>Scribe Khepri</button><button class="suspect" data-name="Priestess Nefru"><span>𓆣</span>Priestess Nefru</button><button class="suspect" data-name="Architect Senen"><span>𓊹</span>Architect Senen</button></div><button class="solve">Seal my accusation</button></div>
<div id="toast"></div>
<div id="end"><div class="endcard"><small>THE TOMB FALLS SILENT</small><h1 id="endtitle"></h1><p id="endtext"></p><button onclick="location.reload()">Begin another investigation</button></div></div>
</div>
<script>
const clues={door:['THE GATE RUNE','The royal seal is broken only from inside. Fresh ochre dust lies beneath a hidden lever.','𓆣','Gate Rune','The same scarlet pigment was found throughout the tomb.'],urn:['THE EMPTY URN','The offering urn holds an amber amulet—yet the lid is marked with a scribe’s reed.','𓂀','Amber Amulet','Its cord bears the crease of a priest’s ceremonial linen.'],tablet:['THE SUN TABLET','A missing sun disk is hidden by false hieroglyphs. The phrase means “one man knew.”','☉','Sun Tablet','A date code matches the tomb’s final construction inspection.'],scarab:['THE BLUE SCARAB','This brass beetle is warm. A concealed map is stamped with the architect’s square.','𓆣','Blue Scarab','The map reveals a secret passage below the east column.'],statue:['THE GUARDIAN’S TEST','The statue turns toward the east passage. Three boot prints stop where the floor is newly cut.','𓃭','Broken Chisel','Its flint edge matches marks around the hidden passage.']};
let found=[];let selected=null;
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1800)}
document.querySelectorAll('.hotspot').forEach(b=>b.onclick=()=>{const k=b.dataset.site,d=clues[k];document.getElementById('ptitle').textContent=d[0];document.getElementById('ptext').textContent=d[1];document.getElementById('psigil').textContent=d[2];document.getElementById('pname').textContent=d[3];document.getElementById('pdesc').textContent=d[4];const take=document.getElementById('take');take.disabled=found.includes(k);take.textContent=found.includes(k)?'In your journal':'Add to journal';take.onclick=()=>{if(found.includes(k))return;found.push(k);take.disabled=true;take.textContent='In your journal';update();toast(d[3]+' recorded');};document.getElementById('evidencePanel').classList.add('open')});
document.querySelectorAll('.close').forEach(b=>b.onclick=()=>b.closest('.panel').classList.remove('open'));
function update(){document.getElementById('count').textContent=found.length+'/5';found.forEach((k,i)=>{const s=document.querySelectorAll('.slot')[i];s.classList.add('filled');s.textContent=clues[k][2];s.title=clues[k][3]})}
document.getElementById('deduce').onclick=()=>{document.getElementById('deduction').classList.add('open')};
document.querySelectorAll('.suspect').forEach(s=>s.onclick=()=>{document.querySelectorAll('.suspect').forEach(x=>x.classList.remove('selected'));s.classList.add('selected');selected=s.dataset.name});
document.querySelector('.solve').onclick=()=>{if(found.length<5){toast('You still need '+(5-found.length)+' clue'+(5-found.length===1?'':'s'));return}if(!selected){toast('Select a suspect');return}const end=document.getElementById('end');document.getElementById('endtitle').textContent=selected==='Architect Senen'?'MYSTERY SOLVED':'THE TRAITOR ESCAPED';document.getElementById('endtext').textContent=selected==='Architect Senen'?'Senen’s secret passage, the copied map, and the newly cut floor prove he broke the royal seal. The tomb is sealed once more—and history is preserved.':selected+' confessed after your accusation—but the evidence points elsewhere. Senen vanished through the east passage as the curse closed behind him.';end.style.display='grid'};
</script></body></html>
