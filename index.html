<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Space Invaders</title>
  <style>
    :root { --green:#a8ff78; --cyan:#78eaff; --pink:#ff6bb5; --ink:#070a12; }
    * { box-sizing:border-box; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#05070d; }
    body { font-family:"Courier New", monospace; color:#fff; }
    canvas { display:block; width:100%; height:100%; image-rendering:pixelated; }
    .shell { position:fixed; inset:0; display:grid; place-items:center; background:radial-gradient(circle at 50% 70%, #10182a 0, #070912 55%, #03040a 100%); }
    .frame { position:relative; width:min(100vw, calc(100vh * 0.72)); height:min(100vh, calc(100vw / 0.72)); max-height:100vh; overflow:hidden; border-left:1px solid rgba(168,255,120,.08); border-right:1px solid rgba(168,255,120,.08); }
    .scanlines { pointer-events:none; position:absolute; inset:0; z-index:5; background:repeating-linear-gradient(to bottom, transparent 0 3px, rgba(0,0,0,.16) 3px 4px); mix-blend-mode:multiply; }
    .grain { pointer-events:none; position:absolute; inset:-50%; z-index:6; opacity:.035; background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); animation:noise .18s steps(2) infinite; }
    @keyframes noise { 0%{transform:translate(0)} 25%{transform:translate(3%, -2%)} 50%{transform:translate(-2%,3%)} 75%{transform:translate(2%,2%)} 100%{transform:translate(-3%,-1%)} }
    .hud { position:absolute; z-index:4; left:7%; right:7%; top:3.2%; display:flex; justify-content:space-between; font-weight:900; font-size:clamp(11px, 2.2vh, 18px); letter-spacing:.08em; color:#dfe6ff; text-shadow:0 0 12px rgba(120,234,255,.45); }
    .hud span b { display:block; margin-top:.12em; color:var(--green); text-align:center; font-size:1.15em; }
    .message { position:absolute; z-index:7; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; background:rgba(3,5,12,.68); transition:opacity .15s; }
    .message.hidden { opacity:0; pointer-events:none; }
    .message h1 { margin:0 0 2vh; color:var(--green); font-size:clamp(28px, 7vh, 64px); line-height:.9; letter-spacing:.12em; text-shadow:0 0 18px rgba(168,255,120,.45); }
    .message p { margin:.6em 0; color:#b9c1d7; font-size:clamp(12px, 2vh, 17px); letter-spacing:.16em; }
    .message .start { margin-top:2vh; padding:12px 20px; color:#07100a; background:var(--green); border:0; font:900 clamp(12px,2vh,16px) "Courier New", monospace; letter-spacing:.12em; box-shadow:0 0 24px rgba(168,255,120,.35); cursor:pointer; }
    .touch { position:absolute; z-index:8; left:3%; right:3%; bottom:2.5%; display:none; justify-content:space-between; pointer-events:none; }
    .touch-group { display:flex; gap:10px; }
    .touch button { pointer-events:auto; width:64px; height:64px; border:1px solid rgba(168,255,120,.35); border-radius:50%; background:rgba(12,18,31,.72); color:var(--green); font-size:24px; touch-action:none; backdrop-filter:blur(4px); }
    .touch .fire { border-color:rgba(255,107,181,.55); color:var(--pink); }
    @media (pointer:coarse), (max-width:700px) { .touch { display:flex; } }
  </style>
</head>
<body>
  <main class="shell"><section class="frame" id="frame">
    <canvas id="game"></canvas>
    <div class="hud"><span>SCORE<b id="score">0000</b></span><span>HI-SCORE<b id="high">0000</b></span><span>LIVES<b id="lives">3</b></span></div>
    <div class="message" id="message"><h1 id="title">SPACE<br>INVADERS</h1><p id="subtitle">PRESS START</p><button class="start" id="start">START</button></div>
    <div class="touch"><div class="touch-group"><button data-key="left">◀</button><button data-key="right">▶</button></div><button class="fire" data-key="fire">●</button></div>
    <div class="scanlines"></div><div class="grain"></div>
  </section></main>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),frame=document.getElementById('frame');
const W=720,H=1000; canvas.width=W; canvas.height=H;
let score=0,high=Number(localStorage.getItem('invadersHigh')||0),lives=3,level=1,state='menu',last=0,flash=0;
const scoreEl=document.getElementById('score'),highEl=document.getElementById('high'),livesEl=document.getElementById('lives'),message=document.getElementById('message'),title=document.getElementById('title'),subtitle=document.getElementById('subtitle');
highEl.textContent=pad(high); const keys={};
const player={x:W/2,y:H-118,w:58,h:24,cool:0};
let aliens=[],bullets=[],enemyBullets=[],barriers=[],saucer=null,saucerTimer=8,alienDir=1,alienStep=0,alienTick=0;
const stars=Array.from({length:75},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.2+.2,a:Math.random()*.55+.15}));
function pad(n){return String(n).padStart(4,'0')}
function updateHUD(){scoreEl.textContent=pad(score);highEl.textContent=pad(high);livesEl.textContent=lives}
const alienShapes=[
 ['00111100','01111110','11111111','11011011','11111111','00100100','01000010','10000001'],
 ['00011000','00111100','01111110','11011011','11111111','00100100','01011010','10100101'],
 ['00100010','00010100','00111110','01111110','11111111','01011010','10000001','01000010']
];
function makeAliens(){aliens=[];for(let r=0;r<5;r++)for(let c=0;c<11;c++)aliens.push({x:105+c*46,y:210+r*48,w:32,h:24,row:r,alive:true,phase:0});alienDir=1}
function makeBarriers(){barriers=[];for(let b=0;b<4;b++){for(let y=0;y<7;y++)for(let x=0;x<9;x++){if((y===0&&(x<2||x>6))||(y===1&&x===0)||(y===1&&x===8)||(y>4&&x>2&&x<6))continue;barriers.push({x:70+b*155+x*8,y:735+y*8,w:8,h:8,life:3})}}}
function reset(){score=0;lives=3;level=1;player.x=W/2;bullets=[];enemyBullets=[];saucer=null;saucerTimer=8;makeAliens();makeBarriers();updateHUD()}
function start(){reset();state='play';message.classList.add('hidden')}
function loseLife(){lives--;flash=12;updateHUD();bullets=[];enemyBullets=[];player.x=W/2;if(lives<=0){state='gameover';title.innerHTML='GAME OVER';subtitle.textContent='FINAL SCORE '+pad(score);document.getElementById('start').textContent='TRY AGAIN';message.classList.remove('hidden')}else setTimeout(()=>{if(state==='play'){}},400)}
function shoot(){if(bullets.length<2){bullets.push({x:player.x,y:player.y-18,v:-11});}}
function rect(a,b){return a.x-a.w/2<b.x+b.w/2&&a.x+a.w/2>b.x-b.w/2&&a.y-a.h/2<b.y+b.h/2&&a.y+a.h/2>b.y-b.h/2}
function update(dt){
 if(state!=='play')return;
 if(keys.left)player.x-=360*dt;if(keys.right)player.x+=360*dt;player.x=Math.max(38,Math.min(W-38,player.x));
 player.cool-=dt;if((keys.fire||keys.space)&&player.cool<=0){shoot();player.cool=.38}
 for(const b of bullets)b.y+=b.v;
 for(const b of enemyBullets)b.y+=b.v;
 bullets=bullets.filter(b=>b.y>-20);enemyBullets=enemyBullets.filter(b=>b.y<H+20);
 alienTick+=dt;let interval=Math.max(.12,.62-((55-aliens.filter(a=>a.alive).length)*.009));
 if(alienTick>interval){alienTick=0;alienStep++;let edge=false;for(const a of aliens)if(a.alive){a.x+=alienDir*12;if(a.x>W-55||a.x<55)edge=true;a.phase=alienStep%2}if(edge){alienDir*=-1;for(const a of aliens)if(a.alive)a.y+=20}}
 const alive=aliens.filter(a=>a.alive);if(alive.length&&alive.some(a=>a.y+a.h/2>player.y-20))loseLife();
 if(alive.length===0){level++;alienDir=1;makeAliens();makeBarriers();enemyBullets=[];subtitle.textContent='WAVE '+level}
 for(const b of bullets){for(const a of aliens){if(a.alive&&rect({x:b.x,y:b.y,w:5,h:16},{x:a.x,y:a.y,w:a.w,h:a.h})){a.alive=false;b.y=-100;score+=(a.row===0?30:a.row<3?20:10);high=Math.max(high,score);localStorage.setItem('invadersHigh',high);updateHUD();break}}}
 if(Math.random()<.018*dt*60&&enemyBullets.length<4&&alive.length){const cols=[];for(let c=0;c<11;c++){const col=alive.filter(a=>a.row>=0&&Math.round((a.x-105)/46)==c);if(col.length)cols.push(col.reduce((q,a)=>a.y>q.y?a:q))}if(cols.length){const s=cols[Math.floor(Math.random()*cols.length)];enemyBullets.push({x:s.x,y:s.y+18,v:5+level*.35})}}
 saucerTimer-=dt;if(!saucer&&saucerTimer<=0)saucer={x:-45,y:155,v:90,w:54,h:22};if(saucer){saucer.x+=saucer.v*dt;if(saucer.x>W+60){saucer=null;saucerTimer=12+Math.random()*8}}
 if(saucer){for(const b of bullets){if(rect({x:b.x,y:b.y,w:5,h:16},saucer)){score+=150;high=Math.max(high,score);updateHUD();saucer=null;b.y=-100;break}}}
 for(const b of enemyBullets){for(const p of barriers){if(p.life>0&&rect({x:b.x,y:b.y,w:5,h:12},{x:p.x+p.w/2,y:p.y+p.h/2,w:p.w,h:p.h})) {p.life--;b.y=H+30;break}}if(rect({x:b.x,y:b.y,w:5,h:12},{x:player.x,y:player.y,w:player.w,h:player.h}))loseLife()}
 for(const b of bullets){for(const p of barriers){if(p.life>0&&rect({x:b.x,y:b.y,w:5,h:16},{x:p.x+p.w/2,y:p.y+p.h/2,w:p.w,h:p.h})) {p.life--;b.y=-100;break}}}
 if(flash>0)flash--;
}
function pixelShape(shape,x,y,color,scale=4){ctx.fillStyle=color;for(let yy=0;yy<shape.length;yy++)for(let xx=0;xx<shape[yy].length;xx++)if(shape[yy][xx]==='1')ctx.fillRect(Math.round(x+(xx-4)*scale),Math.round(y+(yy-4)*scale),scale,scale)}
function draw(){ctx.fillStyle='#060912';ctx.fillRect(0,0,W,H);for(const s of stars){ctx.globalAlpha=s.a;ctx.fillStyle='#d7efff';ctx.fillRect(s.x,s.y,s.r,s.r)}ctx.globalAlpha=1;
 ctx.fillStyle='#26304a';ctx.fillRect(45,H-55,W-90,3);
 ctx.fillStyle=flash?'#fff':'#78eaff';ctx.fillRect(player.x-player.w/2,player.y+8,player.w,12);ctx.fillRect(player.x-14,player.y,28,14);ctx.fillRect(player.x-6,player.y-10,12,12);ctx.fillRect(player.x-21,player.y+20,12,5);ctx.fillRect(player.x+9,player.y+20,12,5);
 for(const a of aliens)if(a.alive){const shape=alienShapes[a.row===0?0:a.row<3?1:2];pixelShape(shape,a.x,a.y,a.row===0?'#ff6bb5':a.row<3?'#78eaff':'#a8ff78',4)}
 ctx.fillStyle='#ffb84d';if(saucer){ctx.fillRect(saucer.x-27,saucer.y-5,54,16);ctx.fillRect(saucer.x-17,saucer.y-13,34,10);ctx.fillRect(saucer.x-21,saucer.y+11,42,5)}
 ctx.fillStyle='#a8ff78';for(const p of barriers)if(p.life>0){ctx.globalAlpha=.45+p.life*.18;ctx.fillRect(p.x,p.y,p.w,p.h)}ctx.globalAlpha=1;
 ctx.fillStyle='#b8fff1';for(const b of bullets){ctx.fillRect(b.x-3,b.y-8,6,16)}ctx.fillStyle='#ff6bb5';for(const b of enemyBullets){ctx.fillRect(b.x-3,b.y-7,6,14);ctx.fillRect(b.x-7,b.y-3,14,4)}
}
function loop(t){const dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}
document.getElementById('start').onclick=start;
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['arrowleft','a','arrowright','d',' ','arrowup','w'].includes(k))e.prevent.prevent; if(k==='arrowleft'||k==='a')keys.left=true;if(k==='arrowright'||k==='d')keys.right=true;if(k===' '||k==='arrowup'||k==='w')keys.fire=true;if(k==='enter'&&state!=='play')start()});
addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(k==='arrowleft'||k==='a')keys.left=false;if(k==='arrowright'||k==='d')keys.right=false;if(k===' '||k==='arrowup'||k==='w')keys.fire=false});
for(const b of document.querySelectorAll('.touch button')){const key=b.dataset.key;const on=e=>{e.preventDefault();keys[key]=true};const off=e=>{e.preventDefault();keys[key]=false};b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('pointerleave',off)}
updateHUD();makeAliens();makeBarriers();requestAnimationFrame(loop);
</script>
</body></html>
