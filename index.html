<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Street Rush</title>
<style>
:root{--lime:#d7ff37;--cyan:#55d9ff;--ink:#090b10}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#090b10;font-family:Arial Black,Impact,sans-serif;color:#fff}#game{position:fixed;inset:0;width:100%;height:100%;display:block}.ui{position:absolute;inset:0;pointer-events:none}.top{position:absolute;top:22px;left:24px;right:24px;display:flex;justify-content:space-between;align-items:flex-start}.brand{font-size:20px;font-style:italic;letter-spacing:-1px;text-shadow:0 3px 12px #000}.brand b{color:var(--lime)}.hud{display:flex;gap:10px}.pill{min-width:86px;height:64px;padding:9px 12px;background:rgba(8,11,16,.82);border:1px solid rgba(255,255,255,.14);border-radius:10px;box-shadow:0 8px 30px #0005}.pill span{display:block;font:700 10px Arial;color:#9da8b5;letter-spacing:1.5px}.pill strong{display:block;margin-top:3px;font-size:25px;font-style:italic}.speed strong{font-size:31px}.speed strong em{font-size:12px;color:var(--lime);font-style:normal}#nitroWrap{position:absolute;right:24px;bottom:25px;width:190px;height:14px;transform:skew(-12deg);background:#111722;border:2px solid #fff6}.nitroLabel{position:absolute;right:27px;bottom:43px;font:800 10px Arial;letter-spacing:2px;color:#c5ced8}#nitroFill{height:100%;width:100%;background:linear-gradient(90deg,#fff,var(--cyan));box-shadow:0 0 16px var(--cyan);transition:width .1s}.position{position:absolute;left:24px;bottom:25px;font-size:48px;font-style:italic;text-shadow:0 4px 16px #000}.position small{display:block;font:800 10px Arial;letter-spacing:2px;color:#aab3be}.position b{color:var(--lime)}#overlay{pointer-events:auto;position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(90deg,rgba(5,7,11,.78),rgba(5,7,11,.12));transition:.25s}.card{width:min(520px,calc(100% - 40px));margin-right:min(38vw,420px);text-align:left}.kicker{display:flex;gap:8px;align-items:center;color:var(--lime);font:900 12px Arial;letter-spacing:5px}.kicker:before{content:"";width:48px;height:3px;background:var(--lime)}h1{margin:8px 0 4px;font-size:76px;line-height:.82;font-style:italic;letter-spacing:-5px;text-shadow:0 8px 30px #000}h1 span{display:block;color:var(--lime)}.card p{margin:18px 0 22px;width:390px;max-width:100%;font:700 13px/1.55 Arial;color:#ccd3dc}.btn{pointer-events:auto;border:0;border-radius:3px;padding:17px 28px;background:var(--lime);color:#111;font:900 14px Arial;letter-spacing:1.5px;transform:skew(-6deg);cursor:pointer;box-shadow:0 10px 35px #bfff2955}.btn:active{transform:skew(-6deg) scale(.97)}.controls{margin-top:16px;font:700 10px Arial;color:#aeb7c2;letter-spacing:1px}.controls kbd{display:inline-grid;place-items:center;min-width:25px;height:25px;margin:0 3px;border:1px solid #ffffff55;border-radius:4px;background:#ffffff12;color:#fff}.hidden{opacity:0;pointer-events:none!important}.toast{position:absolute;top:140px;left:50%;transform:translateX(-50%) skew(-8deg);padding:10px 18px;background:#111a;border-left:4px solid var(--lime);font-size:24px;font-style:italic;opacity:0;transition:.25s}.toast.show{opacity:1}.touch{display:none;position:absolute;inset:auto 18px 18px;justify-content:space-between}.touch button{pointer-events:auto;width:66px;height:66px;border-radius:50%;border:1px solid #ffffff55;background:#111a;color:#fff;font-size:23px}.touch .right{display:flex;gap:10px}.touch #boostTouch{color:var(--lime);border-color:#d7ff3788}@media(max-width:700px){.top{top:12px;left:12px;right:12px}.brand{font-size:15px}.pill{height:52px;min-width:68px;padding:7px}.pill strong{font-size:20px}.speed strong{font-size:23px}.hud{gap:5px}.position{left:12px;bottom:92px;font-size:34px}.nitroLabel{right:14px;bottom:92px}.touch{display:flex}#nitroWrap{right:14px;bottom:78px;width:138px}.card{margin:0;text-align:center}.kicker{justify-content:center}.kicker:before{display:none}h1{font-size:58px}.card p{margin:16px auto}.toast{top:115px}.hud .pill:nth-child(2){display:none}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="ui"><div class="top"><div class="brand">STREET <b>RUSH</b></div><div class="hud"><div class="pill"><span>DISTANCE</span><strong id="distance">0.00</strong></div><div class="pill"><span>TIME</span><strong id="timer">01:30</strong></div><div class="pill speed"><span>SPEED</span><strong id="speed">000 <em>KM/H</em></strong></div></div></div><div class="position"><small>POSITION</small><b id="place">1</b>/6</div><div class="nitroLabel">NITRO</div><div id="nitroWrap"><div id="nitroFill"></div></div><div class="toast" id="toast">NITRO BOOST</div><div id="overlay"><div class="card"><div class="kicker">MIDNIGHT CIRCUIT</div><h1>STREET <span>RUSH</span></h1><p>Cut through downtown traffic. Overtake all five rivals before the clock hits zero. Use nitro to break away.</p><button class="btn" id="start">START ENGINE</button><div class="controls"><kbd>←</kbd><kbd>→</kbd> STEER &nbsp; <kbd>↑</kbd> ACCELERATE &nbsp; <kbd>SPACE</kbd> NITRO</div></div></div><div class="touch"><button id="leftTouch">◀</button><div class="right"><button id="boostTouch">⚡</button><button id="rightTouch">▶</button></div></div></div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');let W,H,DPR;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
const $=id=>document.getElementById(id),keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(['ArrowLeft','ArrowRight','ArrowUp',' ','Spacebar'].includes(e.key))e.preventDefault(); if(e.key==='Escape'&&running)paused=!paused});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let running=false,paused=false,over=false,score=0,elapsed=90,last=0,speed=0,nitro=100,scroll=0;const player={x:0,y:.79,lane:0,tilt:0};let rivals=[],particles=[];
function reset(){elapsed=90;speed=115;nitro=100;scroll=0;score=0;player.x=0;player.tilt=0;rivals=[];for(let i=0;i<6;i++)rivals.push({lane:(i%3)-1,y:-.25-i*.38,color:['#ff3b54','#41aaff','#ffd54a','#9d62ff','#ff7a18'][i%5],speed:40+Math.random()*45,passed:false})}
function start(){reset();running=true;paused=false;over=false;$('overlay').classList.add('hidden');last=performance.now();requestAnimationFrame(loop)}$('start').onclick=start;
function bind(id,key){let el=$(id);el.addEventListener('pointerdown',e=>{e.prevent();keys[key]=true});el.addEventListener('pointerup',()=>keys[key]=false);el.addEventListener('pointercancel',()=>keys[key]=false)}bind('leftTouch','arrowleft');bind('rightTouch','arrowright');bind('boostTouch',' ');
function roadAt(y){const horizon=H*.23;let t=(y-horizon)/(H-horizon);return {left:W*.5-W*(.48-.29*t),width:W*(.10+.80*t)}}
function drawBackground(){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#111827');g.addColorStop(.28,'#263a45');g.addColorStop(.285,'#16202a');g.addColorStop(1,'#090b10');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='#111721';ctx.fillRect(0,H*.23,W,H*.77); // sky glow
let glow=ctx.createRadialGradient(W*.5,H*.15,0,W*.5,H*.15,W*.36);glow.addColorStop(0,'#a4cbd044');glow.addColorStop(1,'transparent');ctx.fillStyle=glow;ctx.fillRect(0,0,W,H*.4);
// roadside buildings
for(let side of [-1,1])for(let i=0;i<8;i++){let z=(i*180-scroll*.18)%1440;let y=H*.22+(z/1440)*(H*.78);let t=(y-H*.22)/(H*.78);let size=30+t*120;if(y<H*.22||y>H)continue;let x=side<0?roadAt(y).left-size*.9:roadAt(y).left+roadAt(y).width+size*.1;ctx.fillStyle=i%2?'#1b252e':'#202d36';ctx.fillRect(x-side*size*.3,y-size*.65,size*.9,size*.65);ctx.fillStyle='#b4eaff55';for(let wy=y-size*.55;wy<y-5;wy+=14)for(let wx=x+8;wx<x+size*.75;wx+=17)if((wx+wy+i)%3<1)ctx.fillRect(wx,wy,7,4)}
// road
let horizon=H*.23,segments=70;ctx.beginPath();ctx.moveTo(W*.5-W*.10, horizon);ctx.lineTo(W*.5+W*.10,horizon);ctx.lineTo(W*.5+W*.48,H);ctx.lineTo(W*.5-W*.48,H);ctx.closePath();ctx.fillStyle='#252a30';ctx.fill();ctx.save();ctx.beginPath();ctx.moveTo(W*.5-W*.10,horizon);ctx.lineTo(W*.5+W*.10,horizon);ctx.lineTo(W*.5+W*.48,H);ctx.lineTo(W*.5-W*.48,H);ctx.clip();
// lane markings
for(let lane of [-.5,.5]){ctx.beginPath();for(let i=0;i<=segments;i++){let y=horizon+(H-horizon)*i/segments,t=i/segments,x=W*.5+lane*(W*(.1+.7*t));i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.strokeStyle='#e8edf2';ctx.globalAlpha=.72;ctx.lineWidth=3;ctx.stroke()}ctx.globalAlpha=1;
// moving road dashes
for(let lane of [-.333,.333])for(let k=0;k<10;k++){let q=((k/10+scroll*.0015)%1);let y=horizon+(H-horizon)*q*q;let r=q;ctx.fillStyle='#dce3e6';ctx.globalAlpha=.7;let dashH=4+r*24,tw=2+r*5;ctx.save();ctx.translate(W*.5+lane*(W*(.1+.7*r)),y);ctx.transform(1,0,0,1,0,0);ctx.fillRect(-tw,-dashH*.5,tw*2,dashH);ctx.restore()}ctx.restore();
// curbs
ctx.strokeStyle='#eef5f2';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(W*.5-W*.10,horizon);ctx.lineTo(W*.5-W*.48,H);ctx.moveTo(W*.5+W*.10,horizon);ctx.lineTo(W*.5+W*.48,H);ctx.stroke();}
function drawCar(cx,cy,w,h,color,playerCar=false,tilt=0){ctx.save();ctx.translate(cx,cy);ctx.rotate(tilt);ctx.fillStyle='#0005';ctx.beginPath();ctx.ellipse(0,h*.42,w*.62,h*.12,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#090b10';ctx.fillRect(-w*.52,h*.18,w*.17,h*.48);ctx.fillRect(w*.35,h*.18,w*.17,h*.48);ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(-w*.42,h*.44);ctx.lineTo(-w*.36,-h*.18);ctx.lineTo(-w*.23,-h*.48);ctx.lineTo(w*.23,-h*.48);ctx.lineTo(w*.36,-h*.18);ctx.lineTo(w*.42,h*.44);ctx.closePath();ctx.fill();ctx.fillStyle='#101923';ctx.beginPath();ctx.moveTo(-w*.25,-h*.22);ctx.lineTo(-w*.17,-h*.41);ctx.lineTo(w*.17,-h*.41);ctx.lineTo(w*.25,-h*.22);ctx.closePath();ctx.fill();ctx.fillStyle='#dffaff55';ctx.fillRect(-w*.18,-h*.36,w*.36,h*.09);ctx.fillStyle='#ff3048';ctx.fillRect(-w*.34,h*.35,w*.18,h*.07);ctx.fillRect(w*.16,h*.35,w*.18,h*.07);if(playerCar){ctx.fillStyle='#d7ff37';ctx.fillRect(-w*.03,h*.43,w*.06,h*.12)}ctx.restore()}
function loop(now){if(!running)return;let dt=Math.min((now-last)/1000,.033);last=now;if(!paused&&!over)update(dt);draw();if(running)requestAnimationFrame(loop)}
function update(dt){elapsed-=dt;if(elapsed<=0){elapsed=0;end(false)}let accelerating=keys.arrowup||keys.w;let boost=keys[' ']||keys.shift;if(boost&&nitro>0){speed=Math.min(280,speed+95*dt);nitro-=28*dt}else{speed+=((accelerating?205:155)-speed)*dt*.9;if(nitro<100&&!boost)nitro+=5*dt}scroll+=speed*dt;score+=speed*dt*.00035;
let steer=((keys.arrowright||keys.d?1:0)-(keys.arrowleft||keys.a?1:0));player.x+=steer*dt*1.15*(.55+speed/220);player.x=Math.max(-1,Math.min(1,player.x));player.tilt+=(steer*.09-player.tilt)*dt*8;
for(let r of rivals){r.y+=(speed-r.speed)*dt*.0023;let dy=r.y-player.y;if(Math.abs(r.y-player.y)<.09&&Math.abs(r.lane-player.x*.95)<.38){speed=Math.max(70,speed-55);r.y-=.18;nitro=Math.max(0,nitro-12)}if(r.y>1.12){r.y=-.25-Math.random*.35;r.lane=(Math.random()*3|0)-1;r.speed=40+Math.random()*75;r.passed=true}else if(r.y>player.y&&!r.passed){r.passed=true}}
$('distance').textContent=(score*10).toFixed(2);$('timer').textContent='0'+Math.floor(elapsed/60)+':'+String(Math.ceil(elapsed%60)).padStart(2,'0');$('speed').innerHTML=String(Math.round(speed)).padStart(3,'0')+' <em>KM/H</em>'; $('nitroFill').style.width=nitro+'%';let ahead=rivals.filter(r=>r.y<player.y).length;let place=Math.min(6,1+ahead);$('place').textContent=place;if(place===1&&score>.02){}if(score>=1.25)end(true)}
function end(won){over=true;setTimeout(()=>{running=false;$('overlay').classList.remove('hidden');$('overlay').querySelector('.kicker').textContent=won?'RACE COMPLETE':'TIME EXPIRED';$('overlay').querySelector('h1').innerHTML=won?'VICTORY':'<span>TRY AGAIN</span>';$('overlay').querySelector('p').textContent=won?'You owned the midnight streets and crossed the finish line.':'The clock got away. Tune up and take another run.';$('start').textContent='RACE AGAIN'},300)}
function draw(){drawBackground();let sorted=[...rivals].sort((a,b)=>a.y-b.y);for(let r of sorted){if(r.y<.18||r.y>1.15)continue;let y=H*.23+(H*.77)*r.y*r.y;let ra=roadAt(y),x=W*.5+ra.width*.31*r.lane,w=40+ra.width*.055,h=w*1.55;drawCar(x,y,w,h,r.color,false)}let py=H*player.y,pc=roadAt(py),px=W*.5+pc.width*.31*player.x,pw=75,h=116;drawCar(px,py,pw,h,'#e8eef2',true,player.tilt);if(keys[' ']&&nitro>0){ctx.fillStyle='#55d9ff99';ctx.beginPath();ctx.moveTo(px-pw*.18,py+h*.5);ctx.lineTo(px-pw*.04,py+h*.9);ctx.lineTo(px+pw*.04,py+h*.5);ctx.closePath();ctx.fill()}if(paused){ctx.fillStyle='#090b10aa';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='italic 900 64px Impact';ctx.fillText('PAUSED',W/2,H/2)}}
// idle scene
reset();draw();
</script>
</body></html>
