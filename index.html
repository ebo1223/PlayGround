<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sunhaven Farm</title>
<style>
*{box-sizing:border-box} :root{font-family:Inter,system-ui,sans-serif;color:#2d321f}
body{margin:0;height:100vh;overflow:hidden;background:#aee0d7}button{font:inherit;cursor:pointer}
#app{height:100vh;display:grid;grid-template-rows:64px 1fr 98px}.top{display:flex;align-items:center;gap:22px;padding:10px 20px;background:#fffdf3;border-bottom:3px solid #d7cba6;z-index:5}.brand{font-family:Georgia,serif;font-size:22px;font-weight:800;margin-right:auto}.brand span{color:#ea8a43}.pill{display:flex;align-items:center;gap:8px;height:42px;padding:0 13px;border:1px solid #dfdabd;border-radius:12px;background:#fff;font-weight:750}.coin{width:23px;height:23px;border-radius:50%;background:#f6bd43;border:3px solid #fff0ac;box-shadow:0 1px 2px #aaa}.weather{font-size:20px}.world{position:relative;overflow:hidden;background:linear-gradient(#83c6aa 0 13%,#b7d98b 13% 17%,#75b34e 17%)}
.farm{position:absolute;inset:0}.barn{position:absolute;right:5.5%;top:12%;width:180px;height:130px}.barn-roof{position:absolute;left:-9px;top:-28px;width:198px;height:70px;background:#9d3f32;clip-path:polygon(50% 0,100% 75%,93% 100%,7% 100%,0 75%);border-bottom:8px solid #763128}.barn-body{position:absolute;bottom:0;width:180px;height:92px;background:#bd593d;border:5px solid #853a2d;border-radius:4px}.barn-door{position:absolute;bottom:0;left:58px;width:64px;height:70px;background:#6f392d;border:5px solid #fff1d1}.barn-window{position:absolute;right:20px;top:15px;width:23px;height:23px;background:#ffe889;border:4px solid #fff1d1}.silo{position:absolute;right:18%;top:8%;width:55px;height:120px;border-radius:28px 28px 7px 7px;background:linear-gradient(90deg,#c8c6b7,#eee9d5,#aaa998);border:3px solid #777}.silo:before{content:"";position:absolute;top:-15px;left:-5px;width:59px;height:25px;border-radius:50%;background:#dedbd0}.fields{position:absolute;left:7%;top:25%;width:59%;height:58%;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(4,1fr);gap:9px;transform:rotate(-1deg)}
.plot{position:relative;border:3px solid rgba(91,62,34,.28);border-radius:8px;background:linear-gradient(135deg,#9b7042 25%,#855833 25%,#855833 50%,#9b7042 50%,#9b7042 75%,#855833 75%);background-size:18px 18px;box-shadow:inset 0 3px 7px #63442355}.plot.empty:after{content:"";position:absolute;inset:42%;border-radius:50%;background:#a98a5d}.plot:hover{filter:brightness(1.08)}.crop{position:absolute;inset:8%;display:grid;place-items:center;font-size:clamp(20px,2.2vw,38px);filter:drop-shadow(0 3px 1px #58491e55)}.progress{position:absolute;left:12%;right:12%;bottom:5px;height:5px;background:#d4c79d;border-radius:5px;overflow:hidden}.progress i{display:block;height:100%;background:#79ad45}.road{position:absolute;left:-5%;bottom:-4%;width:72%;height:24%;background:#dac28c;clip-path:polygon(0 40%,100% 0,100% 75%,0 100%);border-radius:20%}.coop{position:absolute;right:6%;bottom:7%;width:150px;height:110px}.coop-body{position:absolute;bottom:0;width:150px;height:75px;background:#d4a74c;border:4px solid #927737;border-radius:6px}.coop-roof{position:absolute;top:6px;left:-12px;width:174px;height:48px;background:#80513a;clip-path:polygon(50% 0,100% 70%,93% 100%,7% 100%,0 70%)}.chickens{position:absolute;left:3%;bottom:7%;font-size:32px}.chicken{position:absolute}.pond{position:absolute;right:21%;bottom:-3%;width:150px;height:85px;border-radius:55% 45% 60% 40%;background:#65b8bd;border:6px solid #8fbd67}.pond:after{content:"";position:absolute;width:22px;height:8px;left:60px;top:28px;border-radius:50%;border:2px solid #a5e0db}.tree{position:absolute;width:70px;height:90px}.tree:before{content:"";position:absolute;width:62px;height:62px;border-radius:50%;background:#4d943e;bottom:20px;left:4px;box-shadow:-12px 15px 0 #397831,12px 14px 0 #5aab48}.tree:after{content:"";position:absolute;width:12px;height:42px;background:#715236;bottom:0;left:29px}
.bottom{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:10px 18px;background:#fffdf3;border-top:3px solid #d7cba6;z-index:6}.toolbar{display:flex;gap:8px}.tool{width:68px;height:74px;border:2px solid #dedbbf;border-radius:14px;background:#faf8eb;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:800}.tool b{font-size:25px}.tool.active{border-color:#e69a43;background:#fff0d4;box-shadow:0 3px 0 #d07c35}.status{text-align:center}.day{font-family:Georgia,serif;font-size:18px;font-weight:800}.timebar{width:180px;height:8px;border-radius:8px;margin:8px auto;background:#e5dec2}.timebar i{display:block;width:30%;height:100%;border-radius:8px;background:#f0a94b}.actions{justify-self:end;display:flex;gap:8px}.action{height:48px;border:0;border-radius:12px;padding:0 16px;background:#4d7e45;color:white;font-weight:800}.action.secondary{background:#eee7ca;color:#57543b}.toast{position:absolute;left:50%;top:72px;transform:translateX(-50%) translateY(-20px);background:#fffdf3;border:2px solid #d8ceaa;border-radius:12px;padding:9px 15px;font-weight:800;opacity:0;transition:.25s;z-index:10}.toast.show{opacity:1;transform:translateX(-50%)}.shop{position:absolute;right:18px;top:76px;width:260px;padding:14px;background:#fffdf3;border:3px solid #d8ceaa;border-radius:16px;z-index:20;box-shadow:0 12px 30px #5554}.shop.hidden{display:none}.shop h3{margin:0 0 10px;font-family:Georgia,serif}.shop-item{width:100%;display:flex;justify-content:space-between;align-items:center;padding:9px;border:0;border-radius:9px;background:#f2edda;margin:5px 0}.shop-item small{color:#777}
@media(max-width:700px){.top{gap:7px;padding:8px}.pill{height:38px;padding:0 8px}.brand{font-size:17px}.weather{display:none}.bottom{grid-template-columns:1fr auto}.actions{display:none}.status{display:none}.tool{width:58px}.barn,.silo,.coop,.pond{transform:scale(.72);transform-origin:bottom right}.fields{left:3%;width:68%;top:22%}.toast{top:68px}}
</style></head>
<body><div id="app"><header class="top"><div class="brand">SUNHAVEN <span>FARM</span></div><div class="pill"><div class="coin"></div><span id="coins">240</span></div><div class="pill">🌱 <span id="level">Level 3</span></div><div class="pill weather">☀️ 24°</div></header>
<main class="world"><div class="toast" id="toast"></div><div class="road"></div><div class="farm"><div class="tree" style="left:2%;top:10%"></div><div class="tree" style="left:25%;top:5%;transform:scale(.8)"></div><div class="silo"></div><div class="barn"><div class="barn-roof"></div><div class="barn-body"><div class="barn-window"></div><div class="barn-door"></div></div></div><div class="pond"></div><div class="fields" id="fields"></div><div class="coop"><div class="coop-roof"></div><div class="coop-body"></div></div><div class="chickens"><span class="chicken" style="left:0;top:10px">🐔</span><span class="chicken" style="left:48px;top:-15px">🐔</span><span class="chicken" style="left:96px;top:14px">🐔</span></div></div>
<div class="shop hidden" id="shop"><h3>Farm Supply</h3><button class="shop-item" onclick="buy('seed')"><span>🌱 Crop seed</span><b>12 coins</b></button><button class="shop-item" onclick="buy('chicken')"><span>🐔 Feed 10x</span><b>25 coins</b></button><button class="shop-item" onclick="buy('water')"><span>💧 Well upgrade</span><b>60 coins</b></button></div></main>
<footer class="bottom"><div class="toolbar"><button class="tool active" data-tool="plant"><b>🌱</b>Plant</button><button class="tool" data-tool="water"><b>💧</b>Water</button><button class="tool" data-tool="harvest"><b>🧺</b>Harvest</button><button class="tool" data-tool="feed"><b>🌾</b>Feed</button></div><div class="status"><div class="day" id="day">Spring · Day 12</div><div class="timebar"><i id="timebar"></i></div></div><div class="actions"><button class="action secondary" id="shopBtn">🛒 Shop</button><button class="action" id="nextDay">Next day ›</button></div></footer></div>
<script>
let coins=240,tool='plant',day=12,progress=20,feed=4,seeds=8;
const crops=['🌽','🥕','🍅','🥬','🌻'];let plots=[];
function render(){const el=document.getElementById('fields');el.innerHTML='';plots.forEach((p,i)=>{const d=document.createElement('button');d.className='plot '+(p.type?'':'empty');d.title=p.type?'Crop growth: '+p.growth+'%':'Empty plot';if(p.type)d.innerHTML='<div class="crop">'+crops[p.type-1]+'</div><div class="progress"><i style="width:'+p.growth+'%"></i></div>';d.onclick=()=>act(i);el.appendChild(d)})}
for(let i=0;i<20;i++)plots.push(i<7?{type:(i%5)+1,growth:25+(i*11)%75}:{});render();
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(e.t);e.t=setTimeout(()=>e.classList.remove('show'),1500)}
function act(i){const p=plots[i];if(tool==='plant'){if(p.type)toast('This plot is already planted');else if(seeds<1)toast('Buy seeds in the shop');else{p.type=1;p.growth=5;seeds--;toast('Crop planted!')}}
if(tool==='water'){if(!p.type)toast('Plant something first');else if(p.growth>=100)toast('Crop is ready to harvest');else{p.growth=Math.min(100,p.growth+18);toast('Watered · '+p.growth+'%')}}
if(tool==='harvest'){if(!p.type)toast('Nothing to harvest');else if(p.growth<100)toast('Crop needs more growth');else{coins+=18;p.type=null;p.growth=0;document.getElementById('coins').textContent=coins;toast('Harvest sold · +18 coins')}}
if(tool==='feed'){if(feed<1)toast('Buy feed in the shop');else{feed--;toast('Chickens fed!')}}render()}
document.querySelectorAll('.tool').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tool').forEach(x=>x.classList.remove('active'));b.classList.add('active');tool=b.dataset.tool;toast(b.textContent.trim()+' tool selected')});
document.getElementById('nextDay').onclick=()=>{day++;progress=4;plots.forEach(p=>{if(p.type)p.growth=Math.min(100,p.growth+14)});document.getElementById('day').textContent='Spring · Day '+day;document.getElementById('timebar').style.width=progress+'%';render();toast('A fresh day begins')};
setInterval(()=>{progress=(progress+1)%101;document.getElementById('timebar').style.width=progress+'%'},1200);
document.getElementById('shopBtn').onclick=()=>document.getElementById('shop').classList.toggle('hidden');
function buy(type){const costs={seed:12,chicken:25,water:60};if(coins<costs[type])return toast('Not enough coins');coins-=costs[type];if(type==='seed')seeds+=5;if(type==='chicken')feed+=10;document.getElementById('coins').textContent=coins;toast(type==='seed'?'Seeds added':type==='chicken'?'Chicken feed added':'Well upgraded')}
</script></body></html>
