<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#100d1c"><title>Lucky Lantern — Slots</title>
<style>
:root{color-scheme:dark;--gold:#ffcf70;--muted:#a99fbe;--panel:#1b162b;--line:#ffffff1a}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 12%,#49305e 0,#21172f 38%,#100d1c 78%);color:#fff;font:15px/1.45 Inter,ui-sans-serif,system-ui,sans-serif;display:grid;place-items:center;padding:24px}.game{width:min(100%,760px);border:1px solid #ffd78350;border-radius:28px;background:linear-gradient(145deg,#2c203bcf,#130f20f2);box-shadow:0 28px 90px #0009,inset 0 1px #ffffff20;padding:clamp(20px,5vw,42px);position:relative;overflow:hidden}.game:before{content:"";position:absolute;inset:8px;border:1px solid #fff1;border-radius:21px;pointer-events:none}.top{display:flex;justify-content:space-between;align-items:center;gap:14px}.brand{font-size:12px;letter-spacing:.23em;color:var(--gold);font-weight:800}.balance{background:#0d0a16b3;border:1px solid var(--line);border-radius:999px;padding:10px 15px;color:var(--gold);font-weight:750}.balance small{color:var(--muted);font-weight:500;margin-right:8px}.title{text-align:center;margin:25px 0 3px;font-family:Georgia,serif;font-size:clamp(36px,8vw,64px);line-height:1;color:#ffe1a1;text-shadow:0 3px 25px #ffb82c55}.subtitle{text-align:center;color:var(--muted);margin:10px 0 25px}.machine{padding:15px;border:1px solid #ffdc904f;border-radius:19px;background:linear-gradient(180deg,#100c19,#21172d);box-shadow:inset 0 8px 20px #0008,0 12px 30px #0005}.reels{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.reel{height:clamp(65px,13vw,94px);display:grid;place-items:center;font-size:clamp(32px,7vw,50px);border-radius:12px;background:linear-gradient(150deg,#fff8,#fff0 22%),#f5e6c6;color:#24172a;box-shadow:inset 0 2px 6px #fff,0 4px 10px #0008;transition:transform .15s}.reel.spinning{animation:jiggle .16s linear infinite}@keyframes jiggle{50%{transform:translateY(4px) scale(.97)}}.message{height:28px;margin:12px 0 0;text-align:center;color:var(--gold);font-weight:700}.controls{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:22px}.bet-control{display:flex;align-items:center;gap:10px;padding:7px;border-radius:999px;border:1px solid var(--line);background:#100c19}.bet-control button,.sound{width:37px;height:37px;border:0;border-radius:50%;background:#ffffff12;color:white;font-size:20px;cursor:pointer}.bet{min-width:76px;text-align:center}.bet small{display:block;color:var(--muted);font-size:10px;letter-spacing:.12em}.bet strong{color:var(--gold);font-size:17px}.spin{border:0;border-radius:999px;padding:15px 32px;background:linear-gradient(#ffe49e,#ffb53d);color:#351c25;font-weight:900;letter-spacing:.1em;box-shadow:0 5px 0 #ad6824,0 9px 24px #ffbb4b44;cursor:pointer;transition:transform .15s}.spin:hover{transform:translateY(-2px)}.spin:active{transform:translateY(3px);box-shadow:0 2px 0 #ad6824}.spin:disabled{opacity:.6;cursor:wait}.sound{font-size:16px}.help{text-align:center;color:#8f849f;font-size:12px;margin:21px 0 0}.win .reel{animation:win .45s ease-in-out 3}@keyframes win{50%{box-shadow:0 0 28px #ffd65f, inset 0 2px 6px #fff;transform:scale(1.05)}}@media(max-width:520px){body{padding:12px}.game{padding:22px 15px;border-radius:21px}.reels{gap:5px}.reel{height:64px;border-radius:9px}.machine{padding:9px}.controls{gap:10px}.spin{padding:14px 21px}.sound{width:34px;height:34px}}
</style></head><body><main class="game" aria-label="Lucky Lantern slot machine"><div class="top"><div class="brand">✦ LUCKY LANTERN</div><div class="balance"><small>CREDITS</small><span id="credits">1,000</span></div></div><h1 class="title">Fortune is calling</h1><p class="subtitle">Spin beneath the lanterns. Let the good luck find you.</p><section class="machine" aria-label="Five-reel slot machine"><div class="reels" id="reels"></div><div class="message" id="message" aria-live="polite">Choose your bet and spin to begin</div></section><div class="controls"><div class="bet-control"><button id="minus" aria-label="Decrease bet">−</button><div class="bet"><small>BET / SPIN</small><strong id="bet">10</strong></div><button id="plus" aria-label="Increase bet">+</button></div><button class="spin" id="spin">SPIN</button><button class="sound" id="reset" title="Reset credits" aria-label="Reset credits">↻</button></div><p class="help">Match symbols across the center line to win · Three or more lanterns pay extra</p></main>
<script>
(()=>{const icons=['🍒','🍋','🍇','🔔','⭐','🏮','💎'],weights=[25,22,18,14,10,7,4],pay=[2,2,3,4,6,12,25];let credits=Number(localStorage.getItem('lantern-credits'))||1000,bet=10,busy=false;const reels=document.querySelector('#reels'),creditOut=document.querySelector('#credits'),betOut=document.querySelector('#bet'),msg=document.querySelector('#message'),spin=document.querySelector('#spin');const pick=()=>{let n=Math.random()*weights.reduce((a,b)=>a+b,0);for(let i=0;i<icons.length;i++){n-=weights[i];if(n<0)return i}return 0};function draw(values){reels.replaceChildren(...values.map(v=>{const cell=document.createElement('div');cell.className='reel';cell.textContent=icons[v];return cell}))}function update(){creditOut.textContent=credits.toLocaleString();betOut.textContent=bet;localStorage.setItem('lantern-credits',String(credits));document.querySelector('#minus').disabled=busy||bet<=5;document.querySelector('#plus').disabled=busy||bet>=Math.min(100,credits);spin.disabled=busy||credits<bet}document.querySelector('#minus').onclick=()=>{bet=Math.max(5,bet-5);update()};document.querySelector('#plus').onclick=()=>{bet=Math.min(100,credits,bet+5);update()};document.querySelector('#reset').onclick=()=>{if(!busy){credits=1000;bet=10;msg.textContent='Your credits are refreshed. Good luck!';update()}};spin.onclick=()=>{if(busy||credits<bet)return;busy=true;credits-=bet;msg.textContent='The lanterns are turning…';update();reels.classList.add('spinning');let ticks=0;const timer=setInterval(()=>{draw(Array.from({length:5},pick));if(++ticks>12){clearInterval(timer);reels.classList.remove('spinning');let result=Array.from({length:5},pick);draw(result);const counts={};result.forEach(x=>counts[x]=(counts[x]||0)+1);const best=Math.max(...Object.values(counts));let award=0;if(best>=3){const symbol=Number(Object.keys(counts).find(k=>counts[k]===best));award=bet*pay[symbol]*(best===3?1:best===4?3:8)}else if(result[2]===result[3]||result[2]===result[1])award=Math.floor(bet*.5);credits+=award;msg.textContent=award?`✨ ${best>=3?'A lucky match!':'A little return!'} You won ${award} credits!`:'No match this time — try again!';if(award){reels.classList.add('win');setTimeout(()=>reels.classList.remove('win'),1400)}busy=false;update()}},85)};draw([0,4,5,2,6]);update()})();
</script></body></html>
