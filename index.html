<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Dragon Slayer</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#090918;color:#fff;font-family:Georgia,'Times New Roman',serif}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}#ui{position:fixed;inset:0;pointer-events:none}#top{position:absolute;top:24px;left:28px;right:28px;display:flex;justify-content:space-between;align-items:flex-start;text-shadow:0 3px 12px #000}#title{font-size:15px;letter-spacing:5px;color:#bfc8ff;text-transform:uppercase}#level{font-size:11px;color:#97a4c8;margin-top:5px;letter-spacing:2px}.panel{text-align:right}.label{font-size:10px;letter-spacing:3px;color:#aeb9de}.value{font-size:29px;line-height:1;margin-top:4px}.hearts{margin-top:10px;display:flex;gap:7px}.heart{width:16px;height:16px;background:#db4d67;clip-path:path('M8 14 C-1 8 1 2 5 2 C7 2 8 4 8 4 C8 4 9 2 11 2 C15 2 17 8 8 14Z')}.heart.off{background:#323650}#bossbar{position:absolute;top:74px;left:50%;transform:translateX(-50%);width:min(420px,55vw);opacity:0;transition:.3s}.bossname{text-align:center;font-size:10px;letter-spacing:4px;color:#ffc0a0;margin-bottom:7px}.track{height:7px;border:1px solid #7d5562;background:#201827}.fill{height:100%;width:100%;background:linear-gradient(90deg,#bd3c50,#ff8165);box-shadow:0 0 12px #db5c67}#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,rgba(18,24,55,.25),rgba(5,5,18,.78));pointer-events:auto}.card{text-align:center;width:min(580px,86vw)}.eyebrow{font-size:11px;color:#aab5db;letter-spacing:7px;text-transform:uppercase}.card h1{font-size:clamp(48px,9vw,92px);line-height:.82;margin:18px 0 22px;text-transform:uppercase;letter-spacing:-3px;text-shadow:0 8px 30px #000}.card h1 span{display:block;font-size:.34em;letter-spacing:12px;color:#cf5161;margin-top:16px}.card p{color:#b9c1dc;font-size:15px;line-height:1.7;max-width:440px;margin:0 auto 28px}.button{border:1px solid rgba(181,194,242,.55);background:rgba(20,27,61,.72);color:#fff;padding:15px 30px;font:12px Georgia;letter-spacing:4px;text-transform:uppercase;cursor:pointer;box-shadow:0 8px 30px #050611}.button:hover{background:#252e60}.controls{margin-top:24px;font-size:10px;letter-spacing:2px;color:#7783aa}#toast{position:absolute;left:50%;top:100px;transform:translate(-50%,-15px);opacity:0;letter-spacing:5px;font-size:12px;color:#ffe7ad;transition:.25s;text-shadow:0 3px 12px #000}.show{opacity:1!important;transform:translate(-50%,0)!important}@media(max-width:650px){#top{top:14px;left:15px;right:15px}.value{font-size:22px}.heart{width:13px;height:13px}.controls{display:none}}
</style></head><body>
<canvas id="c"></canvas><div id="ui"><div id="top"><div><div id="title">Dragon Slayer</div><div id="level">THE ASHEN MOUNTAIN · STAGE 1</div></div><div class="panel"><div class="label">SCORE</div><div class="value" id="score">000000</div><div class="hearts" id="hearts"></div></div></div><div id="bossbar"><div class="bossname">THE EMBER WYRM</div><div class="track"><div class="fill" id="bossfill"></div></div></div><div id="toast">BLADE AWAKENED</div><div id="overlay"><div class="card"><div class="eyebrow" id="eyebrow">THE ASHEN MOUNTAIN</div><h1 id="maintitle">Dragon<span>Slayer</span></h1><p id="desc">The old wyrm has darkened the mountain pass.<br>Cross the fire and reclaim the realm.</p><button class="button" id="start">Begin the Hunt</button><div class="controls">WASD / ARROWS TO MOVE · CLICK OR SPACE TO ATTACK</div></div></div></div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');let W,H,DPR;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize;
let running=false,keys={},mx=0,my=0,fire=false,last=0,score=0,lives=3,stage=1,spawnT=0,boss=null,particles=[],projectiles=[],enemies=[],items=[];let p;
const rand=(a,b)=>a+Math.random*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function reset(){score=0;lives=3;stage=1;projectiles=[];enemies=[];items=[];particles=[];boss=null;spawnT=0;p={x:W/2,y:H*.82,r:15,speed:260,aimX:0,aimY:-1,cool:0,inv:0,blade:0,combo:0};updateUI();startStage()}function startStage(){document.getElementById('level').textContent=['THE ASHEN MOUNTAIN','THE CRIMSON PEAK','THE WYRM’S LAIR'][Math.min(stage-1,2)]+' · STAGE '+stage;spawnT=1}
function updateUI(){document.getElementById('score').textContent=String(score).padStart(6,'0');let h=document.getElementById('hearts');h.innerHTML='';for(let i=0;i<3;i++){let d=document.createElement('div');d.className='heart'+(i>=lives?' off':'');h.appendChild(d)} }
function burst(x,y,col,n=12){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,s=rand(30,180);particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.35,.8),max:1,size:rand(1,4),col})}}
function spawn(){if(stage===3&&!boss){boss={x:W/2,y:-130,r:55,hp:260,max:260,cd:1.5,phase:0};boss.y=130;document.getElementById('bossbar').classList.add('show');return}let side=Math.random()<.5,kind=stage===1?(Math.random()<.72?0:1):stage===2?(Math.random()<.45?1:Math.random()<.7?2:0):Math.random()<.5?2:1;if(boss)return;enemies.push({x:rand(40,W-40),y:-40,r:kind===2?23:kind===1?16:13,hp:kind===2?4:kind===1?2:1,max:kind===2?4:kind===1?2:1,speed:rand(38,70)+stage*10,kind,cd:rand(.5,1.5),phase:rand(0,6),hit:0})}
function shoot(x,y,angle,spd,enemy=false){projectiles.push({x,y,vx:Math.cos(angle)*spd,vy:Math.sin(angle)*spd,r:enemy?5:4,enemy,life:3})}
function loop(t){requestAnimationFrame(loop);let dt=Math.min((t-last)/1000,.033);last=t;if(!running)return;update(dt);draw()}
function update(dt){spawnT-=dt;if(spawnT<=0){spawn();spawnT=Math.max(.38,1.25-stage*.18)*(stage===3?1.7:1)}p.cool-=dt;p.inv-=dt;p.blade-=dt;let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);if(dx||dy){let l=Math.hypot(dx,dy);p.x+=dx/l*p.speed*dt;p.y+=dy/l*p.speed*dt}if(mx||my){let ax=mx-p.x,ay=my-p.y;if(Math.hypot(ax,ay)>8){p.aimX=ax/Math.hypot(ax,ay);p.aimY=ay/Math.hypot(ax,ay)}}p.x=clamp(p.x,25,W-25);p.y=clamp(p.y,80,H-25);if(fire&&p.cool<=0){shoot(p.x,p.aimY<-.2?p.x:p.x,p.y-18,Math.atan2(p.aimY,p.aimX),620);p.cool=.16;p.blade=.12;burst(p.x+p.aimX*18,p.y+p.aimY*18,'#d9e2ff',3)}
for(let i=projectiles.length-1;i>=0;i--){let q=projectiles[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.life-=dt;if(q.x<-30||q.x>W+30||q.y<-30||q.y>H+30||q.life<=0){projectiles.splice(i,1);continue}if(q.enemy){if(Math.hypot(q.x-p.x,q.y-p.y)<q.r+p.r&&p.inv<=0){projectiles.splice(i,1);hurt()}}else{let hit=false;if(boss&&Math.hypot(q.x-boss.x,q.y-boss.y)<q.r+boss.r){boss.hp--;boss.phase+=.03;score+=15;projectiles.splice(i,1);burst(q.x,q.y,'#ffb16a',5);if(boss.hp<=0){score+=5000;burst(boss.x,boss.y,'#ff9a62',40);boss=null;document.getElementById('bossbar').classList.remove('show');win()}continue}for(let j=enemies.length-1;j>=0;j--){let e=enemies[j];if(Math.hypot(q.x-e.x,q.y-e.y)<q.r+e.r){e.hp--;e.hit=.12;projectiles.splice(i,1);burst(q.x,q.y,'#ffd79a',5);if(e.hp<=0){score+=e.kind===2?350:e.kind===1?180:100;burst(e.x,e.y,e.kind===2?'#a66aff':'#ff714f',e.kind===2?18:10);if(Math.random()<.09)items.push({x:e.x,y:e.y,type:Math.random()<.5?'heart':'blade',r:12,life:10});enemies.splice(j,1)}hit=true;break}}}}
for(let i=enemies.length-1;i>=0;i--){let e=enemies[i];e.phase+=dt;e.hit-=dt;e.y+=e.speed*dt;if(e.kind===1)e.x+=Math.sin(e.phase*2)*65*dt;if(e.kind===2)e.x+=Math.sin(e.phase*1.2)*100*dt;e.cd-=dt;if(e.cd<=0){let a=Math.atan2(p.y-e.y,p.x-e.x);shoot(e.x,e.y,a,170+stage*20,true);e.cd=rand(1,2.2)}if(e.y>H+40||Math.hypot(e.x-p.x,e.y-p.y)<e.r+p.r){if(Math.hypot(e.x-p.x,e.y-p.y)<e.r+p.r)hurt();enemies.splice(i,1)}}
if(boss){boss.phase+=dt;boss.x=W/2+Math.sin(boss.phase*.7)*W*.28;boss.y=105+Math.sin(boss.phase*1.4)*28;boss.cd-=dt;if(boss.cd<=0){let n=stage===3?12:8;for(let k=0;k<n;k++){let a=Math.PI*2*k/n+boss.phase;shoot(boss.x,boss.y,a,180+(stage*25),true)}boss.cd=Math.max(.45,1.5-boss.phase*.02)}document.getElementById('bossfill').style.width=(boss.hp/boss.max*100)+'%';if(Math.hypot(boss.x-p.x,boss.y-p.y)<boss.r+p.r&&p.inv<=0)hurt()}
for(let i=items.length-1;i>=0;i--){let it=items[i];it.life-=dt;it.y+=38*dt;if(Math.hypot(it.x-p.x,it.y-p.y)<it.r+p.r){if(it.type==='heart')lives=Math.min(3,lives+1);else p.cool=Math.min(p.cool,.05);burst(it.x,it.y,'#ffef9a',15);score+=100;items.splice(i,1);toast(it.type==='heart'?'RESTORATION':'BLADE AWAKENED')}else if(it.life<=0||it.y>H+30)items.splice(i,1)}
for(let i=particles.length-1;i>=0;i--){let q=particles[i];q.life-=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.97;q.vy*=.97;if(q.life<=0)particles.splice(i,1)}updateUI();if(stage<3&&score>=stage*2200){stage++;startStage();toast('THE SUMMONS DEEPENS')}}
function hurt(){lives--;p.inv=1.8;burst(p.x,p.y,'#ff5570',18);if(lives<=0){running=false;document.getElementById('eyebrow').textContent='THE MOUNTAIN CLAIMS ANOTHER';document.getElementById('maintitle').innerHTML='Fallen';document.getElementById('desc').innerHTML='Final score: '+String(score).padStart(6,'0');document.getElementById('start').textContent='Rise Again';document.getElementById('overlay').style.display='flex'}else toast('LIFE LOST')}
function win(){running=false;document.getElementById('eyebrow').textContent='THE REALM IS FREE';document.getElementById('maintitle').innerHTML='Victory<span>Slayer</span>';document.getElementById('desc').innerHTML='The Ember Wyrm is no more.<br>Final score: '+String(score).padStart(6,'0');document.getElementById('start').textContent='Slay Again';document.getElementById('overlay').style.display='flex'}
function toast(s){let e=document.getElementById('toast');e.textContent=s;e.classList.add('show');clearTimeout(e.t);e.t=setTimeout(()=>e.classList.remove('show'),1500)}
function draw(){ctx.clearRect(0,0,W,H);let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#090a1d');g.addColorStop(.55,'#17152d');g.addColorStop(1,'#25172a');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='#17182e';ctx.beginPath();ctx.moveTo(0,H*.72);for(let x=0;x<=W;x+=80){ctx.lineTo(x,H*(.58+Math.sin(x*.012)*.06))}ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();ctx.fillStyle='#111226';ctx.beginPath();ctx.moveTo(0,H*.68);for(let x=0;x<=W;x+=55){ctx.lineTo(x,H*(.61+Math.sin(x*.027+2)*.05))}ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();ctx.globalAlpha=.12;ctx.fillStyle='#db8d75';for(let i=0;i<20;i++){let x=(i*173)%W,y=(i*97+((performance.now()/30)%H))%H;ctx.fillRect(x,y,1,rand(2,7))}ctx.globalAlpha=1;
for(let it of items){ctx.save();ctx.translate(it.x,it.y);ctx.rotate(performance.now*.003);ctx.fillStyle=it.type==='heart'?'#e45a70':'#e8dc87';ctx.beginPath();ctx.arc(0,0,it.r,0,7);ctx.fill();ctx.restore()}for(let q of projectiles){ctx.save();ctx.translate(q.x,q.y);ctx.shadowBlur=12;ctx.shadowColor=q.enemy?'#ff6348':'#87aaff';ctx.fillStyle=q.enemy?'#ff795e':'#dce8ff';ctx.beginPath();ctx.arc(0,0,q.r,0,7);ctx.fill();ctx.restore()}for(let e of enemies){ctx.save();ctx.translate(e.x,e.y);if(e.hit>0)ctx.filter='brightness(2)';ctx.fillStyle=e.kind===2?'#4f365f':e.kind===1?'#743247':'#9e3e3a';ctx.beginPath();if(e.kind===2){ctx.moveTo(-25,-8);ctx.lineTo(-15,-25);ctx.lineTo(0,-15);ctx.lineTo(15,-25);ctx.lineTo(25,-8);ctx.quadraticCurveTo(20,25,0,30);ctx.quadraticCurveTo(-20,25,-25,-8)}else{ctx.moveTo(-e.r,-e.r*.3);ctx.lineTo(-e.r*.6,-e.r);ctx.lineTo(0,-e.r*.7);ctx.lineTo(e.r*.6,-e.r);ctx.lineTo(e.r,-e.r*.3);ctx.lineTo(e.r*.7,e.r);ctx.lineTo(-e.r*.7,e.r);ctx.closePath()}ctx.fill();ctx.fillStyle='#ffb35d';ctx.fillRect(-e.r*.45,-3,3,3);ctx.fillRect(e.r*.45,-3,3,3);ctx.restore()}
if(boss){ctx.save();ctx.translate(boss.x,boss.y);ctx.fillStyle='#5b2639';ctx.beginPath();ctx.moveTo(-65,-18);ctx.lineTo(-48,-52);ctx.lineTo(-24,-42);ctx.lineTo(0,-70);ctx.lineTo(24,-42);ctx.lineTo(48,-52);ctx.lineTo(65,-18);ctx.quadraticCurveTo(55,45,0,58);ctx.quadraticCurveTo(-55,45,-65,-18);ctx.fill();ctx.fillStyle='#e59a53';ctx.beginPath();ctx.moveTo(-48,-42);ctx.lineTo(-70,-58);ctx.lineTo(-52,-20);ctx.fill();ctx.beginPath();ctx.moveTo(48,-42);ctx.lineTo(70,-58);ctx.lineTo(52,-20);ctx.fill();ctx.fillStyle='#ffcf67';ctx.fillRect(-30,-12,7,5);ctx.fillRect(23,-12,7,5);ctx.restore()}
for(let q of particles){ctx.globalAlpha=clamp(q.life/q.max,0,1);ctx.fillStyle=q.col;ctx.fillRect(q.x,q.y,q.size,q.size)}ctx.globalAlpha=1;if(p&&(!p.inv||Math.floor(p.inv*10)%2)){ctx.save();ctx.translate(p.x,p.y);if(p.blade>0){ctx.strokeStyle='#f4f1cf';ctx.lineWidth=3;ctx.shadowBlur=18;ctx.shadowColor='#aabaff';ctx.beginPath();ctx.moveTo(p.x*0+p.aimX*8,p.y*0+p.aimY*8);ctx.lineTo(p.aimX*34,p.aimY*34);ctx.stroke()}ctx.rotate(Math.atan2(p.aimY,p.aimX)+Math.PI/2);ctx.fillStyle='#bfc9e8';ctx.beginPath();ctx.moveTo(0,-18);ctx.lineTo(11,-7);ctx.lineTo(9,12);ctx.lineTo(0,18);ctx.lineTo(-9,12);ctx.lineTo(-11,-7);ctx.closePath();ctx.fill();ctx.fillStyle='#31507b';ctx.beginPath();ctx.moveTo(-8,-5);ctx.lineTo(8,-5);ctx.lineTo(6,8);ctx.lineTo(-6,8);ctx.closePath();ctx.fill();ctx.fillStyle='#e7be91';ctx.beginPath();ctx.arc(0,-10,5,0,7);ctx.fill();ctx.restore()}}
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space'){fire=true;e.preventRepeat=true}});addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;if(e.code==='Space')fire=false});canvas.addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY});canvas.addEventListener('pointerdown',e=>{fire=true;mx=e.clientX;my=e.clientY});canvas.addEventListener('pointerup',()=>fire=false);document.getElementById('start').onclick=()=>{document.getElementById('overlay').style.display='none';reset();running=true};resize();requestAnimationFrame(loop);
</script></body></html>
