<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Animal Kingdom — Wild Rescue</title>
  <style>
    :root{--ink:#183126;--cream:#fff8df;--gold:#ffc857;--green:#39785a;--dark:#10251d}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#87bd72;font-family:ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;color:var(--ink);touch-action:none}canvas{display:block;width:100%;height:100%}.ui{position:absolute;inset:0;pointer-events:none}.topbar{position:absolute;left:22px;right:22px;top:18px;display:flex;align-items:flex-start;justify-content:space-between}.panel{background:rgba(255,248,223,.94);border:3px solid #2d583e;border-radius:18px;box-shadow:0 7px 0 rgba(24,49,38,.18);padding:9px 14px}.stats{display:flex;gap:14px;align-items:center}.stat{font-weight:900;font-size:18px;white-space:nowrap}.stat span{color:#df6a3a}.mission{margin-top:8px;min-width:280px}.mission-title{font-size:12px;text-transform:uppercase;letter-spacing:1.5px;color:#55705f}.mission-row{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:900}.progress{height:8px;border-radius:99px;background:#d6d1a8;margin-top:7px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:#58a66c;border-radius:99px;transition:width .25s}.right-tools{display:flex;gap:8px}.iconbtn{pointer-events:auto;width:44px;height:44px;border:3px solid #2d583e;border-radius:50%;background:var(--cream);box-shadow:0 5px 0 rgba(24,49,38,.18);font-size:20px;cursor:pointer}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,rgba(255,250,218,.18),rgba(30,72,48,.42));pointer-events:auto}.overlay.hidden{display:none}.card{width:min(520px,calc(100% - 32px));text-align:center;background:var(--cream);border:4px solid #31583f;border-radius:28px;padding:28px;box-shadow:0 14px 0 rgba(24,49,38,.22),0 25px 45px rgba(15,43,30,.25)}.eyebrow{font-size:13px;letter-spacing:3px;text-transform:uppercase;color:#df6a3a;font-weight:900}.card h1{font-family:Georgia,serif;font-size:52px;line-height:.92;margin:10px 0 12px}.card p{font-size:17px;line-height:1.45;margin:8px auto 18px;max-width:420px}.animals{font-size:45px;letter-spacing:8px;margin:10px 0}.button{border:0;border-radius:16px;background:#f5a83b;color:#183126;font-size:18px;font-weight:900;padding:15px 24px;box-shadow:0 7px 0 #b96d28;cursor:pointer}.button:active{transform:translateY(4px);box-shadow:0 3px 0 #b96d28}.controls{position:absolute;left:18px;right:18px;bottom:18px;display:flex;justify-content:space-between;pointer-events:none}.dpad{display:grid;grid-template-columns:44px 44px 44px;grid-template-rows:44px 44px;gap:5px;pointer-events:auto}.move{border:3px solid #2d583e;border-radius:12px;background:rgba(255,248,223,.9);font-size:20px;font-weight:900}.move.up{grid-column:2}.move.left{grid-column:1;grid-row:2}.move.down{grid-column:2;grid-row:2}.move.right{grid-column:3;grid-row:2}.action{pointer-events:auto;align-self:end;width:74px;height:74px;border:4px solid #31583f;border-radius:50%;background:#ffca55;box-shadow:0 7px 0 #bc742f;font-size:29px}.toast{position:absolute;left:50%;bottom:112px;transform:translate(-50%,20px);background:#183126;color:white;border-radius:99px;padding:10px 18px;font-weight:900;opacity:0;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:700px){.topbar{left:10px;right:10px;top:8px}.panel{padding:7px 9px}.stat{font-size:14px}.stats{gap:8px}.mission{min-width:210px}.mission-row{font-size:12px}.right-tools{display:none}.card h1{font-size:42px}.controls{display:none}}
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div class="ui"><div class="topbar"><div><div class="panel stats"><div class="stat">🫐 <span id="berries">0</span>/15</div><div class="stat">🐾 <span id="rescued">0</span>/3</div><div class="stat">❤️ <span id="hearts">3</span></div></div><div class="panel mission"><div class="mission-title">Your mission</div><div class="mission-row" id="missionText">Collect berries • rescue 3 friends</div><div class="progress"><i id="progress"></i></div></div></div><div class="right-tools"><button class="iconbtn" id="pauseBtn" aria-label="Pause">Ⅱ</button></div></div>
  <div class="controls"><div class="dpad"><button class="move up" data-key="ArrowUp">▲</button><button class="move left" data-key="ArrowLeft">◀</button><button class="move down" data-key="ArrowDown">▼</button><button class="move right" data-key="ArrowRight">▶</button></div><button class="action" id="actionBtn">🐾</button></div><div class="toast" id="toast"></div>
  <div class="overlay" id="start"><div class="card"><div class="eyebrow">Wild Rescue</div><h1>Animal Kingdom</h1><div class="animals">🦊 🐰 🐼</div><p>Gather berries, guide the lost babies home, and keep clear of the hungry foxes!</p><button class="button" id="startBtn">Begin adventure</button></div></div>
  <div class="overlay hidden" id="end"><div class="card"><div class="eyebrow" id="endLabel">Kingdom restored!</div><h1 id="endTitle">Great work!</h1><div class="animals" id="endAnimals">🦊🐰🐼</div><p id="endText"></p><button class="button" id="againBtn">Play again</button></div></div></div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');let W,H,DPR=1,game;
const keys={};const animals=[{x:.18,y:.38,s:'🦊',name:'Foxy'},{x:.78,y:.31,s:'🐰',name:'Bunny'},{x:.72,y:.78,s:'🐼',name:'Panda'}];
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
function reset(){game={running:true,paused:false,player:{x:W*.5,y:H*.58,r:20,speed:210,facing:1,inv:0},berries:[],rescued:[],guards:[],berriesGot:0,rescuedCount:0,lives:3,time:0};for(let i=0;i<15;i++)spawnBerry();for(let i=0;i<4;i++)game.guards.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()<.5?-1:1)*(35+Math.random()*25),vy:(Math.random()<.5?-1:1)*(35+Math.random()*25)});updateUI()} 
function spawnBerry(){let x=70+Math.random()*Math.max(100,W-140),y=130+Math.random()*Math.max(100,H-220);game.berries.push({x,y,r:9,taken:false})}
function updateUI(){document.getElementById('berries').textContent=game.berriesGot;document.getElementById('rescued').textContent=game.rescuedCount;document.getElementById('hearts').textContent=game.lives;document.getElementById('progress').style.width=(game.rescuedCount/3*55+game.berriesGot/15*45)+'%'}
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1300)}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function begin(){document.getElementById('start').classList.add('hidden');document.getElementById('end').classList.add('hidden');reset();last=performance.now();requestAnimationFrame(loop)}
document.getElementById('startBtn').onclick=begin;document.getElementById('againBtn').onclick=begin;document.getElementById('pauseBtn').onclick=()=>{if(!game)return;game.paused=!game.paused};
addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault()});addEventListener('keyup',e=>keys[e.key]=false);
document.querySelectorAll('[data-key]').forEach(b=>{let k=b.dataset.key,bn=e=>{e.preventPreventDefault?.();keys[k]=true};b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true});b.addEventListener('pointerup',()=>keys[k]=false);b.addEventListener('pointercancel',()=>keys[k]=false)});
let last=0;
function loop(now){if(!game||!game.running)return;let dt=Math.min(.033,(now-last)/1000||0);last=now;if(!game.paused)update(dt);draw();requestAnimationFrame(loop)}
function update(dt){let g=game,p=g.player;let dx=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0),dy=(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0);if(dx||dy){let l=Math.hypot(dx,dy);p.x+=dx/l*p.speed*dt;p.y+=dy/l*p.speed*dt;if(dx)p.facing=dx}p.x=Math.max(30,Math.min(W-30,p.x));p.y=Math.max(115,Math.min(H-30,p.y));p.inv=Math.max(0,p.inv-dt);g.time+=dt;
 g.berries.forEach(b=>{if(!b.taken&&dist(p,b)<p.r+b.r){b.taken=true;g.berriesGot++;updateUI();toast('Berry found!  '+g.berriesGot+'/15')}});
 animals.forEach((a,i)=>{if(g.rescued.includes(i))return;let pos={x:W*a.x,y:H*a.y};if(dist(p,pos)<45){g.rescued.push(i);g.rescuedCount++;updateUI();toast(a.name+' is safe!')}});
 g.guards.forEach(q=>{q.x+=q.vx*dt;q.y+=q.vy*dt;if(q.x<25||q.x>W-25)q.vx*=-1;if(q.y<120||q.y>H-25)q.vy*=-1;if(dist(p,q)<34&&p.inv<=0){p.inv=1.8;g.lives--;updateUI();p.x=W*.5;p.y=H*.58;toast('Watch out for foxes!');if(g.lives<=0)finish(false)}});
 if(g.berriesGot>=15&&g.rescuedCount>=3)finish(true)}
function finish(won){game.running=false;let e=document.getElementById('end');e.classList.remove('hidden');document.getElementById('endLabel').textContent=won?'Kingdom restored!':'The wild wins this round';document.getElementById('endTitle').textContent=won?'Great work!':'Try again!';document.getElementById('endText').textContent=won?`You gathered ${game.berriesGot} berries and brought all three baby animals home.`:'Keep moving and avoid the hungry foxes to rescue every friend.'}
function draw(){ctx.clearRect(0,0,W,H);let sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#9dcc83');sky.addColorStop(1,'#76b45d');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
 ctx.fillStyle='#73a85c';for(let i=0;i<9;i++){ctx.beginPath();ctx.arc(i*W/8,70+Math.sin(i)*18,100,0,Math.PI*2);ctx.fill()}ctx.fillStyle='#85bb69';ctx.beginPath();ctx.moveTo(0,H*.55);for(let x=0;x<=W;x+=80)ctx.quadraticCurveTo(x+40,H*.48+Math.sin(x*.01)*45,x+80,H*.55);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();
 ctx.fillStyle='rgba(255,243,174,.18)';for(let i=0;i<18;i++){let x=(i*137%W),y=(i*83%H);ctx.beginPath();ctx.arc(x,y,2+(i%3),0,7);ctx.fill()}
 ctx.fillStyle='#d4b66b';ctx.beginPath();ctx.ellipse(W*.5,H*.62,Math.min(180,W*.18),55,0,0,7);ctx.fill();ctx.fillStyle='#cda95e';ctx.beginPath();ctx.ellipse(W*.5,H*.62,Math.min(115,W*.11),28,0,0,7);ctx.fill();
 drawBerry(game.berries);animals.forEach((a,i)=>{if(!game.rescued.includes(i)){ctx.save();ctx.translate(W*a.x,H*a.y);ctx.font='45px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(a.s,0,0);ctx.restore()}});
 game.guards.forEach(q=>{ctx.save();ctx.translate(q.x,q.y);ctx.font='34px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🦊',0,0);ctx.restore()});
 let p=game.player;if(p.inv<=0||Math.floor(p.inv*8)%2===0){ctx.save();ctx.translate(p.x,p.y);ctx.scale(p.facing,1);ctx.font='40px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🐻',0,0);ctx.restore()}}
function drawBerry(arr){arr.forEach(b=>{if(b.taken)return;ctx.save();ctx.translate(b.x,b.y);ctx.rotate(Math.sin(game.time*2+b.x)*.12);ctx.font='19px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🫐',0,0);ctx.restore()})}
</script>
</body>
</html>
