<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Drift King</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Teko:wght@500;600&display=swap');
:root{--cyan:#55efff;--pink:#ff355d;--ink:#090b10}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#090b10;color:#fff;font-family:Rajdhani,system-ui,sans-serif}canvas{display:block;width:100%;height:100%}.hud{position:absolute;inset:0;pointer-events:none}.topbar{position:absolute;left:28px;right:28px;top:22px;display:flex;justify-content:space-between;align-items:flex-start}.brand{font-family:Teko,sans-serif;font-size:30px;line-height:.8;letter-spacing:3px;text-transform:uppercase;text-shadow:0 0 18px rgba(85,239,255,.25)}.brand b{color:var(--pink)}.scorebox{text-align:right}.label{font-size:11px;letter-spacing:3px;color:#8e99a8;text-transform:uppercase}.score{font-family:Teko;font-size:48px;line-height:.85;color:#fff}.combo{color:var(--cyan);font-size:16px;font-weight:700;letter-spacing:2px}.leftstats{position:absolute;left:28px;bottom:28px}.speed{font-family:Teko;font-size:68px;line-height:.75}.speed span{font-family:Rajdhani;font-size:13px;color:#98a2af}.gear{margin-top:12px;color:var(--cyan);letter-spacing:3px;font-size:12px}.boostbar{position:absolute;left:28px;bottom:82px;width:220px;height:5px;background:rgba(255,255,255,.12);transform:skewX(-18deg)}.boostbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--pink),#ffb15a);box-shadow:0 0 14px var(--pink)}.lapbox{position:absolute;right:28px;bottom:28px;text-align:right}.lapbox .lapnum{font-family:Teko;font-size:38px}.driftmeter{position:absolute;left:50%;bottom:30px;transform:translateX(-50%) text-align:center;width:280px}.driftmeter .label{margin-bottom:7px}.meter{height:7px;background:rgba(255,255,255,.12);transform:skewX(-20deg)}.meter i{display:block;height:100%;width:0%;background:var(--cyan);box-shadow:0 0 16px var(--cyan);transition:width .08s}.start,.end{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 58%,rgba(21,31,42,.2),rgba(5,7,11,.82));pointer-events:auto}.start.hidden,.end.hidden{display:none}.panel{text-align:center}.panel .eyebrow{color:var(--cyan);font-weight:700;font-size:12px;letter-spacing:6px}.panel h1{font-family:Teko;margin:5px 0 2px;font-size:94px;line-height:.9;text-transform:uppercase;letter-spacing:-2px}.panel h1 em{color:var(--pink);font-style:normal}.panel p{color:#aeb7c2;font-size:14px;letter-spacing:2px}.panel button{margin-top:24px;border:0;background:var(--pink);color:white;font-family:Teko;font-size:22px;letter-spacing:3px;padding:13px 34px;transform:skewX(-8deg);cursor:pointer;box-shadow:0 12px 40px rgba(255,53,93,.25)}.panel button span{display:inline-block;transform:skewX(8deg)}.controls{margin-top:28px;font-size:11px;color:#738092;letter-spacing:2px}.controls b{color:#fff}.mobile{display:none;position:absolute;inset:0;pointer-events:none}.touch{pointer-events:auto;position:absolute;bottom:34px;width:68px;height:68px;border:1px solid rgba(255,255,255,.18);border-radius:50%;background:rgba(10,14,20,.35);color:#fff;font-size:20px}.touch.left{left:24px}.touch.right{left:104px}.touch.drift{right:24px;width:78px;height:78px;border-color:rgba(255,53,93,.55);color:var(--pink)}.touch.boost{right:112px;width:62px;height:62px;color:var(--cyan)}@media(max-width:700px){.topbar{left:16px;right:16px;top:14px}.brand{font-size:24px}.score{font-size:38px}.leftstats{left:16px;bottom:118px}.boostbar{left:16px;bottom:172px;width:150px}.lapbox{right:16px;bottom:118px}.driftmeter{bottom:116px;width:150px}.mobile{display:block}.controls{display:none}.panel h1{font-size:66px}.panel p{font-size:11px}}
</style></head>
<body>
<canvas id="game"></canvas>
<div class="hud">
 <div class="topbar"><div class="brand">DRIFT <b>KING</b></div><div class="scorebox"><div class="label">SCORE</div><div class="score" id="score">000000</div><div class="combo" id="combo">CHAIN x1</div></div></div>
 <div class="boostbar"><i id="boostFill"></i></div>
 <div class="leftstats"><div class="label">SPEED</div><div class="speed"><b id="speed">0</b> <span>KM/H</span></div><div class="gear" id="gear">GEAR 1</div></div>
 <div class="lapbox"><div class="label">LAP</div><div class="lapnum"><span id="lap">1</span> / 3</div></div>
 <div class="driftmeter"><div class="label" id="driftLabel">DRIFT</div><div class="meter"><i id="driftFill"></i></div></div>
</div>
<div class="start" id="start"><div class="panel"><div class="eyebrow">NIGHTRUN // TOKYO</div><h1>DRIFT <em>KING</em></h1><p>Hold the corners. Link your drifts. Own the night.</p><button id="play"><span>START ENGINE</span></button><div class="controls"><b>WASD / ARROWS</b> DRIVE &nbsp;&nbsp; <b>SPACE</b> DRIFT &nbsp;&nbsp; <b>SHIFT</b> BOOST</div></div></div>
<div class="end hidden" id="end"><div class="panel"><div class="eyebrow">RUN COMPLETE</div><h1 id="finalTitle">KING</h1><p id="finalScore">SCORE 000000</p><button id="again"><span>RACE AGAIN</span></button></div></div>
<div class="mobile"><button class="touch left" data-key="left">◀</button><button class="touch right" data-key="right">▶</button><button class="touch boost" data-key="boost">N₂O</button><button class="touch drift" data-key="drift">DRIFT</button></div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');let W,H,dpr;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const keys={};let started=false,ended=false,score=0,combo=1,driftScore=0,boost=100,lap=1,elapsed=0;
let car={x:0,y:0,a:0,v:0,drifting:false,trail:[]};
const road=[{x:-.30,y:1.10,r:.18},{x:.10,y:.72,r:.24},{x:.42,y:.42,r:.20},{x:.22,y:.05,r:.22},{x:-.26,y:-.25,r:.20},{x:.14,y:-.58,r:.23},{x:.48,y:-.82,r:.18},{x:.15,y:-1.12,r:.24},{x:-.35,y:-1.38,r:.20}];
let trees=[];for(let i=0;i<180;i++){trees.push({a:Math.random()*Math.PI*2,r:Math.random()*1.3+.95,s:Math.random()*.7+.3})}
function sx(p){return W/2+p*H*.52}function sy(p){return H/2-p*H*.46}
function posOnRoad(t){t=((t%road.length)+road.length)%road.length;let i=Math.floor(t),f=t-i,a=road[i],b=road[(i+1)%road.length];return{x:a.x+(b.x-a.x)*f,y:a.y+(b.y-a.y)*f,r:a.r+(b.r-a.r)*f}}
car=Object.assign(car,posOnRoad(0));
function curve(x,y){ctx.beginPath();for(let i=0;i<road.length;i++){let p=road[i],nx=sx(p.x),ny=sy(p.y);if(i===0)ctx.moveTo(nx,ny);else ctx.lineTo(nx,ny)}ctx.closePath()}
function draw(){ctx.clearRect(0,0,W,H);let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#080b12');g.addColorStop(1,'#111822');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 // grid horizon
 ctx.strokeStyle='rgba(85,239,255,.025)';ctx.lineWidth=1;for(let i=-12;i<=12;i++){ctx.beginPath();ctx.moveTo(W/2+i*H*.06,H);ctx.lineTo(W/2+i*H*.018,0);ctx.stroke()}for(let y=0;y<H;y+=38){ctx.globalAlpha=.35+.65*y/H;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}ctx.globalAlpha=1;
 // wet road
 ctx.save();curve();ctx.fillStyle='#151a22';ctx.fill();ctx.clip();ctx.globalAlpha=.12;ctx.fillStyle='#55efff';ctx.fillRect(0,H*.38,W,H*.08);ctx.restore();
 // road edge and lane markings
 ctx.save();ctx.strokeStyle='#303945';ctx.lineWidth=road[0].r*H*.52*2;ctx.lineJoin='round';ctx.beginPath();road.forEach((p,i)=>i?ctx.lineTo(sx(p.x),sy(p.y)):ctx.moveTo(sx(p.x),sy(p.y)));ctx.closePath();ctx.stroke();ctx.strokeStyle='#18202a';ctx.lineWidth=road[0].r*H*.52*1.82;ctx.stroke();ctx.setLineDash([18,18]);ctx.lineDashOffset=-elapsed*20;ctx.strokeStyle='rgba(210,220,230,.32)';ctx.lineWidth=2;ctx.stroke();ctx.restore();
 // neon roadside lights
 road.forEach((p,i)=>{let x=sx(p.x),y=sy(p.y);ctx.fillStyle=i%2?'#ff355d':'#55efff';ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=12;ctx.fillRect(x-3,y-3,6,6);ctx.shadowBlur=0});
 // trees/city props
 ctx.fillStyle='#1b2530';trees.forEach(t=>{let x=sx(Math.sin(t.a)*t.r),y=sy(Math.cos(t.a)*t.r*.7);let size=(t.s*(.7+t.r*.25))*18;if(x>-20&&x<W+20&&y>-20&&y<H+20){ctx.beginPath();ctx.moveTo(x,y-size);ctx.lineTo(x-size*.55,y+size*.35);ctx.lineTo(x+size*.55,y+size*.35);ctx.fill()}});
 // drift tire marks
 car.trail.forEach((q,i)=>{ctx.globalAlpha=i/car.trail.length*.32;ctx.fillStyle='#050608';ctx.beginPath();ctx.arc(q.x,q.y,3,0,7);ctx.fill();ctx.beginPath();ctx.arc(q.x+q.s,q.y+q.s*.2,3,0,7);ctx.fill()});ctx.globalAlpha=1;
 drawCar();}
function drawCar(){ctx.save();ctx.translate(sx(car.x),sy(car.y));ctx.rotate(-car.a);ctx.scale(Math.max(.75,Math.min(1.25,W/900)),Math.max(.75,Math.min(1.25,W/900)));ctx.shadowColor='#55efff';ctx.shadowBlur=car.drifting?18:8;ctx.fillStyle='#dce4ea';ctx.beginPath();ctx.moveTo(-12,-25);ctx.lineTo(12,-25);ctx.lineTo(17,-12);ctx.lineTo(15,20);ctx.lineTo(-15,20);ctx.lineTo(-17,-12);ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#ff355d';ctx.fillRect(-14,-22,28,5);ctx.fillStyle='#171c24';ctx.beginPath();ctx.moveTo(-10,-10);ctx.lineTo(10,-10);ctx.lineTo(13,5);ctx.lineTo(-13,5);ctx.closePath();ctx.fill();ctx.fillStyle='#ff355d';ctx.fillRect(-12,17,7,3);ctx.fillRect(5,17,7,3);ctx.restore()}
function update(dt){if(!started||ended)return;elapsed+=dt;let throttle=keys.ArrowUp||keys.w||keys.W||keys.up;let brake=keys.ArrowDown||keys.s||keys.S||keys.down;let left=keys.ArrowLeft||keys.a||keys.A||keys.left;let right=keys.ArrowRight||keys.d||keys.D||keys.right;let drifting=keys[' ']||keys.drift;let boosting=(keys.Shift||keys.shift||keys.boost)&&boost>5;
 car.v+=throttle?.55:throttle?0:-.18;if(brake)car.v-=.7;car.v*=.992;car.v=Math.max(-1.2,Math.min(6.5+(boosting?2.1:0),car.v));let steer=(left?-1:0)+(right?1:0);car.drifting=drifting&&Math.abs(car.v)>2&&steer!==0;if(car.drifting){car.a+=steer*.035*(1+car.v*.05);driftScore+=Math.abs(steer)*car.v*.18;score+=Math.floor(driftScore*.012*combo);combo=Math.min(9,1+Math.floor(driftScore/500));boost=Math.min(100,boost+.18)}else{car.a+=steer*.022*(1+car.v*.06);car.a*=.995;if(driftScore>20){driftScore=Math.max(0,driftScore-7)}else{combo=1;driftScore=0}}if(boosting){boost-=.8;car.v+=.08}else{boost=Math.min(100,boost+.04)}
 car.x+=Math.cos(car.a)*car.v*dt*.19;car.y+=Math.sin(car.a)*car.v*dt*.19;if(car.drifting){car.trail.push({x:sx(car.x),y:sy(car.y),s:steer*3});if(car.trail.length>90)car.trail.shift()}if(Math.hypot(car.x,car.y)>1.8){score=Math.max(0,score-25);car.v*=.96}
 document.getElementById('score').textContent=Math.floor(score).toString().padStart(6,'0');document.getElementById('combo').textContent='CHAIN x'+combo;document.getElementById('speed').textContent=Math.floor(Math.abs(car.v)*24);document.getElementById('gear').textContent='GEAR '+Math.min(6,Math.max(1,Math.ceil(Math.abs(car.v)/1.2)));document.getElementById('boostFill').style.width=boost+'%';document.getElementById('driftFill').style.width=Math.min(100,driftScore%500/5)+'%';document.getElementById('driftLabel').textContent=car.drifting?'DRIFTING +'+Math.floor(driftScore):'DRIFT';lap=Math.min(3,1+Math.floor(elapsed/30));document.getElementById('lap').textContent=lap;if(elapsed>90){ended=true;document.getElementById('end').classList.remove('hidden');document.getElementById('finalScore').textContent='SCORE '+Math.floor(score).toString().padStart(6,'0')}}
let last=performance.now();function loop(now){let dt=Math.min(.033,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
addEventListener('keydown',e=>{keys[e.key]=true;keys[e.code]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventPreventDefault?.()});addEventListener('keyup',e=>{keys[e.key]=false;keys[e.code]=false});
document.querySelectorAll('.touch').forEach(b=>{let k=b.dataset.key;for(let ev of ['pointerdown','pointerup','pointerleave','pointercancel'])b.addEventListener(ev,e=>{e.preventDefault();keys[k]=(ev==='pointerdown')})});
function start(){started=true;ended=false;document.getElementById('start').classList.add('hidden');document.getElementById('end').classList.add('hidden');score=0;elapsed=0;lap=1;boost=100;car={x:-.30,y:1.10,a:0,v:0,drifting:false,trail:[]}}document.getElementById('play').onclick=start;document.getElementById('again').onclick=start;
</script></body></html>
