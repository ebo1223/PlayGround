<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Minecraft 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Inter:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#82b9df;font-family:Inter,sans-serif;user-select:none}
canvas{display:block}#crosshair{position:fixed;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%, -50%);pointer-events:none;z-index:5}
#crosshair:before,#crosshair:after{content:"";position:absolute;background:rgba(20,20,20,.8);box-shadow:0 0 0 1px rgba(255,255,255,.7)}#crosshair:before{width:2px;height:18px;left:8px}#crosshair:after{height:2px;width:18px;top:8px}
#hud{position:fixed;inset:0;pointer-events:none;color:white;z-index:4;text-shadow:2px 2px 0 #3a3a3a}.topbar{position:absolute;left:22px;top:18px;display:flex;gap:10px}.badge{background:rgba(20,20,30,.55);border:2px solid rgba(255,255,255,.18);border-radius:10px;padding:8px 12px;font-size:14px;backdrop-filter:blur(8px)}
#hotbar{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);display:flex;gap:5px}.slot{width:58px;height:58px;border:3px solid rgba(15,20,25,.8);background:rgba(55,55,65,.72);box-shadow:inset 0 0 0 2px rgba(255,255,255,.12);border-radius:8px;display:grid;place-items:center;position:relative}.slot.active{border-color:#fff;transform:translateY(-5px);box-shadow:0 5px 0 rgba(0,0,0,.35),inset 0 0 0 2px #f5d76e}.slot .num{position:absolute;left:5px;top:3px;font-size:11px}.cubeicon{width:28px;height:28px;border:2px solid rgba(0,0,0,.25);box-shadow:inset -5px -5px rgba(0,0,0,.12)}
#status{position:absolute;left:22px;bottom:25px;font-size:13px;background:rgba(20,20,30,.55);border-radius:8px;padding:8px 10px}.hearts{position:absolute;right:24px;bottom:25px;font-size:22px;letter-spacing:2px;color:#ef4e50;text-shadow:2px 2px 0 #7d1820}
#pause{position:fixed;inset:0;background:rgba(15,19,28,.38);backdrop-filter:blur(5px);z-index:10;display:grid;place-items:center}#pause.hidden{display:none}.panel{width:min(440px,calc(100% - 40px));background:rgba(28,34,42,.94);border:3px solid #e8e4d4;border-radius:18px;color:white;text-align:center;padding:30px;box-shadow:0 20px 50px rgba(0,0,0,.35)}.panel h1{font-family:Fredoka,sans-serif;font-size:42px;margin:0 0 8px}.panel p{color:#cbd2d8;margin:0 0 22px}.panel button{pointer-events:auto;border:0;border-radius:10px;background:#62a94a;color:white;font-weight:800;font-size:18px;padding:14px 28px;box-shadow:0 5px 0 #3f742e;cursor:pointer}.panel button:active{transform:translateY(3px);box-shadow:0 2px 0 #3f742e}.controls{display:grid;grid-template-columns:1fr 1fr;text-align:left;gap:8px 20px;margin:18px 0 24px;color:#dfe6e8;font-size:13px}.controls b{color:#ffd76a}
#toast{position:absolute;left:50%;top:110px;transform:translateX(-50%);background:rgba(20,25,32,.78);border-radius:8px;padding:9px 14px;opacity:0;transition:.25s}.coords{position:absolute;right:22px;top:22px}
</style>
</head>
<body>
<div id="crosshair"></div>
<div id="hud"><div class="topbar"><div class="badge">⛏️ <span id="score">0</span> blocks</div><div class="badge">🌲 <span id="biome">Forest</span></div></div><div class="coords badge" id="coords">XYZ 0 / 0 / 0</div><div id="status">WASD move · Mouse look · Space jump</div><div class="hearts">♥ ♥ ♥ ♥ ♥</div><div id="hotbar"></div><div id="toast"></div></div>
<div id="pause"><div class="panel"><h1>MINECRAFT 3D</h1><p>Explore, mine, and build in a tiny infinite-feeling world.</p><div class="controls"><div><b>WASD</b> Move</div><div><b>SPACE</b> Jump</div><div><b>MOUSE</b> Look</div><div><b>1–5</b> Select block</div><div><b>LMB</b> Mine</div><div><b>RMB</b> Place</div><div><b>SHIFT</b> Sprint</div><div><b>ESC</b> Pause</div></div><button id="play">Start Playing</button></div></div>
<script type="module" src="game.js"></script>
</body></html>
