<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sunset Park</title>
<style>
*{box-sizing:border-box} :root{--ink:#183c3d;--cream:#fff8e9;--gold:#ffc44d;--orange:#f58c40;--green:#6dbb65}
body{margin:0;font-family:Trebuchet MS,Arial,sans-serif;color:var(--ink);overflow:hidden;background:#9fd5dc}
#app{height:100vh;display:grid;grid-template-rows:78px 1fr 168px}
header{z-index:4;background:var(--cream);display:flex;align-items:center;padding:10px 18px;border-bottom:4px solid #e9c979;box-shadow:0 4px 12px #315a5530}
.brand{display:flex;align-items:center;gap:10px;width:240px}.logo{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#ffd86d,#f79a4c);display:grid;place-items:center;font-size:30px;border:3px solid #fff}.brand b{display:block;font-size:19px}.brand small{color:#6b8580}
.stats{display:flex;gap:10px;margin-left:auto}.stat{min-width:105px;height:54px;border:2px solid #e7dba9;border-radius:12px;background:#fffdf4;padding:7px 12px}.stat small{display:block;color:#71827d}.stat strong{font-size:20px}.stat strong span{color:#d99b27}
main{position:relative;overflow:hidden;background:#86cfc1}#world{width:100%;height:100%;display:block;cursor:crosshair}
.toast{position:absolute;left:50%;top:18px;transform:translateX(-50%);background:#183c3de8;color:white;border-radius:20px;padding:8px 16px;font-weight:bold;opacity:0;transition:.25s}.toast.show{opacity:1}
.goal{position:absolute;right:18px;top:18px;width:230px;background:#fffdf4e9;border:3px solid #ebd99a;border-radius:14px;padding:12px;box-shadow:0 5px 15px #315a5530}.goal h3{margin:0 0 8px;font-size:15px}.bar{height:8px;background:#dfebd8;border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:#69b85e;width:0%;transition:.3s}
.bottom{z-index:5;background:var(--cream);border-top:4px solid #e9c979;display:grid;grid-template-columns:190px 1fr 190px;padding:10px 18px;box-shadow:0 -4px 14px #315a5530}.panel-title{font-size:12px;text-transform:uppercase;letter-spacing:1.5px;color:#78908b;margin:3px 0 8px}.tools{display:flex;gap:8px}.tool{position:relative;width:132px;height:112px;border:2px solid #e4d6a5;border-radius:14px;background:#fffdf6;text-align:center;cursor:pointer;padding:7px 5px}.tool.selected{border:3px solid #ef9c43;background:#fff3c9;transform:translateY(-3px)}.tool-icon{font-size:46px;height:58px}.tool b{display:block;font-size:13px}.tool em{font-style:normal;color:#b17e31;font-size:12px}.tool[data-type="erase"] em{color:#c06d62}
.actions{display:flex;flex-direction:column;gap:7px;align-items:flex-end}.actions button{border:0;border-radius:10px;background:#fff;color:#315b58;height:43px;padding:0 13px;font-weight:bold;cursor:pointer;border:2px solid #e4d6a5}.actions .primary{background:#ef9c43;color:white;border-color:#d47d32}.speed{display:flex;gap:4px}.speed button{width:43px}.speed button.active{background:#6caa63;color:white;border-color:#568d50}
@media(max-width:780px){.brand{width:150px}.brand small{display:none}.stat{min-width:74px;padding:5px}.stat strong{font-size:15px}.bottom{grid-template-columns:1fr 104px}.actions:first-child{display:none}.tool{width:100px}.goal{display:none}}
</style></head>
<body><div id="app">
<header><div class="brand"><div class="logo">🎡</div><div><b>Sunset Park</b><small>build & bloom</small></div></div>
<div class="stats"><div class="stat"><small>Funds</small><strong><span>$</span> <b id="cash">240</b></strong></div><div class="stat"><small>Visitors</small><strong id="visitors">18</strong></div><div class="stat"><small>Rating</small><strong>★ <b id="rating">72</b></strong></div><div class="stat"><small>Day</small><strong id="day">1</strong></div></div></header>
<main><canvas id="world"></canvas><div class="toast" id="toast">Placed!</div><div class="goal"><h3>Park goal</h3><div style="display:flex;justify-content:space-between;font-size:13px"><span>Reach 50 visitors</span><b id="goalText">18 / 50</b></div><div class="bar"><i id="goalBar"></i></div></div></main>
<footer class="bottom"><div><div class="panel-title">Build menu</div><div class="tools"><button class="tool selected" data-type="ride"><div class="tool-icon">🎠</div><b>Carousel</b><em>$60</em></button><button class="tool" data-type="coaster"><div class="tool-icon">🎢</div><b>Coaster</b><em>$110</em></button><button class="tool" data-type="snack"><div class="tool-icon">🍦</div><b>Snack Shop</b><em>$45</em></button><button class="tool" data-type="plant"><div class="tool-icon">🌳</div><b>Tree</b><em>$15</em></button><button class="tool" data-type="erase"><div class="tool-icon">🚫</div><b>Remove</b><em>Refund 50%</em></button></div></div><div></div><div class="actions"><div class="panel-title">Park control</div><div class="speed"><button id="pause">Ⅱ</button><button class="active" data-speed="1">1×</button><button data-speed="2">2×</button></div><button class="primary" id="newDay">Start next day</button></div></footer>
</div>
<script>
const canvas=document.getElementById('world'),ctx=canvas.getContext('2d');let W,H,selected='ride',cash=240,visitors=18,rating=72,day=1,paused=false,speed=1,last=0,spawn=0;
const buildings=[],people=[],clouds=[{x:80,y:60,s:1},{x:470,y:38,s:.7},{x:800,y:80,s:1.1}];
const defs={ride:{cost:60,icon:'🎠',income:5,rating:3},coaster:{cost:110,icon:'🎢',income:9,rating:5},snack:{cost:45,icon:'🍦',income:4,rating:2},plant:{cost:15,icon:'🌳',income:0,rating:1}};
const parkBounds={x:70,y:25,w:760,h:430};
function resize(){const r=canvas.getBoundingClientRect();W=canvas.width=r.width*devicePixelRatio;H=canvas.height=r.height*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);W=r.width;H=r.height}addEventListener('resize',resize);resize();
function iso(x,y){const cx=W/2,cy=H*.12;return{x:cx+(x-y)*30,y:cy+(x+y)*15}}
function poly(p,r,c){ctx.fillStyle=c;ctx.beginPath();p.forEach((q,i)=>{let s=iso(q[0],q[1]);i?ctx.lineTo(s.x,s.y):ctx.moveTo(s.x,s.y)});ctx.closePath();ctx.fill();ctx.strokeStyle='#74ae73';ctx.lineWidth=1;ctx.stroke()}
function rounded(x,y,w,h,c){ctx.fillStyle=c;ctx.beginPath();ctx.roundRect(x,y,w,h,8);ctx.fill()}
function drawGround(){ctx.fillStyle='#86cfc1';ctx.fillRect(0,0,W,H);clouds.forEach(cl=>{ctx.fillStyle='#e8faf5';ctx.globalAlpha=.75;ctx.beginPath();ctx.arc(cl.x,cl.y,18*cl.s,0,7);ctx.arc(cl.x+22*cl.s,cl.y-5*cl.s,24*cl.s,0,7);ctx.arc(cl.x+47*cl.s,cl.y,19*cl.s,0,7);ctx.fill();ctx.globalAlpha=1});
for(let x=-10;x<27;x++)for(let y=-10;y<27;y++){if(x+y>2&&x+y<31){poly([[x,y],[x+1,y],[x+1,y+1],[x,y+1]],1,(x+y)%2?'#82c86f':'#8bd578')}}
for(let i=0;i<19;i++){let p=iso(i,0);ctx.strokeStyle='#e7d9a0';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(p.x,p.y);p=iso(i,19);ctx.lineTo(p.x,p.y);ctx.stroke()} }
function drawBuilding(b){let p=iso(b.x,b.y);ctx.save();ctx.translate(p.x,p.y);if(b.type==='plant'){ctx.fillStyle='#5b8d48';ctx.beginPath();ctx.ellipse(0,16,22,9,0,0,7);ctx.fill();ctx.fillStyle='#6d4b31';ctx.fillRect(-4,-20,8,38);ctx.fillStyle='#3e8d50';ctx.beginPath();ctx.arc(-13,-26,16,0,7);ctx.arc(12,-29,18,0,7);ctx.arc(0,-43,20,0,7);ctx.fill()}else{ctx.fillStyle='#00000018';ctx.beginPath();ctx.ellipse(0,18,38,12,0,0,7);ctx.fill();let base=b.type==='coaster'?'#9cae72':b.type==='snack'?'#e9b84d':'#ef9a64';rounded(-28,-22,56,42,base);ctx.fillStyle='#fff2c4';ctx.fillRect(-22,-17,44,9);ctx.fillStyle='#c85a56';ctx.fillRect(-26,-28,52,8);ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.strokeRect(-22,-17,44,9);ctx.fillStyle='#fff';ctx.font='24px sans-serif';ctx.textAlign='center';ctx.fillText(defs[b.type].icon,0,-32);if(b.type==='ride'){ctx.strokeStyle='#d45b52';ctx.beginPath();ctx.arc(0,-18,22,Math.PI,Math.PI*2);ctx.stroke()}if(b.type==='coaster'){ctx.strokeStyle='#b94d54';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-30,-7);ctx.quadraticCurveTo(0,-45,30,-7);ctx.stroke();ctx.strokeStyle='#70433a';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-25,3);ctx.lineTo(-25,-10);ctx.moveTo(25,3);ctx.lineTo(25,-10);ctx.stroke()}}ctx.restore()}
function screenToGrid(sx,sy){let cx=W/2,cy=H*.12;let u=(sx-cx)/(30),v=(sy-cy)/(15);let x=(u+v)/2,y=(v-u)/2;return{x:Math.round(x),y:Math.round(y)}}
canvas.addEventListener('pointerdown',e=>{let r=canvas.getBoundingClientRect(),g=screenToGrid(e.clientX-r.left,e.clientY-r.top);if(g.x<1||g.x>18||g.y<2||g.y>18)return;let hit=buildings.findIndex(b=>b.x===g.x&&b.y===g.y);if(selected==='erase'){if(hit>=0){let b=buildings[hit];cash+=Math.floor(defs[b.type].cost*.5);buildings.splice(hit,1);rating=Math.max(1,rating-1);update();toast('Removed & refunded')}return}if(hit>=0)return toast('That spot is occupied');let d=defs[selected];if(cash<d.cost)return toast('Not enough coins');cash-=d.cost;buildings.push({x:g.x,y:g.y,type:selected,age:0});rating=Math.min(100,rating+d.rating);update();toast(d.icon+' placed')});
document.querySelectorAll('.tool').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tool').forEach(a=>a.classList.remove('selected'));t.classList.add('selected');selected=t.dataset.type});
document.getElementById('pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'▶':'Ⅱ'};document.querySelectorAll('[data-speed]').forEach(b=>b.onclick=()=>{speed=+b.dataset.speed;document.querySelectorAll('[data-speed]').forEach(a=>a.classList.remove('active'));b.classList.add('active')});
function toast(s){let el=document.getElementById('toast');el.textContent=s;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),1400)}
function update(){document.getElementById('cash').textContent=cash;document.getElementById('visitors').textContent=visitors;document.getElementById('rating').textContent=rating;document.getElementById('day').textContent=day;document.getElementById('goalText').textContent=visitors+' / 50';document.getElementById('goalBar').style.width=Math.min(100,visitors/50*100)+'%'}
document.getElementById('newDay').onclick=()=>{let income=buildings.reduce((n,b)=>n+defs[b.type].income,0)+Math.floor(rating*.12);cash+=income;visitors+=Math.max(2,Math.floor(rating/9)+buildings.length);day++;update();toast('Day '+day+' — +$'+income);if(visitors>=50){toast('🎉 Goal complete! Your park is blooming!')}};
function loop(t){let dt=Math.min(.04,(t-last)/1000||0);last=t;if(!paused){spawn-=dt*speed;if(spawn<0){spawn=1.2;people.push({x:9,y:19,tx:3+Math.random()*15,ty:3+Math.random()*14,phase:Math.random()*7,life:35+Math.random()*20,color:['#ed7066','#4d91ba','#f2ba4a','#765da7'][Math.floor(Math.random()*4)]})}for(let p of people){p.phase+=dt*speed;p.life-=dt*speed;if(Math.abs(p.tx-p.x)>0.08||Math.abs(p.ty-p.y)>0.08){p.x+=(p.tx-p.x)*dt*.45*speed;p.y+=(p.ty-p.y)*dt*.45*speed}else{p.tx=2+Math.random()*16;p.ty=3+Math.random()*13}}while(people.length&&people[0].life<0)people.shift()}drawGround();let items=[...buildings.map(b=>({k:'b',x:b.x,y:b.y,v:b})),...people.map(p=>({k:'p',x:p.x,y:p.y,v:p}))].sort((a,b)=>(a.x+a.y)-(b.x+b.y));items.forEach(o=>{if(o.k==='b')drawBuilding(o.v);else{let p=iso(o.x,o.y);ctx.fillStyle='#00000025';ctx.beginPath();ctx.ellipse(p.x,p.y+5,7,3,0,0,7);ctx.fill();ctx.fillStyle=o.v.color;ctx.beginPath();ctx.arc(p.x,p.y-7,5,0,7);ctx.fill();ctx.fillRect(p.x-4,p.y-2,8,10);ctx.fillStyle='#ffe0b0';ctx.beginPath();ctx.arc(p.x,p.y-10,4,0,7);ctx.fill()}});requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
