<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/><link rel="icon" href="data:,"/><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/><title>Basketball Stars</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;font-family:Impact,'Arial Black',sans-serif;background:#0c1830;color:#fff}canvas{display:block;width:100%;height:100%;touch-action:none}.ui{position:absolute;inset:0;pointer-events:none}.hud{position:absolute;top:22px;left:50%;transform:translateX(-50%);width:min(840px,70vw);display:flex;justify-content:space-between;align-items:flex-start}.player{display:flex;align-items:center;gap:10px}.avatar{width:62px;height:62px;border:4px solid #fff;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#ff5b32,#bb2819);font-size:35px;box-shadow:0 5px 0 #5e1724}.avatar.blue{background:linear-gradient(145deg,#37a4ff,#1560cb);box-shadow:0 5px 0 #143b7a}.name{text-shadow:2px 3px 0 #14213b}.name small{display:block;color:#ffda45;font-size:12px;letter-spacing:1px}.score{text-align:center}.time{font-family:Arial,sans-serif;font-weight:900;background:#f4f1df;color:#16213b;border-radius:8px;padding:7px 18px;font-size:24px;box-shadow:0 5px 0 #aaa996}.total{font-size:46px;line-height:48px;text-shadow:4px 5px 0 #17213b}.right{text-align:right}.right .avatar{order:2}.right .name{order:1}.brand{position:absolute;left:32px;top:20px;color:#ffdf42;font-size:19px;transform:rotate(-4deg);text-shadow:3px 3px 0 #c44b24}.brand b{color:#fff}.help{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);background:rgba(7,19,43,.74);border:2px solid rgba(255,255,255,.65);border-radius:14px;padding:8px 18px;font-family:Arial,sans-serif;font-size:13px;letter-spacing:.5px}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(8,19,44,.35);backdrop-filter:blur(3px);pointer-events:auto}.panel{width:min(460px,86vw);text-align:center;background:linear-gradient(150deg,#173c78,#0d1d43);border:5px solid #fff;border-radius:24px;padding:28px 28px 24px;box-shadow:0 16px 0 rgba(4,12,30,.45),inset 0 0 40px rgba(74,160,255,.18)}.panel h1{margin:0;color:#ffdc48;font-size:48px;line-height:.95;text-shadow:4px 5px 0 #b44c23}.panel p{font-family:Arial,sans-serif;color:#dbeaff}.panel button{border:0;border-radius:12px;background:#ffcf32;color:#17213b;font-family:Impact,'Arial Black',sans-serif;font-size:24px;padding:14px 28px;box-shadow:0 7px 0 #c06e20;cursor:pointer}.panel button:active{transform:translateY(5px);box-shadow:0 2px 0 #c06e20}.hidden{display:none}@media(max-width:700px){.hud{width:92vw;top:10px}.avatar{width:48px;height:48px;font-size:26px}.name{font-size:13px}.total{font-size:34px}.time{font-size:18px;padding:5px 10px}.brand{display:none}.help{font-size:11px;bottom:8px;white-space:nowrap}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="ui"><div class="brand"><b>BASKETBALL</b><br>STARS</div>
<div class="hud"><div class="player"><div class="avatar">♛</div><div class="name"><small>PLAYER 1</small><span>JAY</span></div></div><div class="score"><div class="time" id="time">60</div><div class="total"><span id="p1">0</span> : <span id="p2">0</span></div></div><div class="player right"><div class="avatar blue">♛</div><div class="name"><small>CPU</small><span>ACE</span></div></div></div>
<div class="help" id="help">MOVE: WASD / ARROWS &nbsp; • &nbsp; JUMP: W / UP &nbsp; • &nbsp; SHOOT: SPACE</div><div class="overlay" id="overlay"><div class="panel"><h1 id="title">BASKETBALL<br>STARS</h1><p id="message">First to outscore the CPU in 60 seconds!</p><button id="start">PLAY NOW</button></div></div></div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');let W,H,dpr;function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const keys={};addEventListener('keydown',e=>{keys[e.code]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();if(e.code==='KeyR'&&ended)start()});addEventListener('keyup',e=>keys[e.code]=false);
let p1={x:0,y:0,vx:0,vy:0,dir:1,score:0},p2={x:0,y:0,vx:0,vy:0,dir:-1,score:0},ball={x:0,y:0,vx:0,vy:0,r:17,held:true,owner:1,rot:0},time=60,started=false,ended=false,last=0,particles=[];
p1.x=W*.28;p2.x=W*.72;
function start(){p1={x:W*.28,y:0,vx:0,vy:0,dir:1,score:0};p2={x:W*.72,y:0,vx:0,vy:0,dir:-1,score:0};ball={x:p1.x,y:0,vx:0,vy:0,r:17,held:true,owner:1,rot:0};time=60;started=true;ended=false;document.getElementById('overlay').classList.add('hidden');document.getElementById('p1').textContent='0';document.getElementById('p2').textContent='0';last=performance.now()}
function ground(){return H*.78}function hoopY(){return H*.43}function rimX(){return W*.83}
function playerMove(pl,keysOn,dt,ai=false){const g=ground();if(pl.y===0&&((keysOn===1&&keys.KeyW)||(!ai&&keysOn===2&&keys.ArrowUp)||(!ai&&keysOn===1&&keys.Space&&Math.random()>1))){pl.vy=-Math.min(H*.75,620)}if(!ai){let mx=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0);pl.vx+=(mx*420-pl.vx)*Math.min(1,dt*8)}else{pl.vx+=(Math.max(-180,Math.min(180,(ball.owner===2||ball.owner===0?ball.x:rimX()-30)-pl.x))*2.2-pl.vx)*Math.min(1,dt*5)}pl.vx*=.995;pl.x=Math.max(48,Math.min(W*.92,pl.x+pl.vx*dt));pl.vy+=H*1.55*dt;pl.y+=pl.vy*dt;if(pl.y>0){pl.y-=pl.vy*dt;pl.vy+=H*1.55*dt;pl.y+=pl.vy*dt}if(pl.y>0&&pl.y+pl.vy*dt>=0){pl.y=0;pl.vy=0}else{pl.y+=pl.vy*dt;if(pl.y>0){pl.y=0;pl.vy=0}}}
// simpler arcade physics with grounded Y coordinate
function updatePlayer(pl,move,dt,ai=false){const speed=380;pl.vx+=(move*speed-pl.vx)*Math.min(1,dt*9);pl.x+=pl.vx*dt;if(pl.x<55)pl.x=55;if(pl.x>W-55)pl.x=W-55;pl.vy+=1100*dt;pl.y+=pl.vy*dt;if(pl.y>0){pl.y=0;pl.vy=0}}
function jump(pl){if(pl.y===0){pl.vy=-650}}
function shoot(owner){let pl=owner===1?p1:p2;let tx=owner===1?rimX():W*.17,ty=hoopY();let dx=tx-pl.x,dy=ty-(ground()-55+pl.y);let t=Math.max(.45,Math.abs(dx)/650);ball.owner=0;ball.held=false;ball.x=pl.x+(owner===1?32:-32);ball.y=ground()-98+pl.y;ball.vx=dx/t;ball.vy=dy/t-430*.7*t}
let aiCooldown=0;
function update(dt){if(!started||ended)return;time-=dt;if(time<=0){time=0;ended=true;let win=p1.score===p2.score?'IT\'S A TIE!':p1.score>p2.score?'YOU WIN!':'CPU WINS';document.getElementById('title').innerHTML=win;document.getElementById('message').textContent=`Final score  ${p1.score} : ${p2.score}`;document.getElementById('start').textContent='PLAY AGAIN';document.getElementById('overlay').classList.remove('hidden');return}
let mx=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0);updatePlayer(p1,mx,dt);if(keys.KeyW||keys.ArrowUp)jump(p1);if(keys.Space&&!ball.held?false:false){if(ball.held&&ball.owner===1){shoot(1);keys.Space=false}}
updatePlayer(p2,ball.owner===2||ball.owner===0?Math.sign(ball.x-p2.x):Math.sign(W*.68-p2.x),dt,true);aiCooldown-=dt;if(ball.held&&ball.owner===2&&aiCooldown<=0){if(Math.random()<.02){shoot(2);aiCooldown=1}}if(p2.y===0&&ball.owner===0&&p2.x-rimX()<20&&Math.random()<.008&&ball.x<W*.5)jump(p2);
if(ball.held){let pl=ball.owner===1?p1:p2;ball.x=pl.x+(ball.owner===1?35:-35);ball.y=ground()-95+pl.y}
else{ball.vy+=1000*dt;ball.vx*=.999;ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;ball.rot+=ball.vx*dt*.02;if(ball.y>ground()-ball.r&&ball.vy>0){ball.y=ground()-ball.r;ball.vy*=-.62;ball.vx*=.82;if(Math.abs(ball.vy)<70)ball.vy=-250}
if(ball.x<ball.r){ball.x=ball.r;ball.vx=Math.abs(ball.vx)*.75}if(ball.x>W-ball.r){ball.x=W-ball.r;ball.vx=-Math.abs(ball.vx)*.75}
// pass complete / possession steal
for(const [n,pl] of [[1,p1],[2,p2]]){if(Math.hypot(ball.x-pl.x,ball.y-(ground()-48+pl.y))<42){if(n===1&&keys.KeyS){};if(n===1&&keys.Space&&ball.owner===0){ball.owner=1;ball.held=true}else if(n===2&&ball.owner===0&&Math.random()<.04){ball.owner=2;ball.held=true}}}
// scoring - hoop is right; player crosses right rim
if(ball.y>hoopY()-8&&ball.y<hoopY()+42&&ball.x>rimX()-20&&ball.x<rimX()+38&&ball.vy>0&&ball.vx>0){p1.score+=2;flash(p1.score===0?'':'');resetBall(2)}if(ball.y>hoopY()-8&&ball.y<hoopY()+42&&ball.x>rimX()-20&&ball.x<rimX()+38&&ball.vy>0&&ball.vx>0){}}
// CPU scoring on left hoop omitted: CPU shoots at right? adjust scoring below
particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt});particles=particles.filter(p=>p.life>0);document.getElementById('time').textContent=Math.ceil(time)}
function resetBall(owner){ball.owner=owner;ball.held=true;ball.x=owner===1?p1.x:p2.x;ball.y=ground()-95;burst(rimX(),hoopY(),owner===1?'#ffcf32':'#58aaff');document.getElementById(owner===1?'p1':'p2').textContent=owner===1?p1.score:p2.score}
function burst(x,y,c){for(let i=0;i<16;i++){let a=Math.random()*Math.PI*2,s=80+Math.random()*180;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.5+Math.random()*.5,c})}}
function flash(){}
function draw(){ctx.clearRect(0,0,W,H);let sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#1e65b1');sky.addColorStop(.48,'#79b7dc');sky.addColorStop(.49,'#e4ae67');sky.addColorStop(1,'#bb6e3c');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
// arena lights
ctx.fillStyle='rgba(255,246,180,.18)';for(let i=0;i<5;i++){ctx.beginPath();ctx.moveTo(W*(.12+i*.19),0);ctx.lineTo(W*(.09+i*.19),H*.38);ctx.lineTo(W*(.15+i*.19),H*.38);ctx.fill()} 
ctx.fillStyle='#183b61';ctx.beginPath();ctx.arc(W*.5,-H*.25,W*.32,0,Math.PI*2);ctx.fill();ctx.strokeStyle='rgba(255,255,255,.12)';ctx.lineWidth=3;for(let y=H*.2;y<H*.78;y+=35){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
// court
ctx.fillStyle='#c68a4a';ctx.fillRect(0,ground(),W,H-ground());ctx.fillStyle='#b87c42';ctx.fillRect(0,ground(),W,8);ctx.strokeStyle='rgba(255,241,184,.7)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(W*.5,ground());ctx.lineTo(W*.5,H);ctx.stroke();ctx.beginPath();ctx.arc(W*.5,ground()+45,105,0,Math.PI);ctx.stroke();ctx.beginPath();ctx.ellipse(W*.83,ground()-10,85,18,0,0,Math.PI*2);ctx.stroke();
// hoop backboard and rim
ctx.fillStyle='#d8dde0';ctx.fillRect(rimX()+20,hoopY()-72,12,142);ctx.fillStyle='rgba(220,240,255,.75)';ctx.fillRect(rimX()-5,hoopY()-65,96,54);ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.strokeRect(rimX()-5,hoopY()-65,96,54);ctx.strokeStyle='#f54b30';ctx.lineWidth=7;ctx.beginPath();ctx.arc(rimX()+30,hoopY()-5,27,.02,Math.PI-.02);ctx.stroke();ctx.strokeStyle='#f1b7a1';ctx.lineWidth=2;for(let i=0;i<5;i++){ctx.beginPath();ctx.moveTo(rimX()+8+i*11,hoopY()+10);ctx.lineTo(rimX()+3+i*12,hoopY()+55);ctx.stroke()}
// left board for symmetric look
drawPlayer(p1,1);drawPlayer(p2,2);if(ball)drawBall();for(const p of particles){ctx.globalAlpha=Math.max(0,p.life*2);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,5,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1}
function drawPlayer(pl,n){let x=pl.x,y=ground()+pl.y,dir=n===1?1:-1;ctx.save();ctx.translate(x,y);ctx.scale(dir,1);ctx.fillStyle='rgba(0,0,0,.22)';ctx.beginPath();ctx.ellipse(0,0,45,10,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=n===1?'#f04c2e':'#287ed2';ctx.beginPath();ctx.moveTo(-25,-64);ctx.lineTo(26,-64);ctx.lineTo(32,-20);ctx.lineTo(-31,-20);ctx.fill();ctx.fillStyle=n===1?'#9b2e20':'#14569c';ctx.fillRect(-24,-19,18,23);ctx.fillRect(7,-19,18,23);ctx.fillStyle=n===1?'#ffc85c':'#ffb84e';ctx.beginPath();ctx.arc(0,-88,25,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(-20,-61,40,10);ctx.fillStyle='#18213a';ctx.font='900 15px Arial';ctx.textAlign='center';ctx.fillText(n===1?'JAY':'ACE',0,-53);ctx.restore()}
function drawBall(){ctx.save();ctx.translate(ball.x,ball.y);ctx.rotate(ball.rot);ctx.fillStyle='#f49b32';ctx.beginPath();ctx.arc(0,0,ball.r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#542c1d';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-ball.r,0);ctx.lineTo(ball.r,0);ctx.moveTo(0,-ball.r);ctx.lineTo(0,ball.r);ctx.moveTo(-11,-14);ctx.quadraticCurveTo(16,-6,11,16);ctx.stroke();ctx.restore()}
function loop(now){let dt=Math.min(.033,(now-last)/1000||0);last=now;update(dt);draw();requestAnimationFrame(loop)}document.getElementById('start').onclick=start;requestAnimationFrame(loop);
</script>
</body></html>
