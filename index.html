<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Sudoku Master</title>
<style>
:root{--ink:#17213a;--muted:#8790a3;--purple:#6958d9;--line:#dfe3ec;--blue:#edf2ff;--paper:#fff}*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:#f4f6fb}.app{min-height:100vh}.topbar{height:72px;background:#fff;border-bottom:1px solid #edf0f5;display:flex;align-items:center}.nav{width:min(1120px,calc(100% - 40px));margin:auto;display:flex;align-items:center}.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:20px}.brandmark{width:38px;height:38px;border-radius:10px;background:var(--purple);display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:8px;box-shadow:0 7px 16px #6958d933}.brandmark i{background:#fff;border-radius:1.5px}.navlinks{display:flex;gap:33px;margin-left:74px;height:72px}.navlinks button{border:0;background:none;color:#929aab;font-weight:700;font-size:14px;padding:0;position:relative}.navlinks button.active{color:var(--purple)}.navlinks button.active:after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--purple);border-radius:3px}.profile{margin-left:auto;width:38px;height:38px;border:0;border-radius:50%;background:#edf0f7;color:#6d7587;font-weight:800}.main{width:min(1120px,calc(100% - 40px));margin:34px auto 24px;display:grid;grid-template-columns:190px 540px 190px;justify-content:center;gap:34px}.panel-title{font-size:11px;font-weight:800;letter-spacing:1.6px;color:#adb3c1;margin:8px 0 13px}.difficulty{display:flex;flex-direction:column;gap:9px}.difficulty button{height:48px;border:1px solid #e7eaf1;background:#fff;border-radius:10px;color:#777f91;font-weight:750;text-align:left;padding:0 15px;cursor:pointer}.difficulty button.active{border-color:#cdc7f7;color:var(--purple);background:#f4f2ff}.stats{margin-top:28px}.stat{height:64px;background:#fff;border:1px solid #edf0f5;border-radius:12px;margin-bottom:9px;padding:12px 15px}.stat span{display:block;font-size:11px;color:#adb3c1;font-weight:700}.stat strong{display:block;font-size:20px;margin-top:5px}.game-head{display:flex;align-items:center;margin:0 0 17px}.game-head h1{font-size:24px;margin:0}.game-actions{margin-left:auto;display:flex;gap:8px}.iconbtn{width:40px;height:40px;border:1px solid #e7eaf1;background:#fff;border-radius:9px;color:#7c8496;cursor:pointer;font-size:16px}.board-wrap{background:#fff;border:1px solid #edf0f5;border-radius:16px;padding:14px;box-shadow:0 10px 30px rgba(34,44,74,.06)}.board{display:grid;grid-template-columns:repeat(9,1fr);aspect-ratio:1;width:100%;border:2.5px solid #69718a;border-radius:5px;overflow:hidden}.cell{border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:#fff;color:#69718a;font-size:24px;font-weight:550;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}.cell:nth-child(3n){border-right:2px solid #69718a}.cell:nth-child(9n){border-right:0}.cell:nth-child(n+19):nth-child(-n+27),.cell:nth-child(n+46):nth-child(-n+54){border-bottom:2px solid #69718a}.cell.fixed{color:#26314a;font-weight:800}.cell.selected{background:#dfe7ff!important}.cell.related{background:#f4f6fb}.cell.same{background:#e8edff;color:var(--purple)}.cell.error{background:#ffe9ea;color:#dd6671}.pad-title{margin-top:8px}.number-pad{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.num{height:53px;border:1px solid #e7eaf1;border-radius:9px;background:#fff;color:#626b80;font-size:19px;font-weight:800;cursor:pointer}.num.used{opacity:.32}.tool-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.tool{height:48px;border:1px solid #e7eaf1;background:#fff;border-radius:9px;color:#7c8496;font-weight:750;cursor:pointer}.tool.active{border-color:#cdc7f7;color:var(--purple);background:#f4f2ff}.mistakes{display:flex;gap:6px;margin-top:12px}.mistake-dot{width:9px;height:9px;border-radius:50%;background:#edf0f5}.mistake-dot.on{background:#ed7b86}.progress-card{height:86px;margin-top:26px;background:#fff;border:1px solid #edf0f5;border-radius:12px;padding:16px}.progress-card span{font-size:12px;color:#9aa1b0;font-weight:700}.bar{height:7px;background:#edf0f5;border-radius:8px;margin-top:12px;overflow:hidden}.bar i{display:block;height:100%;background:var(--purple);width:0;border-radius:8px}.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:#252c43;color:#fff;padding:12px 18px;border-radius:9px;opacity:0;transition:.25s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:950px){.main{grid-template-columns:170px minmax(420px,540px);}.right{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr}.number-pad{grid-template-columns:repeat(9,1fr)}.pad-title{display:none}.tool-row{grid-column:2}.mistakes{grid-column:1}.progress-card{display:none}}@media(max-width:680px){.topbar{height:58px}.nav{width:calc(100% - 24px)}.navlinks{margin-left:20px;gap:18px}.navlinks button{font-size:12px}.brand{font-size:17px}.brandmark{width:34px;height:34px}.profile{display:none}.main{width:calc(100% - 24px);margin-top:18px;display:block}.left{display:none}.game-head h1{font-size:20px}.board-wrap{padding:8px}.cell{font-size:20px}.right{margin-top:12px}.number-pad{grid-template-columns:repeat(9,1fr);gap:4px}.num{height:48px}.tool-row{margin-top:6px}.progress-card{display:none}}
</style>
</head><body><div class="app"><header class="topbar"><nav class="nav"><div class="brand"><div class="brandmark"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>Sudoku Master</div><div class="navlinks"><button class="active">Play</button><button>Challenges</button><button>Statistics</button></div><button class="profile">JD</button></nav></header><main class="main"><aside class="left"><div class="panel-title">DIFFICULTY</div><div class="difficulty"><button data-level="easy">Easy</button><button class="active" data-level="medium">Medium</button><button data-level="hard">Hard</button><button data-level="expert">Expert</button></div><div class="stats"><div class="panel-title">CURRENT GAME</div><div class="stat"><span>Time</span><strong id="timer">08:24</strong></div><div class="stat"><span>Errors</span><strong id="errorCount">0 / 3</strong></div></div></aside><section class="center"><div class="game-head"><h1 id="levelTitle">Medium puzzle</h1><div class="game-actions"><button class="iconbtn" id="undo" title="Undo">↶</button><button class="iconbtn" id="reset" title="Reset">↻</button></div></div><div class="board-wrap"><div class="board" id="board"></div></div></section><aside class="right"><div class="panel-title pad-title">NUMBERS</div><div class="number-pad" id="pad"></div><div class="tool-row"><button class="tool" id="notes">✎ Notes</button><button class="tool" id="erase">⌫ Erase</button></div><div class="mistakes" id="mistakes"><span class="mistake-dot"></span><span class="mistake-dot"></span><span class="mistake-dot"></span></div><div class="progress-card"><span id="progressText">Progress: 0%</span><div class="bar"><i id="bar"></i></div></div></aside></main></div><div class="toast" id="toast"></div>
<script>
const puzzles={easy:'530070000600195000098000060800060003400803001700020006060000280000419005000080079',medium:'530070000600195000098000060800060003400803001700020006060000280000419005000080079',hard:'000260701680070090190004500820100040004602900050003008004000030000070006503000920',expert:'300000000005009000200504000020000700160000058704310600000890100000067080000005437'};
let solution='534678912672195348198342567859761423426853791713924856961537284287419635345286179';let board=[],fixed=[],selected=-1,notesMode=false,errors=0,history=[],seconds=504;
const boardEl=document.getElementById('board'),pad=document.getElementById('pad');
for(let i=1;i<=9;i++){let b=document.createElement('button');b.className='num';b.textContent=i;b.dataset.n=i;b.onclick=()=>enter(i);pad.appendChild(b)}
function newGame(level='medium'){const p=puzzles[level];board=p.split('').map(Number);fixed=board.map(v=>v!==0);selected=-1;errors=0;history=[];notesMode=false;document.getElementById('notes').classList.remove('active');document.getElementById('levelTitle').textContent=level[0].toUpperCase()+level.slice(1)+' puzzle';update()}
function render(){boardEl.innerHTML='';board.forEach((v,i)=>{const c=document.createElement('button');c.className='cell';if(fixed[i])c.classList.add('fixed');if(i===selected)c.classList.add('selected');if(selected>=0&&v===board[selected]&&v!==0&&i!==selected)c.classList.add('same');if(selected>=0&&(Math.floor(i/9)===Math.floor(selected/9)||i%9===selected%9||(Math.floor(i/27)===Math.floor(selected/27)&&Math.floor((i%9)/3)===Math.floor((selected%9)/3))))c.classList.add('related');c.textContent=v||'';c.onclick=()=>{selected=i;render()};boardEl.appendChild(c)})}
function enter(n){if(selected<0||fixed[selected])return;history.push({index:selected,value:board[selected]});if(notesMode){board[selected]=0;toast('Notes mode: tap a number (prototype)');return}board[selected]=n;const correct=Number(solution[selected]);if(n!==correct){errors++;document.querySelectorAll('.cell')[selected].classList.add('error');document.querySelectorAll('.mistake-dot')[Math.min(errors-1,2)].classList.add('on');if(errors>=3)setTimeout(()=>{toast('Too many mistakes — puzzle reset');newGame(document.querySelector('.difficulty .active').dataset.level)},350)}update()}
function update(){render();document.getElementById('errorCount').textContent=errors+' / 3';document.querySelectorAll('.mistake-dot').forEach((d,i)=>d.classList.toggle('on',i<errors));const filled=board.filter((v,i)=>v!==0&&!fixed[i]).length;const empty=board.filter((v,i)=>v===0&&!fixed[i]).length;const pct=Math.round(filled/(filled+empty)*100)||0;document.getElementById('progressText').textContent='Progress: '+pct+'%';document.getElementById('bar').style.width=pct+'%';document.querySelectorAll('.num').forEach(b=>b.classList.toggle('used',[...board].filter(v=>v===Number(b.dataset.n)).length>=9));if(board.join('')===solution)toast('Puzzle complete — brilliant!')}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(e.t);e.t=setTimeout(()=>e.classList.remove('show'),2200)}
document.querySelectorAll('.difficulty button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.difficulty button').forEach(x=>x.classList.remove('active'));b.classList.add('active');newGame(b.dataset.level);toast(b.textContent+' puzzle loaded')});
document.getElementById('notes').onclick=function(){notesMode=!notesMode;this.classList.toggle('active',notesMode)};document.getElementById('erase').onclick=()=>{if(selected>=0&&!fixed[selected]){history.push({index:selected,value:board[selected]});board[selected]=0;update()}};document.getElementById('undo').onclick=()=>{const h=history.pop();if(h&&!fixed[h.index]){board[h.index]=h.value;update()}};document.getElementById('reset').onclick=()=>newGame(document.querySelector('.difficulty .active').dataset.level);
window.onkeydown=e=>{if(/^Digit[1-9]$/.test(e.code))enter(Number(e.code.slice(-1)));if(e.key==='Backspace'||e.key==='Delete')document.getElementById('erase').click();if(e.key==='ArrowLeft'&&selected%9>0)selected--;else if(e.key==='ArrowRight'&&selected%9<8)selected++;else if(e.key==='ArrowUp'&&selected>=9)selected-=9;else if(e.key==='ArrowDown'&&selected<72)selected+=9;render()};setInterval(()=>{seconds++;let m=String(Math.floor(seconds/60)).padStart(2,'0'),s=String(seconds%60).padStart(2,'0');document.getElementById('timer').textContent=m+':'+s},1000);newGame('medium');
</script></body></html>
