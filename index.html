<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Gridiron 2026</title>
<style>
:html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111e;font-family:Arial,Helvetica,sans-serif;touch-action:none}
#game{position:relative;width:100vw;height:100vh;overflow:hidden;background:#5b8e40}
canvas{display:block;width:100%;height:100%}
#hud{position:absolute;left:0;right:0;top:0;height:86px;background:linear-gradient(180deg,#101827 0%,#172235 78%,#101827 78%,#101827 100%);color:white;border-bottom:4px solid #ffb21c;display:flex;align-items:center;padding:9px 22px 10px;box-sizing:border-box;gap:18px;box-shadow:0 5px 18px #0008}
.team{display:flex;align-items:center;gap:9px;min-width:210px}.team.right{margin-left:auto;text-align:right}.crest{width:49px;height:49px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:19px;border:3px solid white}.home .crest{background:#b51e35}.away .crest{background:#1d58a7}.name{font-size:15px;font-weight:800;letter-spacing:1px}.score{font-size:34px;font-weight:900}.right .crest{order:2}.right{justify-content:flex-end}
#clockBox{width:250px;text-align:center}.quarter{font-size:12px;color:#ffcc63;font-weight:900;letter-spacing:2px}.clock{font-size:27px;font-weight:900}.down{margin-top:2px;color:#dce7f4;font-size:12px;font-weight:bold}
#overlay{position:absolute;inset:86px 0 0;display:flex;align-items:center;justify-content:center;background:#07111eaa;opacity:0;pointer-events:none;transition:.18s}.show{opacity:1!important;pointer-events:auto!important}.panel{text-align:center;color:white;background:#101827ee;border:2px solid #ffb21c;border-radius:16px;padding:28px 40px;box-shadow:0 20px 50px #000b}.panel h1{margin:0 0 8px;font-size:42px}.panel p{margin:8px 0 20px;color:#dce7f4}.panel button{border:0;border-radius:8px;background:#ffb21c;color:#111827;font-weight:900;font-size:17px;padding:13px 26px;cursor:pointer}
#controls{position:absolute;inset:auto 0 18px;display:flex;justify-content:space-between;padding:0 24px;pointer-events:none}.controlSet{display:flex;align-items:flex-end;gap:11px}.button{pointer-events:auto;width:68px;height:68px;border-radius:50%;border:3px solid #ffffffcc;background:#101827bb;color:white;font-weight:900;display:grid;place-items:center;user-select:none;box-shadow:0 5px 16px #0007;font-size:12px}.button.small{width:58px;height:58px}.button.action{background:#b51e35dd;border-color:#fff}.button.snap{background:#ffb21cdd;color:#182033;border-color:#fff}.button:active{transform:scale(.94)}
#playHint{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);color:white;font-size:13px;font-weight:900;text-shadow:0 2px 4px #000;background:#101827bb;border-radius:20px;padding:8px 14px}
@media(max-width:700px){#hud{height:72px;padding:7px 8px}.team{min-width:105px}.crest{width:38px;height:38px;font-size:14px}.name{display:none}.score{font-size:25px}.team.right{margin-left:auto}#clockBox{width:140px}.clock{font-size:21px}.quarter{font-size:9px}.down{font-size:10px}.button{width:56px;height:56px}.button.small{width:48px;height:48px}#controls{padding:0 10px}.panel{padding:22px}.panel h1{font-size:34px}}
</style></head>
<body><div id="game"><canvas id="c"></canvas><div id="hud"><div class="team home"><div class="crest">R</div><div><div class="name">RIVERSIDE</div><div class="score" id="homeScore">0</div></div></div><div id="clockBox"><div class="quarter" id="quarter">1ST QUARTER</div><div class="clock" id="clock">3:00</div><div class="down" id="down">1ST &amp; 10 · BALL ON 25</div></div><div class="team away"><div class="crest">B</div><div><div class="name">BAY CITY</div><div class="score" id="awayScore">0</div></div></div></div><div id="playHint">SNAP TO PLAY</div><div id="controls"><div class="controlSet"><div class="button small" id="left">◀</div><div class="button small" id="right">▶</div></div><div class="controlSet"><div class="button action" id="pass">PASS</div><div class="button snap" id="snap">SNAP</div></div></div><div id="overlay"><div class="panel"><h1 id="endTitle">TOUCHDOWN!</h1><p id="endText">Riverside 7 · Bay City 0</p><button id="again">NEXT DRIVE</button></div></div></div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),hud={home:document.getElementById('homeScore'),away:document.getElementById('awayScore'),clock:document.getElementById('clock'),quarter:document.getElementById('quarter'),down:document.getElementById('down')};
let W,H,scale,field={x:0,y:86,w:0,h:0},running=false,phase='pre',ballCarrier=null,ball={x:0,y:0,z:0,vx:0,vy:0,vz:0,held:true},players=[],defenders=[],clock=180,quarter=1,home=0,away=0,down=1,yds=25,toGo=10,driveDir=1,poss='home',keys={},last=0,passTarget=0,playSpot=25,downResult=null;
function resize(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);W=innerWidth;H=innerHeight;field.w=Math.min(W*.92,H*.82);field.h=H-86-36;field.x=(W-field.w)/2;field.y=86+18;scale=Math.min(field.w/900,field.h/470)}
addEventListener('resize',resize);resize();
function yToScreen(y){return field.y+(y/100)*field.h}function xToScreen(x){return field.x+(x/100)*field.w}function sx(p){return xToScreen(p.x)}function sy(p){return yToScreen(p.y)}
function resetPlay(){phase='pre';running=false;ball.held=true;ballCarrier=null;players=[];defenders=[];const base=playSpot;for(let i=-2;i<=2;i++)players.push({x:50+i*5,y:55+(i%2)*2,r:9,role:i===0?'qb':'o',num:i===0?12:70+i,vx:0,vy:0});players.push({x:39,y:57,r:9,role:'rb',num:32,vx:0,vy:0});for(let i=-3;i<=3;i++)defenders.push({x:50+i*6,y:45+(i%2)*2,r:9,role:'d',num:50+i,vx:0,vy:0});defenders.push({x:50,y:39,r:10,role:'d',num:90,vx:0,vy:0});ballCarrier=players[0];ball.x=ballCarrier.x;ball.y=ballCarrier.y;updateHUD()}
function updateHUD(){hud.home.textContent=home;hud.away.textContent=away;hud.clock.textContent=Math.floor(clock/60)+':'+String(Math.floor(clock%60)).padStart(2,'0');hud.quarter.textContent=['1ST','2ND','3RD','4TH','FINAL'][quarter-1]+' QUARTER';const zone=playSpot<=50?'HOME '+playSpot:'OPP '+(100-playSpot);hud.down.textContent=(['','1ST','2ND','3RD','4TH'][down])+' & '+toGo+' · BALL ON '+zone}
function snap(){if(phase==='pre'){phase='live';running=true;document.getElementById('playHint').style.display='block';document.getElementById('playHint').textContent='RUN!';ballCarrier=players.find(p=>p.role==='rb')||players[0];ball.held=true}}
function passBall(){if(phase!=='live'||ball.held===false)return;const carrier=ballCarrier||players[0];if(carrier.role==='qb')ballCarrier=players.find(p=>p.role==='rb')||carrier;const target=players.find(p=>p.role==='o'&&p.x>45)||players[0];passTarget=target;ball.held=false;ball.z=8;ball.x=carrier.x;ball.y=carrier.y;const dx=target.x-ball.x,dy=target.y-ball.y;ball.vx=dx/55;ball.vy=dy/55;ball.vz=2.4;document.getElementById('playHint').textContent='THROW!' }
function setDir(k,v){keys[k]=v}
['left','right'].forEach(id=>{
  const el=document.getElementById(id);
  el.addEventListener('pointerdown',e=>{e.preventDefault();setDir(id,true)});
  el.addEventListener('pointerup',()=>setDir(id,false));
  el.addEventListener('pointercancel',()=>setDir(id,false));
  el.addEventListener('pointerleave',()=>setDir(id,false));
});
document.getElementById('snap').addEventListener('click',snap);document.getElementById('pass').addEventListener('click',passBall);document.getElementById('again').addEventListener('click',()=>{document.getElementById('overlay').classList.remove('show');resetPlay()});
addEventListener('keydown',e=>{if(e.code==='Space')snap();if(e.code==='KeyX'||e.code==='KeyP')passBall();if(e.code==='ArrowLeft'||e.code==='KeyA')keys.left=true;if(e.code==='ArrowRight'||e.code==='KeyD')keys.right=true;if(e.code==='ArrowUp'||e.code==='KeyW')keys.up=true;if(e.code==='ArrowDown'||e.code==='KeyS')keys.down=true});addEventListener('keyup',e=>{if(e.code==='ArrowLeft'||e.code==='KeyA')keys.left=false;if(e.code==='ArrowRight'||e.code==='KeyD')keys.right=false;if(e.code==='ArrowUp'||e.code==='KeyW')keys.up=false;if(e.code==='ArrowDown'||e.code==='KeyS')keys.down=false});
function collide(a,b){return Math.hypot(a.x-b.x,(a.y-b.y)*1.25)<11}
function endPlay(touchdown=false,tackle=false){if(phase==='ended')return;phase='ended';running=false;let gain=Math.round((playSpot===undefined?0:(ballCarrier?.y||55))-55)*-1;gain=Math.max(-4,Math.min(35,Math.round((55-(ballCarrier?.y||55))*-1)));if(touchdown)gain=100-playSpot;const newSpot=Math.max(1,Math.min(99,playSpot+gain));const actual=Math.round(newSpot-playSpot);if(touchdown||newSpot>=100){home+=6;away+=0;showResult('TOUCHDOWN!','Riverside scores +6',true)}else{playSpot=newSpot;toGo-=actual;if(toGo<=0){down=1;toGo=10}else{down++;if(down>4){showResult('TURNOVER ON DOWNS','Bay City takes over',false);return}}showResult(actual>=0?'PLAY COMPLETE':'TACKLED!',`Gain: ${actual>0?'+'+actual:actual} yards`,false)}}
function showResult(title,text,td){document.getElementById('endTitle').textContent=title;document.getElementById('endText').textContent=text+'  ·  Riverside '+home+' — Bay City '+away;document.getElementById('overlay').classList.add('show');document.getElementById('playHint').style.display='none'}
function update(dt){if(running){clock=Math.max(0,clock-dt);if(clock===0){quarter++;clock=180;if(quarter>4){phase='ended';showResult(home===away?'OVERTIME':'FINAL','Riverside '+home+' — Bay City '+away,false);return}resetPlay();updateHUD();return}
if(ball.held&&ballCarrier){ballCarrier.vx=0;ballCarrier.vy=0;if(keys.left)ballCarrier.vx=-22;if(keys.right)ballCarrier.vx=22;if(keys.up)ballCarrier.vy=-22;if(keys.down)ballCarrier.vy=22;ballCarrier.x=Math.max(4,Math.min(96,ballCarrier.x+ballCarrier.vx*dt));ballCarrier.y=Math.max(4,Math.min(96,ballCarrier.y+ballCarrier.vy*dt));ball.x=ballCarrier.x;ball.y=ballCarrier.y;if(ballCarrier.y<playSpot-4&&false){}if(ballCarrier.y<8)endPlay(true)}
else{ball.x+=ball.vx*dt*60;ball.y+=ball.vy*dt*60;ball.z+=ball.vz*dt*60;ball.vz-=5*dt;let caught=false;for(const p of players){if(p!==ballCarrier&&collide(ball,p)&&ball.z<20&&ball.y<75){caught=true;ballCarrier=p;ball.held=true;ball.z=0;break}}if(caught===false&&ball.z<0){ball.held=true;ballCarrier=null;ball.z=0;endPlay(false)}}
for(const d of defenders){let target=ballCarrier||players[0];let dx=target.x-d.x,dy=target.y-d.y,dist=Math.hypot(dx,dy)||1;d.x+=(dx/dist)*14*dt;d.y+=(dy/dist)*14*dt;if(ballCarrier&&collide(d,ballCarrier)){endPlay(false)} }
}
updateHUD()}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#4f8438';ctx.fillRect(field.x,field.y,field.w,field.h);ctx.fillStyle='#5a9140';for(let i=0;i<10;i++){if(i%2===0)ctx.fillRect(field.x+i*field.w/10,field.y,field.w/10,field.h)}ctx.fillStyle='#f1f5e9';ctx.globalAlpha=.9;for(let i=1;i<10;i++){const x=field.x+i*field.w/10;ctx.fillRect(x,field.y,2,field.h)}ctx.globalAlpha=1;for(let i=0;i<=10;i++){const y=field.y+i*field.h/10;ctx.fillStyle=i===5?'#f7c84b':'#edf3ec';ctx.fillRect(field.x,y,field.w,2)}ctx.strokeStyle='#e9eee9';ctx.lineWidth=4;ctx.strokeRect(field.x,field.y,field.w,field.h);
// end zones
ctx.fillStyle='#1d58a7';ctx.globalAlpha=.55;ctx.fillRect(field.x,field.y,field.w,field.h*.12);ctx.fillStyle='#b51e35';ctx.fillRect(field.x,field.y+field.h*.88,field.w,field.h*.12);ctx.globalAlpha=1;
// goal posts
ctx.strokeStyle='#ffeb91';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(field.x+field.w/2,field.y+8);ctx.lineTo(field.x+field.w/2,field.y-12);ctx.moveTo(field.x+field.w/2-25,field.y-12);ctx.lineTo(field.x+field.w/2+25,field.y-12);ctx.stroke();
for(const p of players)drawPlayer(p,'#b51e35','#fff');for(const d of defenders)drawPlayer(d,'#1d58a7','#ffd45a');if(!ball.held||ballCarrier){drawBall(ball.x,ball.y,ball.z)}
if(phase==='pre'){ctx.fillStyle='#101827cc';ctx.font='900 15px Arial';ctx.textAlign='center';ctx.fillText('READY',sx({x:50}),sy({x:50,y:67}))}}
function drawPlayer(p,color,trim){const x=sx(p),y=sy(p);ctx.beginPath();ctx.ellipse(x,y+8,11,7,0,0,Math.PI*2);ctx.fillStyle='#1b231f55';ctx.fill();ctx.beginPath();ctx.arc(x,y,10,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();ctx.strokeStyle=trim;ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#fff';ctx.font='900 8px Arial';ctx.textAlign='center';ctx.fillText(p.num,x,y+3)}
function drawBall(x,y,z){const bx=sx({x}),by=sy({y})-z*scale*.35;ctx.save();ctx.translate(bx,by);ctx.rotate(-.5);ctx.beginPath();ctx.ellipse(0,0,7,4,0,0,Math.PI*2);ctx.fillStyle='#7b3f22';ctx.fill();ctx.strokeStyle='#f4e6c8';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(-3,0);ctx.lineTo(3,0);ctx.stroke();ctx.restore()}
function loop(t){const dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
resetPlay();
</script></body></html>
