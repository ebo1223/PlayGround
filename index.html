<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Corner Kings — Boxing Arena</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#07090d;color:#fff;font-family:Arial,Helvetica,sans-serif}canvas{display:block;width:100%;height:100%}
#ui{position:absolute;inset:0;pointer-events:none}.hud{position:absolute;top:18px;left:3%;right:3%;height:92px}.fighter{position:absolute;top:0;width:min(38%,430px)}.fighter.right{right:0}.nameplate{display:flex;align-items:center;gap:10px;margin-bottom:7px}.right .nameplate{justify-content:flex-end}.avatar{width:44px;height:44px;border-radius:50%;border:2px solid #f1b94b;background:linear-gradient(135deg,#151922,#596178);display:grid;place-items:center;font-weight:900}.red .avatar{border-color:#f2cf51}.name{font-size:17px;font-weight:900;letter-spacing:1.5px}.record{font-size:10px;color:#bbc1c9;margin-top:3px}.health{height:18px;background:#252932;border:2px solid #08090c;overflow:hidden;transform:skew(-12deg);box-shadow:0 4px 18px #000}.health span{display:block;height:100%;width:100%;background:linear-gradient(90deg,#f0be42,#f8d975);transition:width .18s}.red .health span{margin-left:auto;background:linear-gradient(90deg,#ff3b34,#ffb13b)}
.roundbox{position:absolute;left:50%;top:-2px;transform:translateX(-50%);text-align:center}.roundnum{font-size:12px;color:#c8cbd1;letter-spacing:3px}.timer{font-size:37px;font-weight:900;font-style:italic;line-height:38px;text-shadow:0 3px 10px #000}.rounddots{display:flex;gap:5px;justify-content:center;margin-top:7px}.dot{width:25px;height:5px;background:#343742}.dot.win{background:#f7c64a}.dot.loss{background:#ef3d35}
.start,.end{position:absolute;inset:0;display:grid;place-items:center;pointer-events:auto;background:radial-gradient(circle,rgba(12,15,21,.15),rgba(3,4,7,.82));transition:.25s}.hidden{opacity:0!important;visibility:hidden!important}.card{text-align:center;width:min(520px,86vw);padding:34px 30px 28px;border:1px solid rgba(255,255,255,.12);background:linear-gradient(145deg,rgba(20,24,31,.96),rgba(8,10,14,.96));box-shadow:0 24px 80px #000}.eyebrow{color:#e8bc4d;font-size:11px;font-weight:bold;letter-spacing:5px}.card h1{margin:10px 0 4px;font-size:clamp(44px,7vw,78px);line-height:.86;font-style:italic;letter-spacing:-4px}.card h1 span{color:#ed3d36}.card p{color:#aeb4bd;font-size:13px;letter-spacing:1px}.controls{display:flex;justify-content:center;gap:8px;margin:24px 0 18px}.control{min-width:86px;border:1px solid #30343d;padding:8px 10px;background:#151820;font-size:10px;color:#bbb}.control b{display:block;color:#fff;font-size:13px;margin-bottom:3px}.start button,.end button{border:0;background:#efc34a;color:#111;font-weight:900;font-size:14px;letter-spacing:2px;padding:15px 34px;cursor:pointer;clip-path:polygon(8% 0,100% 0,92% 100%,0 100%)}
#toast{position:absolute;left:50%;top:39%;transform:translate(-50%,-50%) scale(.8);font-size:clamp(38px,7vw,82px);font-style:italic;font-weight:900;letter-spacing:-3px;text-shadow:0 8px 24px #000;opacity:0;transition:.18s}.#END_UNUSED{display:none}
.mobile{display:none;position:absolute;bottom:24px;left:18px;right:18px;justify-content:space-between;pointer-events:auto}.mgroup{display:flex;gap:8px}.mkey{width:58px;height:58px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(12,14,18,.74);color:#fff;font-weight:bold;font-size:11px}.mkey.punch{background:rgba(228,62,55,.76)}
@media(max-width:760px){.hud{top:10px}.nameplate{gap:5px}.avatar{width:34px;height:34px}.name{font-size:12px}.record{display:none}.health{height:13px}.fighter{width:41%}.roundbox{top:0}.timer{font-size:27px}.roundnum{font-size:8px}.dot{width:14px}.mobile{display:flex}.controls{flex-wrap:wrap}.control{min-width:74px}}
</style></head>
<body><canvas id="c"></canvas><div id="ui">
<div class="hud"><div class="fighter red"><div class="nameplate"><div><div class="name">M. JACKSON</div><div class="record">THE HAWK · 24-2-0</div></div><div class="avatar">MJ</div></div><div class="health"><span id="pHealth"></span></div></div><div class="roundbox"><div class="roundnum">ROUND <span id="round">1</span> / 3</div><div class="timer" id="timer">1:30</div><div class="rounddots"><i class="dot" id="d0"></i><i class="dot" id="d1"></i><i class="dot" id="d2"></i></div></div><div class="fighter right"><div class="nameplate"><div class="avatar">R</div><div><div class="name">R. STONE</div><div class="record">THE WRECKER · 18-5-1</div></div></div><div class="health"><span id="eHealth"></span></div></div></div>
<div id="toast"></div><div class="start" id="start"><div class="card"><div class="eyebrow">CHAMPIONSHIP NIGHT</div><h1>CORNER <span>KINGS</span></h1><p>3 ROUNDS · 90 SECONDS · NO MERCY</p><div class="controls"><div class="control"><b>A / D</b>MOVE</div><div class="control"><b>W / S</b>GUARD</div><div class="control"><b>J</b>LEFT</div><div class="control"><b>K</b>RIGHT</div><div class="control"><b>L</b>BODY</div></div><button id="fight">ENTER THE RING</button></div></div>
<div class="end hidden" id="end"><div class="card"><div class="eyebrow">FINAL BELL</div><h1 id="result">K.O.</h1><p id="summary"></p><button id="again">FIGHT AGAIN</button></div></div>
<div class="mobile"><div class="mgroup"><button class="mkey" data-key="a">◀</button><button class="mkey" data-key="d">▶</button></div><div class="mgroup"><button class="mkey" data-key="w">GUARD</button><button class="mkey punch" data-key="j">JAB</button><button class="mkey punch" data-key="k">HOOK</button></div></div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');let W,H,DPR;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*DPR;c.height=H*DPR;c.style.width=W+'px';c.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const keys={};addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
document.querySelectorAll('.mkey').forEach(b=>{const k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true});b.addEventListener('pointerup',()=>keys[k]=false);b.addEventListener('pointerleave',()=>keys[k]=false)});
let running=false,round=1,time=90,pHP=100,eHP=100,pWins=0,eWins=0,last=performance.now(),shake=0,flash=0;
let p={x:-1.25,y:0,guard:false,action:'idle',at:0,stun:0,combo:0},e={x:1.25,y:0,guard:false,action:'idle',at:0,stun:0};
function resetPositions(){p.x=-1.25;e.x=1.25;p.action=e.action='idle'}
function toast(t){const q=document.getElementById('toast');q.textContent=t;q.style.opacity=1;q.style.transform='translate(-50%,-50%) scale(1)';clearTimeout(toast.id);toast.id=setTimeout(()=>q.style.opacity=0,700)}
function punch(who,type){const from=who===p?p:e,to=who===p?e:p;if(from.stun>0||from.action==='punch')return;from.action='punch';from.at=.16;from.combo=(from.combo||0)+1;if(Math.abs(p.x-e.x)<1.7){const guard=to.guard;let dmg=(type==='jab'?7:type==='hook'?11:9)*(guard?.45:1);if(who===p)dmg*=1+Math.min(p.combo,4)*.025;who===p?(eHP-=dmg):(pHP-=dmg);shake=who===p?5:3;if(!guard&&type!=='jab')to.stun=.22}else if(who===p)flash=.08}
function endGame(win,reason){running=false;document.getElementById('end').classList.remove('hidden');document.getElementById('result').innerHTML=win?'YOU <span style="color:#efc34a">WIN</span>':'K.O. <span style="color:#ef3d35">LOSS</span>';document.getElementById('summary').textContent=reason+' · '+(win?'Championship secured':'Back to the gym')}
function startRound(){running=true;resetPositions();time=90;toast('ROUND '+round);document.getElementById('round').textContent=round}
document.getElementById('fight').onclick=()=>{document.getElementById('start').classList.add('hidden');startRound()};document.getElementById('again').onclick=()=>location.reload();
function update(dt){if(!running)return;time-=dt;p.guard=keys.w||keys.arrowup;p.y=p.guard?.05:0;e.guard=false;
 if(keys.a||keys.arrowleft)p.x-=dt*1.9;if(keys.d||keys.arrowright)p.x+=dt*1.9;p.x=clamp(p.x,-3.7,2.2);
 if(keys.j&&!p._j)punch(p,'jab');if(keys.k&&!p._k)punch(p,'hook');if(keys.l&&!p._l)punch(p,'body');p._j=keys.j;p._k=keys.k;p._l=keys.l;
 const dist=p.x-e.x;if(e.stun<=0){e.at-=dt;if(Math.abs(e.x-.15)>.08)e.x+=Math.sign(.15-e.x)*dt*.7;if(dist>-.8)e.x+=dt*.55;if(dist<-1.9)e.x-=dt*.5;if(Math.random()<dt*.9){const r=Math.random();if(r>.72)e.guard=true;else if(r>.45)punch(e,r>.58?'hook':'jab')}}e.guard=Math.random()<.018?true:e.guard;if(e.guard&&Math.random()<dt*2)e.guard=false;
 p.at=Math.max(0,p.at-dt);e.at=Math.max(0,e.at-dt);p.stun=Math.max(0,p.stun-dt);e.stun=Math.max(0,e.stun-dt);if(p.at<=0)p.action='idle';if(e.at<=0)e.action='idle';pHP=clamp(pHP,0,100);eHP=clamp(eHP,0,100);document.getElementById('pHealth').style.width=pHP+'%';document.getElementById('eHealth').style.width=eHP+'%';document.getElementById('timer').textContent=Math.floor(time/60)+':'+String(Math.max(0,Math.ceil(time%60))).padStart(2,'0');
 if(pHP<=0||eHP<=0){endGame(eHP<=0,pHP<=0?'K.O. victory':'K.O. defeat');return}if(time<=0){if(pHP>eHP)pWins++,toast('ROUND WON');else if(eHP>pHP)eWins++,toast('ROUND LOST');else toast('DRAW');round++;if(round>3||pWins>=2||eWins>=2){endGame(pWins>eWins,pWins>eWins?'Split decision':'Corner stoppage');return}pHP=clamp(pHP+18,0,100);eHP=clamp(eHP+18,0,100);startRound()}}
const pal={skin:'#9d6347',skinDark:'#70452f',red:'#c43b32',blue:'#31577a',gold:'#dcb64c',white:'#dedbd1',black:'#17191d'};
function project(x,y,z){const horizon=H*.53,scale=H/8/(8-z*.55);return{x:W/2+x*scale,y:horizon+y*scale,scale}}
function poly(points,fill,stroke){ctx.beginPath();ctx.moveTo(points[0].x,points[0].y);for(let i=1;i<points.length;i++)ctx.lineTo(points[i].x,points[i].y);ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.stroke()}}
function ellipse(x,y,rw,rh,color){ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,rw,rh,0,0,Math.PI*2);ctx.fill()}
function drawArena(){const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#101722');sky.addColorStop(.55,'#090c12');sky.addColorStop(1,'#030405');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
 // back wall and upper lights
 ctx.fillStyle='#151923';ctx.fillRect(0,H*.29,W,H*.24);ctx.fillStyle='#202631';for(let i=0;i<10;i++){ellipse(W*(.08+i*.094),H*.24,8,12,['#d9c58a','#b8d5ed','#eec6a4'][i%3])}
 // crowd, with perspective tiers
 for(let row=0;row<6;row++){for(let col=0;col<18;col++){const x=col*W/17+rnd(-2,2),y=H*(.34+row*.045);ellipse(x,y,3.5+row*.3,5+row*.5,['#4b5361','#30343d','#7a5b4c','#747a82'][((col*7+row*3)%4)])}}
 // ring floor in perspective
 const floor=poly([{x:W*.11,y:H*.57},{x:W*.89,y:H*.57},{x:W*.96,y:H*.91},{x:W*.04,y:H*.91}],'#aaa99f');
 ctx.strokeStyle='rgba(255,255,255,.22)';ctx.lineWidth=1;for(let i=0;i<9;i++){const t=i/8;ctx.beginPath();ctx.moveTo(W*(.11+(0.78*t)),H*.57);ctx.lineTo(W*(.04+(.92*t)),H*.91);ctx.stroke()}ctx.strokeStyle='#8d1f26';ctx.lineWidth=5;ctx.beginPath();ctx.arc(W/2,H*.74,W*.16,0,Math.PI*2);ctx.stroke();ctx.fillStyle='rgba(0,0,0,.28)';ctx.font='900 '+clamp(W*.018,11,24)+'px Arial';ctx.textAlign='center';ctx.fillText('CORNER  KINGS',W/2,H*.72);
 // ring posts
 for(const side of [.10,.90]){const x=W*side;ctx.fillStyle='#151820';ctx.fillRect(x-H*.012,H*.42,H*.024,H*.49);ctx.fillStyle='#d3d1c6';ctx.fillRect(x-H*.012,H*.42,H*.024,H*.018);ctx.fillStyle='#8d1f26';ctx.fillRect(x-H*.018,H*.49,H*.036,H*.018)}
 // three ropes receding toward sides
 for(const y of [.49,.58,.67]){ctx.strokeStyle='#c8c4b7';ctx.lineWidth=clamp(H*.006,3,7);ctx.beginPath();ctx.moveTo(W*.10,y*H);ctx.quadraticCurveTo(W/2,y*H-(y-.58)*H*.15,W*.90,y*H);ctx.stroke();ctx.strokeStyle='#6f7479';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(W*.10,y*H+2);ctx.quadraticCurveTo(W/2,y*H-(y-.58)*H*.15+2,W*.90,y*H+2);ctx.stroke()}
 // spotlights
 ctx.save();ctx.globalCompositeOperation='screen';for(const x of [W*.18,W*.82]){const g=ctx.createRadialGradient(x,H*.22,1,x,H*.22,W*.16);g.addColorStop(0,'rgba(215,225,255,.22)');g.addColorStop(1,'rgba(215,225,255,0)');ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(x,H*.25);ctx.lineTo(x-W*.09,H*.88);ctx.lineTo(x+W*.09,H*.88);ctx.fill()}ctx.restore()
}
function limb(a,b,r,fill){ctx.strokeStyle=fill;ctx.lineWidth=r;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.lineCap='butt'}
function boxer(f,red){const side=red?-1:1;const s=project(f.x,0,0);const scale=clamp(s.scale*.78,.7,1.3);const cx=s.x,base=s.y+H*.10,dir=red?1:-1;
 const bob=running?Math.sin(performance.now()/180+f.x)*scale*3:0;ctx.save();ctx.translate(cx,base+bob);ctx.scale(scale*dir,scale);
 ellipse(0,0,62,14,'rgba(0,0,0,.35)');
 // legs
 limb({x:-28,y:-55},{x:-38,y:-6},20,pal.skin);limb({x:28,y:-55},{x:38,y:-6},20,pal.skin);ellipse(-38,-3,27,8,'#111319');ellipse(38,-3,27,8,'#111319');
 // shorts
 poly([{x:-49,y:-128},{x:49,y:-128},{x:43,y:-65},{x:-43,y:-65}],red?pal.red:pal.blue);ctx.fillStyle=pal.gold;ctx.fillRect(-49,-130,98,9);ctx.fillStyle='#eee';ctx.font='bold 13px Arial';ctx.textAlign='center';ctx.fillText(red?'M.JACKSON':'R.STONE',0,-112);
 // torso
 ellipse(0,-173,51,79,pal.skin);ellipse(0,-130,47,12,'rgba(50,20,15,.18)');ctx.fillStyle='rgba(255,255,255,.12)';ellipse(-12,-190,10,28,'rgba(255,255,255,.12)');
 let guard=f.guard,action=f.action,phase=f.at/.16;
 if(action==='punch'){limb({x:32,y:-200},{x:32+70*phase,y:-178},20,pal.skin);limb({x:-32,y:-200},{x:guard?-28:-62,y:-195},20,pal.skin)}else{limb({x:32,y:-200},{x:guard?22:52,y:guard?-205:-154},20,pal.skin);limb({x:-32,y:-200},{x:guard?-22:-52,y:guard?-205:-154},20,pal.skin)}
 ellipse(action==='punch'?32+70*phase:guard?22:52,action==='punch'?-178:guard?-205:-154,16,16,red?'#d34338':'#dfba4d');ellipse(guard?-22:-52,guard?-205:-154,16,16,red?'#d34338':'#dfba4d');
 // head
 ellipse(0,-270,34,40,pal.skin);ctx.fillStyle='#17191d';ctx.beginPath();ctx.arc(0,-278,35,Math.PI,0);ctx.fill();ellipse(0,-306,31,8,'#17191d');ellipse(-8,-268,3,3,'#17191d');ellipse(8,-268,3,3,'#17191d');ellipse(0,-250,9,4,pal.skinDark);ctx.restore()
}
function frame(now){const dt=Math.min(.033,(now-last)/1000);last=now;update(dt);ctx.save();if(shake>0){ctx.translate(rnd(-shake,shake),rnd(-shake,shake));shake*=.88}drawArena();boxer(p,true);boxer(e,false);ctx.restore();if(flash>0){ctx.fillStyle='rgba(255,60,45,'+flash+')';ctx.fillRect(0,0,W,H);flash*=.8}requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
