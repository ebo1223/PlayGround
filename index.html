<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Soccer Championship</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght:wght@500;700&display=swap');
:root{--lime:#d8ff32;--ink:#07110d;--green:#183d2c}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;color:#fff;background:#07110d;overflow:hidden}button{font:inherit;cursor:pointer}.app{height:100vh;display:grid;grid-template-columns:260px 1fr 300px}.left,.right{background:linear-gradient(180deg,#10291e,#091711);border-right:1px solid #294637}.left{padding:24px}.brand{display:flex;align-items:center;gap:11px;margin-bottom:35px}.brandmark{width:38px;height:38px;border-radius:50%;background:var(--lime);color:#102117;display:grid;place-items:center;font-size:22px}.brand b{font-family:'Barlow Condensed';font-size:21px;text-transform:uppercase}.brand span{color:#80958b;font-size:10px;display:block}.nav{display:flex;flex-direction:column;gap:7px}.nav button{border:0;background:transparent;color:#91a49a;text-align:left;padding:13px 14px;border-radius:9px}.nav button.active{background:#203a2e;color:#fff}.nav button span{margin-right:10px}.profile{position:absolute;bottom:22px;left:24px;width:212px;padding-top:14px;border-top:1px solid #294637;display:flex;align-items:center;gap:10px}.avatar{width:38px;height:38px;border-radius:50%;background:#d7a46c;display:grid;place-items:center}.profile small{color:#82968c}.main{position:relative;overflow:hidden}.topbar{height:78px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:1px solid #294637}.title small{color:#95a69e}.title h1{font-family:'Barlow Condensed';font-size:27px;margin:2px 0 0;text-transform:uppercase}.top-actions{display:flex;align-items:center;gap:10px}.iconbtn{width:38px;height:38px;border:1px solid #345244;border-radius:50%;background:#10271d;color:#fff}.stadium{position:absolute;left:28px;right:28px;top:96px;bottom:24px;border-radius:14px;overflow:hidden;background:linear-gradient(90deg,#4d7961 1px,transparent 1px),linear-gradient(#4d7961 1px,transparent 1px),#2d6849;background-size:7.7% 11.1%;border:2px solid #d8e7dc}.stadium:before{content:"";position:absolute;inset:0;border:1px solid rgba(255,255,255,.5);margin:18px}.field-line{position:absolute;border:2px solid rgba(255,255,255,.78);pointer-events:none}.halfway{top:-2px;bottom:-2px;left:50%;width:0}.center{width:110px;height:110px;border-radius:50%;left:calc(50% - 55px);top:calc(50% - 55px)}.box-left{left:-2px;top:31%;width:130px;height:38%}.box-right{right:-2px;top:31%;width:130px;height:38%}.goal-left{left:-2px;top:43%;width:38px;height:14%}.goal-right{right:-2px;top:43%;width:38px;height:14%}.scoreboard{position:absolute;z-index:5;top:14px;left:50%;transform:translateX(-50%);height:54px;display:flex;align-items:center;border-radius:8px;background:#0b1711cc;box-shadow:0 8px 20px #0005}.team{height:100%;display:flex;align-items:center;gap:8px;padding:0 13px;font-family:'Barlow Condensed';font-weight:700}.team:first-child{border-right:1px solid #3d5147}.team:last-child{border-left:1px solid #3d5147}.crest{width:25px;height:25px;border-radius:50%;background:#dfff39;color:#183d2c;display:grid;place-items:center;font-size:11px}.crest.red{background:#ff735f}.score{font-size:25px}.time{font-size:12px;padding:0 14px;color:#c7d3cd}.player{position:absolute;z-index:3;width:32px;height:32px;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 3px 8px #0007;border:3px solid #fff;transition:left .08s linear,top .08s linear}.player.blue{background:#b6ee35}.player.orange{background:#ff6b50}.player.selected{outline:3px solid #fff;outline-offset:5px}.player:after{content:"";position:absolute;inset:5px;border:2px solid #fff;border-radius:50%;opacity:.45}.ball{position:absolute;z-index:4;width:18px;height:18px;border-radius:50%;background:white;border:2px solid #8b9c91;transform:translate(-50%,-50%);box-shadow:0 3px 5px #0008}.right{border-right:0;border-left:1px solid #294637;padding:22px}.right h3{font-family:'Barlow Condensed';text-transform:uppercase;margin:0 0 14px}.controls-card{background:#0c1d15;border:1px solid #294637;border-radius:12px;padding:14px;margin-bottom:18px}.control-row{display:flex;justify-content:space-between;align-items:center;margin:9px 0;color:#a7b7af;font-size:12px}.key{min-width:28px;height:28px;border:1px solid #53675d;border-radius:6px;background:#1b3025;display:grid;place-items:center;color:#fff}.control-row div:last-child{display:flex;gap:4px}.tactics{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tactics button{border:1px solid #345244;border-radius:8px;padding:10px 5px;background:#10251b;color:#aebeb6;font-size:11px}.tactics button.active{border-color:var(--lime);color:var(--lime)}.pause-overlay{position:absolute;z-index:20;inset:0;background:#07110dcc;display:none;place-items:center}.pause-overlay.show{display:grid}.modal{width:330px;text-align:center;background:#10271d;border:1px solid #456151;border-radius:16px;padding:24px}.modal h2{font-family:'Barlow Condensed';font-size:38px;margin:0 0 8px}.modal button{width:100%;height:44px;margin-top:8px;border:0;border-radius:8px;background:var(--lime);color:#102117;font-weight:800}.modal button.secondary{background:#20392c;color:#fff}.goalflash{position:absolute;z-index:30;left:50%;top:43%;transform:translate(-50%,-50%) scale(.7);font-family:'Barlow Condensed';font-size:74px;font-weight:800;color:var(--lime);text-shadow:0 6px 20px #0008;opacity:0}.goalflash.show{animation:goal 1.2s ease}@keyframes goal{0%{opacity:0;transform:translate(-50%,-50%) scale(.7)}20%,70%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0}}
@media(max-width:1000px){.app{grid-template-columns:70px 1fr 220px}.left{padding:20px 15px}.brand div:last-child,.nav button:not(.active) span,.nav button{font-size:0}.nav button span{display:block;font-size:16px;margin:0}.nav button{padding:12px;text-align:center}.profile{display:none}.right{padding:16px}.stadium{left:16px;right:16px}.brandmark{width:40px}}
@media(max-width:700px){body{overflow:hidden}.app{grid-template-columns:1fr}.left,.right{display:none}.topbar{height:64px;padding:0 14px}.stadium{left:8px;right:8px;top:78px;bottom:8px}.title h1{font-size:21px}.title small{display:none}}
</style></head>
<body><div class="app">
<aside class="left"><div class="brand"><div class="brandmark">⚽</div><div><b>Championship</b><span>SEASON 2026</span></div></div>
<div class="nav"><button class="active"><span>◉</span> Match</button><button><span>▦</span> Squad</button><button><span>◫</span> Tactics</button><button><span>♜</span> League</button><button><span>⚙</span> Settings</button></div>
<div class="profile"><div class="avatar">JD</div><div><b>Jamie Diaz</b><br><small>Pro Manager</small></div></div></aside>
<main class="main"><header class="topbar"><div class="title"><small>QUARTER-FINAL</small><h1>Lime FC vs Red United</h1></div><div class="top-actions"><button class="iconbtn" id="sound">♪</button><button class="iconbtn" id="pause">Ⅱ</button></div></header>
<div class="stadium" id="pitch"><div class="field-line halfway"></div><div class="field-line center"></div><div class="field-line box-left"></div><div class="field-line box-right"></div><div class="field-line goal-left"></div><div class="field-line goal-right"></div>
<div class="scoreboard"><div class="team"><span class="crest">LF</span><span class="score" id="scoreA">2</span></div><div class="time" id="clock">64:18</div><div class="team"><span class="score" id="scoreB">1</span><span class="crest red">RU</span></div></div>
<div class="goalflash" id="goalflash">GOAL!</div><div class="ball" id="ball"></div></div></main>
<aside class="right"><h3>Match Controls</h3><div class="controls-card"><div class="control-row"><span>Move</span><div><kbd class="key">W</kbd><kbd class="key">A</kbd><kbd class="key">S</kbd><kbd class="key">D</kbd></div></div><div class="control-row"><span>Pass</span><div><kbd class="key">P</kbd></div></div><div class="control-row"><span>Shoot</span><div><kbd class="key">S</kbd></div></div><div class="control-row"><span>Switch player</span><div><kbd class="key">C</kbd></div></div></div><h3>Formation</h3><div class="tactics"><button class="active">Balanced</button><button>Attack</button><button>Press</button><button>Defend</button></div></aside></div>
<div class="pause-overlay" id="overlay"><div class="modal"><h2 id="modalTitle">MATCH PAUSED</h2><p id="modalText">Take a breather.</p><button id="resume">RESUME MATCH</button><button class="secondary" id="restart">RESTART</button></div></div>
<script>
const pitch=document.getElementById('pitch'),ballEl=document.getElementById('ball'),overlay=document.getElementById('overlay');
let W=1000,H=600,paused=false,score=[2,1],seconds=3858,selected=0,keys={},ball={x:54,y:50,vx:0,vy:0,owner:0};
const blue=[{x:23,y:50},{x:38,y:28},{x:42,y:72},{x:56,y:20},{x:58,y:54},{x:67,y:75},{x:49,y:50}];
const orange=[{x:78,y:50},{x:65,y:24},{x:64,y:76},{x:89,y:33},{x:86,y:67},{x:72,y:50}];
const els=[];blue.forEach((p,i)=>{const e=document.createElement('div');e.className='player blue'+(i===selected?' selected':'');pitch.appendChild(e);els.push(e)});orange.forEach(p=>{const e=document.createElement('div');e.className='player orange';pitch.appendChild(e);els.push(e)});
function size(){const r=pitch.getBoundingClientRect();W=r.width;H=r.height}addEventListener('resize',size);size();
function pos(e,p){e.style.left=(p.x/100*W)+'px';e.style.top=(p.y/100*H)+'px'}
function render(){blue.forEach((p,i)=>pos(els[i],p));orange.forEach((p,i)=>pos(els[blue.length+i],p));pos(ballEl,ball)}
function movePlayer(p,dx,dy){p.x=Math.max(2,Math.min(98,p.x+dx));p.y=Math.max(3,Math.min(97,p.y+dy)}
function nearestBall(arr){let n=0,d=999;arr.forEach((p,i)=>{let q=Math.hypot(p.x-ball.x,p.y-ball.y);if(q<d){d=q;n=i}});return n}
function tick(){if(!paused){const p=blue[selected];let dx=((keys.d||keys.arrowright)?1:0)-((keys.a||keys.arrowleft)?1:0),dy=((keys.s||keys.arrowdown)?1:0)-((keys.w||keys.arrowup)?1:0);if(dx||dy){let l=Math.hypot(dx,dy);movePlayer(p,dx/l*.75,dy/l*.75)}
// AI chase and drift
orange.forEach((o,i)=>{let tx=i===0?ball.x:o.x+(i%2?-.04:.04);let ty=i===0?ball.y:o.y+(i%2?.03:-.03);let dx=tx-o.x,dy=ty-o.y,l=Math.hypot(dx,dy)||1;if(l>3)movePlayer(o,dx/l*.16,dy/l*.16)});
blue.forEach((q,i)=>{if(i!==selected){let base=i===0?49:(i===1?38:i===2?42:i===3?56:i===4?58:i===5?67:49);q.x+=(base-q.x)*.002}});
ball.vx*=.985;ball.vy*=.985;ball.x+=ball.vx;ball.y+=ball.vy;if(ball.x<1||ball.x>99){if(ball.y>38&&ball.y<62){score[ball.x<1?1:0]++;updateScore();goal()}ball.x=Math.max(2,Math.min(98,ball.x));ball.vx*=-.7}if(ball.y<2||ball.y>98){ball.y=Math.max(2,Math.min(98,ball.y));ball.vy*=-.7}
let owner=null;blue.forEach((q,i)=>{if(Math.hypot(q.x-ball.x,q.y-ball.y)<3.2&&owner===null)owner={arr:'b',i}});if(owner===null)orange.forEach((q,i)=>{if(Math.hypot(q.x-ball.x,q.y-ball.y)<3.2&&owner===null)owner={arr:'o',i}});if(owner){ball.vx*=.7;ball.vy*=.7}render()}requestAnimationFrame(tick)}
function pass(){let p=blue[selected],target=null,best=999;blue.forEach((q,i)=>{if(i!==selected){let d=Math.hypot(q.x-p.x,q.y-p.y);if(d<best){best=d;target=q}}});if(target){let dx=target.x-p.x,dy=target.y-p.y,l=Math.hypot(dx,dy)||1;ball.vx=dx/l*1.25;ball.vy=dy/l*1.25;ball.x=p.x;ball.y=p.y}}
function shoot(){let p=blue[selected],dx=100-p.x,dy=(50-p.y)+(Math.random()*12-6),l=Math.hypot(dx,dy)||1;ball.vx=dx/l*2.1;ball.vy=dy/l*2.1}
function switchPlayer(){selected=(selected+1)%blue.length}function updateScore(){document.getElementById('scoreA').textContent=score[0];document.getElementById('scoreB').textContent=score[1]}function goal(){const g=document.getElementById('goalflash');g.classList.remove('show');void g.offsetWidth;g.classList.add('show');ball={x:50,y:50,vx:0,vy:0,owner:0};setTimeout(()=>ball.vx=.25,600)}
addEventListener('keydown',e=>{let k=e.key.toLowerCase();keys[k]=true;if(k==='p')pass();if(k==='c')switchPlayer();if(k===' '){e.prevent;shoot()}if(k==='escape')togglePause()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
pitch.addEventListener('pointerdown',e=>{const r=pitch.getBoundingClientRect();let x=(e.clientX-r.left)/r.width*100,y=(e.clientY-r.top)/r.height*100;let d=999;blue.forEach((p,i)=>{let q=Math.hypot(p.x-x,p.y-y);if(q<d){d=q;selected=i}});render()});
function togglePause(){paused=!paused;overlay.classList.toggle('show',paused)}document.getElementById('pause').onclick=togglePause;document.getElementById('resume').onclick=togglePause;document.getElementById('restart').onclick=()=>location.reload();document.querySelectorAll('.tactics button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tactics button').forEach(x=>x.classList.remove('active'));b.classList.add('active')});
setInterval(()=>{if(!paused){seconds++;let m=Math.floor(seconds/60),s=seconds%60;document.getElementById('clock').textContent=m+':'+String(s).padStart(2,'0')}},1000);render();tick();
</script></body></html>
