<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no" />
  <title>Brick Breaker</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#090b14; font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif; }
    body { display:grid; place-items:center; }
    canvas { width:min(100vw, 1180px); height:min(100vh, 760px); display:block; image-rendering:auto; }
    #shell { position:relative; width:min(100vw,1180px); height:min(100vh,760px); }
  </style>
</head>
<body>
  <div id="shell"><canvas id="game"></canvas></div>
  <script>
  (() => {
    const canvas=document.getElementById('game'), ctx=canvas.getContext('2d');
    const W=1120,H=700;
    let dpr=1;
    function resize(){ dpr=Math.min(devicePixelRatio||1,2); const r=document.queryid='x'; const rect=canvas.getBoundingClientRect(); canvas.width=Math.round(rect.width*dpr); canvas.height=Math.round(rect.height*dpr); ctx.setTransform(canvas.width/W,0,0,canvas.height/H,0,0); }
    addEventListener('resize',resize); resize();

    const colors=['#ff4b81','#ff8a42','#ffd166','#43d9a3','#4db7ff','#a78bfa'];
    let score=0, lives=3, level=1, high=+(localStorage.brickHigh||0), state='ready', last=0;
    let keys={}, pointerX=null;
    const paddle={x:W/2-75,y:H-62,w:150,h:18,target:W/2};
    const ball={x:W/2,y:H-78,r:9,vx:310,vy:-390,stuck:true};
    let bricks=[], particles=[], stars=[];

    for(let i=0;i<95;i++) stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.4+.3,a:Math.random()*0.55+.12});
    function makeLevel(){
      bricks=[]; const rows=Math.min(5+level,8), cols=12, gap=8, bw=78, bh=30, ox=(W-(cols*bw+(cols-1)*gap))/2;
      for(let r=0;r<rows;r++) for(let c=0;c<cols;c++) {
        if(level>2 && ((r+c+level)%11===0)) continue;
        bricks.push({x:ox+c*(bw+gap),y:92+r*(bh+gap),w:bw,h:bh,hp:(r<1&&level>2?2:1),max: r<1&&level>2?2:1,color:colors[(r+level-1)%colors.length]});
      }
    }
    makeLevel();

    function resetBall(){ ball.x=paddle.x+paddle.w/2; ball.y=paddle.y-16; ball.vx=(Math.random()<.5?-1:1)*(280+level*12); ball.vy=-390-level*10; ball.stuck=true; }
    function start(){ if(state==='ready'||state==='over'||state==='won') { if(state==='over'||state==='won'){score=0;lives=3;level=1;makeLevel();} state='playing'; ball.stuck=false; } else if(state==='paused') state='playing'; }
    addEventListener('keydown',e=>{ keys[e.key.toLowerCase()]=true; if([' ','arrowleft','arrowright','a','d'].includes(e.key.toLowerCase())) e.preventDefault(); if(e.key===' ') start(); if(e.key.toLowerCase()==='p') state=state==='paused'?'playing':'paused'; });
    addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
    canvas.addEventListener('pointermove',e=>{const r=canvas.getBoundingClientRect(); pointerX=(e.clientX-r.left)/r.width*W;});
    canvas.addEventListener('pointerdown',e=>{const r=canvas.getBoundingClientRect();pointerX=(e.clientX-r.left)/r.width*W; if(state==='ready'||state==='over'||state==='won'||state==='paused') start();});

    function burst(x,y,color,n=8){ for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,s=80+Math.random()*180;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.55+Math.random*.35,max:0.9,color,size:2+Math.random()*3});} }
    function roundRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);}

    function update(dt){
      if(state==='playing'||state==='ready'){
        if(pointerX!==null) paddle.target=pointerX-paddle.w/2;
        else { if(keys.arrowleft||keys.a) paddle.target-=560*dt; if(keys.arrowright||keys.d) paddle.target+=560*dt; }
        paddle.target=Math.max(24,Math.min(W-paddle.w-24,paddle.target)); paddle.x+=(paddle.target-paddle.x)*Math.min(1,dt*14);
        if(ball.stuck){ball.x=paddle.x+paddle.w/2; ball.y=paddle.y-16;}
        if(!ball.stuck){
          ball.x+=ball.vx*dt; ball.y+=ball.vy*dt;
          if(ball.x-ball.r<18){ball.x=18+ball.r;ball.vx=Math.abs(ball.vx)}
          if(ball.x+ball.r>W-18){ball.x=W-18-ball.r;ball.vx=-Math.abs(ball.vx)}
          if(ball.y-ball.r<18){ball.y=18+ball.r;ball.vy=Math.abs(ball.vy)}
          if(ball.y-ball.r>H){lives--;burst(ball.x,H-20,'#ff4b81',18);if(lives<=0){state='over';if(score>high){high=score;localStorage.brickHigh=high}}else resetBall();}
          if(ball.y+ball.r>=paddle.y && ball.y-ball.r<paddle.y+paddle.h && ball.x>=paddle.x-4 && ball.x<=paddle.x+paddle.w+4 && ball.vy>0){
            const rel=(ball.x-(paddle.x+paddle.w/2))/(paddle.w/2); ball.vx=rel*470; ball.vy=-Math.sqrt(Math.max(150000,420*420-ball.vx*ball.vx)); ball.y=paddle.y-ball.r-1;burst(ball.x,paddle.y,'#61dfff',5);
          }
          for(const b of bricks){if(!b.hp)continue; if(ball.x+ball.r>b.x&&ball.x-ball.r<b.x+b.w&&ball.y+ball.r>b.y&&ball.y-ball.r<b.y+b.h){
            b.hp--; score+=b.hp?25:100*level;burst(ball.x,ball.y,b.color,b.hp?4:10); if(score>high)high=score;
            const overlapL=ball.x+ball.r-b.x, overlapR=b.x+b.w-(ball.x-ball.r), overlapT=ball.y+ball.r-b.y, overlapB=b.y+b.h-(ball.y-ball.r);
            const min=Math.min(overlapL,overlapR,overlapT,overlapB); if(min===overlapL||min===overlapR)ball.vx*=-1;else ball.vy*=-1;break;
          }}
          if(bricks.every(b=>b.hp===0)){level++;if(level>5){state='won';if(score>high)localStorage.brickHigh=high}else{makeLevel();paddle.w=Math.max(110,150-level*5);resetBall();}}
        }
      }
      for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=260*dt;if(p.life<=0)particles.splice(i,1);}
    }

    function text(t,x,y,size=24,color='#fff',align='center',weight=800){ctx.save();ctx.font=`${weight} ${size}px Inter,system-ui,sans-serif`;ctx.textAlign=align;ctx.fillStyle=color;ctx.fillText(t,x,y);ctx.restore();}
    function draw(){
      ctx.clearRect(0,0,W,H); const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#11162a');bg.addColorStop(1,'#080a12');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
      ctx.strokeStyle='#20263a';ctx.lineWidth=18;ctx.strokeRect(9,9,W-18,H-18);
      for(const s of stars){ctx.globalAlpha=s.a;ctx.fillStyle='#b9c7ff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill()}ctx.globalAlpha=1;
      text('SCORE',42,43,14,'#77809a','left',700);text(String(score).padStart(6,'0'),42,68,24,'#fff','left',900);
      text('LEVEL',W/2,43,14,'#77809a','center',700);text(String(level).padStart(2,'0'),W/2,68,24,'#fff','center',900);
      text('BEST',W-42,43,14,'#77809a','right',700);text(String(high).padStart(6,'0'),W-42,68,24,'#ffd166','right',900);
      for(let i=0;i<lives;i++){ctx.fillStyle='#ff5d88';ctx.beginPath();ctx.moveTo(W-38-i*24,H-38);ctx.lineTo(W-50-i*24,H-38);ctx.lineTo(W-44-i*24,H-27);ctx.closePath();ctx.fill();}
      for(const b of bricks){if(!b.hp)continue;ctx.save();ctx.shadowColor=b.color;ctx.shadowBlur=b.hp< b.max?0:10;const grad=ctx.createLinearGradient(b.x,b.y,b.x,b.y+b.h);grad.addColorStop(0,b.color);grad.addColorStop(1,b.hp< b.max?'#697080':b.color+'cc');ctx.fillStyle=grad;roundRect(b.x,b.y,b.w,b.h,7);ctx.fill();ctx.fillStyle='rgba(255,255,255,.25)';roundRect(b.x+5,b.y+4,b.w-10,4,2);ctx.fill();ctx.restore();}
      ctx.save();ctx.shadowColor='#61dfff';ctx.shadowBlur=18;ctx.fillStyle='#65dcff';roundRect(paddle.x,paddle.y,paddle.w,paddle.h,9);ctx.fill();ctx.fillStyle='#d7f7ff';roundRect(paddle.x+8,paddle.y+3,paddle.w-16,4,2);ctx.fill();ctx.restore();
      ctx.save();ctx.shadowColor='#fff';ctx.shadowBlur=16;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,7);ctx.fill();ctx.restore();
      for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/.9);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,7);ctx.fill()}ctx.globalAlpha=1;
      if(state==='ready'||state==='paused'||state==='over'||state==='won'){
        ctx.fillStyle='rgba(6,8,16,.72)';ctx.fillRect(18,18,W-36,H-36);
        let title=state==='ready'?'BRICK BREAKER':state==='paused'?'PAUSED':state==='over'?'GAME OVER':'YOU WIN!';
        text(title,W/2,H/2-65,52,state==='over'?'#ff6b9d':'#fff','center',900);
        text(state==='ready'?'Move to aim • Click or press Space to launch':state==='paused'?'Press P or click to resume':state==='over'?'Final score: '+score:'Score: '+score,W/2,H/2+3,20,'#bac3d9','center',600);
        if(state==='ready'||state==='paused'||state==='over'||state==='won'){
          ctx.fillStyle='#7667ff';roundRect(W/2-120,H/2+35,240,54,27);ctx.fill();text(state==='paused'?'RESUME':'PLAY AGAIN',W/2,H/2+70,17,'#fff','center',800);
        }
      }
    }
    function loop(t){const dt=Math.min(.025,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
