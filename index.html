<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#10151b"><title>IRONBOUND — Sword Fighter</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10151b;color:#f5eee0;font:14px/1.4 system-ui,sans-serif}body{display:grid;place-items:center;background:radial-gradient(ellipse at 50% 40%,#29353b,#10151b 72%)}#game{position:relative;width:min(100vw,1280px);height:min(100vh,800px);min-height:360px;overflow:hidden;background:#172127;box-shadow:0 24px 100px #0009}canvas{width:100%;height:100%;display:block}.top{position:absolute;inset:22px 26px auto;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}.brand{font-size:11px;letter-spacing:.3em;color:#d5a968;font-weight:800}.sub{color:#8e9b9e;font-size:10px;letter-spacing:.18em;margin-top:3px}.hud{display:flex;gap:14px;align-items:center}.plate{background:#12191dcc;border:1px solid #66716d66;padding:9px 13px;min-width:102px}.label{font-size:9px;letter-spacing:.18em;color:#a6aaa2}.value{font-size:17px;font-weight:800;margin-top:2px}.health{width:150px;height:5px;background:#573c38;margin-top:5px}.health i{display:block;height:100%;background:#df7355;transition:width .2s}.intro{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;text-shadow:0 2px 20px #000}.intro h1{font:900 clamp(32px,7vw,72px)/.95 Georgia,serif;letter-spacing:.07em;margin:0;color:#f1e4cb}.intro p{font-size:11px;letter-spacing:.22em;color:#c69b65;margin:15px 0}.notice{font-size:10px;color:#aeb8b3;letter-spacing:.12em}.bottom{position:absolute;bottom:20px;left:26px;right:26px;display:flex;justify-content:space-between;align-items:end;pointer-events:none;color:#b1b8b2;font-size:10px;letter-spacing:.12em}.bottom b{color:#e2c28e}.actions{display:flex;gap:8px}.action{border:1px solid #c69b6566;background:#131b20cc;padding:8px 11px;color:#e3c18c;letter-spacing:.12em}.touch{display:none;position:absolute;bottom:62px;left:15px;right:15px;justify-content:space-between;align-items:end;pointer-events:none}.cluster{display:grid;grid-template-columns:repeat(3,46px);gap:4px}.tap{pointer-events:auto;border:1px solid #d5c49a66;background:#111a20bb;color:#f4e4c2;border-radius:8px;height:44px;font-weight:800;touch-action:none}.cluster .up{grid-column:2}.cluster .left{grid-column:1;grid-row:2}.cluster .down{grid-column:2;grid-row:2}.cluster .right{grid-column:3;grid-row:2}.tap.attack{height:56px;width:62px;border-radius:50%;background:#743e31cc}.veil{position:absolute;inset:0;background:#10151bd9;display:none;place-items:center;text-align:center}.veil.show{display:grid}.veil h2{font:700 44px Georgia;margin:0 0 8px}.veil button{margin-top:16px;padding:12px 22px;background:#d0a76a;border:0;color:#1b1b18;font-weight:900;letter-spacing:.15em}@media(max-width:650px){.top{inset:13px 12px auto}.brand{font-size:9px}.sub{font-size:8px}.hud{gap:5px}.plate{padding:7px;min-width:72px}.health{width:86px}.value{font-size:14px}.bottom{left:12px;right:12px;bottom:12px;font-size:8px}.actions{display:none}.touch{display:flex}.intro{top:43%}.notice{font-size:9px}}
</style></head><body><main id="game" aria-label="Sword Fighter game"><canvas id="arena" aria-label="Three-dimensional sword fighting arena"></canvas><header class="top"><div><div class="brand">IRONBOUND <span style="color:#eee">/</span> DUEL 01</div><div class="sub">THE ASHEN COURTYARD</div></div><div class="hud"><div class="plate"><div class="label">VITALITY</div><div class="health"><i id="health"></i></div></div><div class="plate"><div class="label">WAVE <span id="wave">01</span></div><div class="value"><span id="score">000</span><small style="font-size:9px;color:#a6aaa2"> PTS</small></div></div></div></header><div class="intro" id="intro"><h1>IRONBOUND</h1><p>ONE BLADE. NO MERCY.</p><div class="notice">WASD / ARROWS MOVE &nbsp; · &nbsp; SPACE ATTACK &nbsp; · &nbsp; SHIFT DASH</div></div><footer class="bottom"><span>DEFEAT THE <b>WARDENS</b> · SURVIVE THE WAVE</span><span class="actions"><span class="action">SPACE &nbsp; STRIKE</span><span class="action">SHIFT &nbsp; EVADE</span></span></footer><div class="touch"><div class="cluster"><button class="tap up" data-key="w">▲</button><button class="tap left" data-key="a">◀</button><button class="tap down" data-key="s">▼</button><button class="tap right" data-key="d">▶</button></div><button class="tap attack" data-key=" ">STRIKE</button></div><div class="veil" id="veil"><div><h2 id="endtitle">FALLEN</h2><div class="notice" id="endtext">THE COURTYARD CLAIMS ANOTHER.</div><button id="restart">RISE AGAIN</button></div></div></main><script>
(()=>{const c=document.querySelector('#arena'),ctx=c.getContext('2d'),ui={health:document.querySelector('#health'),score:document.querySelector('#score'),wave:document.querySelector('#wave'),intro:document.querySelector('#intro'),veil:document.querySelector('#veil'),endtitle:document.querySelector('#endtitle'),endtext:document.querySelector('#endtext')};let W=0,H=0,keys={},last=0,score=0,wave=1,gameOver=false,player,enemies=[],particles=[],started=false,attack=0,dash=0,spawnTimer=0;const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;c.width=W*d;c.height=H*d;ctx.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();function reset(){score=0;wave=1;gameOver=false;started=true;attack=dash=spawnTimer=0;player={x:0,z:2,hp:100,face:Math.PI,inv:0};enemies=[];particles=[];for(let i=0;i<3;i++)spawn();ui.score.textContent='000';ui.wave.textContent='01';ui.veil.classList.remove('show');ui.intro.style.display='none'}function spawn(){let a=rand(0,Math.PI*2),r=rand(7,10);enemies.push({x:Math.cos(a)*r,z:Math.sin(a)*r,hp:2,face:0,attack:rand(.3,1),flash:0})}function project(x,z,y=0){const s=Math.min(W/23,H/15),horizon=H*.49,depth=clamp(1-(z+9)/25,.48,1.3);return {x:W/2+x*s*depth,y:horizon+(z-1)*s*.68-y*s*depth,scale:s*depth}}function line(a,b,color,w=1){ctx.strokeStyle=color;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}function poly(points,fill,stroke){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke()}}function ellipse(x,y,rx,ry,fill){ctx.fillStyle=fill;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}
function floor(){const top=project(-10,-9),right=project(10,-9),front=project(10,11),left=project(-10,11);poly([top,right,front,left],'#293538','#59625a');for(let i=-9;i<=9;i+=1.5){line(project(i,-9),project(i,11),'#c4b38a18');line(project(-10,i),project(10,i),'#c4b38a18')}for(let i=0;i<24;i++){let x=rand(-9,9),z=rand(-8,10),p=project(x,z);ellipse(p.x,p.y,rand(1,3),rand(.5,1.5),'#d0c3a01b')}const a=project(-10,-9),b=project(10,-9);line(a,b,'#9b7952',3);for(let x=-9;x<=9;x+=3){let p=project(x,-9);line(p,{x:p.x,y:p.y+9},'#9b7952',2)}}
function fighter(o,hero){let p=project(o.x,o.z),s=p.scale,body=hero?'#c5c6b8':(o.flash?'#f2c37f':'#9a5847'),dark=hero?'#4d6570':'#513638',metal=hero?'#c4d2cc':'#ce8666';ellipse(p.x+2,p.y+2,11*s,4*s,'#09101488');let bob=hero&&started&&!gameOver?Math.sin(Date.now()*.009)*1.5*s:0;const ground=p.y;poly([{x:p.x-6*s,y:ground-9*s+bob},{x:p.x+6*s,y:ground-9*s+bob},{x:p.x+5*s,y:ground-20*s+bob},{x:p.x-5*s,y:ground-20*s+bob}],dark);poly([{x:p.x-7*s,y:ground-20*s+bob},{x:p.x+7*s,y:ground-20*s+bob},{x:p.x+5*s,y:ground-36*s+bob},{x:p.x-4*s,y:ground-36*s+bob}],body);ellipse(p.x,p.y-40*s+bob,5*s,6*s,hero?'#d7c6a4':'#c79575');poly([{x:p.x-5*s,y:p.y-42*s+bob},{x:p.x+5*s,y:p.y-42*s+bob},{x:p.x+4*s,y:p.y-47*s+bob},{x:p.x-4*s,y:p.y-47*s+bob}],hero?'#ad8b59':'#573e39');let fx=Math.cos(o.face),fz=Math.sin(o.face),shoulder=project(o.x+fx*.27,o.z+fz*.27,.5),tip=project(o.x+fx*(hero&&attack>.05?2.3:1.55),o.z+fz*(hero&&attack>.05?2.3:1.55),hero&&attack>.05?1.15:.72);line(shoulder,tip,metal,2.4*s);line({x:shoulder.x-fz*4*s,y:shoulder.y+fx*4*s},{x:shoulder.x+fz*4*s,y:shoulder.y-fx*4*s},'#8d6a44',2*s);if(hero&&attack>.05){ctx.globalAlpha=attack*1.6;line(project(o.x,o.z,.8),project(o.x+fx*3,o.z+fz*3,1.4),'#f5dfac',3*s);ctx.globalAlpha=1}}
function draw(){ctx.clearRect(0,0,W,H);const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#1d292f');sky.addColorStop(.52,'#354044');sky.addColorStop(.53,'#242f32');sky.addColorStop(1,'#11191e');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);let sun=ctx.createRadialGradient(W*.5,H*.47,2,W*.5,H*.47,H*.5);sun.addColorStop(0,'#d0a56b20');sun.addColorStop(1,'#d0a56b00');ctx.fillStyle=sun;ctx.fillRect(0,0,W,H);for(let x=0;x<8;x++){let bx=W*(x/7),bh=rand(30,0);ctx.fillStyle='#182328';ctx.fillRect(bx-12,H*.28,24,H*.22);ctx.fillStyle='#293437';ctx.fillRect(bx-16,H*.31,32,H*.03)}floor();let actors=[...enemies.map(e=>({o:e,hero:false})),...(player?[{o:player,hero:true}]:[])].sort((a,b)=>a.o.z-b.o.z);actors.forEach(a=>fighter(a.o,a.hero));particles.forEach(p=>{let q=project(p.x,p.z,p.y);ellipse(q.x,q.y,2*q.scale,2*q.scale,p.color)});if(!started){ctx.fillStyle='#e3c28d';ctx.font=`${Math.max(10,W*.012)}px system-ui`;ctx.textAlign='center';ctx.fillText('PRESS ANY MOVEMENT KEY TO ENTER THE DUEL',W/2,H*.75)}}
function end(){gameOver=true;ui.endtitle.textContent='FALLEN';ui.endtext.textContent=`YOU CLAIMED ${score} POINTS. THE WARDENS ENDURE.`;ui.veil.classList.add('show')}function update(dt){if(!started||gameOver)return;attack=Math.max(0,attack-dt*2.7);dash=Math.max(0,dash-dt);player.inv=Math.max(0,player.inv-dt);let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dz=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0),len=Math.hypot(dx,dz)||1;if(dx||dz){player.x+=dx/len*dt*(dash?13:5.1);player.z+=dz/len*dt*(dash?13:5.1);player.face=Math.atan2(dz,dx)}player.x=clamp(player.x,-8,8);player.z=clamp(player.z,-7,9);if(keys[' ']&&attack<=0){attack=1;for(const e of enemies){let d=Math.hypot(e.x-player.x,e.z-player.z),a=Math.atan2(e.z-player.z,e.x-player.x),diff=Math.atan2(Math.sin(a-player.face),Math.cos(a-player.face));if(d<2.8&&Math.abs(diff)<1.2){e.hp--;e.flash=.15;e.x+=Math.cos(a)*.8;e.z+=Math.sin(a)*.8;for(let i=0;i<8;i++)particles.push({x:e.x,z:e.z,y:rand(.2,1.4),life:rand(.2,.6),color:'#edbd76'})}}}for(let e of enemies){e.flash=Math.max(0,e.flash-dt);e.attack-=dt;let x=player.x-e.x,z=player.z-e.z,d=Math.hypot(x,z)||1;e.face=Math.atan2(z,x);if(d>1.3){e.x+=x/d*dt*1.25;e.z+=z/d*dt*1.25}else if(e.attack<=0){e.attack=1.25;if(!player.inv){player.hp-=12;player.inv=.6;if(player.hp<=0){player.hp=0;end()}}}}for(let i=enemies.length-1;i>=0;i--)if(enemies[i].hp<=0){score+=100;ui.score.textContent=String(score).padStart(3,'0');enemies.splice(i,1);spawnTimer=.45}if(!enemies.length){spawnTimer-=dt;if(spawnTimer<=0){wave++;ui.wave.textContent=String(wave).padStart(2,'0');for(let i=0;i<Math.min(3+wave,8);i++)spawn()}}particles=particles.filter(p=>p.life>0);particles.forEach(p=>{p.life-=dt;p.y+=dt*2;p.x+=rand(-1,1)*dt;p.z+=rand(-1,1)*dt});ui.health.style.width=player.hp+'%'}function frame(t){let dt=Math.min(.04,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);addEventListener('keydown',e=>{let k=e.key.toLowerCase();if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();keys[k]=true;if(!started&&['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].includes(k)){reset();ui.intro.style.display='none'}if(k==='shift'&&started)dash=.18});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);document.querySelectorAll('.tap').forEach(b=>{let k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true;if(!started&&k!==' ')reset();if(k===' '&&!started)reset();if(k==='shift')dash=.18});for(const ev of ['pointerup','pointercancel','pointerleave'])b.addEventListener(ev,()=>keys[k]=false)});document.querySelector('#restart').onclick=reset;document.querySelector('#game').addEventListener('click',()=>{if(!started)reset()});})();
</script></body></html>
