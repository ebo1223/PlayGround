<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tournament Champion</title>
  <style>
    :root{--gold:#f6c74b;--ink:#101828;--cream:#fff9e8;--red:#de5d4d;--blue:#4d82b8}
    *{box-sizing:border-box} body{margin:0;font-family:Trebuchet MS,Arial,sans-serif;background:#f2ead8;color:var(--ink);overflow:hidden}
    #app{height:100vh;display:grid;grid-template-rows:74px 1fr 34px;background:radial-gradient(circle at 50% 35%,#fffdf5 0,#f4eddb 58%,#ddd1b5 100%)}
    header{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;border-bottom:3px solid #b8a985;background:rgba(255,252,244,.92);box-shadow:0 3px 12px #75684520}
    .brand{display:flex;align-items:center;gap:12px}.crest{width:47px;height:47px;border:3px solid #8a7136;border-radius:50%;background:var(--gold);display:grid;place-items:center;font-size:25px;box-shadow:inset 0 0 0 4px #ffe89b}.brand h1{margin:0;font-family:Georgia,serif;font-size:24px}.brand small{display:block;color:#766b52;font-size:11px;letter-spacing:2px;text-transform:uppercase}
    .stats{display:flex;gap:8px}.stat{background:#fff;border:1px solid #d0c6a8;border-radius:8px;padding:7px 12px;min-width:82px;text-align:center}.stat b{display:block;color:#7b6330;font-size:18px}.stat span{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#77705d}
    main{position:relative;min-height:0;display:grid;grid-template-columns:230px 1fr 230px;gap:14px;padding:14px 18px 12px}
    .panel{background:rgba(255,253,246,.88);border:1px solid #c9bf9f;border-radius:12px;padding:14px;box-shadow:0 5px 18px #76684518}.panel h2{font-family:Georgia,serif;margin:0 0 10px;padding-bottom:8px;border-bottom:1px solid #ddd2b4;font-size:17px}
    #fighters{display:flex;flex-direction:column;gap:8px}.fighter{display:grid;grid-template-columns:42px 1fr 28px;align-items:center;gap:8px;border:1px solid #ded5bc;border-radius:8px;padding:6px;background:#fff}.fighter.active{border-color:#b5913f;box-shadow:0 0 0 2px #f1d98a}.portrait{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:#eee6cf}.fighter-name{font-weight:bold;font-size:13px}.fighter-type{font-size10px;color:#77705d}.level{font:bold 13px Georgia;background:#ece3c9;border-radius:50%;width28px;height28px;display:grid;place-items:center}
    #arena{position:relative;min-width:0;border-radius:14px;overflow:hidden;border:3px solid #8e8059;background:#d2c68c;box-shadow:0 8px 24px #574b3226}
    canvas{display:block;width:100%;height:100%;background:#d8cd98}
    #roundBanner{position:absolute;left:50%;top:18px;transform:translateX(-50%) translateY(-20px);background:#1d2b36;color:#fff;border:2px solid var(--gold);border-radius:7px;padding8px 18px;text-align:center;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}.round-big{font:700 19px Georgia;color:#f8d76d}.round-small{font-size10px;letter-spacing2px;text-transform:uppercase}
    #controls{display:grid;gap:8px}.ability{border:1px solid #bbae87;border-radius9px;background:#fff;padding9px 10px;text-align:left;cursor:pointer;transition:.12s}.ability:hover{transform:translateY(-1px);border-color:#94763d;box-shadow:0 3px8px #71613b1f}.ability:disabled{opacity:.45;cursor:not-allowed}.ability strong{display:block;font-family:Georgia,serif;font-size14px}.ability span{font-size10px;color:#77705d}.ability em{float:right;font-style:normal;color:#9a7b35;font-weight:bold}.button{border:0;border-radius8px;padding10px;background:#26394a;color:white;font-weight:bold;cursor:pointer}.button.gold{background:#a8893b}.button.red{background:#b85145}
    #log{height:118px;overflow:hidden;font-size:11px;line-height:1.45;padding-top:6px}.logline{border-bottom:1px solid #eee6d1;padding:3px 0}.winner{color:#3d7a55;font-weight:bold}.damage{color:#aa4a40}
    footer{border-top:1px solid #bcb18f;background:#e6dcc0;text-align:center;font-size10px;color:#776e55;padding8px;letter-spacing:1px}
    #toast{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);background:#fffdf6;border:1px solid #b8a77d;border-radius20px;padding8px 14px;font-size12px;font-weight:bold;opacity:0;transition:.18s;pointer-events:none}.card{margin-top10px;border-top:1px solid #ddd2b4;padding-top10px}.health{height:8px;border-radius5px;background:#dacfb3;margin-top6px;overflow:hidden}.health i{display:block;height:100%;background:#5d9868;width:100%;transition:.3s}
    @media(max-width:800px){main{grid-template-columns:150px 1fr 150px;padding:8px}.panel{padding8px}.stats .stat:nth-child(n+3){display:none}.brand h1{font-size19px}.fighter{grid-template-columns:36px 1fr}.level{display:none}.portrait{width36px;height36px}}
  </style>
</head>
<body><div id="app">
<header><div class="brand"><div class="crest">♛</div><div><h1>Tournament Champion</h1><small>Royal Trials</small></div></div><div class="stats"><div class="stat"><b id="roundStat">1 / 3</b><span>Round</span></div><div class="stat"><b id="goldStat">120</b><span>Gold</span></div><div class="stat"><b id="winsStat">0</b><span>Victories</span></div></div></header>
<main>
  <aside class="panel"><h2>Your Champions</h2><div id="fighters"></div></aside>
  <section id="arena"><canvas id="game"></canvas><div id="roundBanner"><div class="round-big">ROUND I</div><div class="round-small">Choose your fighter</div></div><div id="toast"></div></section>
  <aside class="panel"><h2 id="actionTitle">Commands</h2><div id="controls"><button class="ability" data-act="slash"><strong>⚔ Strike</strong><span>Reliable sword attack</span><em>100%</em></button><button class="ability" data-act="power"><strong>✦ Power Blow</strong><span>High damage, low accuracy</span><em>65%</em></button><button class="ability" data-act="guard"><strong>◆ Brace</strong><span>Reduce next enemy damage</span></button><button class="ability" data-act="heal"><strong>✚ Bandage</strong><span>Restore 18–25 health</span><em>1</em></button><button id="nextBtn" class="button gold">Next Round</button></div><div class="card"><h2>Battle Log</h2><div id="log"></div></div></aside>
</main>
<footer>ROYAL ARENA • SPRING CUP • 1492</footer>
</div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
let W,H,particles=[],phase='choose',round=1,gold=120,wins=0,battle=false,enemy=null,active=0,turnLocked=false;
const team=[
 {name:'Sir Aldric',type:'Knight',icon:'♞',hp:100,max:100,atk:18,level:3,color:'#d45d4e'},
 {name:'Lyra',type:'Ranger',icon:'➶',hp:82,max:82,atk:15,level:2,color:'#628f62'},
 {name:'Brother Oren',type:'Monk',icon:'✦',hp:90,max:90,atk:14,level:2,color:'#5d7f9e'}
];
function resize(){const r=canvas.getBoundingRect();W=canvas.width=Math.floor(r.width*devicePixelRatio);H=canvas.height=Math.floor(r.height*devicePixelRatio)}
addEventListener('resize',resize); resize();
const enemies=[
 {name:'The Black Knight',icon:'♜',hp:92,max:92,atk:16,color:'#3d4149'},
 {name:'Duchess Viper',icon:'♛',hp:105,max:105,atk:18,color:'#6a3d63'},
 {name:'Baron Ironclad',icon:'♝',hp:125,max:125,atk:20,color:'#6d6b58'}
];
function resetEnemy(){enemy={...enemies[round-1],guard:false}}
function renderFighters(){const el=document.getElementById('fighters');el.innerHTML='';team.forEach((f,i)=>{el.innerHTML+=`<div class="fighter ${i===active?'active':''}" data-i="${i}"><div class="portrait" style="background:${f.color}22">${f.icon}</div><div><div class="fighter-name">${f.name}</div><div class="fighter-type">${f.type}</div><div class="health"><i style="width:${f.hp/f.max*100}%"></i></div></div><div class="level">${f.level}</div></div>`});document.querySelectorAll('.fighter').forEach(e=>e.onclick=()=>{if(!battle&&team[+e.dataset.i].hp>0){active=+e.dataset.i;renderFighters();toast(team[active].name+' selected')}})}
function log(s,cls=''){let el=document.getElementById('log');el.innerHTML=`<div class="logline ${cls}">${s}</div>`+el.innerHTML}
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.opacity=0,1300)}
function banner(a,b){const e=document.getElementById('roundBanner');e.querySelector('.round-big').textContent=a;e.querySelector('.round-small').textContent=b;e.style.opacity=1;e.style.transform='translateX(-50%) translateY(0)';setTimeout(()=>e.style.opacity=0,1800)}
function draw(){ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);ctx.clearRect(0,0,W/devicePixelRatio,H/devicePixelRatio);const w=W/devicePixelRatio,h=H/devicePixelRatio;
 ctx.fillStyle='#d8d09f';ctx.fillRect(0,0,w,h);ctx.fillStyle='#c7bc89';for(let i=0;i<12;i++){ctx.beginPath();ctx.ellipse((i*137+60)%w,h*.72,180,28,0,0,Math.PI*2);ctx.fill()}
 ctx.fillStyle='#6d6042';ctx.fillRect(0,h*.77,w,h*.23);ctx.fillStyle='#d2c28c';ctx.fillRect(0,h*.79,w,h*.21);
 ctx.strokeStyle='#b4a66e';ctx.lineWidth=2;for(let x=-h*.2;x<w+h*.2;x+=70){ctx.beginPath();ctx.moveTo(x,h*.78);ctx.lineTo(x+180,h);ctx.stroke()} 
 ctx.fillStyle='#7e704d';ctx.fillRect(0,h*.15,w,8);ctx.fillStyle='#a99a68';ctx.fillRect(0,h*.17,w,5);
 ctx.fillStyle='#51472f';ctx.beginPath();ctx.arc(w*.5,h*.34,34,0,7);ctx.fill();ctx.fillStyle='#e8dec0';ctx.fillRect(w*.5-100,h*.33,200,6);
 drawFighter(team[active],w*.27,h*.64,1,false);if(enemy&&battle)drawFighter(enemy,w*.73,h*.64,-1,true);else if(enemy)drawChest(w*.73,h*.64);
 particles.forEach(p=>{ctx.globalAlpha=p.a;ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();ctx.globalAlpha=1;p.x+=p.vx;p.y+=p.vy;p.vy+=.08;p.a-=.015});particles=particles.filter(p=>p.a>0);requestAnimationFrame(draw)}
function drawFighter(f,x,y,dir,bad){ctx.save();ctx.translate(x,y);ctx.scale(dir,1);ctx.fillStyle='#554833';ctx.beginPath();ctx.ellipse(0,74,62,13,0,0,7);ctx.fill();ctx.fillStyle=bad?f.color:'#8c7045';ctx.beginPath();ctx.moveTo(-34,60);ctx.quadraticCurveTo(-48,-5,-19,-34);ctx.quadraticCurveTo(0,-48,20,-34);ctx.quadraticCurveTo(48,-5,34,60);ctx.fill();ctx.fillStyle='#e7d6ae';ctx.beginPath();ctx.arc(0,-53,27,0,7);ctx.fill();ctx.fillStyle=bad?'#4b4e55':'#a87850';ctx.beginPath();ctx.arc(0,-57,27,Math.PI,Math.PI*2);ctx.fill();ctx.fillStyle='#252b31';ctx.fillRect(-22,-43,44,5);ctx.font='28px Georgia';ctx.fillStyle='#5d4a2d';ctx.textAlign='center';ctx.fillText(f.icon,0,13);ctx.restore();ctx.fillStyle='rgba(255,255,255,.9)';ctx.fillRect(x-55,y-125,110,13);ctx.fillStyle=bad?'#a64a43':'#639064';ctx.fillRect(x-53,y-123,106*(Math.max(0,f.hp)/f.max),9);ctx.fillStyle='#5b5035';ctx.font='bold 13px Trebuchet MS';ctx.textAlign='center';ctx.fillText(f.name,x,y-135)}
function drawChest(x,y){ctx.fillStyle='#7b5a32';ctx.fillRect(x-38,y-50,76,48);ctx.fillStyle='#b18a48';ctx.fillRect(x-42,y-54,84,25);ctx.fillStyle='#d2b36a';ctx.fillRect(x-5,y-38,10,18)}
function burst(x,y,c){for(let i=0;i<22;i++){const a=Math.random()*7,v=1+Math.random()*4;particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:2+Math.random()*4,a:1,c})}}
function playerAct(act){if(turnLocked||phase==='end')return;let f=team[active];if(f.hp<=0){toast('This champion is defeated');return}let used=false;
 if(act==='heal'){const n=1; if(f.hp>=f.max)return toast('Already at full health');f.hp=Math.min(f.max,f.hp+18+Math.floor(Math.random()*8));used=true;log(f.name+' bandages wounds.','winner')}
 else if(act==='guard'){f.guard=true;used=true;log(f.name+' braces for impact.')}
 else{let hit=act==='power'?Math.random()<.65:true;if(hit){let dmg=Math.round(f.atk*(act==='power'?1.65:(.85+Math.random()*.25)));if(act==='slash'&&Math.random()<.18)dmg+=5;enemy.hp-=dmg;burst(W/devicePixelRatio*.73,H/devicePixelRatio*.64,'#e9c66b');log(f.name+' deals <span class="damage">'+dmg+'</span> damage.',dmg>25?'winner':'');used=true}else{log(f.name+' missed!');used=true}}
 if(used){updateUI();turnLocked=true;if(enemy.hp<=0)return setTimeout(win,500);setTimeout(enemyTurn,700)}}
function enemyTurn(){if(!enemy||enemy.hp<=0)return;let f=team[active];let dmg=Math.max(5,enemy.atk-Math.floor(Math.random()*5));if(f.guard){dmg=Math.round(dmg*.45);f.guard=false}f.hp-=dmg;burst(W/devicePixelRatio*.27,H/devicePixelRatio*.64,'#b85043');log(enemy.name+' hits '+f.name+' for <span class="damage">'+dmg+'</span>.');updateUI();if(f.hp<=0){f.hp=0;updateUI();let alive=team.filter(x=>x.hp>0);if(!alive.length)return setTimeout(loss,500)}turnLocked=false}
function win(){phase='end';battle=false;wins++;gold+=round*45;team.forEach(f=>{if(f.hp>0)f.hp=Math.min(f.max,f.hp+12)});updateUI();banner('VICTORY','You earned '+round*45+' gold');log(enemy.name+' has fallen!','winner');document.getElementById('nextBtn').textContent=round<3?'Begin Next Round':'Tournament Won'}
function loss(){phase='end';battle=false;updateUI();banner('DEFEAT','The cup has slipped away');document.getElementById('nextBtn').textContent='Try Again';log('Your champions have fallen.','damage')}
function startBattle(){enemy={...enemies[round-1],guard:false};battle=true;phase='battle';turnLocked=false;team.forEach(f=>{if(f.hp>0)f.hp=Math.min(f.max,f.hp+18)});updateUI();banner('ROUND '+['I','II','III'][round-1],enemy.name+' enters the arena');log('Round '+round+' begins against '+enemy.name+'.')}
function updateUI(){document.getElementById('roundStat').textContent=round+' / 3';document.getElementById('goldStat').textContent=gold;document.getElementById('winsStat').textContent=wins;renderFighters();document.querySelectorAll('.ability').forEach(b=>b.disabled=!battle||turnLocked||team[active].hp<=0)}
startBattle();updateUI();draw();
document.querySelectorAll('.ability').forEach(b=>b.onclick=()=>playerAct(b.dataset.act));
document.getElementById('nextBtn').onclick=()=>{if(phase==='end'){if(wins>=round&&round<3){round++;team.forEach(f=>f.hp=Math.min(f.max,f.hp+25));startBattle()}else if(wins>=round&&round===3){gold+=100;round=1;wins=0;team.forEach(f=>{f.hp=f.max});resetEnemy();startBattle()}else{team.forEach(f=>f.hp=f.max);round=1;wins=0;startBattle()}}};
</script></body></html>
