<script>
const symbols=[{s:'7',c:'red',pay:500},{s:'♛',c:'purple',pay:200},{s:'◆',c:'blue',pay:160},{s:'♣',c:'green',pay:120},{s:'★',c:'gold',pay:100},{s:'BAR',c:'gold',pay:250}];let credit=1000,bet=10,spinning=false;const reels=[...document.querySelectorAll('.reel')],spin=document.getElementById('spin'),creditEl=document.getElementById('credit'),betEl=document.getElementById('bet'),banner=document.getElementById('banner');function money(n){return '$'+n.toLocaleString()}function makeSymbol(d){let el=document.createElement('div');el.className='symbol '+d.c;el.innerHTML=d.s==='BAR'?'<div class="label">BAR</div>':'<div>'+d.s+'</div>';return el}function setStrip(r,seq){r.innerHTML='';let strip=document.createElement('div');strip.className='strip';for(let i=0;i<12;i++)strip.append(makeSymbol(seq[i%seq.length]));r.append(strip);return strip}function update(){creditEl.textContent=money(credit);betEl.textContent=money(bet)}reels.forEach((r,i)=>{let seq=[];for(let k=0;k<12;k++)seq.push(symbols[(k+i*2)%symbols.length]);setStrip(r,seq)});update();function spinOnce(){if(spinning)return;if(credit<bet){banner.innerHTML='GAME OVER';banner.classList.remove('show');void banner.offsetWidth;banner.classList.add('show');return}spinning=true;spin.disabled=true;credit-=bet;update();banner.classList.remove('show');let finals=[];reels.forEach((r,i)=>{r.className='reel spinning';let seq=[];for(let k=0;k<12;k++)seq.push(symbols[Math.floor(Math.random()*symbols.length)]);let d=symbols[Math.floor(Math.random()*symbols.length)];seq[5]=d;let strip=setStrip(r,seq);finals.push(d);strip.style.transform='translateY(-112px)';strip.style.transition='none';requestAnimationFrame(()=>requestAnimationFrame(()=>{strip.style.transition=`transform ${1.2+i*.22}s cubic-bezier(.12,.75,.18,1)`;strip.style.transform='translateY(-672px)'}))});setTimeout(()=>{reels.forEach(r=>r.className='reel');let counts={};finals.forEach(d=>counts[d.s]=(counts[d.s]||0)+1);let winner=Object.keys(counts).filter(k=>counts[k]>=3).sort((a,b)=>counts[b]-counts[a])[0],win=0;if(winner){let d=symbols.find(x=>x.s===winner);win=d.pay*(bet/10)*(counts[winner]===5?3:counts[winner]===4?1.7:1);credit+=Math.round(win);banner.innerHTML='WIN <span>'+money(Math.round(win))+'</span>';banner.classList.remove('show');void banner.offsetWidth;banner.classList.add('show');reels.forEach((r,i)=>{if(finals[i].s===winner)r.style.filter='brightness(1.25)';setTimeout(()=>r.style.filter='',1800)})}update();spinning=false;spin.disabled=false},2400)}spin.onclick=spinOnce;document.getElementById('up').onclick=()=>{if(!spinning){bet=Math.min(100,bet+10);update()}};document.getElementById('down').onclick=()=>{if(!spinning){bet=Math.max(10,bet-10);update()}};
