<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Asteroid Blaster 3D</title>
  <style>
    :root { --cyan:#64d9ff; --pink:#ff5577; --ink:#050711; }
    * { box-sizing:border-box; }
    html,body { width:100%; height:100%; margin:0; overflow:hidden; background:#050711; }
    canvas { display:block; width:100%; height:100%; }
    #ui { position:fixed; inset:0; pointer-events:none; color:white; font-family:Inter,ui-sans-serif,system-ui,sans-serif; }
    #top { position:absolute; left:24px; right:24px; top:18px; display:flex; justify-content:space-between; align-items:flex-start; }
    .panel { background:linear-gradient(135deg,rgba(17,27,52,.86),rgba(7,11,25,.72)); border:1px solid rgba(120,210,255,.16); box-shadow:0 10px 30px rgba(0,0,0,.18); backdrop-filter:blur(10px); }
    #score { min-width:148px; padding:10px 16px 9px; border-radius:12px; }
    .label { color:#91a1bd; font-size:10px; letter-spacing:.23em; font-weight:800; }
    #scoreValue { font-size:27px; line-height:1.05; font-weight:900; letter-spacing:.04em; margin-top:3px; }
    #lives { display:flex; gap:7px; padding:12px 13px; border-radius:12px; }
    .life { width:22px; height:22px; position:relative; transform:rotate(45deg); border:2px solid #66daf7; clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%); background:linear-gradient(135deg,#71e6ff,#3671a5); box-shadow:0 0 10px rgba(102,218,247,.5); }
    .life.off { opacity:.18; filter:grayscale(1); }
    #reticle { position:absolute; left:50%; top:50%; width:44px; height:44px; transform:translate(-50%,-50%); border:1px solid rgba(150,224,255,.5); border-radius:50%; box-shadow:0 0 14px rgba(90,180,255,.12); }
    #reticle:before,#reticle:after { content:""; position:absolute; left:50%; top:50%; background:rgba(150,224,255,.8); transform:translate(-50%,-50%); }
    #reticle:before { width:58px; height:1px; } #reticle:after { width:1px; height:58px; }
    #centerDot { position:absolute; width:5px; height:5px; border-radius:50%; background:#fff; left:50%; top:50%; transform:translate(-50%,-50%); box-shadow:0 0 8px #fff; }
    #message { position:absolute; left:50%; top:50%; transform:translate(-50%, -50%); text-align:center; transition:.25s; }
    #message.hidden { opacity:0; transform:translate(-50%, -46%) scale(.96); }
    h1 { margin:0 0 8px; font-size:clamp(38px,7vw,84px); line-height:.92; letter-spacing:.03em; text-transform:uppercase; text-shadow:0 8px 40px rgba(0,0,0,.9); }
    h1 span { color:#64d9ff; }
    #subtitle { color:#b2bdd1; font-size:12px; letter-spacing:.26em; font-weight:800; text-transform:uppercase; }
    #start { pointer-events:auto; margin-top:24px; border:1px solid rgba(145,225,255,.7); color:#06101a; background:linear-gradient(135deg,#9df1ff,#54aeca); border-radius:7px; padding:13px 28px; font-weight:900; letter-spacing:.16em; cursor:pointer; box-shadow:0 10px 30px rgba(72,194,222,.22); }
    #start:hover { filter:brightness(1.12); }
    #gameOver { display:none; }
    #bottom { position:absolute; left:24px; bottom:18px; color:#7f91ae; font-size:10px; letter-spacing:.15em; text-transform:uppercase; }
    #wave { position:absolute; right:24px; bottom:20px; text-align:right; }
    #waveValue { margin-top:3px; font-size:20px; font-weight:900; }
    @media(max-width:650px){ #top{left:12px;right:12px;top:12px}.panel{backdrop-filter:none} #bottom{display:none} #wave{right:12px} }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="ui">
    <div id="top">
      <div id="score" class="panel"><div class="label">SCORE</div><div id="scoreValue">000000</div></div>
      <div id="lives" class="panel"><div class="life"></div><div class="life"></div><div class="life"></div></div>
    </div>
    <div id="reticle"><div id="centerDot"></div></div>
    <div id="message">
      <h1>Asteroid<br><span>Blaster</span></h1>
      <div id="subtitle">3D Deep Space Defense</div>
      <button id="start">LAUNCH MISSION</button>
    </div>
    <div id="bottom">WASD / Arrows to move · Mouse to aim · Space to fire</div>
    <div id="wave"><div class="label">WAVE</div><div id="waveValue">01</div></div>
  </div>
<script>
(() => {
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let w,h,dpr,cx,cy; let started=false,gameOver=false,keys={},mouse={x:0,y:0};
let score=0,lives=3,wave=1,shake=0,spawnTimer=0,flash=0,last=0;
const stars=[],asteroids=[],bullets=[],particles=[];
function resize(){ dpr=Math.min(devicePixelRatio||1,2); w=innerWidth;h=innerHeight;canvas.width=w*dpr;canvas.height=h*dpr;canvas.style.width=w+'px';canvas.style.height=h+'px';ctx.setTransform(dpr,0,0,dpr,0,0);cx=w/2;cy=h*.58; }
addEventListener('resize',resize);resize();
for(let i=0;i<190;i++) stars.push({x:Math.random(),y:Math.random(),z:Math.random(),r:.3+Math.random()*1.2});

const ship={x:0,y:0,tilt:0,bank:0};
function reset(){ score=0;lives=3;wave=1;asteroids.length=0;bullets.length=0;particles.length=0;ship.x=0;ship.y=0;started=true;gameOver=false;spawnTimer=.5;document.getElementById('message').classList.add('hidden');updateUI(); }
function updateUI(){document.getElementById('scoreValue').textContent=String(score).padStart(6,'0');document.getElementById('waveValue').textContent=String(wave).padStart(2,'0');document.querySelectorAll('.life').forEach((el,i)=>el.classList.toggle('off',i>=lives));}
document.getElementById('start').onclick=reset;
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space'&&started&&!gameOver)e.preventDefault();});
addEventListener('keyup',e=>keys[e.code]=false);
addEventListener('mousemove',e=>{mouse.x=e.clientX-cx;mouse.y=e.clientY-cy;document.getElementById('reticle').style.left=e.clientX+'px';document.getElementById('reticle').style.top=e.clientY+'px';});
addEventListener('mousedown',e=>{if(started&&!gameOver)shoot();});
addEventListener('touchstart',e=>{if(!started)return;const t=e.changedTouches[0];mouse.x=t.clientX-cx;mouse.y=t.clientY-cy;shoot();},{passive:true});
addEventListener('touchmove',e=>{const t=e.changedTouches[0];mouse.x=t.clientX-cx;mouse.y=t.clientY-cy;document.getElementById('reticle').style.left=t.clientX+'px';document.getElementById('reticle').style.top=t.clientY+'px';},{passive:true});

function shoot(){ bullets.push({x:ship.x,y:ship.y-45,vx:(mouse.x*.018),vy:-12-life:0}); }
function spawn(){
  const edge=Math.random(); let x=(Math.random()*2-1)*w*.58,y=-40;
  if(edge>.82){x=Math.random()<.5?-40:w+40;y=Math.random()*h*.45;}
  const r=18+Math.random()*28;
  asteroids.push({x,y,z:1,r,vx:(Math.random()*2-1)*.5+(cx-x)*.0008,vy:.8+Math.random()*1.1+wave*.08,rot:Math.random()*6,vr:(Math.random()-.5)*.025,shape:Array.from({length:10},()=>.78+Math.random()*.32),hit:0});
}
function burst(x,y,color='#82dcff',n=14){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=1+Math.random()*5;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:20+Math.random()*30,max:50,color,r:1+Math.random()*2});}}
function collide(ax,ay,bx,by,r){const dx=ax-bx,dy=ay-by;return dx*dx+dy*dy<r*r;}
function update(dt){
  const sp=7*dt; if(keys.ArrowLeft||keys.KeyA)ship.x-=sp;if(keys.ArrowRight||keys.KeyD)ship.x+=sp;if(keys.ArrowUp||keys.KeyW)ship.y-=sp;if(keys.ArrowDown||keys.KeyS)ship.y+=sp;
  ship.x=Math.max(-w*.42,Math.min(w*.42,ship.x));ship.y=Math.max(-h*.38,Math.min(h*.35,ship.y));ship.tilt+=(ship.x*0.00015-ship.tilt)*.12;ship.bank+=( (keys.ArrowLeft||keys.KeyA?-1:0)+(keys.ArrowRight||keys.KeyD?1:0)-ship.bank)*.12;
  if(started&&!gameOver){ spawnTimer-=dt;if(spawnTimer<=0){spawn();spawnTimer=Math.max(.22,1.25-wave*.08)*(.7+Math.random*.7);} }
  for(const b of bullets){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life+=dt;} for(let i=bullets.length-1;i>=0;i--)if(bullets[i].life>130||bullets[i].y<-100)bullets.splice(i,1);
  for(const a of asteroids){a.x+=a.vx*dt;a.y+=a.vy*dt;a.rot+=a.vr*dt;a.hit=Math.max(0,a.hit-dt*.12);}
  // Bullets use ship-relative coordinates, as do the drawn projectiles.
  for(let bi=bullets.length-1;bi>=0;bi--)for(let ai=asteroids.length-1;ai>=0;ai--){const b=bullets[bi],a=asteroids[ai];const bx=cx+ship.x+b.x,by=cy+ship.y+b.y;if(collide(bx,by,a.x,a.y,a.r*.72)){bullets.splice(bi,1);burst(a.x,a.y,'#ff9b68',18);score+=100;asteroids.splice(ai,1);if(score>0&&score%1200===0)wave++;updateUI();break;}}
  for(let i=asteroids.length-1;i>=0;i--){const a=asteroids[i];if(collide(a.x,a.y,cx+ship.x,cy+ship.y,38)){burst(a.x,a.y,'#ff5577',25);asteroids.splice(i,1);lives--;shake=18;flash=1;updateUI();if(lives<=0){gameOver=true;started=false;const m=document.getElementById('message');m.innerHTML='<h1>Mission<br><span>Failed</span></h1><div id="subtitle">Final score '+String(score).padStart(6,'0')+'</div><button id="start">TRY AGAIN</button>';m.classList.remove('hidden');document.getElementById('start').onclick=reset;}}else if(a.y>h+80){asteroids.splice(i,1);}}
  for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.98;p.vy*=.98;p.life-=dt;if(p.life<=0)particles.splice(i,1);}shake*=.88;flash=Math.max(0,flash-dt*.06);
}
function poly(sides,r,phase){ctx.beginPath();for(let i=0;i<sides;i++){const a=i/sides*Math.PI*2+phase,rr=r*(1+.06*Math.sin(i*7+phase));const x=Math.cos(a)*rr,y=Math.sin(a)*rr;i?ctx.lineTo(x,y):ctx.moveTo(x,y);}ctx.closePath();}
function draw(){
  const sx=(Math.random-.5)*shake,sy=(Math.random-.5)*shake;ctx.save();ctx.translate(sx,sy);
  const g=ctx.createRadialGradient(w*.5,h*.5,20,w*.5,h*.5,h*.8);g.addColorStop(0,'#101d35');g.addColorStop(.55,'#090e20');g.addColorStop(1,'#02040b');ctx.fillStyle=g;ctx.fillRect(-30,-30,w+60,h+60);
  ctx.fillStyle='#fff';for(const s of stars){const tw=.55+.45*Math.sin(performance.now*.001*s.z*3+s.x*99);ctx.globalAlpha=(.25+s.z*.75)*tw;ctx.beginPath();ctx.arc(s.x*w,(s.y*h+performance.now*.008*s.z)%(h),s.r,0,7);ctx.fill();}ctx.globalAlpha=1;
  // nebula bands
  ctx.globalAlpha=.08;ctx.fillStyle='#3264a8';ctx.beginPath();ctx.ellipse(w*.18,h*.25,w*.32,h*.09,-.35,0,7);ctx.fill();ctx.fillStyle='#70407e';ctx.beginPath();ctx.ellipse(w*.78,h*.72,w*.38,h*.08,.4,0,7);ctx.fill();ctx.globalAlpha=1;
  // grid floor
  ctx.save();ctx.beginPath();ctx.moveTo(0,h);ctx.lineTo(w,h);ctx.lineTo(w,h*.74);ctx.lineTo(w*.55,h*.45);ctx.lineTo(w*.45,h*.45);ctx.lineTo(0,h*.74);ctx.clip();ctx.strokeStyle='rgba(70,130,170,.10)';ctx.lineWidth=1;for(let i=0;i<18;i++){const y=h*.48+i*i*.48;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}ctx.restore();
  // bullets
  for(const b of bullets){const bx=cx+ship.x+b.x,by=cy+ship.y+b.y;ctx.strokeStyle='#9deaff';ctx.lineWidth=2;ctx.shadowBlur=12;ctx.shadowColor='#55cfff';ctx.beginPath();ctx.moveTo(bx,by+8);ctx.lineTo(bx,by+31);ctx.stroke();ctx.shadowBlur=0;}
  // asteroids
  for(const a of asteroids){ctx.save();ctx.translate(a.x,a.y);ctx.rotate(a.rot);ctx.shadowBlur=18;ctx.shadowColor='rgba(0,0,0,.8)';ctx.fillStyle='#26304a';ctx.strokeStyle='#69748a';ctx.lineWidth=2;poly(10,a.r,a.rot);ctx.fill();ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle='rgba(0,0,0,.24)';ctx.beginPath();ctx.arc(-a.r*.25,-a.r*.1,a.r*.28,0,7);ctx.fill();ctx.fillStyle='rgba(170,190,210,.12)';ctx.beginPath();ctx.arc(a.r*.28,-a.r*.22,a.r*.13,0,7);ctx.fill();ctx.restore();}
  // particles
  for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();}ctx.globalAlpha=1;
  // ship
  const sx=cx+ship.x,sy=cy+ship.y;ctx.save();ctx.translate(sx,sy);ctx.rotate(ship.bank*.12);ctx.shadowBlur=22;ctx.shadowColor='#3aa5dc';ctx.fillStyle='#91dcef';ctx.beginPath();ctx.moveTo(0,-46);ctx.lineTo(28,26);ctx.lineTo(9,18);ctx.lineTo(0,30);ctx.lineTo(-9,18);ctx.lineTo(-28,26);ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#1d5675';ctx.beginPath();ctx.moveTo(0,-38);ctx.lineTo(10,10);ctx.lineTo(0,18);ctx.lineTo(-10,10);ctx.closePath();ctx.fill();ctx.fillStyle='#b8efff';ctx.beginPath();ctx.moveTo(0,-31);ctx.lineTo(5,-5);ctx.lineTo(0,5);ctx.lineTo(-5,-5);ctx.closePath();ctx.fill();ctx.fillStyle='#4ccfff';ctx.beginPath();ctx.moveTo(-17,20);ctx.lineTo(-31,30);ctx.lineTo(-12,14);ctx.fill();ctx.beginPath();ctx.moveTo(17,20);ctx.lineTo(31,30);ctx.lineTo(12,14);ctx.fill();ctx.fillStyle='rgba(83,190,255,.75)';ctx.beginPath();ctx.moveTo(-7,25);ctx.lineTo(-2,25);ctx.lineTo(-5,48+Math.random()*12);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(7,25);ctx.lineTo(2,25);ctx.lineTo(5,48+Math.random()*12);ctx.closePath();ctx.fill();ctx.restore();
  if(flash){ctx.fillStyle=`rgba(255,60,90,${flash*.35})`;ctx.fillRect(0,0,w,h);}ctx.restore();
}
function loop(t){const dt=Math.min(2,(t-last)/16.667||1);last=t;update(dt);draw();requestAnimationFrame(loop);}requestAnimationFrame(loop);
})();
</script>
</body>
</html>
