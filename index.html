<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Memory Match</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="game-shell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="Memory Match home">
        <span class="brand-mark">M</span>
        <span>Memory Match</span>
      </a>
      <button class="icon-button" id="soundButton" type="button" aria-label="Toggle sound" title="Toggle sound">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6.8 8.5H3.5v7h3.3L11 19V5Zm4.2 3.1a5.5 5.5 0 0 1 0 7.8M17.8 5.5a9 9 0 0 1 0 13"/></svg>
      </button>
    </header>

    <section class="game-area">
      <aside class="score-panel">
        <div class="stat">
          <span class="stat-label">MOVES</span>
          <strong id="moves">0</strong>
        </div>
        <div class="stat">
          <span class="stat-label">TIME</span>
          <strong id="timer">0:00</strong>
        </div>
        <button class="restart-button" id="restartButton" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 6M20 5v6h-6"/></svg>
          Restart
        </button>
      </aside>

      <div class="board-wrap">
        <div class="board" id="board" aria-label="Memory card grid"></div>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <div class="modal-backdrop" id="winModal" aria-hidden="true">
    <div class="win-modal" role="dialog" aria-modal="true" aria-labelledby="winTitle">
      <div class="celebration">🎉</div>
      <h2 id="winTitle">You matched them all!</h2>
      <p><strong id="finalMoves">0</strong> moves <span>•</span> <strong id="finalTime">0:00</strong></p>
      <button class="play-again" id="playAgainButton" type="button">Play again</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
