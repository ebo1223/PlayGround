<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Tennis Masters</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061d3a;font-family:Trebuchet MS,Arial,sans-serif}canvas{display:block;width:100vw;height:100vh}.ui{position:absolute;inset:0;pointer-events:none}.top{position:absolute;top:18px;left:50%;transform:translateX(-50%);width:min(650px,75vw);display:flex;align-items:center;justify-content:space-between;color:white;text-shadow:0 2px 3px #0008}.score{display:flex;align-items:center;gap:10px;font-weight:900;font-size:22px}.scorebox{background:#102d5eeb;border:3px solid #fff7;border-radius:12px;padding:7px 14px;min-width:88px;text-align:center;box-shadow:0 5px 12px #0015}.scorebox.player{border-color:#57e5ff}.scorebox.enemy{border-color:#ff6f91}.logo{position:absolute;top:65px;left:20px;color:white;font-size:16px;font-weight:900;transform:rotate(-3deg);text-shadow:0 3px #0b6b79}.logo span{color:#ffdc45}.hint{position:absolute;bottom:18px;left:50%;transform:translateX(-50);color:white;font-weight:800;font-size:13px;text-shadow:0 2px 3px #000;background:#123364aa;padding:7px 12px;border-radius:20px}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(90deg,#061d3aaa,#061d3a55);pointer-events:auto}.panel{width:min(470px,86vw);text-align:center;color:white}.title{font-size:clamp(42px,8vw,76px);line-height:.82;font-weight:1000;font-style:italic;letter-spacing:-4px;text-shadow:0 7px 0 #0b3d70,0 12px 20px #001}.title span{color:#ffde43}.sub{margin:20px 0 24px;font-weight:800;letter-spacing:3px;color:#bdecff}.button{border:0;border-radius:999px;background:linear-gradient(#ffef73,#ffb21c);color:#17345a;font-weight:1000;font-size:20px;padding:15px 34px;box-shadow:0 7px 0 #b36a11,0 12px 18px #0028;cursor:pointer}.button:active{transform:translateY(5px);box-shadow:0 2px 0 #b36a11}.hidden{display:none}.controls{position:absolute;bottom:20px;width:100%;display:flex;justify-content:space-between;padding:0 22px}.touch{pointer-events:auto;width:76px;height:76px;border-radius:50%;border:3px solid #fff9;background:#103b68aa;color:white;font-size:28px;font-weight:900;display:flex;align-items:center;justify-content:center;opacity:.78;user-select:none}.servezone{position:absolute;width:70px;height:70px;border:2px solid #fff7;border-radius:50%;right:24px;bottom:110px;pointer-events:auto;color:white;text-align:center;font-size:11px;font-weight:900;padding-top:20px;background:#ef4d75aa}.winlabel{font-size:26px;margin:10px 0 18px;font-weight:900}.shake{animation:shake .25s}@keyframes shake{50%{transform:translateX(8px)}}
@media(max-width:700px){.top{top:8px;width:96vw}.scorebox{font-size:16px;min-width:74px}.logo{display:none}.hint{display:none}.controls{display:flex}}@media(min-width:701px){.controls,.servezone{display:none}}
</style></head>
<body>
<canvas id="c"></canvas>
<div class="ui"><div class="logo">TENNIS <span>MASTERS</span></div><div class="top"><div class="scorebox player" id="ps">YOU 0</div><div class="score" id="score"><span id="sets">• •</span></div><div class="scorebox enemy" id="es">CPU 0</div></div><div class="hint" id="hint">A / D MOVE · SPACE SWING · W LOB</div><div class="controls"><button class="touch" id="left">◀</button><button class="touch" id="right">▶</button></div><button class="servezone" id="swing">SMASH</button>
<div class="overlay" id="overlay"><div class="panel"><div class="title">TENNIS <span>MASTERS</span></div><div class="sub" id="sub">MATCH POINT</div><button class="button" id="start">PLAY MATCH</button><div class="winlabel hidden" id="win"></div></div></div></div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');let W,H,DPR;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space'){keys.swing=true;e.prevent();}if(e.key.toLowerCase()==='w')keys.lob=true});addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
let started=false,rally=true,paused=false,points=[0,0],match=[0,0],lastTouch=0;
const p={x:.5,y:.78,vx:0,side:1,swing:0};const cpu={x:.5,y:.25,vx:0,side:-1,swing:0};let ball={x:.5,y:.52,z:.12,vx:.16,vz:.15,vy:.38,owner:'cpu',hit:false};
function resetBall(server=1){ball={x:.5+(server?-0.02:0.02),y:server?.30:.72,z:.12,vx:0,vz:server?-.25:.25,vy:.65,owner:'cpu',hit:false};rally=true}
function point(who){points[who]++;match[who]=points[who]>=4?1:0;if(points[who]>=4&&points[who]-points[1-who]>=2){match[who]++;points=[0,0]}if(match[who]>=2){end(who)}else{setTimeout(()=>resetBall(who),700)}}
function end(who){started=false;paused=true;const o=document.getElementById('overlay'),w=document.getElementById('win');w.textContent=(who===0?'VICTORY! YOU WIN':'MATCH LOST — CPU WINS');w.classList.remove('hidden');document.getElementById('sub').textContent='TENNIS MASTERS';document.getElementById('start').textContent='PLAY AGAIN';o.classList.remove('hidden')}
function start(){document.getElementById('overlay').classList.add('hidden');document.getElementById('win').classList.add('hidden');points=[0,0];match=[0,0];started=true;paused=false;p.x=.5;cpu.x=.5;resetBall(1)}document.getElementById('start').onclick=start;
function touch(id,prop){const el=document.getElementById(id);el.ontouchstart=e=>{e.preventDefault();keys[prop]=true};el.ontouchend=e=>{e.preventDefault();keys[prop]=false}}touch('left','a');touch('right','d');document.getElementById('swing').ontouchstart=e=>{e.preventDefault();keys.swing=true};
function proj(x,y,z){const horizon=H*.23,mid=W*.5,nearH=H*.68,farH=horizon;const q=(y-.22)/(1-.22);return{x:mid+(x-.5)*W*(.48+(1-q)*.62),y:horizon+(y-horizon/H)*(nearH-horizon)*(1-q*.15)+z*-H*.16}}
function court(){const g=ctx.createLinearGradient(0,H*.2,0,H);g.addColorStop(0,'#5ecad3');g.addColorStop(.25,'#159e82');g.addColorStop(1,'#087c67');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='#4c99a3';ctx.fillRect(0,0,W,H*.24);ctx.fillStyle='#ed7448';ctx.beginPath();ctx.arc(W*.78,H*.12,42,0,7);ctx.fill();ctx.fillStyle='#5f3a25';ctx.fillRect(0,H*.19,W,5);ctx.fillStyle='#1d9a78';ctx.beginPath();ctx.moveTo(W*.18,H*.25);ctx.lineTo(W*.82,H*.25);ctx.lineTo(W*.72,H*.90);ctx.lineTo(W*.28,H*.90);ctx.closePath();ctx.fill();ctx.strokeStyle='#e8f6db';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(W*.18,H*.25);ctx.lineTo(W*.82,H*.25);ctx.lineTo(W*.72,H*.90);ctx.lineTo(W*.28,H*.90);ctx.closePath();ctx.stroke();ctx.beginPath();ctx.moveTo(W*.32,H*.25);ctx.lineTo(W*.68,H*.25);ctx.moveTo(W*.37,H*.58);ctx.lineTo(W*.63,H*.58);ctx.moveTo(W*.50,H*.25);ctx.lineTo(W*.50,H*.90);ctx.stroke();ctx.fillStyle='#eee';ctx.fillRect(W*.15,H*.195,W*.70,8);ctx.fillStyle='#9dc4c4';ctx.fillRect(W*.15,H*.205,W*.70,4);ctx.fillStyle='#12305a';ctx.fillRect(W*.41,H*.215,W*.18,18);for(let i=0;i<14;i++){ctx.fillStyle=i%2?'#163f35':'#1d5145';ctx.fillRect(i*W/14,H*.25,W/14,H*.035)} }
function player(a,isCPU){const sc=ctx;let px=a.x*W;let py=isCPU?H*(.25+(a.y-.25)*.55):H*(.66+(a.y-.66)*.35);if(!isCPU)py=a.y*H;else py=a.y*H*.75+.02*H;const s=Math.max(.55,Math.min(1.15,W/900));sc.save();sc.translate(px,py);sc.scale(s,s);sc.shadowColor='#0005';sc.shadowBlur=12;sc.fillStyle=isCPU?'#ef4d75':'#18b9df';sc.beginPath();sc.ellipse(0,10,18,38,0,0,7);sc.fill();sc.fillStyle=isCPU?'#ffcc6a':'#ffe14f';sc.beginPath();sc.arc(0,-30,15,0,7);sc.fill();sc.fillStyle=isCPU?'#a54d6d':'#3d7d9e';sc.fillRect(-11,-18,22,35);sc.fillStyle='#fff';sc.beginPath();sc.ellipse(0,42,24,8,0,0,7);sc.fill();sc.save();sc.rotate(-1.1+a.swing);sc.strokeStyle='#7d5535';sc.lineWidth=4;sc.beginPath();sc.moveTo(12,-10);sc.lineTo(35,-32);sc.stroke();sc.strokeStyle='#ddd';sc.lineWidth=3;sc.beginPath();sc.ellipse(39,-35,10,20,-.5,0,7);sc.stroke();sc.restore();sc.restore()}
function draw(){court();ctx.fillStyle='#fff';ctx.font='900 14px Trebuchet MS';ctx.fillText('WIMBLEDON CLUB',W*.18,H*.18);const bp=proj(ball.x,ball.y,ball.z);ctx.fillStyle='#ffec40';ctx.beginPath();ctx.arc(bp.x,bp.y,7+ball.z*3,0,7);ctx.fill();ctx.fillStyle='#fff6';ctx.beginPath();ctx.arc(bp.x-2,bp.y-2,3,0,7);ctx.fill();player(cpu,true);player(p,false)}
function update(){if(!started)return;if(keys.a)p.vx-=.0018;if(keys.d)p.vx+=.0018;p.vx*=.86;p.x=Math.max(.32,Math.min(.68,p.x+p.vx));if(keys.swing&&p.swing<=0){p.swing=.6;const dx=ball.x-p.x,dy=ball.y-p.y;if(Math.abs(dx)<.18&&Math.abs(dy)<.28&&ball.y>.58){ball.owner='p';ball.vx=-dx*.3+ (Math.random()-.5)*.05;ball.vz=-.55-(keys.lob?.12:0);ball.vy=keys.lob?.9:.62;ball.hit=true}}if(keys.lob&&p.swing<=0)p.swing=.35;p.swing=Math.max(0,p.swing-.04);cpu.vx=(ball.x-cpu.x)*.018;cpu.x=Math.max(.32,Math.min(.68,cpu.x+cpu.vx));if(Math.abs(ball.x-cpu.x)<.16&&ball.y<.32&&ball.vz<0&&!ball.hit){cpu.swing=.5;ball.owner='cpu';ball.vx=(p.x-ball.x)*.12+(Math.random()-.2)*.05;ball.vz=.55;ball.vy=.68}cpu.swing=Math.max(0,cpu.swing-.04);
ball.x+=ball.vx;ball.y+=ball.vz;ball.z+=ball.vy*.016;if(ball.z>.12&&ball.hit){ball.hit=false}ball.vy-=.018;if(ball.z<.06)ball.z=.06;
if(ball.x<.22||ball.x>.78){ball.vx*=-.35}
if(ball.y<-0.05||ball.y>1.05){const who=ball.y>1.02?1:0;point(who);ball.y=who?0.98:-.02}
if(ball.y>.82&&ball.z<.08&&ball.owner==='cpu'&&rally){points[1]++;rally=false;setTimeout(()=>resetBall(0),700)}}
function loop(){update();draw();document.getElementById('ps').textContent='YOU '+points[0];document.getElementById('es').textContent='CPU '+points[1];requestAnimationFrame(loop)}loop();
</script></body></html>
