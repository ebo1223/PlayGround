<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Space Wars</title>
  <style>
    :*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#03050a;font-family:"Courier New",monospace;color:#dffcff}
    canvas{display:block;width:100%;height:100%;cursor:crosshair}
    #ui{position:fixed;inset:0;pointer-events:none;padding:22px 28px}
    .brand{position:absolute;top:18px;left:24px;font-size:13px;letter-spacing:5px;color:#63dcff;text-shadow:0 0 12px #19aadd}.brand b{color:white}
    #top{position:absolute;left:50%;top:18px;transform:translateX(-50%);display:flex;gap:42px;text-align:center}
    .stat label{display:block;font-size:9px;letter-spacing:3px;color:#7891a4;margin-bottom:4px}.stat span{font-size:20px;color:#fff;text-shadow:0 0 10px #39bee8}
    #lives{position:absolute;right:28px;top:20px;font-size:15px;color:#ff738e;letter-spacing:3px}
    #msg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;text-transform:uppercase;opacity:0;transition:.25s}
    #msg.show{opacity:1}#msg h1{margin:0;font-family:Impact,"Arial Black",sans-serif;font-size:clamp(48px,8vw,92px);letter-spacing:7px;font-style:italic;color:#f7fbff;text-shadow:5px 5px 0 #0f5ca2,0 0 35px #25bcff}
    #msg p{font-size:12px;letter-spacing:4px;color:#82bfd3}#msg button{pointer-events:auto;margin-top:22px;border:1px solid #63dcff;background:rgba(5,25,37,.9);color:white;padding:13px 24px;font:700 12px "Courier New";letter-spacing:3px;cursor:pointer}
    #controls{position:absolute;bottom:18px;left:24px;font-size:9px;letter-spacing:2px;color:#617785}.key{border:1px solid #496170;padding:3px 5px;margin:0 2px;color:#b7edf7}
    #bossbar{position:absolute;top:66px;left:50%;transform:translateX(-50%);width:280px;height:5px;background:#1a2630;display:none}.bossfill{height:100%;width:100%;background:#ff5173;box-shadow:0 0 10px #ff5173}
    #mobile{display:none;position:absolute;right:20px;bottom:22px;pointer-events:auto}.fire{width:74px;height:74px;border-radius:50%;border:1px solid #ff6e85;background:rgba(255,60,100,.12);color:#ffb2bd;font:700 11px "Courier New"}
    @media(max-width:700px){#ui{padding:14px}#controls{display:none}.brand{left:14px}.brand span{display:none}#top{top:52px;gap:18px}#lives{right:14px}#mobile{display:block}}
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="ui">
    <div class="brand"><b>SPACE</b> <span>WARS</span></div>
    <div id="top"><div class="stat"><label>SCORE</label><span id="score">000000</span></div><div class="stat"><label>WAVE</label><span id="wave">01</span></div></div>
    <div id="lives">▲ × <span id="life">3</span></div>
    <div id="bossbar"><div class="bossfill" id="bossfill"></div></div>
    <div id="msg"><h1 id="title">READY</h1><p id="subtitle">PRESS SPACE TO ENGAGE</p><button id="restart">START MISSION</button></div>
    <div id="controls"><span class="key">WASD</span> MOVE &nbsp; <span class="key">MOUSE</span> AIM &nbsp; <span class="key">SPACE</span> FIRE &nbsp; <span class="key">P</span> PAUSE</div>
    <div id="mobile"><button class="fire" id="fire">FIRE</button></div>
  </div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let W,H,DPR,keys={},mouse={x:0,y:0,down:false},stars=[],bullets=[],enemies=[],particles=[],pickups=[],last=0,shake=0;
let state='menu',score=0,wave=1,lives=3,spawnTimer=0,spawnLeft=0,boss=null,inv=0,fireTimer=0;
const player={x:0,y:0,r:13,angle:-Math.PI/2,speed:260};
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);stars=[];for(let i=0;i<160;i++)stars.push({x:Math.random()*W,y:Math.random()*H,z:Math.random()*1+.2})}
addEventListener('resize',resize);resize();
function reset(){score=0;wave=1;lives=3;bullets=[];enemies=[];particles=[];pickups=[];boss=null;inv=120;player.x=W/2;player.y=H*.72;state='playing';spawnWave();hideMsg();updateHUD()}
function spawnWave(){spawnLeft=5+wave*2;spawnTimer=40;if(wave%5===0){boss={x:W/2,y:-100,r:55,hp:70+wave*12,maxhp:70+wave*12,side:0,shoot:0,angle:0};enemies.push(boss)} }
function hideMsg(){document.getElementById('msg').classList.remove('show')}
function showMsg(title,sub,button){document.getElementById('title').textContent=title;document.getElementById('subtitle').textContent=sub;document.getElementById('restart').textContent=button;document.getElementById('msg').classList.add('show')}
function updateHUD(){document.getElementById('score').textContent=String(score).padStart(6,'0');document.getElementById('wave').textContent=String(wave).padStart(2,'0');document.getElementById('life').textContent=lives}
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space'){e.preventDefault();mouse.down=true;if(state==='menu'||state==='gameover')reset()}if(e.key.toLower==='p'&&state==='playing'){state='pause';showMsg('PAUSED','PRESS P TO RESUME','RESUME')}else if(e.key.toLower==='p'&&state==='pause'){state='playing';hideMsg()}});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;if(e.code==='Space')mouse.down=false});
canvas.addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});canvas.addEventListener('mousedown',()=>mouse.down=true);addEventListener('mouseup',()=>mouse.down=false);
canvas.addEventListener('touchmove',e=>{e.preventMouse;const t=e.touches[0];mouse.x=t.clientX;mouse.y=t.clientY},{passive:false});
canvas.addEventListener('touchstart',e=>{const t=e.touches[0];mouse.x=t.clientX;mouse.y=t.clientY;mouse.down=true},{passive:false});canvas.addEventListener('touchend',()=>mouse.down=false);
document.getElementById('fire').addEventListener('touchstart',e=>{e.preventDefault();mouse.down=true},{passive:false});document.getElementById('fire').addEventListener('touchend',()=>mouse.down=false);
document.getElementById('restart').onclick=()=>{if(state==='pause'){state='playing';hideMsg()}else reset()};
function shoot(x,y,a,speed=520,enemy=false){bullets.push({x,y,vx:Math.cos(a)*speed,vy:Math.sin(a)*speed,r:enemy?5:3,enemy,life:150})}
function burst(x,y,color,n=12){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,s=Math.random()*180+40;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:30+Math.random()*30,color,r:Math.random()*2+1})}}
function enemyShoot(e){let a=Math.atan2(player.y-e.y,player.x-e.x);if(e.boss){shoot(e.x-25,e.y+35,a,260,true);shoot(e.x+25,e.y+35,a+.12,260,true);shoot(e.x,e.y+35,a-.12,260,true)}else shoot(e.x,e.y+e.r,a,210,true)}
function update(){if(state!=='playing'){for(let s of stars)s.y+=s.z*.3;if(s.y>H)s.y=0;return}
  if(inv>0)inv--; if(fireTimer>0)fireTimer--; player.angle=Math.atan2(mouse.y-player.y,mouse.x-player.x);
  let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0),d=Math.hypot(dx,dy)||1;player.x+=dx/d*player.speed*(1/60);player.y+=dy/d*player.speed*(1/60);player.x=Math.max(20,Math.min(W-20,player.x));player.y=Math.max(80,Math.min(H-30,player.y));
  if(mouse.down&&fireTimer<=0){shoot(player.x+Math.cos(player.angle)*18,player.y+Math.sin(player.angle)*18,player.angle);fireTimer=8}
  for(let s of stars){s.y+=s.z*1.8;if(s.y>H){s.y=-5;s.x=Math.random()*W}} if(shake>0)shake--;
  if(!boss&&spawnLeft>0){spawnTimer--;if(spawnTimer<=0){let side=Math.random()<.5?1:-1,en={x:side<0?-30:W+30,y:50+Math.random()*H*.38,r:14+Math.random()*8,hp:1+Math.floor(wave/4),type:'fighter',phase:Math.random()*6.28,shoot:50+Math.random()*80};enemies.push(en);spawnLeft--;spawnTimer=Math.max(18,70-wave*4)}}
  for(let i=bullets.length-1;i>=0;i--){let b=bullets[i];b.x+=b.vx/60;b.y+=b.vy/60;b.life--;if(b.life<0||b.x<-30||b.x>W+30||b.y<-30||b.y>H+30){bullets.splice(i,1);continue}
    if(!b.enemy&&boss&&Math.hypot(b.x-boss.x,b.y-boss.y)<boss.r){boss.hp--;b.life=0;burst(b.x,b.y,'#ffcf70',3);score+=10;if(boss.hp<=0){burst(boss.x,boss.y,'#ff5173',55);score+=5000;boss=null;document.getElementById('bossbar').style.display='none';spawnLeft=0}}
    if(!b.enemy){for(let j=enemies.length-1;j>=0;j--){let e=enemies[j];if(e!==boss&&Math.hypot(b.x-e.x,b.y-e.y)<e.r){e.hp--;b.life=0;burst(b.x,b.y,'#62dfff',5);if(e.hp<=0){burst(e.x,e.y,'#ffb34d',16);score+=100;enemies.splice(j,1);if(Math.random()<.09)pickups.push({x:e.x,y:e.y,type:'repair',life:600})}}}
    }else if(inv<=0&&Math.hypot(b.x-player.x,b.y-player.y)<player.r){b.life=0;damagePlayer()}
  }
  for(let i=enemies.length-1;i>=0;i--){let e=enemies[i];if(e===boss){if(e.y<95)e.y+=1.2;e.phase=(e.phase||0)+.025;e.x=W/2+Math.sin(e.phase)*W*.28;e.shoot--;if(e.shoot<=0){enemyShoot(e);e.shoot=Math.max(35,75-wave*3)}bossfillUpdate(e)}else{e.phase+=.04;e.x+=((W/2+(e.phase*90%(W*.7))-W*.15)-e.x)*.012+Math.sin(e.phase*2)*.7;e.y+=.5+wave*.04;e.shoot--;if(e.shoot<=0&&e.y>20){enemyShoot(e);e.shoot=90+Math.random()*100}if(e.y>H+30){enemies.splice(i,1);continue}}if(inv<=0&&Math.hypot(e.x-player.x,e.y-player.y)<e.r+player.r){damagePlayer();burst(e.x,e.y,'#ff5c78',20);if(e!==boss)enemies.splice(i,1)}}
  for(let i=pickups.length-1;i>=0;i--){let p=pickups[i];p.y+=1.2;p.life--;if(Math.hypot(p.x-player.x,p.y-player.y)<25){lives=Math.min(5,lives+1);score+=250;burst(p.x,p.y,'#77ffbd',18);pickups.splice(i,1)}else if(p.life<0)pickups.splice(i,1)}
  for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx/60;p.y+=p.vy/60;p.vx*=.98;p.vy*=.98;p.life--;if(p.life<=0)particles.splice(i,1)}
  if(!boss&&spawnLeft<=0&&enemies.length===0){wave++;burst(W/2,H*.3,'#62dfff',25);spawnWave();updateHUD()}
  updateHUD();document.getElementById('bossbar').style.display=boss?'block':'none';
}
function bossfillUpdate(e){document.getElementById('bossfill').style.width=(e.hp/e.maxhp*100)+'%' }
function damagePlayer(){lives--;inv=150;shake=14;burst(player.x,player.y,'#ff5577',22);updateHUD();if(lives<=0){state='gameover';showMsg('MISSION LOST','FINAL SCORE '+String(score).padStart(6,'0'),'TRY AGAIN')}}
function draw(){ctx.save();if(shake>0)ctx.translate((Math.random()-5)*shake*.08,(Math.random()-.5)*shake*.08);
  ctx.fillStyle='#030711';ctx.fillRect(-10,-10,W+20,H+20);
  ctx.fillStyle='#0b1a2a';ctx.fillRect(0,0,W,H*.018);
  for(let s of stars){ctx.globalAlpha=.35+s.z*.65;ctx.fillStyle=s.z>.8?'#d9fbff':'#5a91a8';ctx.fillRect(s.x,s.y,s.z*1.4,s.z*2.8)}ctx.globalAlpha=1;
  ctx.strokeStyle='rgba(53,116,150,.09)';ctx.lineWidth=1;for(let x=(performance.now()/70)%80;x<W;x+=80){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=(performance.now()/100)%80;y<H;y+=80){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
  for(let p of pickups){ctx.save();ctx.translate(p.x,p.y);ctx.strokeStyle='#77ffbd';ctx.rotate(performance.now()/300);ctx.strokeRect(-9,-9,18,18);ctx.restore()}
  for(let b of bullets){ctx.save();ctx.translate(b.x,b.y);ctx.rotate(Math.atan2(b.vy,b.vx));ctx.fillStyle=b.enemy?'#ff5e7b':'#77eaff';ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=12;ctx.fillRect(-7,-2,14,b.enemy?4:3);ctx.restore()}
  for(let e of enemies){ctx.save();ctx.translate(e.x,e.y);if(e===boss){ctx.fillStyle='#ff3f6b';ctx.shadowColor='#ff174f';ctx.shadowBlur=18;ctx.beginPath();ctx.moveTo(-55,-25);ctx.lineTo(-38,-48);ctx.lineTo(-18,-35);ctx.lineTo(0,-58);ctx.lineTo(18,-35);ctx.lineTo(38,-48);ctx.lineTo(55,-25);ctx.lineTo(42,30);ctx.lineTo(0,46);ctx.lineTo(-42,30);ctx.closePath();ctx.fill();ctx.fillStyle='#4b0920';ctx.beginPath();ctx.arc(0,-5,17,0,7);ctx.fill();ctx.fillStyle='#ffb1bc';ctx.beginPath();ctx.arc(0,-5,7,0,7);ctx.fill()}else{ctx.rotate(Math.PI);ctx.fillStyle='#ffb24a';ctx.shadowColor='#ff5d35';ctx.shadowBlur=12;ctx.beginPath();ctx.moveTo(0,-18);ctx.lineTo(15,12);ctx.lineTo(5,8);ctx.lineTo(0,15);ctx.lineTo(-5,8);ctx.lineTo(-15,12);ctx.closePath();ctx.fill();ctx.fillStyle='#6b1b28';ctx.fillRect(-3,-5,6,12)}ctx.restore()}
  for(let p of particles){ctx.globalAlpha=Math.max(0,p.life/50);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,p.r,p.r)}ctx.globalAlpha=1;
  if(state==='playing'||state==='pause'||state==='gameover'){ctx.save();ctx.translate(player.x,player.y);ctx.rotate(player.angle+Math.PI/2);if(inv>0&&Math.floor(inv/5)%2)ctx.globalAlpha=.35;ctx.shadowColor='#35d6ff';ctx.shadowBlur=16;ctx.fillStyle='#ecfbff';ctx.beginPath();ctx.moveTo(0,-18);ctx.lineTo(12,13);ctx.lineTo(4,8);ctx.lineTo(0,14);ctx.lineTo(-4,8);ctx.lineTo(-12,13);ctx.closePath();ctx.fill();ctx.strokeStyle='#44cde8';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-7,8);ctx.lineTo(-13,20);ctx.moveTo(7,8);ctx.lineTo(13,20);ctx.stroke();ctx.fillStyle='#35cfff';ctx.fillRect(-3,-15,6,8);ctx.restore()}ctx.restore();
}
function loop(t){let dt=t-last;last=t;if(dt<100)update();draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
showMsg('SPACE WARS','WAVE 01 • PRESS SPACE TO ENGAGE','START MISSION');
</script>
</body>
</html>
