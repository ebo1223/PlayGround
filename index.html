<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spelling Bee</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght-serif&family=DM+Serif+Display&display=swap');
:root{--ink:#20201d;--paper:#fbfaf6;--line:#dfddd4;--yellow:#f7da21;--yellow2:#efce17;--green:#b5cbb0}
*{box-sizing:border-box}body{margin:0;font-family:'DM Sans',Arial,sans-serif;background:var(--paper);color:var(--ink)}
header{height:66px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 38px;gap:20px}.brand{font-family:'DM Serif Display',Georgia,serif;font-size:26px}.brand:after{content:'®';font-family:Arial;font-size:9px;vertical-align:super;margin-left:3px}.header-actions{margin-left:auto;display:flex;align-items:center;gap:18px}.icon-btn{width:28px;height:28px;border:0;background:none;font-size:20px;cursor:pointer;color:#555}
main{max-width:1000px;margin:0 auto;padding:44px 24px 30px}.topline{display:flex;justify-content:space-between;align-items:flex-end}.date{font-size:13px;color:#777}.progress-wrap{display:flex;align-items:center;gap:10px}.progress-track{width:220px;height:9px;border-radius:20px;background:#eee;overflow:hidden}.progress-fill{height:100%;width:6%;background:var(--yellow);transition:.35s}.rank{font-family:'DM Serif Display',Georgia,serif;font-size:19px}
.game{display:grid;grid-template-columns:420px 1fr;gap:70px;margin-top:38px}.left{text-align:center}.letters-title{font-size:13px;text-transform:uppercase;letter-spacing:1.6px;color:#777;margin-bottom:12px}.input-box{height:54px;font-size:31px;font-family:'DM Serif Display',Georgia,serif;letter-spacing:2px;text-align:center;text-transform:uppercase}.bee{text-align:center;margin:8px 0 28px}.hive{width:300px;height:260px;position:relative;margin:auto}.hex{position:absolute;width:94px;height:82px;background:#fff;border:1px solid #dcdad1;clip-path:polygon(25% 7%,75% 7%,100% 50%,75% 93%,25% 93%,0 50%);display:flex;align-items:center;justify-content:center;font-size:35px;font-weight:700;text-transform:uppercase;cursor:pointer;user-select:none;transition:.12s}.hex:hover{transform:scale(.96)}.hex:active{transform:scale(.9)}.hex.center{background:var(--yellow);border:0}.h0{left:103px;top:0}.h1{left:197px;top:87px}.h2{left:103px;top:174px}.h3{left:9px;top:174px}.h4{left:-85px;top:87px;display:none}.hive{width:300px}.h1{left:197px}.h2{left:103px}.h3{left:9px}.hex.c1{left:103px;top:87px}.hex.c2{left:9px;top:87px}.hex.c3{left:-85px;top:87px}.hex.c4{left:103px;top:174px}.hex.c5{left:197px;top:87px}.hex.c6{left:197px;top:87px}.hex.e1{left:103px;top:87px}.controls{display:flex;justify-content:center;gap:10px;margin-top:-8px}.controls button{height:38px;border:1px solid #aaa;border-radius:24px;background:white;padding:0 18px;font-weight:600;cursor:pointer}.controls button:hover{border-color:#777}.message{height:30px;font-size:14px;color:#555;margin-top:12px}.right{border-left:1px solid var(--line);padding-left:36px}.words-head{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:12px}.words-head h2{font-family:'DM Serif Display',Georgia,serif;font-size:20px;margin:0}.count{font-size:13px;color:#777}.words{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px 8px;max-height:390px;overflow:auto;padding:20px 0}.word{font-size:15px;text-transform:lowercase}.empty{color:#aaa;font-style:italic}
.modal-backdrop{position:fixed;inset:0;background:rgba(20,20,20,.35);display:none;align-items:center;justify-content:center;z-index:10}.modal-backdrop.show{display:flex}.modal{width:min(420px,calc(100% - 30px));background:white;border-radius:12px;padding:28px}.modal h2{font-family:'DM Serif Display',Georgia,serif;margin-top:0}.modal p{line-height:1.6}.modal button{border:0;background:var(--yellow);border-radius:25px;padding:12px 22px;font-weight:bold;cursor:pointer}
@media(max-width:760px){header{padding:0 18px}.brand{font-size:22px}main{padding:28px 16px}.topline{align-items:flex-start}.progress-track{width:120px}.game{grid-template-columns:1fr;gap:24px}.right{border-left:0;border-top:1px solid var(--line);padding-left:0;padding-top:20px}.hive{transform:scale(.82);transform-origin:top center;height:220px}.bee{margin-bottom:0}.words{max-height:none}.input-box{height:44px}.date{margin-bottom:8px}}
</style>
</head>
<body>
<header><div class="brand">Spelling Bee</div><div class="header-actions"><button class="icon-btn" id="stats" title="Rankings">▥</button><button class="icon-btn" id="help" title="How to play">?</button></div></header>
<main>
<div class="topline"><div class="date" id="date"></div><div class="progress-wrap"><span class="rank" id="rank">Beginner</span><div class="progress-track"><div class="progress-fill" id="progress"></div></div></div></div>
<div class="game"><section class="left"><div class="letters-title">Make words with 4+ letters</div><div class="input-box" id="input"></div>
<div class="bee"><div class="hive" id="hive"></div></div>
<div class="controls"><button id="delete">Delete</button><button id="shuffle">Shuffle</button><button id="enter">Enter</button></div><div class="message" id="message"></div></section>
<section class="right"><div class="words-head"><h2>Words found</h2><span class="count" id="count">0 words</span></div><div class="words" id="words"><span class="empty">Your words will appear here</span></div></section></div>
</main>
<div class="modal-backdrop" id="modal"><div class="modal"><h2 id="modalTitle"></h2><div id="modalBody"></div><br><button id="closeModal">Got it</button></div></div>
<script>
const puzzles=[{letters:['A','B','C','K','O','R','T'],center:'A',answers:['aback','abator','abort','abactor','actor','acrobat','arbor','art','bract','back','bar','barb','bark','boat','boa','boar','brat','cart','coat','cork','rack','rock','tab','tabor','track','trace','tar','tract','cobra','cobra']},{letters:['A','E','G','I','L','N','T'],center:'E',answers:['agile','angle','tangle','tangle','eagle','elegant','agent','alien','align','elating','gent','gentle','glean','glee','late','lean','lent','line','meal','meat','night','tale','teal','tile','tine']},{letters:['C','D','I','L','O','R','Y'],center:'O',answers:['cold','color','cord','corn','dollar','idol','lord','odor','old','or','oral','rory','radio','road','roil','roll','solid','sour','yodel']}];
let pi=0,puzzle=puzzles[pi],current='',found=[];const hive=document.getElementById('hive'),input=document.getElementById('input'),message=document.getElementById('message');
function renderHive(){hive.innerHTML='';puzzle.letters.forEach((l,i)=>{const d=document.createElement('div');d.className='hex '+(i===0?'center':'e'+i);d.textContent=l;d.style.position='absolute';if(i===0){d.style.left='103px';d.style.top='87px'}else if(i===1){d.style.left='9px';d.style.top='87px'}else if(i===2){d.style.left='197px';d.style.top='87px'}else if(i===3){d.style.left='103px';d.style.top='0'}else if(i===4){d.style.left='103px';d.style.top='174px'}else if(i===5){d.style.left='9px';d.style.top='174px'}else{d.style.left='197px';d.style.top='174px'}d.onclick=()=>add(l);hive.appendChild(d)})}
function add(l){current+=l;input.textContent=current}
function status(text,bad=false){message.textContent=text;message.style.color=bad?'#b34b42':'#555'}
function submit(){if(!current)return;if(current.length<4){status('Too short',true);shake()}else if(!current.toLowerCase().includes(puzzle.center.toLowerCase())){status('Missing the center letter',true)}else if(found.includes(current.toLowerCase())){status('Already found',true)}else if(puzzle.answers.includes(current.toLowerCase())){found.push(current.toLowerCase());renderFound();status(found.includes(current.toLowerCase())?'Nice!':'')}else status('Not in the word list',true);current='';input.textContent=''}
function shake(){input.animate([{transform:'translateX(-4px)'},{transform:'translateX(4px)'},{transform:'translateX(0)' }],{duration:180})}
function renderFound(){const words=document.getElementById('words');words.innerHTML='';found.forEach(w=>{let s=document.createElement('div');s.className='word';s.textContent=w;words.appendChild(s)});document.getElementById('count').textContent=found.length+' word'+(found.length===1?'':'s');let pct=Math.min(100,found.length/puzzle.answers.length*100);document.getElementById('progress').style.width=pct+'%';const ranks=[['Beginner',0],['Good Start',12],['Moving Up',25],['Good',40],['Great',55],['Amazing',70],['Genius',85]];let rank='Beginner';ranks.forEach(r=>{if(pct>=r[1])rank=r[0]});document.getElementById('rank').textContent=rank}
function shuffle(){let rest=puzzle.letters.slice(1);for(let i=rest.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[rest[i],rest[j]]=[rest[j],rest[i]]}puzzle.letters=[puzzle.letters[0],...rest];renderHive();status('Letters shuffled')}
document.getElementById('delete').onclick=()=>{current=current.slice(0,-1);input.textContent=current};document.getElementById('shuffle').onclick=shuffle;document.getElementById('enter').onclick=submit;
window.addEventListener('keydown',e=>{if(e.key==='Enter')submit();else if(e.key==='Backspace'){current=current.slice(0,-1);input.textContent=current}else if(/^[a-z]$/i.test(e.key)&&puzzle.letters.some(l=>l.toLowerCase()===e.key.toLowerCase()))add(e.key.toUpperCase())});
const modal=document.getElementById('modal');document.getElementById('help').onclick=()=>openModal('How to play','<p>Create words using the letters in the hive.</p><p>Words must contain at least <b>4 letters</b> and include the <b>center letter</b>.</p><p>Every valid word earns points. Repeated letters are allowed.</p>');document.getElementById('stats').onclick=()=>openModal('Rankings', '<p><b>Beginner</b> · 0 points<br><b>Good Start</b> · 12%<br><b>Moving Up</b> · 25%<br><b>Good</b> · 40%<br><b>Great</b> · 55%<br><b>Amazing</b> · 70%<br><b>Genius</b> · 85%</p>');function openModal(t,b){document.getElementById('modalTitle').textContent=t;document.getElementById('modalBody').innerHTML=b;modal.classList.add('show')}document.getElementById('closeModal').onclick=()=>modal.classList.remove('show');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('show')};
document.getElementById('date').textContent=new Intl.DateTimeFormat('en-US',{month:'long',day:'numeric',year:'numeric'}).format(new Date());renderHive();
</script></body></html>
