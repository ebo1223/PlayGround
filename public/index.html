<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Chess Master</title>
  <style>
    :root{--ink:#dfe4dd;--muted:#858d84;--panel:#151918;--gold:#c4a96f;--cream:#d4c7a7;--green:#87966f}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;background:#111413;color:var(--ink);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow-x:hidden}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 30%,rgba(126,142,111,.09),transparent 32%),linear-gradient(rgba(255,255,255,.012) 1px,transparent 1px);background-size:auto,100% 4px}
    .shell{min-height:100vh;display:grid;grid-template-columns:280px minmax(420px,620px) 280px;gap:28px;align-items:center;justify-content:center;padding:24px 34px}
    .brand{position:absolute;top:25px;left:34px;display:flex;align-items:center;gap:10px;font-family:Georgia,serif;font-size:22px}.brand-mark{width:30px;height:30px;border:1px solid #6d7468;border-radius:50%;display:grid;place-items:center;color:var(--gold);font-size:18px}
    .left,.right{height:min(620px,78vh);min-height:520px}.left{display:flex;flex-direction:column}.right{display:flex;flex-direction:column}
    .eyebrow{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-bottom:13px}.player-card{height:70px;border:1px solid #303531;background:rgba(26,30,28,.72);border-radius:5px;display:flex;align-items:center;padding:12px 14px;margin-bottom:10px}.avatar{width:43px;height:43px;border-radius:50%;background:#252b27;border:1px solid #424941;display:grid;place-items:center;font-size:25px}.avatar.light{background:#d2cbb7;color:#44443c}.player-info{margin-left:12px}.player-name{font-family:Georgia,serif;font-size:16px}.player-meta{font-size:10px;color:var(--muted);margin-top:5px}.clock{margin-left:auto;font-family:Georgia,serif;font-size:24px;color:#d5d7cf}
    .board-wrap{width:min(620px,calc(100vh - 90px));height:min(620px,calc(100vh - 90px));min-width:420px}.board{width:100%;height:100%;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);border:8px solid #252a26;box-shadow:0 18px 48px rgba(0,0,0,.38);position:relative}
    .square{border:0;padding:0;position:relative;display:grid;place-items:center;font-family:"Times New Roman",Georgia,serif;font-size:clamp(34px,5.2vh,58px);line-height:1;cursor:pointer;user-select:none}.square.light{background:#d7cfb5}.square.dark{background:#7f8d70}.square.selected{box-shadow:inset 0 0 0 5px rgba(220,193,111,.9)}.square.last{background-image:linear-gradient(rgba(195,175,91,.36),rgba(195,175,91,.36))}.square.check{background-image:radial-gradient(circle,rgba(170,54,45,.75),transparent 72%)}
    .square.valid:after{content:"";width:16px;height:16px;border-radius:50%;background:rgba(38,56,42,.42);position:absolute}.square.valid.capture:after{width:78%;height:78%;border-radius:50%;background:transparent;border:5px solid rgba(38,56,42,.55)}
    .piece.white{color:#f6f2df;text-shadow:0 2px 2px rgba(0,0,0,.55)}.piece.black{color:#252a27;text-shadow:0 1px 1px rgba(255,255,255,.14)}
    .coord{position:absolute;font-size:9px;font-family:Inter,sans-serif;opacity:.55}.coord.file{bottom:3px;right:5px}.coord.rank{top:4px;left:5px}
    .status-card{border-bottom:1px solid #303431;padding:4px 0 18px;margin-bottom:12px}.status-title{font-family:Georgia,serif;font-size:19px}.status-sub{font-size:11px;color:var(--muted);margin-top:7px}
    .moves{flex:1;overflow:auto;border-top:1px solid #303431}.move-row{display:grid;grid-template-columns:38px 1fr 1fr;height:38px;align-items:center;border-bottom:1px solid #292d2a;font-size:12px}.move-row .num{color:#626961}.move-row span{padding-left:8px}.move-row .active{color:var(--gold)}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-top:12px}.btn{height:43px;border:1px solid #3b423d;background:#1b201d;color:#dfe3dc;border-radius:4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}.btn:hover{border-color:#777f74}.btn.primary{background:#a99a71;border-color:#b7a980;color:#171a17}
    @media(max-width:1050px){.shell{grid-template-columns:minmax(380px,600px) 220px;gap:18px}.left{display:none}.right{height:min(600px,78vh)}}
    @media(max-width:760px){body{overflow:auto}.shell{display:flex;flex-direction:column;padding:64px 12px 18px}.board-wrap{width:min(94vw,600px);height:min(94vw,600px);min-width:300px}.right{width:min(94vw,600px);height:260px;min-height:260px}.brand{top:17px}.square{font-size:clamp(30px,10vw,52px)}}
  </style>
</head>
<body>
  <div class="brand"><div class="brand-mark">♜</div> Chess Master</div>
  <main class="shell">
    <aside class="left">
      <div class="eyebrow">Black</div>
      <div class="player-card"><div class="avatar">♚</div><div class="player-info"><div class="player-name">Noir</div><div class="player-meta">Computer</div></div><div class="clock" id="blackClock">10:00</div></div>
      <div style="flex:1"></div>
      <div class="eyebrow" style="margin-top:20px">White</div>
      <div class="player-card"><div class="avatar light">♔</div><div class="player-info"><div class="player-name">You</div><div class="player-meta" id="rating">Rating 1,240</div></div><div class="clock" id="whiteClock">10:00</div></div>
    </aside>
    <section class="board-wrap"><div class="board" id="board"></div></section>
    <aside class="right">
      <div class="status-card"><div class="status-title" id="status">White to move</div><div class="status-sub" id="substatus">Select a piece to begin</div></div>
      <div class="eyebrow">Move history</div><div class="moves" id="moves"></div>
      <div class="actions"><button class="btn" id="undo">Undo</button><button class="btn primary" id="reset">New game</button></div>
    </aside>
  </main>
<script>
const glyph={K:'♔',Q:'♕',R:'♖',B:'♗',N:'♘',P:'♙',k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'};
let board,turn,selected,lastMove,history,gameOver,timerWhite,timerBlack,timerRunning;
function initial(){return [['r','n','b','q','k','b','n','r'],['p','p','p','p','p','p','p','p'],['','','','','','','',''],['','','','','','','',''],['','','','','','','',''],['','','','','','','',''],['P','P','P','P','P','P','P','P'],['R','N','B','Q','K','B','N','R']]}
function reset(){board=initial();turn='w';selected=null;lastMove=null;history=[];gameOver=false;timerWhite=600;timerBlack=600;timerRunning=true;render()}
function color(p){return p && p===p.toUpperCase()?'w':'b'}
function isInside(r,c){return r>=0&&r<8&&c>=0&&c<8}
function enemy(p,t){return p&&(t==='w'?p===p.toLowerCase():p===p.toUpperCase())}
function pseudo(r,c,r2,c2,b=board){const p=b[r][c];if(!p)return[];const pc=p.toUpperCase(),tc=color(p),dr=r2-r,dc=c2-c;if(pc==='P'){let dir=tc==='w'?-1:1,start=tc==='w'?6:1;if(dc===0&&!b[r2][c2]&&(r2-r===dir||(r===start&&r2-r===2*dir&&!b[r+dir][c])))return[[r2,c2]];if(Math.abs(dc)===1&&r2-r===dir&&enemy(b[r2][c2],tc))return[[r2,c2]]}if(pc==='N')return((Math.abs(dr)===2&&Math.abs(dc)===1)||(Math.abs(dr)===1&&Math.abs(dc)===2))&&(!b[r2][c2]||color(b[r2][c2])!==tc)?[[r2,c2]]:[];if(pc==='K')return Math.max(Math.abs(dr),Math.abs(dc))===1&&(!b[r2][c2]||color(b[r2][c2])!==tc)?[[r2,c2]]:[];if(pc==='B'||pc==='R'||pc==='Q'){if(pc==='B'&&Math.abs(dr)!==Math.abs(dc)||pc==='R'&&dr!==0&&dc!==0||pc==='Q'&&dr!==0&&dc!==0&&Math.abs(dr)!==Math.abs(dc))return[];let rs=Math.sign(dr),cs=Math.sign(dc);for(let rr=r+rs,cc=c+cs;rr!==r2||cc!==c2;rr+=rs,cc+=cs){if(!isInside(rr,cc)||b[rr][cc])return[]}return !b[r2][c2]||color(b[r2][c2])!==tc?[[r2,c2]]:[]}
return[]}
function movesFor(r,c,b=board){let out=[];if(!b[r][c])return out;for(let r2=0;r2<8;r2++)for(let c2=0;c2<8;c2++)if(pseudo(r,c,r2,c2,b).length&&(!b[r2][c2]||color(b[r2][c2])!==color(b[r][c])))out.push([r2,c2]);return out}
function findKing(t,b=board){for(let r=0;r<8;r++)for(let c=0;c<8;c++)if(b[r][c]&&(b[r][c].toUpperCase()==='K')&&color(b[r][c])===t)return[r,c];return null}
function attacked(r,c,t,b=board){for(let rr=0;rr<8;rr++)for(let cc=0;cc<8;cc++){let p=b[rr][cc];if(p&&color(p)!==t&&pseudo(rr,cc,r,c,b).length)return true}return false}
function inCheck(t,b=board){const k=findKing(t,b);return k?attacked(k[0],k[1],t,b):false}
function legalMoves(r,c){return movesFor(r,c).filter(([r2,c2])=>{let copy=board.map(x=>[...x]);let p=copy[r][c];copy[r2][c2]=p;copy[r][c]='';return !inCheck(color(p),copy)})}
function allMoves(t){for(let r=0;r<8;r++)for(let c=0;c<8;c++)if(board[r][c]&&color(board[r][c])===t){if(legalMoves(r,c).length)return true}return false}
function move(r,c){if(gameOver||turn==='b')return;let [sr,sc]=selected||[];if(selected&&legalMoves(sr,sc).some(([x,y])=>x===r&&y===c)){board[r][c]=board[sr][sc];board[sr][sc]='';if(board[r][c].toUpperCase()==='P'&&(r===0||r===7))board[r][c]=turn==='w'?'Q':'q';history.push({piece:glyph[board[r][c]],from:[sr,sc],to:[r,c],capture:!!board[r][c]});lastMove=[sr,sc,r,c];selected=null;turn=turn==='w'?'b':'w';updateStatus();render();if(!gameOver)setTimeout(computerMove,520)}}
function computerMove(){if(gameOver||turn!=='b')return;let opts=[];for(let r=0;r<8;r++)for(let c=0;c<8;c++)if(board[r][c]&&color(board[r][c])==='b')for(let m of legalMoves(r,c))opts.push([r,c,m[0],m[1]]);if(!opts.length)return;opts.sort((a,b)=>{let va=bv=0;let px=board[a[2]][a[3]],py=board[b[2]][b[3]];const val={'q':9,'r':5,'b':3,'n':3,'p':1,'k':100};va=px?val[px.toLower()):0;py=py?val[py.toLower()]:0;return va-vb});let candidates=opts.slice(0,Math.min(8,opts.length));let [r,c,r2,c2]=candidates[Math.floor(Math.random()*candidates.length)],p=board[r][c];board[r2][c2]=p;board[r][c]='';if(p.toLowerCase()==='p'&&(r2===7))board[r2][c2]='q';history.push({piece:glyph[board[r2][c2]],from:[r,c],to:[r2,c2],capture:!!board[r2][c2]});lastMove=[r,c,r2,c2];turn='w';updateStatus();render()}
function updateStatus(){let k=inCheck(turn);if(!allMoves(turn)){gameOver=true;status.textContent=k?(turn==='w'?'Black wins by checkmate':'White wins by checkmate'):'Draw — stalemate';substatus.textContent='Game complete'}else{status.textContent=(turn==='w'?'White':'Black')+(k?' — in check':' to move');substatus.textContent=k?'Protect your king':'Select a piece to begin'}renderMoves()}
function squareName(r,c){return 'abcdefgh'[c]+(8-r)}
function renderMoves(){let h='';for(let i=0;i<history.length;i+=2){let w=history[i],b=history[i+1];h+=`<div class="move-row"><span class="num">${i/2+1}.</span><span>${w.piece} ${squareName(w.from[0],w.from[1])}–${squareName(w.to[0],w.to[1])}</span><span>${b?b.piece+' '+squareName(b.from[0],b.from[1])+'–'+squareName(b.to[0],b.to[1]):''}</span></div>`}moves.innerHTML=h;moves.scrollTop=moves.scrollHeight}
function render(){const el=document.getElementById('board');el.innerHTML='';let legal=selected?legalMoves(...selected):[];let king=inCheck(turn)?findKing(turn):null;for(let r=0;r<8;r++)for(let c=0;c<8;c++){let b=document.createElement('button');b.className='square '+((r+c)%2?'dark':'light');if(selected&&selected[0]==r&&selected[1]==c)b.className+=' selected';if(lastMove&&(r===lastMove[0]&&c===lastMove[1]||r===lastMove[2]&&c===lastMove[3]))b.className+=' last';if(king&&king[0]==r&&king[1]==c)b.className+=' check';if(legal.some(([x,y])=>x===r&&y===c)){b.className+=' valid'+(board[r][c]?' capture':'')};let p=board[r][c];if(p){let s=document.createElement('span');s.className='piece '+(color(p)==='w'?'white':'black');s.textContent=glyph[p];b.appendChild(s)}if(c===0){let x=document.createElement('span');x.className='coord rank';x.textContent=8-r;b.appendChild(x)}if(r===7){let x=document.createElement('span');x.className='coord file';x.textContent='abcdefgh'[c];b.appendChild(x)}b.onclick=()=>{if(turn==='w'&&!gameOver){let p=board[r][c];if(selected&&legalMoves(...selected).some(([x,y])=>x===r&&y===c)){move(r,c)}else if(p&&color(p)==='w'){selected=[r,c];render()}else if(selected){selected=null;render()}}};el.appendChild(b)}renderMoves()}
document.getElementById('reset').onclick=reset;document.getElementById('undo').onclick=()=>{if(history.length){reset();for(let i=0;i<history.length-1;i++){} updateStatus()}};
setInterval(()=>{if(!timerRunning||gameOver)return;if(turn==='w'&&timerWhite>0)timerWhite--;else if(turn==='b'&&timerBlack>0)timerBlack--;else{gameOver=true;status.textContent=(turn==='w'?'Black':'White')+' wins on time';substatus.textContent='Game complete'}let f=n=>`${Math.floor(n/60)}:${String(n%60).padStart(2,'0')}`;whiteClock.textContent=f(timerWhite);blackClock.textContent=f(timerBlack)},1000);
reset();
</script>
</body>
</html>
